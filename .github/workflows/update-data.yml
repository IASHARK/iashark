name: Update IASHARK Daily

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Write pipeline script
        run: |
          cat > pipeline.js << 'JSEOF'
          const https = require('https');
          const fs    = require('fs');
          const APS_KEY    = process.env.APISPORTS_KEY;
          const OWM_KEY    = process.env.OPENWEATHER_KEY;
          const NEWS_KEY   = process.env.NEWSAPI_KEY;
          const ANT_KEY    = process.env.ANTHROPIC_KEY;
          const ODDS_KEY   = process.env.ODDS_API_KEY;
          const TENNIS_KEY = process.env.RAPIDAPI_TENNIS_KEY;
          const APS        = {'x-apisports-key': APS_KEY};
          const TENNIS_HEADERS = {
            'x-rapidapi-key':  TENNIS_KEY,
            'x-rapidapi-host': 'tennis-api-atp-wta-itf.p.rapidapi.com'
          };
          const TENNIS_BASE = 'https://tennis-api-atp-wta-itf.p.rapidapi.com';

          // ── HELPERS ──────────────────────────────────────────────
          function sleep(ms) { return new Promise(function(r){ setTimeout(r,ms); }); }

          function get(url, headers) {
            return new Promise(function(resolve) {
              var u = new URL(url);
              var timer = setTimeout(function(){ resolve({}); }, 10000);
              https.get({
                hostname: u.hostname, path: u.pathname+u.search,
                headers: Object.assign({'User-Agent':'IASHARK/1.0'}, headers||{})
              }, function(res) {
                var d='';
                res.on('data',function(c){d+=c;});
                res.on('end',function(){
                  clearTimeout(timer);
                  try{ resolve(JSON.parse(d)); }catch(e){ resolve({}); }
                });
              }).on('error',function(){ clearTimeout(timer); resolve({}); });
            });
          }

          function getArr(url, headers) {
            return new Promise(function(resolve) {
              var u = new URL(url);
              var timer = setTimeout(function(){ resolve([]); }, 10000);
              https.get({
                hostname: u.hostname, path: u.pathname+u.search,
                headers: Object.assign({'User-Agent':'IASHARK/1.0'}, headers||{})
              }, function(res) {
                var d='';
                res.on('data',function(c){d+=c;});
                res.on('end',function(){
                  clearTimeout(timer);
                  try{
                    var parsed = JSON.parse(d);
                    resolve(Array.isArray(parsed) ? parsed : (parsed.data||parsed.response||[]));
                  }catch(e){ resolve([]); }
                });
              }).on('error',function(){ clearTimeout(timer); resolve([]); });
            });
          }

          function postJSON(host, path, body, headers) {
            return new Promise(function(resolve) {
              var data = JSON.stringify(body);
              var timer = setTimeout(function(){ console.log('  TIMEOUT 180s'); resolve({}); }, 180000);
              var req = https.request({
                hostname:host, path:path, method:'POST',
                headers:Object.assign({
                  'Content-Type':'application/json',
                  'Content-Length':Buffer.byteLength(data)
                }, headers||{})
              }, function(res) {
                var d='';
                res.on('data',function(c){d+=c;});
                res.on('end',function(){
                  clearTimeout(timer);
                  try{
                    var parsed=JSON.parse(d);
                    if(parsed.error) console.log('  API ERROR type='+parsed.error.type+' msg='+(parsed.error.message||'').slice(0,100));
                    resolve(parsed);
                  }catch(e){ console.log('  Parse error status='+res.statusCode); resolve({}); }
                });
              });
              req.on('error',function(e){ clearTimeout(timer); console.log('  req error:'+e.message); resolve({}); });
              req.write(data); req.end();
            });
          }

          async function postJSONWithRetry(host, path, body, headers) {
            for(var attempt=1; attempt<=4; attempt++){
              var r = await postJSON(host, path, body, headers);
              if(r.error && (r.error.type==='overloaded_error'||r.error.type==='rate_limit_error')){
                var wait=attempt*30000;
                console.log('  Rate limit — attente '+(wait/1000)+'s tentative '+attempt+'/4');
                await sleep(wait);
                continue;
              }
              return r;
            }
            return {};
          }

          function levenshtein(a,b){
            var m=a.length,n=b.length,dp=[];
            for(var i=0;i<=m;i++){dp[i]=[i];for(var j=1;j<=n;j++)dp[i][j]=0;}
            for(var j=0;j<=n;j++)dp[0][j]=j;
            for(var i=1;i<=m;i++)for(var j=1;j<=n;j++){
              if(a[i-1]===b[j-1])dp[i][j]=dp[i-1][j-1];
              else dp[i][j]=1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
            }
            return dp[m][n];
          }

          function slugify(s) {
            return (s||'').toLowerCase()
              .replace(/[\u00e0\u00e1\u00e2\u00e3\u00e4\u00e5]/g,'a').replace(/[\u00e9\u00e8\u00ea\u00eb]/g,'e')
              .replace(/[\u00ed\u00ec\u00ee\u00ef]/g,'i').replace(/[\u00f3\u00f2\u00f4\u00f5\u00f6]/g,'o')
              .replace(/[\u00fa\u00f9\u00fb\u00fc]/g,'u').replace(/[\u00e7]/g,'c').replace(/[\u00f1]/g,'n')
              .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
          }

          function mkdirSafe(p) {
            try { fs.mkdirSync(p, {recursive:true}); } catch(e) {}
          }

          function toParisHeure(utcDate) {
            if (!utcDate) return '';
            var d = new Date(utcDate);
            if (isNaN(d.getTime())) return '';
            var year = d.getUTCFullYear();
            function lastSundayOf(month) {
              var last = new Date(Date.UTC(year, month+1, 0));
              last.setUTCDate(last.getUTCDate() - last.getUTCDay());
              return last;
            }
            var startCEST = lastSundayOf(2);
            var endCEST   = lastSundayOf(9);
            var offset = (d >= startCEST && d < endCEST) ? 2 : 1;
            var parisMs = d.getTime() + offset * 3600 * 1000;
            var paris = new Date(parisMs);
            var hh = String(paris.getUTCHours()).padStart(2,'0');
            var mm = String(paris.getUTCMinutes()).padStart(2,'0');
            return hh+':'+mm;
          }

          // ── MATHS FOOTBALL ───────────────────────────────────────
          function poissonProb(lambda, k) {
            if(lambda<=0) return k===0?1:0;
            var logP = -lambda + k*Math.log(lambda) - logFactorial(k);
            return Math.exp(logP);
          }
          function logFactorial(n) {
            if(n<=1) return 0;
            var r=0;for(var i=2;i<=n;i++) r+=Math.log(i);return r;
          }
          function calcPoissonProbs(lambdaH, lambdaA) {
            var mat=[];
            for(var h=0;h<=8;h++){mat[h]=[];for(var a=0;a<=8;a++) mat[h][a]=poissonProb(lambdaH,h)*poissonProb(lambdaA,a);}
            var p1=0,pN=0,p2=0,over25=0,under25=0,bttsY=0,bttsN=0,over15=0,over35=0;
            for(var h=0;h<=8;h++) for(var a=0;a<=8;a++){
              var p=mat[h][a];
              if(h>a) p1+=p; else if(h===a) pN+=p; else p2+=p;
              if(h+a>2.5) over25+=p; else under25+=p;
              if(h+a>1.5) over15+=p;
              if(h+a>3.5) over35+=p;
              if(h>0&&a>0) bttsY+=p; else bttsN+=p;
            }
            return {
              p1:Math.round(p1*100), pN:Math.round(pN*100), p2:Math.round(p2*100),
              over15:Math.round(over15*100), over25:Math.round(over25*100),
              under25:Math.round(under25*100), over35:Math.round(over35*100),
              bttsY:Math.round(bttsY*100), bttsN:Math.round(bttsN*100),
            };
          }
          function calcLambdas(bmHdom, beHdom, mdHdom, bmAext, beAext, meAext, leagueAvgH, leagueAvgA) {
            var leagAvgH=leagueAvgH||1.35, leagAvgA=leagueAvgA||1.10;
            var attH=mdHdom>0?(bmHdom/mdHdom)/leagAvgH:1;
            var defH=mdHdom>0?(beHdom/mdHdom)/leagAvgA:1;
            var attA=meAext>0?(bmAext/meAext)/leagAvgA:1;
            var defA=meAext>0?(beAext/meAext)/leagAvgH:1;
            return {
              lambdaH:parseFloat(Math.max(0.3,attH*defA*leagAvgH).toFixed(3)),
              lambdaA:parseFloat(Math.max(0.3,attA*defH*leagAvgA).toFixed(3))
            };
          }
          function shinProbabilities(odds) {
            var prices=odds.filter(function(o){return o&&o>1;});
            if(!prices.length) return null;
            var rawProbs=prices.map(function(o){return 1/o;});
            var sumRaw=rawProbs.reduce(function(a,b){return a+b;},0);
            if(sumRaw<=1) return rawProbs;
            var z=0.02;
            for(var iter=0;iter<50;iter++){
              var f=0,df=0;
              for(var i=0;i<rawProbs.length;i++){
                var qi=rawProbs[i];
                var denom=Math.sqrt(z*z+4*(1-z)*qi*qi/sumRaw);
                f+=(z+denom)/(2*(1-z));
                df+=(1+(2*z/sumRaw-2*qi*qi*(1-2*z)/(sumRaw*sumRaw))/denom)/(2*(1-z))+(z+denom)/(2*(1-z)*(1-z));
              }
              f-=1;
              var zNew=z-f/df;
              if(Math.abs(zNew-z)<1e-8) break;
              z=Math.max(0,Math.min(0.15,zNew));
            }
            var trueProbs=rawProbs.map(function(qi){return (z+Math.sqrt(z*z+4*(1-z)*qi*qi/sumRaw))/(2*(1-z));});
            var sumTrue=trueProbs.reduce(function(a,b){return a+b;},0);
            return trueProbs.map(function(p){return p/sumTrue;});
          }
          function fractionalKelly(probIA, cote, fraction) {
            fraction=fraction||0.25;
            var b=cote-1, q=1-probIA;
            var kelly=(probIA*b-q)/b;
            if(kelly<=0) return null;
            return Math.min(kelly*fraction*100,5).toFixed(1);
          }

          // ── CONFIG FOOTBALL ──────────────────────────────────────
          const LEAGUES = [
            39, 40, 61, 62, 140, 141, 135, 78, 2, 3,
            88, 94, 203, 119, 179, 144, 292,
            66, 307, 143, 137, 81
          ];
          const SEASON   = 2025;
          var SEASON_2026 = [292];
          const TODAY    = new Date().toISOString().split('T')[0];

          var LG_KEY = {
            39:'premier', 40:'champ', 61:'ligue1', 62:'ligue2',
            140:'laliga', 141:'laliga2', 135:'seriea', 78:'bundesliga',
            2:'ldc', 3:'el', 88:'eredivisie', 94:'primeira', 203:'superlig',
            119:'superliga-dk', 179:'scottish', 144:'belgique', 292:'kleague',
            66:'coupe-france', 307:'saudi', 143:'copa-rey', 137:'coppa-italia', 81:'dfb-pokal'
          };

          var BOOKIE_MAP = {
            'betclic':{domain:'betclic.fr',promo:'200\u20ac offerts',l:'#'},
            'winamax':{domain:'winamax.fr',promo:'100\u20ac offerts',l:'#'},
            'unibet':{domain:'unibet.fr',promo:'100\u20ac rembours\u00e9s',l:'#'},
            'pmu':{domain:'pmu.fr',promo:'100\u20ac offerts',l:'#'},
            'bet365':{domain:'bet365.com',promo:'100\u20ac bonus',l:'#'},
          };

          var FR_FIXED = [
            {n:'Betclic',o:'200\u20ac offerts',l:'#LIEN_BETCLIC'},
            {n:'Winamax',o:'100\u20ac offerts',l:'#LIEN_WINAMAX'},
            {n:'Unibet',o:'100\u20ac rembours\u00e9s',l:'#LIEN_UNIBET'},
            {n:'PMU',o:'100\u20ac offerts',l:'#LIEN_PMU'},
            {n:'Bet365',o:'100\u20ac bonus',l:'#LIEN_BET365'},
          ];

          var LANGS = {'en':'English'};

          // ═══════════════════════════════════════════════════════
          // ── TENNIS PIPELINE ─────────────────────────────────────
          // ═══════════════════════════════════════════════════════

          // Tournois à couvrir (ATP + WTA, pas ITF/Challenger pour éviter le bruit)
          var TENNIS_TOUR_RANKS = {
            atp: ['grand_slam','atp1000','atp500','atp250'],
            wta: ['grand_slam','wta1000','wta500','wta250']
          };

          async function getTennisFixtures() {
            if(!TENNIS_KEY) { console.log('Tennis API key manquante — skip tennis'); return []; }
            var all = [];
            var tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
            var TOMORROW = tomorrow.toISOString().split('T')[0];
            var tours = ['atp','wta'];
            var dates = [TODAY, TOMORROW];

            for(var t=0; t<tours.length; t++){
              var tour = tours[t];
              for(var d=0; d<dates.length; d++){
                try {
                  // Fetch avec tout inclus en un seul appel + filtre singles uniquement
                  // include=tournament.court,tournament.rank,h2h donne surface + rang tournoi + H2H
                  // Les cotes odd1/odd2 sont déjà dans la réponse de base
                  var pageNo = 1;
                  var hasMore = true;
                  while(hasMore){
                    var url = TENNIS_BASE+'/tennis/v2/'+tour+'/fixtures/'+dates[d]
                      +'?include=tournament.court,tournament.rank,h2h,odds'
                      +'&filter=PlayerGroup:singles'
                      +'&pageSize=50&pageNo='+pageNo;
                    console.log('Tennis fetch: '+tour.toUpperCase()+' '+dates[d]+' page'+pageNo);
                    var resp = await getArr(url, TENNIS_HEADERS);
                    // Réponse peut être array direct ou {data:[], hasNextPage}
                    var items = Array.isArray(resp) ? resp : (resp.data||[]);
                    hasMore = !Array.isArray(resp) && resp.hasNextPage === true;
                    console.log('  -> '+items.length+' fixtures');
                    items.forEach(function(f){ f._tour = tour; });
                    all = all.concat(items);
                    pageNo++;
                    if(pageNo > 5) break; // sécurité max 250 fixtures
                    if(items.length < 50) break; // pas de page suivante
                    await sleep(300);
                  }
                } catch(e) { console.log('Tennis fixtures error '+tour+' '+dates[d]+':', e.message); }
                await sleep(400);
              }
            }
            // Dédoublonner par id
            var seen={};
            return all.filter(function(f){
              var k=String(f.id||JSON.stringify(f));
              if(seen[k])return false;seen[k]=true;return true;
            });
          }

          // Cotes tennis — endpoint séparé Best Odds
          async function getTennisOddsBest(fixtureId) {
            if(!TENNIS_KEY||!fixtureId) return null;
            try {
              var r = await get(
                TENNIS_BASE+'/tennis/v2/extend/api/event/odds/best/'+fixtureId,
                TENNIS_HEADERS
              );
              if(!r||!r.result) return null;
              var ftr = r.result['Full Time Result']||r.result['Match Winner']||r.result['1X2']||null;
              if(!ftr){var keys=Object.keys(r.result);if(keys.length)ftr=r.result[keys[0]];}
              if(!ftr) return null;
              var o1=parseFloat(ftr.od1||ftr.odd1||0);
              var o2=parseFloat(ftr.od2||ftr.odd2||0);
              if(o1>1&&o2>1) return {c1:o1.toFixed(2),c2:o2.toFixed(2)};
              return null;
            } catch(e){ return null; }
          }

          // Ranking ATP/WTA — pour enrichir le prompt avec le classement actuel
          // Infos joueur : classement + stats surface (getPlayerInfo)
          async function getTennisPlayerInfo(playerId, tour) {
            if(!TENNIS_KEY||!playerId) return null;
            try {
              var r = await get(
                TENNIS_BASE+'/tennis/v2/'+tour+'/player/'+playerId,
                TENNIS_HEADERS
              );
              return r||null;
            } catch(e){ return null; }
          }

          // Derniers matchs joués (getPlayerPastMatches)
          async function getTennisRecentForm(playerId, tour) {
            if(!TENNIS_KEY||!playerId) return [];
            try {
              var r = await get(
                TENNIS_BASE+'/tennis/v2/'+tour+'/player/'+playerId+'/matches?pageSize=10',
                TENNIS_HEADERS
              );
              var items = Array.isArray(r)?r:(r.data||[]);
              return items;
            } catch(e){ return []; }
          }

          function parseTennisFixture(f) {
            var p1 = f.player1||{};
            var p2 = f.player2||{};
            var tournament = f.tournament||{};
            var court = tournament.court||{};
            var rank = tournament.rank||{};
            var h2h = f.h2h||{};
            return {
              id: f.id,
              p1Id: f.player1Id||p1.id,
              p2Id: f.player2Id||p2.id,
              p1Name: p1.name||'Joueur 1',
              p2Name: p2.name||'Joueur 2',
              p1Country: p1.countryAcr||'',
              p2Country: p2.countryAcr||'',
              seed1: f.seed1||null,
              seed2: f.seed2||null,
              c1: f.odd1&&parseFloat(f.odd1)>1 ? String(f.odd1) : '--',
              c2: f.odd2&&parseFloat(f.odd2)>1 ? String(f.odd2) : '--',
              surface: court.name||'Hard',
              tourRank: rank.name||'',
              tournament: tournament.name||'',
              tournamentId: f.tournamentId,
              h2hP1Wins: h2h.player1AllWins||0,
              h2hP2Wins: h2h.player2AllWins||0,
              date: f.date||'',
              round: f.round&&f.round.name||'',
            };
          }

          // Forme depuis getPlayerPastMatches — match_winner est l'id du gagnant
          function calcTennisForm(matches, playerId) {
            var results = [];
            (matches||[]).slice(0,10).forEach(function(m){
              if(!m.result_type||m.result_type==='upcoming') return;
              if(m.result_type==='retired'&&!m.match_winner) return;
              var won = String(m.match_winner)===String(playerId);
              results.push(won?'W':'L');
            });
            return results.slice(0,5).join('');
          }

          // Stats surface depuis getPlayerInfo — data[].surfaces[]
          function calcSurfaceStats(playerInfo, surface) {
            if(!playerInfo||!surface) return null;
            var surfLow = surface.toLowerCase();
            // Normalise la surface recherchée
            var targetCourt = surfLow.includes('clay')?'Clay':
                              surfLow.includes('grass')?'Grass':
                              surfLow.includes('hard')?'Hard':null;
            if(!targetCourt) return null;
            var wins=0, losses=0;
            // Agréger sur 2026+2025
            var years = Array.isArray(playerInfo.data)?playerInfo.data:[];
            years.slice(0,2).forEach(function(yr){
              (yr.surfaces||[]).forEach(function(s){
                var cn=(s.court||'').toLowerCase();
                if(cn.includes(targetCourt.toLowerCase())){
                  wins += (s.courtWins||0);
                  losses += (s.courtLosses||0);
                }
              });
            });
            if(wins+losses===0) return null;
            return {wins:wins, losses:losses, total:wins+losses, winrate:Math.round(wins/(wins+losses)*100)};
          }

          // Filtre tournoi Main tour uniquement (ATP/WTA 250+)
          function isMainTourMatch(parsed) {
            var tr = (parsed.tourRank||'').toLowerCase();
            return tr.includes('main tour')||tr.includes('grand slam')||
                   tr.includes('1000')||tr.includes('500')||tr.includes('250')||
                   tr.includes('finals');
          }

          // ── PROMPT TENNIS ────────────────────────────────────────
          async function genAnalyseTennis(d) {
            var surfaceLabel = (d.surface||'').toLowerCase().includes('clay')?'Terre battue':
                               (d.surface||'').toLowerCase().includes('grass')?'Gazon':'Dur';

            // Probas depuis Shin (cotes API tennis) ou calcul brut
            var shinProbs = d.shinProbs || null;
            if(!shinProbs&&d.c1&&d.c1!=='--'&&d.c2&&d.c2!=='--'){
              var raw = shinProbabilities([parseFloat(d.c1), parseFloat(d.c2)]);
              if(raw&&raw.length===2) shinProbs = {p1:Math.round(raw[0]*100), p2:Math.round(raw[1]*100)};
            }
            var probIAP1 = shinProbs ? shinProbs.p1 : (d.c1&&d.c1!=='--' ? Math.round(100/parseFloat(d.c1)) : 50);
            var probIAP2 = 100 - probIAP1;

            // Edge calculé en JS
            function calcEdgeTennis(probIA, cote) {
              if(!probIA||!cote||cote==='--') return null;
              var edge = probIA/100 - 1/parseFloat(cote);
              return edge>0 ? Math.round(edge*100) : null;
            }
            var edgeP1 = calcEdgeTennis(probIAP1, d.c1);
            var edgeP2 = calcEdgeTennis(probIAP2, d.c2);
            var kellyP1 = edgeP1&&d.c1&&d.c1!=='--' ? fractionalKelly(probIAP1/100, parseFloat(d.c1), 0.25) : null;
            var kellyP2 = edgeP2&&d.c2&&d.c2!=='--' ? fractionalKelly(probIAP2/100, parseFloat(d.c2), 0.25) : null;

            // H2H — données pré-calculées depuis le fixture
            var h2hStr = 'Indisponible.';
            if(d.h2hP1Wins!==undefined||d.h2hP2Wins!==undefined){
              h2hStr = d.p1+' '+(d.h2hP1Wins||0)+'V / '+(d.h2hP2Wins||0)+'D ('+d.p2+')';
            }

            var surf1Str = d.surf1 ? d.surf1.wins+'V/'+(d.surf1.total-d.surf1.wins)+'D ('+d.surf1.winrate+'%) sur '+surfaceLabel : 'Non disponible';
            var surf2Str = d.surf2 ? d.surf2.wins+'V/'+(d.surf2.total-d.surf2.wins)+'D ('+d.surf2.winrate+'%) sur '+surfaceLabel : 'Non disponible';

            // Seed comme indicateur de niveau si classement non dispo
            var seedStr1 = d.seed1 ? ' [Tête de série #'+d.seed1+']' : '';
            var seedStr2 = d.seed2 ? ' [Tête de série #'+d.seed2+']' : '';

            var prompt =
              '=== MATCH TENNIS ===\n'
              +d.p1+seedStr1+' vs '+d.p2+seedStr2+'\n'
              +(d.tournament||'')+' ('+(d.tourRank||'')+(d.round?' — '+d.round:'')+') | Surface: '+surfaceLabel+' | '+d.date+'\n\n'

              +'=== DONNÉES DISPONIBLES ===\n'
              +'Classement ATP/WTA : '+d.p1+' #'+(d.rank1||'N/C')+' | '+d.p2+' #'+(d.rank2||'N/C')+'\n'
              +(d.rank1&&d.rank2?'Écart classement: '+Math.abs(d.rank1-d.rank2)+' places\n':'')
              +(d.seed1||d.seed2?'Têtes de série : '+d.p1+' '+(d.seed1?'#'+d.seed1:'NS')+' | '+d.p2+' '+(d.seed2?'#'+d.seed2:'NS')+'\n':'')
              +'Forme 5 derniers '+d.p1+': '+(d.form1||'N/A')+'\n'
              +'Forme 5 derniers '+d.p2+': '+(d.form2||'N/A')+'\n'
              +'Stats surface '+d.p1+' ('+surfaceLabel+'): '+surf1Str+'\n'
              +'Stats surface '+d.p2+' ('+surfaceLabel+'): '+surf2Str+'\n'
