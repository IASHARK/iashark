                bookies:odds.bookies,edge:an&&an.pari_rec?(function(){ function nm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');} var pn=nm(an.pari_rec); var mk=(allMarkets||[]).find(function(x){var xn=nm(x.market);return xn===pn||pn.includes(xn)||xn.includes(pn);}); return mk?mk.prob+'% (modele)':''; })():'',marche:an?(an.marche||'RESULTAT'):'RESULTAT',
                risque:risqueNorm,pari_rec:an?(an.pari_rec||''):'',
