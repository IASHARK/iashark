name: Resolve Tennis History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run resolution script
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
        run: node resolve_tennis.js

      - name: Commit historique
        run: |
          git config user.name "IASHARK"
          git config user.email "action@github.com"
          git add historique.json
          git diff --staged --quiet || git commit -m "Résolution paris tennis pending"
          git push
