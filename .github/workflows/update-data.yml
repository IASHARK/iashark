      - name: Vider le cache uniquement si force_refresh demande
        run: |
          if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then
            echo '{"matchs":[]}' > data.json
            echo "force_refresh=true : cache vide, tous les matchs seront recalcules"
          else
            echo "Cache conserve : les matchs deja verrouilles gardent leur prediction (matchCache actif)"
          fi
      - name: Run pipeline
