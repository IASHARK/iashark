              var totalTeams=standings.length||20;
              var matchsPlayedH=entryH?entryH.all.played:20;
              var matchsLeft=totalTeams*2-Math.max(matchsPlayedH,1);
              var motivH=calcMotivation(rkH,totalTeams,entryH?entryH.points:0,standings[0]?standings[0].points:0,matchsLeft,true,lg.name,home.name,away.name);
              var motivA=calcMotivation(rkA,totalTeams,entryA?entryA.points:0,standings[0]?standings[0].points:0,matchsLeft,false,lg.name,home.name,away.name);

              var totalH=(sH&&sH.fixtures&&sH.fixtures.played&&sH.fixtures.played.total)||30;
              var totalA=(sA&&sA.fixtures&&sA.fixtures.played&&sA.fixtures.played.total)||30;
              var mdHdom_elo=(sH&&sH.fixtures&&sH.fixtures.played&&sH.fixtures.played.home)||Math.round(totalH/2);
              var vdH_elo=(sH&&sH.fixtures&&sH.fixtures.wins&&sH.fixtures.wins.home)||0;
              var eloH=getElo(eloData,home.name);
              var eloA=getElo(eloData,away.name);
              var eloStats=eloWinProb(eloH,eloA,isKnockout?0:vdH_elo,isKnockout?1:mdHdom_elo,isKnockout);
              if(eloH&&eloA)console.log('ELO: '+home.name+' '+Math.round(eloH)+' vs '+away.name+' '+Math.round(eloA));

              var droppingOdds=null;
              var matchKey=home.name+'|'+away.name;
              if(prevPinnacleOdds[matchKey]&&pinnacleOdds){
                var prev=prevPinnacleOdds[matchKey];var drops=[];
                if(prev.c1&&pinnacleOdds.c1){var d1=Math.round(((prev.c1-pinnacleOdds.c1)/prev.c1)*100);if(Math.abs(d1)>=5)drops.push({team:home.name,pct:d1,dir:d1>0?'baisse':'hausse',coteOuv:prev.c1,coteCurr:pinnacleOdds.c1});}
                if(prev.c2&&pinnacleOdds.c2){var d2=Math.round(((prev.c2-pinnacleOdds.c2)/prev.c2)*100);if(Math.abs(d2)>=5)drops.push({team:away.name,pct:d2,dir:d2>0?'baisse':'hausse',coteOuv:prev.c2,coteCurr:pinnacleOdds.c2});}
                if(drops.length)droppingOdds=drops;
              }

              var mdHdom=(sH&&sH.fixtures&&sH.fixtures.played&&sH.fixtures.played.home)||Math.round(totalH/2);
              var meAext=(sA&&sA.fixtures&&sA.fixtures.played&&sA.fixtures.played.away)||Math.round(totalA/2);
              var bmHdom=(sH&&sH.goals&&sH.goals.for&&sH.goals.for.home)||0;
              var beHdom=(sH&&sH.goals&&sH.goals.against&&sH.goals.against.home)||0;
              var bmAext=(sA&&sA.goals&&sA.goals.for&&sA.goals.for.away)||0;
              var beAext=(sA&&sA.goals&&sA.goals.against&&sA.goals.against.away)||0;
              var bmHdom_p=(sH&&sH.goals&&sH.goals.for&&sH.goals.for.total&&sH.goals.for.total.home)||0;
              var beHdom_p=(sH&&sH.goals&&sH.goals.against&&sH.goals.against.total&&sH.goals.against.total.home)||0;
