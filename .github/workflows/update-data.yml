              if(!current.length) return null;
              current.sort(function(a,b){ return (a.category||99)-(b.category||99); });
              var best = current[0];
              console.log('  [SPORTMONKS] Fallback retenu: "'+best.name+'" (categorie '+best.category+', probablement le plus haut niveau du pays)');
