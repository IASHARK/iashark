            // derniere '}' avant de parser) - si le JSON reste illisible,
            // return null SANS jamais inventer de contenu ; l'appelant
            // publie alors EXPLANATION_STATUS=FAILED et la selection reste
            // intacte (verifie : aucun consommateur de `an` ne touche
            // pickedMarket/edgeVal/probabilites, tous en lecture defensive
            // an?(...):'' / an&&...).
            try{
              var cleaned=txt.replace(/```json|```/g,'').trim();
              var firstBrace=cleaned.indexOf('{'), lastBrace=cleaned.lastIndexOf('}');
              if(firstBrace>=0&&lastBrace>firstBrace) cleaned=cleaned.slice(firstBrace,lastBrace+1);
              return JSON.parse(cleaned);
