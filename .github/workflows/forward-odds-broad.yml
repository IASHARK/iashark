name: forward-odds-broad

# Market Lab Phase 3A (item 6) - collecteur BROAD, decouple du pipeline
# principal (update-data.yml, cron quotidien unique) pour permettre une
# cadence plus fine sans re-executer tout le pipeline. Cible les
# fixtures des prochaines 72h pour chacune des 13 ligues (FIRST_SEEN/
# T72/T24/T6 selon le temps reel avant coup d'envoi), ecrit dans
# odds_snapshots (cache operationnel existant, scripts/save-odds-snapshot.js
# INCHANGE - seule sa cadence d'appel change ici). Budget dur et
# circuit-breaker rate-limit deja dans le script (MAX_API_CALLS_PER_RUN,
# isRateLimitOrQuotaError) - jamais de retry infini.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: forward-odds-broad
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collecte broad (72h, cadence 6h)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/save-odds-snapshot.js --fixtures-per-league=3
