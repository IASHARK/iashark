          var TRANSFER_CACHE_DAYS = 5;
          async function updateTransferts(fixtures) {
            console.log('\n=== TRANSFERTS OFFICIELS ===');
            var transfPath = 'transferts.json';
            var store = { teams_checked: {}, items: [] };
            try { store = JSON.parse(fs.readFileSync(transfPath, 'utf8')); } catch(e) {}
            var seenPlayers = {};
            store.items.forEach(function(it){ seenPlayers[it.player_id+'_'+it.date] = true; });
            var teamIds = [], teamLeagueMap = {};
            fixtures.forEach(function(fx){
              var hId=fx.teams.home.id, aId=fx.teams.away.id, lgId=fx.league.id;
              if(hId && teamIds.indexOf(hId)===-1){ teamIds.push(hId); teamLeagueMap[hId]=lgId; }
              if(aId && teamIds.indexOf(aId)===-1){ teamIds.push(aId); teamLeagueMap[aId]=lgId; }
            });
            console.log('  '+teamIds.length+' clubs concernes par les matchs a venir');
            var now = Date.now(), newCount = 0;
            for(var ti=0; ti<teamIds.length; ti++){
              var teamId = teamIds[ti];
              var lastChecked = store.teams_checked[teamId];
              if(lastChecked && (now-lastChecked) < TRANSFER_CACHE_DAYS*86400000) continue;
              try{
                var r = await get('https://v3.football.api-sports.io/transfers?team='+teamId, APS);
                var records = r.response || [];
                for(var pi=0; pi<records.length; pi++){
                  var rec = records[pi];
                  var player = rec.player || {};
                  var latest = (rec.transfers||[])[0];
                  if(!latest || !latest.date) continue;
                  var daysAgo = (now - new Date(latest.date).getTime())/86400000;
                  if(daysAgo>21 || daysAgo<0) continue;
                  var uid = player.id+'_'+latest.date;
                  if(seenPlayers[uid]) continue;
                  seenPlayers[uid]=true;
                  var season = seasonForLeague(teamLeagueMap[teamId], SEASON);
                  var pInfo = await get('https://v3.football.api-sports.io/players?id='+player.id+'&season='+season, APS);
                  var pData = (pInfo.response && pInfo.response[0]) || null;
                  var bio = pData ? pData.player : null;
                  var stats = pData && pData.statistics && pData.statistics[0] ? pData.statistics[0] : null;
                  store.items.unshift({
                    player_id: player.id, name: player.name||(bio&&bio.name)||'',
                    photo: (bio&&bio.photo)||('https://media.api-sports.io/football/players/'+player.id+'.png'),
                    age: bio?bio.age:null, nationality: bio?bio.nationality:null,
                    poste: stats&&stats.games?stats.games.position:null,
                    from: (latest.teams&&latest.teams.out&&latest.teams.out.name)||'',
                    to: (latest.teams&&latest.teams.in&&latest.teams.in.name)||'',
                    fee: latest.type || 'N/A',
                    date: latest.date,
                    buts_saison_prec: stats&&stats.goals?stats.goals.total:null,
                    passes_saison_prec: stats&&stats.goals?stats.goals.assists:null,
                    matchs_saison_prec: stats&&stats.games?stats.games.appearences:null,
                  });
                  newCount++;
                  await sleep(200);
                }
                store.teams_checked[teamId]=now;
              }catch(e){ console.log('  Erreur transferts team '+teamId+': '+e.message); }
              await sleep(200);
            }
            store.items.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
            store.items = store.items.slice(0,60);
            store.updated = TODAY;
            fs.writeFileSync(transfPath, JSON.stringify(store,null,2));
            console.log('  Transferts: '+store.items.length+' au total ('+newCount+' nouveaux)');
          }
