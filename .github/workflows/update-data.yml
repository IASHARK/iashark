          async function processTennisFixtures(fixtures) {
            var tennisMatchs = [];
            console.log('\n=== TENNIS PIPELINE: '+fixtures.length+' matchs à analyser ===');

            for(var i=0; i<fixtures.length; i++){
              var f = fixtures[i];
              var tour = f._tour||'atp';
              var parsed = parseTennisFixture(f);
              var p1Name = parsed.p1Name;
              var p2Name = parsed.p2Name;

              // Skip doubles
              if(p1Name.includes('/')&&p2Name.includes('/')){
                console.log('[TENNIS] Skip doubles: '+p1Name);
                continue;
              }

              // Skip tournois inférieurs à 250 (Challenger, ITF, Futures)
              if(!isMainTourMatch(parsed)){
                console.log('[TENNIS] Skip (non Main tour): '+p1Name+' vs '+p2Name+' — '+parsed.tourRank);
                continue;
              }

              console.log('\n[TENNIS] -> '+p1Name+' vs '+p2Name+' ('+tour.toUpperCase()+' | '+parsed.tourRank+' | '+parsed.surface+')');

              // Fetcher cotes + infos joueurs + forme en parallèle
              var batch = await Promise.all([
                getTennisPlayerInfo(parsed.p1Id, tour),
                getTennisPlayerInfo(parsed.p2Id, tour),
                getTennisRecentForm(parsed.p1Id, tour),
                getTennisRecentForm(parsed.p2Id, tour),
                getTennisOddsBest(parsed.id),
              ]);
              await sleep(500);

              var info1    = batch[0];
              var info2    = batch[1];
              var matches1 = batch[2]||[];
              var matches2 = batch[3]||[];
              var bestOdds = batch[4];

              // Classement
              var rank1 = info1&&info1.currentRank ? info1.currentRank : null;
              var rank2 = info2&&info2.currentRank ? info2.currentRank : null;

              // Forme 5 derniers matchs
              var form1 = calcTennisForm(matches1, parsed.p1Id);
              var form2 = calcTennisForm(matches2, parsed.p2Id);

              // Stats surface 2025+2026
              var surf1 = calcSurfaceStats(info1, parsed.surface);
              var surf2 = calcSurfaceStats(info2, parsed.surface);

              // Cotes : Best Odds prioritaire sinon fixture
              var c1 = (bestOdds&&bestOdds.c1)||parsed.c1;
              var c2 = (bestOdds&&bestOdds.c2)||parsed.c2;
              console.log('  Classement: '+rank1+' / '+rank2+' | Cotes: '+c1+'/'+c2+' | Forme: '+form1+'/'+form2);

              // Skip si aucune cote ET aucun classement (aucune donnée)
              if(c1==='--'&&c2==='--'&&!rank1&&!rank2){
                console.log('  Skip (aucune donnée): '+p1Name+' vs '+p2Name);
                continue;
              }

              // Shin sur les cotes
              var shinProbs = null;
              if(c1!=='--'&&c2!=='--'){
                var raw=shinProbabilities([parseFloat(c1),parseFloat(c2)]);
                if(raw&&raw.length===2)shinProbs={p1:Math.round(raw[0]*100),p2:Math.round(raw[1]*100)};
              }

              var an = await genAnalyseTennis({
                p1:p1Name, p2:p2Name, p1Id:parsed.p1Id, p2Id:parsed.p2Id,
                rank1:rank1, rank2:rank2,
                seed1:parsed.seed1, seed2:parsed.seed2,
                tournament:parsed.tournament, tourRank:parsed.tourRank,
                surface:parsed.surface, round:parsed.round,
                date:(parsed.date||'').split('T')[0]+' '+toParisHeure(parsed.date||''),
                form1:form1, form2:form2,
                surf1:surf1, surf2:surf2,
                h2hP1Wins:parsed.h2hP1Wins, h2hP2Wins:parsed.h2hP2Wins,
                c1:c1, c2:c2, shinProbs:shinProbs,
              });
              await sleep(300);

              if(an&&an.passe_ton_tour===true){
                console.log('  ⏭ PASS tennis: '+p1Name+' vs '+p2Name);
                an.pari_rec='';an.cote_rec='';an.confiance=0;
                an.vbet='NON';an.verdict_shark='';an.edge='';an.kelly='0';
              }

              var lkKey = tour==='wta'?'wta':'atp';
              var surfLabel = (parsed.surface||'').toLowerCase().includes('clay')?'clay':
                              (parsed.surface||'').toLowerCase().includes('grass')?'grass':'hard';
              var fDate = (parsed.date||'').split('T')[0];
              var heure = toParisHeure(parsed.date||'');

              var matchObj = {
                id: 't_'+parsed.id,
                sport: 'tennis',
                home: {n:p1Name, id:parsed.p1Id, seed:parsed.seed1, country:parsed.p1Country},
                away: {n:p2Name, id:parsed.p2Id, seed:parsed.seed2, country:parsed.p2Country},
                league: parsed.tournament+(parsed.round?' — '+parsed.round:''),
                ligue_icon: '\uD83C\uDFBE',
                league_key: lkKey,
                surface: surfLabel,
                tour_rank: parsed.tourRank,
                date: (fDate+' '+heure).trim(),
                cat: ['all'],
                val: an?(an.vbet==='OUI'&&(an.confiance||0)>=7.0):false,
                hot: an?((an.confiance||0)>=8.0):false,
                conf: an?parseFloat(an.confiance||0):0,
                p1: shinProbs?shinProbs.p1:(an?(an.p1||50):50),
                pn: 0,
                p2: shinProbs?shinProbs.p2:(an?(an.p2||50):50),
                c1: c1, c2: c2,
                cote_rec: an?(an.cote_rec||''):'',
                pari_rec: an?(an.pari_rec||''):'',
                edge: an?(an.edge||''):'',
                kelly: an?(an.kelly||'0'):'0',
                vbet: an?(an.vbet||'NON'):'NON',
                risque: an?(an.risque||'ELEVE'):'ELEVE',
                verdict_shark: an?(an.verdict_shark||''):'',
                analyse_card: an?(an.analyse_card||an.conseil||''):'',
                conseil_public: an?(an.conseil||an.analyse_card||''):'',
                contexte: an?(an.contexte||''):'',
                facteur_x: an?(an.facteur_x||''):'',
                scenario: an&&an.scenario_match?{phase1:an.scenario_match.set1||'',phase2:an.scenario_match.set2||'',phase3:an.scenario_match.set3||null}:null,
                no_signal: an&&an.passe_ton_tour===true?true:!(an&&an.pari_rec),
                no_signal_label: (an&&an.passe_ton_tour===true)||(!(an&&an.pari_rec))?'Aucun signal clair sur ce match':'',
                h2h_tennis: {p1Wins:parsed.h2hP1Wins, p2Wins:parsed.h2hP2Wins},
                form_p1: form1, form_p2: form2,
                surf_stats_p1: surf1, surf_stats_p2: surf2,
                mise: '1-2% bankroll',
              };

              tennisMatchs.push(matchObj);
              console.log('  OK conf='+matchObj.conf+' pari='+matchObj.pari_rec+' cotes='+c1+'/'+c2);
            }
            return tennisMatchs;
          }


          // ═══════════════════════════════════════════════════════
          // ── FOOTBALL PIPELINE (inchangé) ────────────────────────
          // ═══════════════════════════════════════════════════════

          function lgKey(lgId) { return LG_KEY[lgId]||'other'; }

          function lgIcon(l) {
            var s=(l||'').toLowerCase();
            if(s.includes('ligue 1')) return '\uD83C\uDDEB\uD83C\uDDF7';
            if(s.includes('la liga')) return '\uD83C\uDDEA\uD83C\uDDF8';
            if(s.includes('serie a')) return '\uD83C\uDDEE\uD83C\uDDF9';
            if(s.includes('bundesliga')) return '\uD83C\uDDE9\uD83C\uDDEA';
            if(s.includes('premier league')) return '\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC65\uDB40\uDC6E\uDB40\uDC67\uDB40\uDC7F';
            if(s.includes('championship')) return '\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC65\uDB40\uDC6E\uDB40\uDC67\uDB40\uDC7F';
            if(s.includes('champions')) return '\uD83C\uDFC6';
            if(s.includes('scottish')) return '\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC73\uDB40\uDC63\uDB40\uDC74\uDB40\uDC7F';
            if(s.includes('belgi')) return '\uD83C\uDDE7\uD83C\uDDEA';
            return '\uD83C\uDFC6';
          }

          async function getFixtures() {
            var all = [];
            var tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
            var TOMORROW = tomorrow.toISOString().split('T')[0];
            var dayAfter = new Date(); dayAfter.setDate(dayAfter.getDate()+2);
            var DAYAFTER = dayAfter.toISOString().split('T')[0];
            var dates = [TODAY, TOMORROW, DAYAFTER];

            // Coupe du Monde — fetch global puis filtre
            try {
              var wcResp = await get('https://v3.football.api-sports.io/fixtures?league=1&season=2025', APS);
              if(wcResp.response&&wcResp.response.length){
                console.log('World Cup fixtures total:', wcResp.response.length);
                var wcFiltered = wcResp.response.filter(function(f){
                  return dates.indexOf((f.fixture.date||'').split('T')[0]) !== -1;
                });
                console.log('World Cup today/tomorrow:', wcFiltered.length);
                all = all.concat(wcFiltered);
              }
            } catch(e) { console.log('WC fetch error:', e.message); }
            await sleep(300);

            // Autres ligues
            for(var d=0; d<dates.length; d++){
              for(var i=0; i<LEAGUES.length; i++){
                var lgId = LEAGUES[i];
                var season = SEASON_2026.indexOf(lgId)!==-1?2026:SEASON;
                var r = await get(
                  'https://v3.football.api-sports.io/fixtures?date='+dates[d]+'&league='+lgId+'&season='+season+'&timezone=Europe%2FParis',
                  APS
                );
                if(r.response) all = all.concat(r.response);
                await sleep(200);
              }
            }
            var seen={};
            return all.filter(function(f){
              if(seen[f.fixture.id]) return false;
              seen[f.fixture.id]=true; return true;
            });
          }

