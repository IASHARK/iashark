# Installe (ou réinstalle) toutes les fonctions Supabase du site d'un seul clic :
# GitHub > Actions > « Installer les fonctions IASHARK » > Run workflow.
# Réglage de vérification identique à la production (CHECKLIST-JOUR-J.md §3) :
# --no-verify-jwt pour les fonctions appelées sans session (webhook Stripe, tâches planifiées…),
# vérification gardée pour celles appelées par un compte connecté. Le robot Telegram a son propre workflow.
name: Installer les fonctions IASHARK
on:
  workflow_dispatch:
env:
  PROJECT_REF: ksvjraqitxouwiabecai
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer les fonctions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "Secret SUPABASE_ACCESS_TOKEN manquant" >&2; exit 1; fi
          SANS_JWT="match-data create-checkout-session stripe-webhook cancel-subscription delete-account login-guard send-transactional-email send-lifecycle-emails email-unsubscribe trial-reminder affiliate-payouts"
          AVEC_JWT="sync-subscription create-portal-session admin-revenue affiliate-connect"
          echo "## Fonctions installées" >> "$GITHUB_STEP_SUMMARY"
          for f in $SANS_JWT; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt
            echo "- $f (sans vérification de session)" >> "$GITHUB_STEP_SUMMARY"
          done
          for f in $AVEC_JWT; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF"
            echo "- $f" >> "$GITHUB_STEP_SUMMARY"
          done
