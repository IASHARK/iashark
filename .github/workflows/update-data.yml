                paris_safe:{bet:pickedMarket?pickedMarket.market:'',cote:pickedMarket?parseFloat(pickedMarket.cote):odds.c1,proba:pickedMarket?Math.round(pickedMarket.prob)+'%':''},
                paris_risque:{bet:'',cote:'',proba:''},
                stade:{nom:f.venue&&f.venue.name?(f.venue.name+(f.venue.city?' - '+f.venue.city:'')):home.name+' (domicile)',cap:'',meteo:wx?wx.emoji:'',temp:wx?wx.temp:'',desc:wx?wx.desc:''},
                crit_home:critH,crit_away:critA,
                form_home:last10H.slice(0,5),form_away:last10A.slice(0,5),
                forme_h:(sH&&sH.form)||'',forme_a:(sA&&sA.form)||'',
                h2h:h2hFormatted,injuries,
                fatigue:{home:{val:fatigueH.val,info:fatigueH.info},away:{val:fatigueA.val,info:fatigueA.info}},
                fatigue_home:{val:fatigueH.val,info:fatigueH.info},fatigue_away:{val:fatigueA.val,info:fatigueA.info},
                tendances,classement:classementObj,actu:(nH||[]).concat(nA||[]),
                arbitre:refStats?{nom:refStats.name,cartons:refStats.cards_per_game,penaltys:refStats.pens_per_game,matchs:refStats.games}:null,
                events_home:isWorldCupMatch?(function(){
                  var ts=WC_TEAM_STATS_CACHE['tournoi_'+home.id];
                  if(ts&&ts.slots) return {slots:ts.slots,slots_against:ts.slots_against||null,goals_avg:ts.xg_for||null,conceded_avg:ts.xg_against||null,games:ts.games||0};
                  return null;
                })():(evPatH||null),
                events_away:isWorldCupMatch?(function(){
                  var ts=WC_TEAM_STATS_CACHE['tournoi_'+away.id];
                  if(ts&&ts.slots) return {slots:ts.slots,slots_against:ts.slots_against||null,goals_avg:ts.xg_for||null,conceded_avg:ts.xg_against||null,games:ts.games||0};
                  return null;
                })():(evPatA||null),
                top_scorers_home:topScorersH||[],top_scorers_away:topScorersA||[],
                hot_scorer_home:hotH.scorer,hot_assist_home:hotH.assist,
                hot_scorer_away:hotA.scorer,hot_assist_away:hotA.assist,
                key_absences:keyAbsenceAlerts||[],
                match_stats_home:matchStatsH,
                match_stats_away:matchStatsA,
                elo_home:eloH?Math.round(eloH):null,elo_away:eloA?Math.round(eloA):null,
                elo_diff:eloStats?eloStats.diff:null,elo_signal:eloStats?eloStats.signal:null,
                pinnacle_snapshot:pinnacleOdds?{c1:pinnacleOdds.c1,cn:pinnacleOdds.cn,c2:pinnacleOdds.c2,date:TODAY}:null,
                pipeline_sha:process.env.GITHUB_SHA||null,
                market_source:usingPinnacle?'Pinnacle (sharp)':(marketOdds?'Cotes moyennes multi-bookmakers':'Aucune cote fiable'),
              };
              // Champs premium (Outils) : jamais ecrits dans data.json (public, non
              // authentifie). Collectes a part et pousses vers Supabase apres la boucle -
              // seule l'Edge Function match-data, avec verification de session/plan cote
              // serveur, doit pouvoir les lire. Voir supabase/migrations/0002_match_premium_data.sql.
              // kellyVal/edgeVal deja calcules plus haut (reels, pas de valeur codee en dur).
              premiumRows.push({
                fixture_id:f.id,kelly:kellyVal,edge:edgeVal,
                verdict_shark:an?(an.verdict_shark||''):'',
                facteur_x:an?(an.facteur_x||''):'',
                dropping_odds:droppingOdds||null,
                raw_response:an||null,
                pipeline_sha:process.env.GITHUB_SHA||null,
              });
              snapshotRows.push({
                fixture_id:f.id,
                snapshot_type:'prediction',
                model_version:MODEL_VERSION,
                pipeline_sha:process.env.GITHUB_SHA||null,
                raw_inputs:{
                  odds:odds||null,
                  pinnacle_odds:pinnacleOdds||null,
                  injuries:injuries||[],
                  lineups:lineups||null,
                  team_stats_home:sH||null,team_stats_away:sA||null,
                  match_stats_home:matchStatsH||null,match_stats_away:matchStatsA||null,
                  h2h:h2hFormatted||[],
                  weather:wx||null,
                  referee:refStats||null,
                  standing_home:entryH||null,standing_away:entryA||null,
                  elo_home:eloH||null,elo_away:eloA||null,
                },
              });
              matchsData.push(matchObj);
              console.log('  OK conf='+matchObj.conf+' edge='+edgeVal+' pari='+matchObj.pari_rec);
            }
            var allMatchsData = matchsData.slice();
            allMatchsData.sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
            matchsData.sort(function(a,b){var tA=(a.date||'').split(' ')[1]||'99:99';var tB=(b.date||'').split(' ')[1]||'99:99';return tA<tB?-1:tA>tB?1:0;});
            fs.writeFileSync('data.json',JSON.stringify({matchs:allMatchsData},null,2));
            console.log('\n=== DONE: '+allMatchsData.length+' matchs total ===');
            await writePremiumData(premiumRows);
            await writeSnapshots(snapshotRows);
            await updateHistorique(allMatchsData);
            await updateTransferts(fixtures);
            await updateRumeurs();
            generateMatchPages(allMatchsData);
            generateSitemaps(allMatchsData);
            injectHomeSeoSummary(allMatchsData);
          }
          main().catch(function(e){console.error('FATAL:',e.message,e.stack);process.exit(1);});
          JSEOF
      - name: Vider le cache uniquement si force_refresh demande
        run: |
          if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then
            echo '{"matchs":[]}' > data.json
            echo "force_refresh=true : cache vide, tous les matchs seront recalcules"
          else
            echo "Cache conserve : les matchs deja verrouilles gardent leur prediction (matchCache actif)"
          fi
      - name: Run pipeline
        env:
          APISPORTS_KEY:      ${{ secrets.APISPORTS_KEY }}
          OPENWEATHER_KEY:    ${{ secrets.OPENWEATHER_KEY }}
          NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_KEY:      ${{ secrets.ANTHROPIC_KEY }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          ODDS_API_IO_KEY:    ${{ secrets.ODDS_API_IO_KEY }}
          CREATOMATE_KEY:     ${{ secrets.CREATOMATE_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_WC_ONLY:       ${{ github.event.inputs.test_wc_only }}
        run: node pipeline.js

      - name: Commit and push
        run: |
          git config user.name "IASHARK"
          git config user.email "yaramode81@gmail.com"
          git add data.json historique.json transferts.json actus.json sitemap.xml sitemap-*.xml match/ index.html
          git diff --staged --quiet || git commit -m "Daily update - $(date +%Y-%m-%d)"
          git push
