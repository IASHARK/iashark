          // vide/non traduite indexee). hreflang complet via xhtml:link sur
          // chaque <url>, y compris x-default vers la version FR par defaut.
          function generateLocalizedSitemaps(){
            var SITE='https://iashark.com';
            var files=[];
            I18N_LOCALES.supported.forEach(function(locale){
              var urls = I18N_PAGES.map(function(page){
                var slug = page.file === 'index.html' ? '' : page.file;
                var loc = SITE+'/'+locale+'/'+slug;
                var alternates = I18N_LOCALES.supported.map(function(l2){
                  var altSlug = page.file === 'index.html' ? '' : page.file;
                  return '<xhtml:link rel="alternate" hreflang="'+l2+'" href="'+SITE+'/'+l2+'/'+altSlug+'"/>';
                }).join('');
                alternates += '<xhtml:link rel="alternate" hreflang="x-default" href="'+SITE+'/'+I18N_LOCALES.default+'/'+slug+'"/>';
                return '<url><loc>'+loc+'</loc><lastmod>'+TODAY+'</lastmod><changefreq>weekly</changefreq><priority>0.5</priority>'+alternates+'</url>';
              });
              var fname = 'sitemap-'+locale+'-i18n.xml';
