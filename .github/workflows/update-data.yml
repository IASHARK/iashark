                d10H:d10Hstr,d10A:d10Astr,csHdom,csAext,failHdom,failAext,
                bmHdom,beHdom,bmAext,beAext,mdHdom,meAext,h2hAvgButs,h2hNuls,
                c1:odds.c1,cn:odds.cn,c2:odds.c2,co15:odds.co15,co25:odds.co25,cu25:odds.cu25,
                dc1x:odds.dc1x,dc2x:odds.dc2x,btts_oui:odds.btts_oui,btts_non:odds.btts_non,
                co35:odds.co35,ah_dom:odds.ah_dom,ah_ext:odds.ah_ext,
                injuries,h2h:h2hRaw,fatH:fatigueH.info,fatA:fatigueA.info,
                domH20w:domH20.filter(function(m){return m.result==='W';}).length,
                domH20d:domH20.filter(function(m){return m.result==='D';}).length,
                domH20l:domH20.filter(function(m){return m.result==='L';}).length,
                domH20:domH20.length,
