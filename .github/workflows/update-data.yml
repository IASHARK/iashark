          async function getTennisOddsIO(p1Name, p2Name) {
            if(!ODDS_IO_INDEX) return null;
            function ck(n){ return (n||'').toLowerCase().replace(/[^a-z]/g,''); }
            var c1=ck(p1Name), c2=ck(p2Name);
            var found=null;
            Object.values(ODDS_IO_INDEX).forEach(function(e){
              if(found) return;
              var eh=ck(e.home_team||''), ea=ck(e.away_team||'');
              if((eh.slice(0,6)===c1.slice(0,6)&&ea.slice(0,6)===c2.slice(0,6))||
                 (eh.slice(0,6)===c2.slice(0,6)&&ea.slice(0,6)===c1.slice(0,6))) {
                found=e;
              }
            });
            if(!found) return null;
            try {
              // Les cotes sont déjà dans l'event The Odds API
              var bks = found.bookmakers||[];
              var bk = bks.find(function(b){return b.key==='pinnacle';}) ||
                       bks.find(function(b){return b.key==='bet365';}) ||
                       bks[0];
              if(!bk) return null;
              var ml = (bk.markets||[]).find(function(m){return m.key==='h2h';});
              if(!ml||!ml.outcomes||!ml.outcomes[0]) return null;
              // Tennis h2h = 2 outcomes : home et away
              var o1 = ml.outcomes.find(function(o){return ck(o.name).slice(0,6)===c1.slice(0,6);});
              var o2 = ml.outcomes.find(function(o){return ck(o.name).slice(0,6)===c2.slice(0,6);});
              var c1val = o1?parseFloat(o1.price):0;
              var c2val = o2?parseFloat(o2.price):0;
              if(c1val>1&&c2val>1) {
                // Si les noms sont inversés dans l'index, inverser les cotes
                var eh=clean(found.home);
                var needSwap = eh.slice(0,6)===c2.slice(0,6);
                return needSwap?{c1:c2val.toFixed(2),c2:c1val.toFixed(2)}:{c1:c1val.toFixed(2),c2:c2val.toFixed(2)};
              }
              return null;
            } catch(e){ return null; }
          }

