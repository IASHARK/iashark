                +(d.rkH?'Rang FIFA '+d.home+': #'+d.rkH+'\n':'')
                +(d.rkA?'Rang FIFA '+d.away+': #'+d.rkA+'\n':'')
                +'Poisson: '+d.home+' '+d.poisson_p1+'% | Nul '+d.poisson_pN+'% | '+d.away+' '+d.poisson_p2+'%\n'
                +(d.pinnacle_p1?'Pinnacle: '+d.home+' '+d.pinnacle_p1+'% | Nul '+d.pinnacle_pN+'% | '+d.away+' '+d.pinnacle_p2+'%\n':'Pinnacle: non disponible\n')
                +'DC 1X: '+(d.dc1x&&d.dc1x!=='--'?d.dc1x:'N/A')+' | DC X2: '+(d.dc2x&&d.dc2x!=='--'?d.dc2x:'N/A')+' | Over 2.5: '+(d.co25&&d.co25!=='--'?d.co25:'N/A')+'\n\n'
