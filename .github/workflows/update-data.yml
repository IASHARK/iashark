            return files;
          }
          async function updateHistorique(matchsData){
            console.log('\n=== HISTORIQUE UPDATE ===');
            var histoPath='historique.json';
            var histo={predictions:[],stats:{winrate:0,roi:0,total:0,streak:0,wins:0,losses:0},monthly:[],backtesting:{}};
            try{histo=JSON.parse(fs.readFileSync(histoPath,'utf8'));}catch(e){}
            var yesterday=new Date(TODAY+'T12:00:00Z');yesterday.setDate(yesterday.getDate()-1);
            var yDate=yesterday.toISOString().split('T')[0];
            var resolveDates=[];
            for(var dback=1; dback<=4; dback++){
              var dd=new Date(TODAY+'T12:00:00Z'); dd.setDate(dd.getDate()-dback);
              resolveDates.push(dd.toISOString().split('T')[0]);
            }
            // Rattrapage: les predictions encore scheduled/pending plus vieilles que 4 jours
            // (match non retrouve la premiere fois) ne sont sinon plus jamais retentees.
            var staleDates=(histo.predictions||[])
              .filter(function(p){return (p.result==='scheduled'||p.result==='pending')&&p.date;})
              .map(function(p){return p.date.substring(0,10);})
              .filter(function(d,i,arr){return d<yDate&&resolveDates.indexOf(d)===-1&&arr.indexOf(d)===i;});
            resolveDates=resolveDates.concat(staleDates);
            try{
              var yResults=[];
              for(var rdi=0; rdi<resolveDates.length; rdi++){
                var rDate=resolveDates[rdi];
                var fClassic=await get('https://v3.football.api-sports.io/fixtures?date='+rDate+'&timezone=Europe/Paris',APS);
                var fWC=await get('https://v3.football.api-sports.io/fixtures?league=1&season=2026&date='+rDate+'&timezone=Europe/Paris',APS);
                yResults=yResults.concat(fClassic.response||[], fWC.response||[]);
                console.log('  Resultats '+rDate+': '+(fClassic.response||[]).length+' classique + '+(fWC.response||[]).length+' World Cup');
                await sleep(150);
              }
              for(var yr=0;yr<yResults.length;yr++){
                var fix=yResults[yr];
                var fid=fix.fixture&&fix.fixture.id;
                var homeN=fix.teams&&fix.teams.home&&fix.teams.home.name||'';
                var awayN=fix.teams&&fix.teams.away&&fix.teams.away.name||'';
                var gh=fix.goals&&fix.goals.home!=null?fix.goals.home:null;
                var ga=fix.goals&&fix.goals.away!=null?fix.goals.away:null;
                var status=fix.fixture&&fix.fixture.status&&fix.fixture.status.short||'';
                var isVoidStatus=(status==='PST'||status==='CANC'||status==='ABD');
                if(!isVoidStatus&&status!=='FT'&&status!=='AET'&&status!=='PEN')continue;
                if(!isVoidStatus&&(gh===null||ga===null))continue;
                var found=histo.predictions.find(function(p){return (p.result==='scheduled'||p.result==='pending')&&p.fixture_id===fid;});
                if(!found)found=histo.predictions.find(function(p){return (p.result==='scheduled'||p.result==='pending')&&p.type==='single'&&p.date&&resolveDates.indexOf(p.date.substring(0,10))!==-1&&levenshtein((p.home||'').toLowerCase(),homeN.toLowerCase())<=3&&levenshtein((p.away||'').toLowerCase(),awayN.toLowerCase())<=3;});
                if(!found)continue;
                if(isVoidStatus){
                  found.result='void';found.score=null;found.fixture_id=fid;found.resolved_date=TODAY;
                  console.log('  VOID (match '+status+'): '+found.match);
                  continue;
                }
                var isWin=resolveMarketWin(found.prediction, gh, ga);
                if(isWin===null){ continue; }
                if(isWin==='void'){
                  found.result='void';found.score=gh+'-'+ga;found.fixture_id=fid;found.resolved_date=TODAY;
                  console.log('  VOID (push handicap): '+found.match+' ('+gh+'-'+ga+')');
                  continue;
                }
                found.result=isWin?'win':'loss';found.score=gh+'-'+ga;found.fixture_id=fid;found.resolved_date=TODAY;
                console.log('  Resolu foot: '+found.match+' -> '+found.result+' ('+gh+'-'+ga+')');
              }
            }catch(e){console.log('  Resultats hier erreur:',e.message);}
            for(var mi=0;mi<matchsData.length;mi++){
              var m=matchsData[mi];
              var alreadyExists=histo.predictions.find(function(p){return p.fixture_id===m.id||(p.home===m.home.n&&p.away===m.away.n&&p.date&&p.date.substring(0,10)===TODAY);});
              if(!alreadyExists&&m.pari_rec){
                var betLabel=m.pari_rec;
                var betCote=parseFloat(m.cote_rec)||null;
                var marketType='autre';
                if(betLabel){
                  var bl=betLabel.toLowerCase();
                  if(bl.includes('under 2.5'))marketType='under25';
                  else if(bl.includes('over 2.5'))marketType='over25';
                  else if(bl.includes('over 1.5'))marketType='over15';
                  else if(bl.includes('btts non'))marketType='btts_non';
                  else if(bl.includes('btts'))marketType='btts_oui';
                  else if(bl.includes('handicap')&&(bl.includes('domicile')||bl.includes('dom')))marketType='handicap_dom';
                  else if(bl.includes('handicap')&&(bl.includes('exterieur')||bl.includes('ext')))marketType='handicap_ext';
                  else if(bl.includes('victoire')&&(bl.includes('domicile')||bl.includes('dom')))marketType='victoire_dom';
                  else if(bl.includes('victoire')&&(bl.includes('exterieur')||bl.includes('ext')))marketType='victoire_ext';
                  else if(bl.includes('1x'))marketType='dc1x';
                  else if(bl.includes('x2'))marketType='dc_x2';
                }
                var confBucket=m.conf>=8?'8+':m.conf>=7?'7-8':m.conf>=6?'6-7':'<6';
                histo.predictions.unshift({
                  match:m.home.n+' vs '+m.away.n,home:m.home.n,away:m.away.n,
                  prediction:betLabel,cote:betCote,conf:m.conf,conf_bucket:confBucket,
                  model_probability:m.model_probability!=null?m.model_probability:null,
                  reliability:m.reliability||null,
                  market:marketType,league:m.league||'',league_key:m.league_key||'',
                  sport:m.sport||'football',
                  elo_diff:m.elo_diff||null,has_pinnacle:!!(m.pinnacle_snapshot),has_elo:!!(m.elo_home),
                  date:TODAY,result:'scheduled',fixture_id:m.id,type:'single',score:null,
                  pipeline_sha:process.env.GITHUB_SHA||null
                });
              }
            }
            // Archive complete, non plafonnee, dans Supabase (predictions_archive,
            // migration 0005) AVANT toute troncature du cache JSON local - plus
            // aucune prediction n'est perdue definitivement (MASTER §15.3, corrige
            // ce jalon : l'ancien slice(0,300) supprimait silencieusement tout au-dela
            // des 300 plus recentes, a chaque run, sans aucune archive).
            await writePredictionsArchive(histo.predictions);
            // Cache JSON local : fenetre recente bornee pour la taille de page
            // (§33), plus genereuse que l'ancien plafond (500 au lieu de 300) - ce
            // n'est plus destructif puisque l'historique complet vit desormais dans
            // Supabase.
            histo.predictions=histo.predictions.slice(0,500);
            var beforeClean=histo.predictions.length;
            histo.predictions=histo.predictions.filter(function(p){return p.type!=='combi';});
            var cleaned=beforeClean-histo.predictions.length;
            if(cleaned>0)console.log('  Nettoyage: '+cleaned+' combines supprimes');
            var singles=histo.predictions.filter(function(p){return p.type==='single'&&(p.result==='win'||p.result==='loss');});
            var wins=singles.filter(function(p){return p.result==='win';});
            var total=singles.length;
            var winrate=total>0?(wins.length/total*100):0;
            // ROI : cote manquante/invalide -> le pari est exclu du ROI (jamais remplace
            // par une valeur fictive) mais reste compte dans le winrate ci-dessus, qui
            // n'a pas besoin de la cote.
            var roiTotal=0, roiCount=0;
            singles.forEach(function(p){var c=parseFloat(p.cote);if(!c||c<=1)return;roiCount++;roiTotal+=p.result==='win'?(c-1):-1;});
            var roi=roiCount>0?(roiTotal/roiCount*100):0;
            var streak=0;
            for(var si=0;si<singles.length;si++){
              var isW=singles[si].result==='win';
              if(si===0)streak=isW?1:-1;
              else if(isW&&streak>0)streak++;
              else if(!isW&&streak<0)streak--;
              else break;
            }
            histo.stats={winrate:Math.round(winrate*10)/10,roi:Math.round(roi*10)/10,total,streak,wins:wins.length,losses:total-wins.length};
            function breakdown(field){
              var groups={};
              singles.forEach(function(p){
                var k=p[field]||'inconnu';
                if(!groups[k])groups[k]={wins:0,losses:0,roi:0,roiCount:0};
                if(p.result==='win')groups[k].wins++; else groups[k].losses++;
                var c=parseFloat(p.cote);
                if(!c||c<=1)return; // cote manquante : exclue du ROI du groupe, comptee dans wins/losses
                groups[k].roiCount++;
                groups[k].roi+=p.result==='win'?(c-1):-1;
              });
              return Object.keys(groups).sort().map(function(k){
                var g=groups[k];var tot=g.wins+g.losses;
                return{key:k,wins:g.wins,losses:g.losses,total:tot,winrate:tot>0?Math.round(g.wins/tot*1000)/10:0,roi:g.roiCount>0?Math.round(g.roi/g.roiCount*1000)/10:0};
              }).sort(function(a,b){return b.total-a.total;});
            }
            histo.backtesting={by_market:breakdown('market'),by_league:breakdown('league_key'),by_conf:breakdown('conf_bucket'),by_sport:breakdown('sport'),by_has_pinnacle:breakdown('has_pinnacle'),by_has_elo:breakdown('has_elo'),updated:TODAY};
            var mktStats=histo.backtesting.by_market;
            console.log('  === BACKTESTING INSIGHTS ===');
            mktStats.forEach(function(m){if(m.total>=5)console.log('  '+m.key+': '+m.winrate+'% winrate | ROI '+m.roi+'% | '+m.total+' paris');});
            // Meme formule que le ROI global (vraie cote, pas de paiement fixe suppose) -
            // avant ce correctif, le ROI mensuel utilisait un paiement fictif de 0.75 par
            // victoire, une 3e formule independante qui divergeait du ROI global affiche
            // juste au-dessus.
            var months={};
            singles.forEach(function(p){
              var key=(p.date||'').substring(0,7);
              if(!months[key])months[key]={wins:0,losses:0,roi:0,roiCount:0};
              if(p.result==='win')months[key].wins++; else months[key].losses++;
              var c=parseFloat(p.cote);
              if(!c||c<=1)return;
              months[key].roiCount++;
              months[key].roi+=p.result==='win'?(c-1):-1;
            });
            histo.monthly=Object.keys(months).sort().reverse().slice(0,6).map(function(k){
              var mo=months[k];var tot=mo.wins+mo.losses;var r=mo.roiCount>0?(mo.roi/mo.roiCount*100):0;
              var parts=k.split('-');var mn=['Jan','Fev','Mar','Avr','Mai','Jun','Jul','Aou','Sep','Oct','Nov','Dec'];
