          function getElo(eloData,teamName){
            if(!eloData||!teamName) return null;
            var nameLow=teamName.toLowerCase();
            if(eloData[nameLow]) return eloData[nameLow];
            var best=null,bestScore=Infinity;
            Object.keys(eloData).forEach(function(k){
              var score=levenshtein(nameLow,k)/Math.max(nameLow.length,k.length);
              if(score<bestScore){bestScore=score;best=k;}
            });
            return bestScore<0.35?eloData[best]:null;
          }

          function eloWinProb(eloH,eloA,vdH,mdHdom){
            if(!eloH||!eloA) return null;
            var homeBonus=70;
            if(vdH!=null&&mdHdom&&mdHdom>0){
              var hwr=vdH/mdHdom;
              if(hwr>=0.65)homeBonus=100;else if(hwr>=0.50)homeBonus=70;else if(hwr>=0.35)homeBonus=40;else homeBonus=20;
            }
            var probHadj=1/(1+Math.pow(10,(eloA-(eloH+homeBonus))/400));
            return {probH:Math.round(probHadj*100),probA:Math.round((1-probHadj)*100),diff:Math.round(eloH-eloA),homeBonus,signal:Math.abs(eloH-eloA)>=100?'FORT':Math.abs(eloH-eloA)>=50?'MOD\u00c9R\u00c9':'FAIBLE'};
          }

          function parseOdds(o) {
            var empty={c1:'--',cn:'--',c2:'--',co15:'--',co25:'--',cu25:'--',dc1x:'--',dc2x:'--',dc12:'--',btts_oui:'--',btts_non:'--',bookies:[]};
            if(!o||!o.bookmakers||!o.bookmakers.length) return empty;
            var arr1=[],arrN=[],arr2=[],arr15=[],arr25=[],arru25=[],arr35=[],arru35=[],arr1x=[],arrx2=[],arr12=[],arrby=[],arrbn=[];
            o.bookmakers.forEach(function(bk){
              (bk.bets||[]).forEach(function(bet){
                if(bet.name==='Match Winner'||bet.name==='Home/Draw/Away'){
                  var hm=(bet.values||[]).find(function(v){return v.value==='Home';});
                  var dr=(bet.values||[]).find(function(v){return v.value==='Draw';});
                  var aw=(bet.values||[]).find(function(v){return v.value==='Away';});
                  if(hm&&parseFloat(hm.odd)>=1.05&&parseFloat(hm.odd)<=15)arr1.push(parseFloat(hm.odd));
                  if(dr&&parseFloat(dr.odd)>=1.05&&parseFloat(dr.odd)<=15)arrN.push(parseFloat(dr.odd));
                  if(aw&&parseFloat(aw.odd)>=1.05&&parseFloat(aw.odd)<=15)arr2.push(parseFloat(aw.odd));
                }
                if(bet.name==='Goals Over/Under'){
                  (bet.values||[]).forEach(function(v){
                    if(v.value==='Over 1.5')arr15.push(parseFloat(v.odd));
                    if(v.value==='Over 2.5')arr25.push(parseFloat(v.odd));
                    if(v.value==='Under 2.5')arru25.push(parseFloat(v.odd));
                    if(v.value==='Over 3.5')arr35.push(parseFloat(v.odd));
                    if(v.value==='Under 3.5')arru35.push(parseFloat(v.odd));
                  });
                }
                if(bet.name==='Double Chance'){
                  var d1x=(bet.values||[]).find(function(v){return v.value==='Home/Draw';});
                  var dx2=(bet.values||[]).find(function(v){return v.value==='Draw/Away';});
                  var d12=(bet.values||[]).find(function(v){return v.value==='Home/Away';});
                  if(d1x)arr1x.push(parseFloat(d1x.odd));
                  if(dx2)arrx2.push(parseFloat(dx2.odd));
                  if(d12)arr12.push(parseFloat(d12.odd));
                }
                if(bet.name==='Both Teams Score'){
                  var by=(bet.values||[]).find(function(v){return v.value==='Yes';});
                  var bn=(bet.values||[]).find(function(v){return v.value==='No';});
                  if(by)arrby.push(parseFloat(by.odd));
                  if(bn)arrbn.push(parseFloat(bn.odd));
                }
              });
            });
            function med(a){
              if(!a.length)return '--';
              var s=a.slice().sort(function(x,y){return x-y;});
              var m=Math.floor(s.length/2);
              return (s.length%2?s[m]:((s[m-1]+s[m])/2)).toFixed(2);
            }
            var c1=med(arr1),cn=med(arrN),c2=med(arr2);
            var co15=med(arr15),co25=med(arr25),cu25=med(arru25);
            var dc1x=med(arr1x),dc2x=med(arrx2),dc12=med(arr12);
            var btts_oui=med(arrby),btts_non=med(arrbn);
            var deltas=[0,-0.03,-0.02,-0.05,+0.03];
            function vary(c,d){if(!c||c==='--')return '--';return Math.max(1.01,parseFloat(c)+d).toFixed(2);}
            var bookies=FR_FIXED.map(function(bk,i){return {n:bk.n,o:bk.o,l:bk.l,c:vary(c1,deltas[i]),c1:vary(c1,deltas[i]),cn:vary(cn,deltas[i]),c2:vary(c2,deltas[i])};});
            return {c1,cn,c2,co15,co25,cu25,co35:med(arr35),cu35:med(arru35),dc1x,dc2x,dc12,btts_oui,btts_non,bookies};
          }

          function calcCriteres(stats,isDom,rank){
            if(!stats)return{fd:50,att:50,def:50,fr:50,mot:70,fat:50};
            var total=(stats.fixtures&&stats.fixtures.played&&stats.fixtures.played.total)||30;
            var bm=(stats.goals&&stats.goals.for&&stats.goals.for.total&&stats.goals.for.total.total)||0;
            var be=(stats.goals&&stats.goals.against&&stats.goals.against.total&&stats.goals.against.total.total)||0;
            var form=(stats.form||'').slice(-5);
            var pts=form.split('').reduce(function(a,c){return a+(c==='W'?3:c==='D'?1:0);},0);
            var fr=Math.round(pts/Math.max(form.length*3,1)*100);
            var att=Math.min(100,Math.round(bm/Math.max(total,1)*40));
            var def=Math.max(0,Math.min(100,Math.round((2.5-be/Math.max(total,1))*35)));
            var vd=(stats.fixtures&&stats.fixtures.wins&&stats.fixtures.wins.home)||0;
            var ve=(stats.fixtures&&stats.fixtures.wins&&stats.fixtures.wins.away)||0;
            var md=(stats.fixtures&&stats.fixtures.played&&stats.fixtures.played.home)||Math.round(total/2);
            var me=(stats.fixtures&&stats.fixtures.played&&stats.fixtures.played.away)||Math.round(total/2);
            var fd=isDom?Math.min(100,Math.round(vd/Math.max(md,1)*100)):Math.min(100,Math.round(ve/Math.max(me,1)*100));
            var mot=70;
            if(rank){if(rank<=3)mot=95;else if(rank<=6)mot=85;else if(rank<=10)mot=70;else if(rank>=17)mot=90;else mot=60;}
            return{fd:Math.max(0,Math.min(100,fd)),att:Math.max(0,Math.min(100,att)),def:Math.max(0,Math.min(100,def)),fr:Math.max(0,Math.min(100,fr)),mot:Math.max(0,Math.min(100,mot)),fat:50};
          }

          function calcFatigue(last10){
            if(!last10||!last10.length)return{val:40,info:'Calendrier inconnu'};
            var now=new Date();
            var last=new Date(last10[0].date_full||last10[0].d);
            var daysSince=Math.round((now-last)/(1000*60*60*24));
            var matchesIn14=last10.filter(function(m){return (now-new Date(m.date_full||m.d))/(1000*60*60*24)<=14;}).length;
            var score=0;
            if(daysSince<=2)score=90;else if(daysSince<=4)score=70;else if(daysSince<=6)score=50;else if(daysSince<=8)score=30;else score=15;
            if(matchesIn14>=3)score=Math.min(100,score+20);
            return{val:Math.round(score),info:daysSince<=7?'Dernier match il y a '+daysSince+'j \u2014 '+matchesIn14+' match(s) en 14j':'Repos '+daysSince+' jours'};
          }

          function calcTendances(last10Home,last10Away){
            function countOver25(games){return games.filter(function(g){var p=(g.score||'').split('-');return parseInt(p[0]||0)+parseInt(p[1]||0)>2;}).length;}
            function countBTTS(games){return games.filter(function(g){var p=(g.score||'').split('-');return parseInt(p[0]||0)>0&&parseInt(p[1]||0)>0;}).length;}
            var domGames=last10Home.filter(function(g){return g.home===true;});
            var extGames=last10Away.filter(function(g){return g.home===false;});
            var n1=Math.max(domGames.length,1),n2=Math.max(extGames.length,1);
            return{over25_home:countOver25(domGames),over25_away:countOver25(extGames),over25_home_n:n1,over25_away_n:n2,btts_home:countBTTS(domGames),btts_away:countBTTS(extGames),btts_home_n:n1,btts_away_n:n2};
          }

          function calcMotivation(rank,totalTeams,pts,ptsLeader,matchsLeft,isHome,leagueName,homeName,awayName){
            totalTeams=totalTeams||20;matchsLeft=matchsLeft||5;
            var alerts=[],score=50;
