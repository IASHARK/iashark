              var beAext_p=(sA&&sA.goals&&sA.goals.against&&sA.goals.against.total&&sA.goals.against.total.away)||0;
              var meAext_p=(sA&&sA.fixtures&&sA.fixtures.played&&sA.fixtures.played.away)||10;
              var lambdas=calcLambdas(bmHdom_p,beHdom_p,mdHdom,bmAext_p,beAext_p,meAext_p);
              if(xgH.xg_avg&&xgA.xg_avg){lambdas.lambdaH=parseFloat((lambdas.lambdaH*0.6+parseFloat(xgH.xg_avg)*0.4).toFixed(3));lambdas.lambdaA=parseFloat((lambdas.lambdaA*0.6+parseFloat(xgA.xg_avg)*0.4).toFixed(3));}
              var poissonProbs=calcPoissonProbs(lambdas.lambdaH,lambdas.lambdaA);

              var shinProbs=null;
              if(pinnacleOdds&&pinnacleOdds.c1&&pinnacleOdds.cn&&pinnacleOdds.c2){var raw=shinProbabilities([pinnacleOdds.c1,pinnacleOdds.cn,pinnacleOdds.c2]);if(raw)shinProbs={p1:Math.round(raw[0]*100),pN:Math.round(raw[1]*100),p2:Math.round(raw[2]*100)};}

              function calcEdge(probIA,cote){if(!probIA||!cote||cote==='--')return null;var edge=probIA/100-1/parseFloat(cote);return edge>0?Math.round(edge*100):null;}
              var prob1X=(shinProbs?shinProbs.p1:poissonProbs.p1)+(shinProbs?shinProbs.pN:poissonProbs.pN);
              var probX2=(shinProbs?shinProbs.p2:poissonProbs.p2)+(shinProbs?shinProbs.pN:poissonProbs.pN);
              var allEdges=[
                {market:'Over 2.5',edge:calcEdge(poissonProbs.over25,odds.co25),cote:odds.co25,prob:poissonProbs.over25},
                {market:'BTTS Non',edge:calcEdge(poissonProbs.bttsN,odds.btts_non),cote:odds.btts_non,prob:poissonProbs.bttsN},
                {market:'DC 1X',edge:calcEdge(prob1X,odds.dc1x),cote:odds.dc1x,prob:prob1X},
                {market:'DC X2',edge:calcEdge(probX2,odds.dc2x),cote:odds.dc2x,prob:probX2}
              ].filter(function(e){return e.edge!==null&&e.edge>=5&&e.cote&&e.cote!=='--'&&parseFloat(e.cote)>=1.50&&parseFloat(e.cote)<=3.00;});
              allEdges.sort(function(a,b){return b.edge-a.edge;});
              var bestEdge=allEdges[0]||null;
              var nodeKelly=bestEdge?fractionalKelly(bestEdge.prob/100,parseFloat(bestEdge.cote),0.25):null;

              var injuries=(injRaw||[]).map(function(inj){return{name:inj.name,team:inj.team===home.id?home.id:away.id,reason:inj.reason||'Blessure',status:(inj.status||'out').toLowerCase().includes('suspend')?'suspended':'out',impact:'medium'};});
              var matchup=calcMatchup(xgH,xgA,sH,sA);
              var keyAbsenceAlerts=calcKeyAbsences(injuries,topScorersH,topScorersA,home.id,away.id,bmHdom,mdHdom,bmAext,meAext);
              var disciplineRisk=calcDisciplineRisk(refStats,xgH,xgA,home.name,away.name);
              var h2hFormatted=formatH2H(h2hRaw,home.id);
              var mdH=(sH&&sH.fixtures&&sH.fixtures.played&&sH.fixtures.played.home)||Math.round(totalH/2);
              var meA=(sA&&sA.fixtures&&sA.fixtures.played&&sA.fixtures.played.away)||Math.round(totalA/2);
              var d10Hstr=last10H.slice(0,5).map(function(m){return m.result+' '+m.score+' vs '+m.match+' ('+m.lieu+')';}).join(' | ')||'N/A';
              var d10Astr=last10A.slice(0,5).map(function(m){return m.result+' '+m.score+' vs '+m.match+' ('+m.lieu+')';}).join(' | ')||'N/A';
              var domH20=last10H.slice(0,20).filter(function(m){return m.home===true;});
              var extA20=last10A.slice(0,20).filter(function(m){return m.home===false;});
              function calcCurrentStreak(matches){if(!matches||!matches.length)return '';var last=matches[0].result,count=0;for(var i=0;i<matches.length;i++){if(matches[i].result===last)count++;else break;}var label=last==='W'?'victoires consécutives':last==='L'?'défaites consécutives':'nuls consécutifs';return count>1?'En ce moment: '+count+' '+label:'';}
              var streakH=calcCurrentStreak(last10H);
              var streakA=calcCurrentStreak(last10A);
              var forme5H=last10H.slice(0,5).map(function(m){return m.result;}).join('');
              var forme5A=last10A.slice(0,5).map(function(m){return m.result;}).join('');
              var csHdom=(sH&&sH.clean_sheet&&sH.clean_sheet.home)||0;
              var csAext=(sA&&sA.clean_sheet&&sA.clean_sheet.away)||0;
              var failHdom=(sH&&sH.failed_to_score&&sH.failed_to_score.home)||0;
              var failAext=(sA&&sA.failed_to_score&&sA.failed_to_score.away)||0;
              var h2hAvgButs='?',h2hNuls=0;
              if(h2hRaw&&h2hRaw.length){var h2hTotal=0;h2hRaw.slice(0,5).forEach(function(g){h2hTotal+=(g.goals.home||0)+(g.goals.away||0);if((g.goals.home||0)===(g.goals.away||0))h2hNuls++;});h2hAvgButs=(h2hTotal/Math.min(h2hRaw.length,5)).toFixed(2);}
              var heureUTC=(f.date||'').split('T')[1]?(f.date||'').split('T')[1].slice(0,5):'';
              var heure=toParisHeure(f.date||'')||heureUTC;
              var meteoStr=wx?wx.desc+' '+wx.emoji+' '+wx.temp+' | Vent: '+wx.wind:'N/A';

              var an=await genAnalyse({
                leagueId:lg.id,home:home.name,away:away.name,homeId:home.id,awayId:away.id,
                league:lg.name,date:TODAY+' '+heure,stade:(f.venue&&f.venue.name)||'',meteo:meteoStr,
                rkH,rkA,totalH,totalA,mdH,meA,
                bmH:(sH&&sH.goals&&sH.goals.for&&sH.goals.for.total&&sH.goals.for.total.total)||0,
                beH:(sH&&sH.goals&&sH.goals.against&&sH.goals.against.total&&sH.goals.against.total.total)||0,
                bmA:(sA&&sA.goals&&sA.goals.for&&sA.goals.for.total&&sA.goals.for.total.total)||0,
                beA:(sA&&sA.goals&&sA.goals.against&&sA.goals.against.total&&sA.goals.against.total.total)||0,
                vdH:(sH&&sH.fixtures&&sH.fixtures.wins&&sH.fixtures.wins.home)||0,
                veA:(sA&&sA.fixtures&&sA.fixtures.wins&&sA.fixtures.wins.away)||0,
                d10H:d10Hstr,d10A:d10Astr,csHdom,csAext,failHdom,failAext,
                bmHdom,beHdom,bmAext,beAext,mdHdom,meAext,h2hAvgButs,h2hNuls,
                c1:odds.c1,cn:odds.cn,c2:odds.c2,co15:odds.co15,co25:odds.co25,cu25:odds.cu25,
                dc1x:odds.dc1x,dc2x:odds.dc2x,btts_oui:odds.btts_oui,btts_non:odds.btts_non,
                injuries,h2h:h2hRaw,fatH:fatigueH.info,fatA:fatigueA.info,
                domH20w:domH20.filter(function(m){return m.result==='W';}).length,
                domH20d:domH20.filter(function(m){return m.result==='D';}).length,
                domH20l:domH20.filter(function(m){return m.result==='L';}).length,
                domH20:domH20.length,
                extA20w:extA20.filter(function(m){return m.result==='W';}).length,
                extA20d:extA20.filter(function(m){return m.result==='D';}).length,
                extA20l:extA20.filter(function(m){return m.result==='L';}).length,
                extA20:extA20.length,
                xgH_avg:xgH.xg_avg,xgH_weighted:xgH.xg_weighted,xgH_fouls:xgH.fouls_avg,
                xgA_avg:xgA.xg_avg,xgA_weighted:xgA.xg_weighted,xgA_fouls:xgA.fouls_avg,
                poisson_lambdaH:lambdas.lambdaH,poisson_lambdaA:lambdas.lambdaA,
                poisson_p1:poissonProbs.p1,poisson_pN:poissonProbs.pN,poisson_p2:poissonProbs.p2,
                poisson_over25:poissonProbs.over25,poisson_under25:poissonProbs.under25,
                poisson_bttsY:poissonProbs.bttsY,poisson_bttsN:poissonProbs.bttsN,
                pinnacle_p1:shinProbs?shinProbs.p1:null,pinnacle_pN:shinProbs?shinProbs.pN:null,pinnacle_p2:shinProbs?shinProbs.p2:null,
                pinnacle_c1:pinnacleOdds?pinnacleOdds.c1:null,pinnacle_c2:pinnacleOdds?pinnacleOdds.c2:null,
                best_edge:bestEdge?bestEdge.edge:null,best_edge_market:bestEdge?bestEdge.market:null,
                all_edges:allEdges.slice(0,3),node_kelly:nodeKelly,
                lineup_home_formation:lineups&&lineups.home?lineups.home.formation:null,
                lineup_away_formation:lineups&&lineups.away?lineups.away.formation:null,
                streakH,streakA,forme5H,forme5A,
                evPatH,evPatA,motivH,motivA,matchup,keyAbsenceAlerts,disciplineRisk,topScorersH,topScorersA,
                eloH,eloA,eloStats,droppingOdds,
                xgH_xga:xgH.xga_avg,xgA_xga:xgA.xga_avg,
                xgH_defense_surchauffe:xgH.defense_surchauffe,xgA_defense_surchauffe:xgA.defense_surchauffe,
              });
              await sleep(500);

              if(an&&an.passe_ton_tour===true){
                console.log('  \u23ed PASS: '+home.name+' vs '+away.name);
                an.pari_rec='';an.cote_rec='';an.confiance=0;an.vbet='NON';an.verdict_shark='';an.edge='';an.kelly='0';an.marche='';an.risque='ELEVE';
              }

              (function(){
                var p=(an&&an.pari_rec||'').toLowerCase();
                var coteRec;
                if(p.includes('btts non'))coteRec=odds.btts_non;
                else if(p.includes('x2'))coteRec=odds.dc2x;
                else if(p.includes('1x'))coteRec=odds.dc1x;
                else if(p.includes('over 2.5'))coteRec=odds.co25;
                else coteRec=an&&an.cote_rec||odds.c1;
                var deltas=[0,-0.03,-0.02,-0.05,+0.03];
                if(odds.bookies&&odds.bookies.length&&coteRec&&coteRec!=='--'){odds.bookies.forEach(function(bk,i){bk.c=Math.max(1.01,parseFloat(coteRec)+(deltas[i]||0)).toFixed(2);});}
              })();

              var kellyVal=nodeKelly||null;
              if(!kellyVal&&an){var edgeRaw=(an.edge||'').replace(/[^0-9.]/g,'');var edgeNum=parseFloat(edgeRaw)||0;var coteRaw=parseFloat(an.cote_rec)||parseFloat(odds.c1)||0;if(edgeNum>0&&coteRaw>1)kellyVal=Math.min((edgeNum/(coteRaw-1))*0.25,5).toFixed(1);}

              var classementObj=null;
              if(entryH||entryA){
                var rankH=rkH||99,rankA=rkA||99;
                var minRank=Math.max(1,Math.min(rankH,rankA)-2);
                var maxRank=Math.min(Math.max(rankH,rankA)+2,standings.length);
                classementObj={league_name:lg.name,standings:standings.filter(function(s){return s.rank>=minRank&&s.rank<=maxRank;}).map(function(s){return{rank:s.rank,name:s.team.name,team_id:s.team.id,played:s.all.played,won:s.all.win,drawn:s.all.draw,lost:s.all.lose,gd:s.goalsDiff,pts:s.points,form:s.form||''};}),home:entryH?{rank:entryH.rank,pts:entryH.points,played:entryH.all.played,won:entryH.all.win,lost:entryH.all.lose,gd:entryH.goalsDiff,form:entryH.form||''}:null,away:entryA?{rank:entryA.rank,pts:entryA.points,played:entryA.all.played,won:entryA.all.win,lost:entryA.all.lose,gd:entryA.goalsDiff,form:entryA.form||''}:null};
              }

              var risqueRaw=an?(an.risque||'MODERE'):'MODERE';
              var risqueNorm=risqueRaw.toUpperCase();
              if(risqueNorm.includes('FAIBLE'))risqueNorm='FAIBLE';
              else if(risqueNorm.includes('ELEVE')||risqueNorm.includes('HIGH'))risqueNorm='ELEVE';
              else risqueNorm='MODERE';

              var parisDateObj=new Date(new Date(f.date||TODAY).toLocaleString('en-US',{timeZone:'Europe/Paris'}));
              var dateVraieParis=parisDateObj.getFullYear()+'-'+String(parisDateObj.getMonth()+1).padStart(2,'0')+'-'+String(parisDateObj.getDate()).padStart(2,'0');

              var matchObj={
                id:f.id,sport:'football',
                home:{n:home.name,id:home.id},away:{n:away.name,id:away.id},
                league:lg.name,ligue_icon:lgIcon(lg.name),league_key:lgKey(lg.id),
                date:(dateVraieParis+' '+heure).trim(),cat:['all'],
                val:an?(an.vbet==='OUI'&&(an.confiance||0)>=7.0):false,
                hot:an?((an.confiance||0)>=8.0||((an.confiance||0)>=7.5&&['ldc','premier','laliga','seriea','bundesliga','ligue1'].includes(lgKey(lg.id)))):false,
                conf:an?parseFloat(an.confiance||0):0,
                p1:an&&(an.p1||0)>0?(an.p1||0):(shinProbs?shinProbs.p1:poissonProbs.p1)||0,
                pn:an&&(an.pn||0)>0?(an.pn||0):(shinProbs?shinProbs.pN:poissonProbs.pN)||0,
                p2:an&&(an.p2||0)>0?(an.p2||0):(shinProbs?shinProbs.p2:poissonProbs.p2)||0,
                po15:0,po25:an?(an.po25||0):0,btts:an?(an.btts||0):0,
                c1:odds.c1,cn:odds.cn,c2:odds.c2,co15:odds.co15,co25:odds.co25,cu25:odds.cu25,
                dc1x:odds.dc1x,dc2x:odds.dc2x,dc12:odds.dc12,cdc1x:odds.dc1x,cdc2x:odds.dc2x,
                cbtts:odds.btts_oui,cbtts_non:odds.btts_non,btts_oui:odds.btts_oui,btts_non:odds.btts_non,
                bookies:odds.bookies,edge:an?(an.edge||''):'',marche:an?(an.marche||'RESULTAT'):'RESULTAT',
                risque:risqueNorm,pari_rec:an?(an.pari_rec||''):'',
                cote_rec:an?(an.cote_rec||''):'',
                no_signal:an&&an.passe_ton_tour===true?true:!(an&&an.pari_rec),
                no_signal_label:(an&&an.passe_ton_tour===true)||(!(an&&an.pari_rec))?'Aucun signal clair sur ce match':'',
                mise:'2-3% bankroll',verdict_shark:an?(an.verdict_shark||''):'',
                scenario:an?(an.scenario||{phase1:'',phase2:'',phase3:''}):null,
                scenario_15min:an?(an.scenario_15min||null):null,
                facteur_x:an?(an.facteur_x||''):'',
                analyse_card:an?(an.analyse_card||an.conseil||''):'',
                conseil_public:an?(an.conseil||an.analyse_card||''):'',
                contexte:an?(an.contexte||''):'',
                vbet:an?(an.vbet||'NON'):'NON',
                scores:an&&an.score_central?[an.score_central]:[],
                paris_safe:{bet:an?(an.pari_rec||''):'',cote:an?(parseFloat(an.cote_rec)||odds.c1):odds.c1,proba:an?(an.p1||0)+'%':''},
                paris_risque:{bet:'',cote:'',proba:''},kelly:kellyVal,
                stade:{nom:f.venue&&f.venue.name?(f.venue.name+(f.venue.city?' \u2014 '+f.venue.city:'')):home.name+' (domicile)',cap:'',meteo:wx?wx.emoji:'\ud83c\udf24\ufe0f',temp:wx?wx.temp:'',desc:wx?wx.desc:''},
                crit_home:critH,crit_away:critA,
                form_home:last10H.slice(0,5),form_away:last10A.slice(0,5),
                forme_h:(sH&&sH.form)||'',forme_a:(sA&&sA.form)||'',
                h2h:h2hFormatted,injuries,
                fatigue:{home:{val:fatigueH.val,info:fatigueH.info},away:{val:fatigueA.val,info:fatigueA.info}},
                fatigue_home:{val:fatigueH.val,info:fatigueH.info},fatigue_away:{val:fatigueA.val,info:fatigueA.info},
                tendances,classement:classementObj,actu:(nH||[]).concat(nA||[]),
                arbitre:refStats?{nom:refStats.name,cartons:refStats.cards_per_game,penaltys:refStats.pens_per_game,matchs:refStats.games}:null,
                events_home:evPatH||null,events_away:evPatA||null,
                top_scorers_home:topScorersH||[],top_scorers_away:topScorersA||[],
                elo_home:eloH?Math.round(eloH):null,elo_away:eloA?Math.round(eloA):null,
                elo_diff:eloStats?eloStats.diff:null,elo_signal:eloStats?eloStats.signal:null,
                dropping_odds:droppingOdds||null,
                pinnacle_snapshot:pinnacleOdds?{c1:pinnacleOdds.c1,cn:pinnacleOdds.cn,c2:pinnacleOdds.c2,date:TODAY}:null,
              };
              matchsData.push(matchObj);

              if(an&&(an.confiance||0)>=7.0){
                var edgeNumCheck=parseFloat((an.edge||'').replace(/[^0-9.]/g,''))||0;
                var coteRecCheck=parseFloat(an.cote_rec)||0;
                var edgeOk=edgeNumCheck>=5&&edgeNumCheck<=15;
                var coteOk=coteRecCheck>=1.55&&coteRecCheck<=2.40;
                var eloOk=isWorldCupMatch?true:!!(matchObj.elo_home&&matchObj.elo_away);
                var pariLow=(an.pari_rec||'').toLowerCase();
                var marcheOk=pariLow.includes('dc 1x')||pariLow.includes('dc x2')||pariLow.includes('over 2.5')||pariLow.includes('btts non');
                if(edgeOk&&coteOk&&eloOk&&marcheOk){
                  var coteRec2=odds.c1;
                  if(pariLow.includes('btts non'))coteRec2=odds.btts_non;
                  else if(pariLow.includes('x2'))coteRec2=odds.dc2x;
                  else if(pariLow.includes('1x'))coteRec2=odds.dc1x;
                  else if(pariLow.includes('over 2.5'))coteRec2=odds.co25;
                  forCombis.push({home:home.name,away:away.name,pari:an.pari_rec,conf:an.confiance,edge:an.edge||'',cote:coteRec2&&coteRec2!=='--'?parseFloat(coteRec2):1.5});
                  console.log('  \u2705 QUALIFI\u00c9: conf='+an.confiance+' edge='+edgeNumCheck+'% cote='+coteRecCheck);
                }else{console.log('  \u26d4 Filtr\u00e9: conf='+an.confiance+' edge='+edgeNumCheck+'% cote='+coteRecCheck);}
              }
              console.log('  OK conf='+matchObj.conf+' edge='+matchObj.edge+' pari='+matchObj.pari_rec);
            }

            // ── 3. TENNIS PROCESSING ──
            var tennisMatchs = [];
            if(tennisFixtures.length){
              tennisMatchs = await processTennisFixtures(tennisFixtures);
            }

            // ── 4. MERGE football + tennis dans matchsData ──
            var allMatchsData = matchsData.concat(tennisMatchs);
            allMatchsData.sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});

            // ── 5. COMBINÉS (football uniquement) ──
            matchsData.sort(function(a,b){var tA=(a.date||'').split(' ')[1]||'99:99';var tB=(b.date||'').split(' ')[1]||'99:99';return tA<tB?-1:tA>tB?1:0;});
            var todayDate=new Date(TODAY+'T12:00:00Z');
            var dayOfWeek=todayDate.getUTCDay();
            var isSamedi=(dayOfWeek===6);
            var isDimanche=(dayOfWeek===0);
            var combisRaw=await genCombis(forCombis,isSamedi,isDimanche,matchsData);
            var combisData=combisRaw.map(function(c){return{label:c.label,type:c.type,selections:c.selections,matchs:c.matchs,cote_totale:c.cote_totale,conseil:c.conseil};});

            fs.writeFileSync('data.json',JSON.stringify({matchs:allMatchsData,combis:combisData},null,2));
            console.log('\n=== DONE: '+allMatchsData.length+' matchs total ('+matchsData.length+' football + '+tennisMatchs.length+' tennis) | '+combisData.length+' combis ===');

            await updateHistorique(allMatchsData);

            generateWorldCupPages();
            generateSitemaps(allMatchsData);
          }

          main().catch(function(e){console.error('FATAL:',e.message,e.stack);process.exit(0);});
          JSEOF

      - name: Run pipeline
        env:
          APISPORTS_KEY:      ${{ secrets.APISPORTS_KEY }}
          OPENWEATHER_KEY:    ${{ secrets.OPENWEATHER_KEY }}
          NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_KEY:      ${{ secrets.ANTHROPIC_KEY }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
          CREATOMATE_KEY:     ${{ secrets.CREATOMATE_KEY }}
        run: node pipeline.js

      - name: Commit and push
        run: |
          git config user.name "IASHARK"
          git config user.email "yaramode81@gmail.com"
          git add data.json historique.json sitemap.xml sitemap-*.xml
          git diff --staged --quiet || git commit -m "Daily update - $(date +%Y-%m-%d)"
          git push
