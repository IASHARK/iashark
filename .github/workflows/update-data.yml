name: Update IASHARK Daily

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Write pipeline script
        run: |
          cat > pipeline.js << 'JSEOF'
          const https = require('https');
          const fs    = require('fs');
          const APS_KEY    = process.env.APISPORTS_KEY;
          const OWM_KEY    = process.env.OPENWEATHER_KEY;
          const NEWS_KEY   = process.env.NEWSAPI_KEY;
          const ANT_KEY    = process.env.ANTHROPIC_KEY;
          const ODDS_KEY   = process.env.ODDS_API_KEY;
          const TENNIS_KEY = process.env.RAPIDAPI_TENNIS_KEY;
          const ODDS_IO_KEY = process.env.ODDS_API_IO_KEY;
          const APS        = {'x-apisports-key': APS_KEY};
          const TENNIS_HEADERS = {
            'x-rapidapi-key':  TENNIS_KEY,
            'x-rapidapi-host': 'tennis-api-atp-wta-itf.p.rapidapi.com'
          };
          const TENNIS_BASE = 'https://tennis-api-atp-wta-itf.p.rapidapi.com';

          // ── MODÈLE COUPE DU MONDE 2026 ──────────────────────────
          var WC_DATA = null, WC_MODEL = null;
          try {
            WC_DATA  = require('./wc2026_data.js');
            WC_MODEL = require('./wc2026_model.js');
            console.log('WC2026 model loaded OK');
          } catch(e) { console.log('WC2026 model not found:', e.message); }

          // ── HELPERS ──────────────────────────────────────────────
          function sleep(ms) { return new Promise(function(r){ setTimeout(r,ms); }); }

          function get(url, headers) {
            return new Promise(function(resolve) {
              var u = new URL(url);
              var timer = setTimeout(function(){ resolve({}); }, 10000);
              https.get({
                hostname: u.hostname, path: u.pathname+u.search,
                headers: Object.assign({'User-Agent':'IASHARK/1.0'}, headers||{})
              }, function(res) {
                var d='';
                res.on('data',function(c){d+=c;});
                res.on('end',function(){
                  clearTimeout(timer);
                  try{ resolve(JSON.parse(d)); }catch(e){ resolve({}); }
                });
              }).on('error',function(){ clearTimeout(timer); resolve({}); });
            });
          }

          function getArr(url, headers) {
            return new Promise(function(resolve) {
              var u = new URL(url);
              var timer = setTimeout(function(){ resolve([]); }, 10000);
              https.get({
                hostname: u.hostname, path: u.pathname+u.search,
                headers: Object.assign({'User-Agent':'IASHARK/1.0'}, headers||{})
              }, function(res) {
                var d='';
                res.on('data',function(c){d+=c;});
                res.on('end',function(){
                  clearTimeout(timer);
                  try{
                    var parsed = JSON.parse(d);
                    resolve(Array.isArray(parsed) ? parsed : (parsed.data||parsed.response||[]));
                  }catch(e){ resolve([]); }
                });
              }).on('error',function(){ clearTimeout(timer); resolve([]); });
            });
          }

          // ═══════════════════════════════════════════════════════
          // ── DONNÉES DYNAMIQUES WC2026 — qualifs réelles + tournoi en cours ──
          // ═══════════════════════════════════════════════════════

          // Mapping équipe → ligue de qualifs API-Sports (par confédération).
          // Océanie (id 33) n'a pas statistics_fixtures actif → pas de fallback API,
          // on reste sur wc2026_data.js (QUALS_XG statique) pour ces équipes.
          var WC_QUALIF_LEAGUE = {
            // Europe (id 32)
            'France':32,'Germany':32,'Spain':32,'England':32,'Portugal':32,'Italy':32,
            'Netherlands':32,'Belgium':32,'Croatia':32,'Switzerland':32,'Austria':32,
            'Denmark':32,'Norway':32,'Sweden':32,'Poland':32,'Ukraine':32,'Czech Republic':32,
            'Scotland':32,'Wales':32,'Serbia':32,'Slovakia':32,'Slovenia':32,'Romania':32,
            'Hungary':32,'Bosnia':32,'Bosnia and Herzegovina':32,'Albania':32,'Kosovo':32,
            'Greece':32,'Turkey':32,'Iceland':32,'Finland':32,'Ireland':32,'Northern Ireland':32,
            'Montenegro':32,'North Macedonia':32,'Israel':32,'Georgia':32,'Luxembourg':32,
            'Cyprus':32,'Faroe Islands':32,'Gibraltar':32,'San Marino':32,'Andorra':32,
            'Malta':32,'Moldova':32,'Belarus':32,'Armenia':32,'Azerbaijan':32,'Kazakhstan':32,
            'Estonia':32,'Latvia':32,'Lithuania':32,'Bulgaria':32,'Liechtenstein':32,

            // CONCACAF (id 31)
            'USA':31,'Mexico':31,'Canada':31,'Costa Rica':31,'Jamaica':31,'Panama':31,
            'Honduras':31,'El Salvador':31,'Curacao':31,'Haiti':31,'Trinidad and Tobago':31,
            'Guatemala':31,'Nicaragua':31,'Suriname':31,

            // Asie (id 30)
            'Iran':30,'South Korea':30,'Korea Republic':30,'Japan':30,'Australia':30,
            'Saudi Arabia':30,'Qatar':30,'Iraq':30,'UAE':30,'United Arab Emirates':30,
            'Uzbekistan':30,'Jordan':30,'Oman':30,'Bahrain':30,'Kyrgyzstan':30,
            'North Korea':30,'China':30,'Indonesia':30,'Palestine':30,

            // Afrique (id 29)
            'Morocco':29,'Senegal':29,'Tunisia':29,'Egypt':29,'Algeria':29,'Nigeria':29,
            'Ghana':29,'Cameroon':29,'Ivory Coast':29,'South Africa':29,'DR Congo':29,
            'Mali':29,'Cape Verde':29,'Gabon':29,'Mozambique':29,'Benin':29,'Uganda':29,
            'Burkina Faso':29,'Guinea':29,

            // Amérique du Sud (id 34)
            'Brazil':34,'Argentina':34,'Uruguay':34,'Colombia':34,'Ecuador':34,
            'Paraguay':34,'Bolivia':34,'Venezuela':34,'Chile':34,'Peru':34,

            // Océanie (id 33) — pas de stats fixtures, volontairement absent du mapping
            // 'New Zealand', 'Fiji', etc. tomberont sur le fallback statique.
          };

          // Cache mémoire pour éviter de refetch la même équipe plusieurs fois dans le run
          var WC_TEAM_STATS_CACHE = {};

          // Calcule un xG approximatif à partir des buts réels + tirs cadrés.
          // Pondération : 65% buts réels (résultat brut, ce qui compte au final),
          // 35% tirs cadrés convertis en "buts attendus" via un taux de conversion
          // moyen de 32% (taux observé en moyenne dans le football international —
          // un tir cadré sur trois finit globalement au fond des filets).
          function calcApproxXG(goalsAvg, shotsOnTargetAvg) {
            if(goalsAvg==null) return null;
            if(shotsOnTargetAvg==null) return Math.round(goalsAvg*100)/100;
            var xgFromShots = shotsOnTargetAvg * 0.32;
            var blended = goalsAvg*0.65 + xgFromShots*0.35;
            return Math.round(blended*100)/100;
          }

          // Récupère les 8 derniers matchs de qualifs d'une équipe + leurs stats
          // (buts réels + tirs cadrés, expected_goals étant systématiquement null
          // pour les qualifs d'après vérification manuelle sur 3 matchs Asie 2026).
          async function getTeamQualifStats(teamId, teamName) {
            var cacheKey = 'qualif_'+teamId;
            if(WC_TEAM_STATS_CACHE[cacheKey]) return WC_TEAM_STATS_CACHE[cacheKey];

            var leagueId = WC_QUALIF_LEAGUE[teamName];
            if(!leagueId) {
              console.log('  [WC qualif] '+teamName+': clé absente de WC_QUALIF_LEAGUE (vérifier orthographe exacte / Océanie) — fallback statique');
              WC_TEAM_STATS_CACHE[cacheKey] = null;
              return null;
            }

            try {
              // On tente la saison "current" pour ce cycle de qualifs (2024/2023/2026
              // selon confédération — cf ids constatés). On essaie season 2026 puis
              // 2024 puis 2023 en fallback, car l'API-Sports a des conventions de
              // numérotation de saison différentes par confédération pour ce cycle.
              var seasonsToTry = [2026, 2024, 2023];
              var fixturesRaw = null;
              for(var si=0; si<seasonsToTry.length; si++){
                var r = await get('https://v3.football.api-sports.io/fixtures?league='+leagueId+'&season='+seasonsToTry[si]+'&team='+teamId, APS);
                if(r.response && r.response.length){ fixturesRaw = r.response; break; }
                await sleep(150);
              }
              if(!fixturesRaw || !fixturesRaw.length) {
                console.log('  [WC qualif] '+teamName+': aucun match de qualifs trouvé — fallback statique');
                WC_TEAM_STATS_CACHE[cacheKey] = null;
                return null;
              }

              // Garder seulement les matchs terminés, triés du plus récent au plus ancien
              var played = fixturesRaw.filter(function(f){
                var st=(f.fixture.status&&f.fixture.status.short)||'';
                return st==='FT'||st==='AET'||st==='PEN';
              }).sort(function(a,b){ return (b.fixture.timestamp||0)-(a.fixture.timestamp||0); });

              var last8 = played.slice(0, 8);
              if(!last8.length) {
                console.log('  [WC qualif] '+teamName+': 0 match terminé trouvé — fallback statique');
                WC_TEAM_STATS_CACHE[cacheKey] = null;
                return null;
              }

              // Buts réels (toujours disponibles, jamais null)
              var goalsFor=[], goalsAgainst=[];
              last8.forEach(function(f){
                var isHome = f.teams.home.id===teamId;
                var gf = isHome ? f.goals.home : f.goals.away;
                var ga = isHome ? f.goals.away : f.goals.home;
                if(gf!=null) goalsFor.push(gf);
                if(ga!=null) goalsAgainst.push(ga);
              });

              // Tirs cadrés via fixtures/statistics (peut être null par match, on ignore les null)
              var shotsOnFor=[], shotsOnAgainst=[];
              for(var mi=0; mi<last8.length; mi++){
                try {
                  var statR = await get('https://v3.football.api-sports.io/fixtures/statistics?fixture='+last8[mi].fixture.id, APS);
                  var blocks = statR.response||[];
                  var teamBlock = blocks.find(function(b){ return b.team && b.team.id===teamId; });
                  var oppBlock = blocks.find(function(b){ return b.team && b.team.id!==teamId; });
                  if(teamBlock){
                    var sot = (teamBlock.statistics||[]).find(function(s){ return s.type==='Shots on Goal'; });
                    if(sot && sot.value!=null) shotsOnFor.push(parseFloat(sot.value));
                  }
                  if(oppBlock){
                    var sotOpp = (oppBlock.statistics||[]).find(function(s){ return s.type==='Shots on Goal'; });
                    if(sotOpp && sotOpp.value!=null) shotsOnAgainst.push(parseFloat(sotOpp.value));
                  }
                } catch(e){}
                await sleep(120);
              }

              function avg(arr){ return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : null; }
              var goalsForAvg = avg(goalsFor);
              var goalsAgainstAvg = avg(goalsAgainst);
              var shotsOnForAvg = avg(shotsOnFor);
              var shotsOnAgainstAvg = avg(shotsOnAgainst);

              // Forme récente V/N/D sur ces 8 matchs (signal complémentaire, pas utilisé
              // dans le calcul de lambdas mais utile à afficher dans le prompt pour Claude)
              var form = last8.map(function(f){
                var isHome = f.teams.home.id===teamId;
                var gf = isHome ? f.goals.home : f.goals.away;
                var ga = isHome ? f.goals.away : f.goals.home;
                if(gf==null||ga==null) return '?';
                return gf>ga?'V':gf<ga?'D':'N';
              }).join('');

              var result = {
                xg_for: calcApproxXG(goalsForAvg, shotsOnForAvg),
                xg_against: calcApproxXG(goalsAgainstAvg, shotsOnAgainstAvg),
                goals_for_avg: goalsForAvg!=null?Math.round(goalsForAvg*100)/100:null,
                goals_against_avg: goalsAgainstAvg!=null?Math.round(goalsAgainstAvg*100)/100:null,
                shots_on_for_avg: shotsOnForAvg!=null?Math.round(shotsOnForAvg*100)/100:null,
                shots_on_against_avg: shotsOnAgainstAvg!=null?Math.round(shotsOnAgainstAvg*100)/100:null,
                form: form,
                n_matches: last8.length,
                source: 'qualifs_api',
              };
              console.log('  [WC qualif] '+teamName+': xg_for≈'+result.xg_for+' xg_against≈'+result.xg_against+' ('+last8.length+' matchs, forme '+form+')');
              WC_TEAM_STATS_CACHE[cacheKey] = result;
              return result;
            } catch(e) {
              console.log('  [WC qualif] '+teamName+' erreur:', e.message);
              WC_TEAM_STATS_CACHE[cacheKey] = null;
              return null;
            }
          }

          // Récupère les matchs déjà joués par l'équipe dans le tournoi WC2026 en cours,
          // avec leur expected_goals réel (disponible et fiable pour les matchs WC,
          // contrairement aux qualifs — vérifié manuellement).
          async function getTeamTournamentStats(teamId, teamName) {
            var cacheKey = 'tournoi_'+teamId;
            if(WC_TEAM_STATS_CACHE[cacheKey]!==undefined) return WC_TEAM_STATS_CACHE[cacheKey];

            try {
              var r = await get('https://v3.football.api-sports.io/fixtures?league=1&season=2026&team='+teamId, APS);
              var fixturesRaw = r.response||[];
              var played = fixturesRaw.filter(function(f){
                var st=(f.fixture.status&&f.fixture.status.short)||'';
                return st==='FT'||st==='AET'||st==='PEN';
              });

              if(!played.length) {
                WC_TEAM_STATS_CACHE[cacheKey] = null;
                return null;
              }

              var xgFor=[], xgAgainst=[], goalsFor=[], goalsAgainst=[];
              for(var mi=0; mi<played.length; mi++){
                var f = played[mi];
                var isHome = f.teams.home.id===teamId;
                if(f.goals.home!=null) goalsFor.push(isHome?f.goals.home:f.goals.away);
                if(f.goals.away!=null) goalsAgainst.push(isHome?f.goals.away:f.goals.home);

                try {
                  var statR = await get('https://v3.football.api-sports.io/fixtures/statistics?fixture='+f.fixture.id, APS);
                  var blocks = statR.response||[];
                  var teamBlock = blocks.find(function(b){ return b.team && b.team.id===teamId; });
                  var oppBlock = blocks.find(function(b){ return b.team && b.team.id!==teamId; });
                  if(teamBlock){
                    var xg = (teamBlock.statistics||[]).find(function(s){ return s.type==='expected_goals'; });
                    if(xg && xg.value!=null) xgFor.push(parseFloat(xg.value));
                  }
                  if(oppBlock){
                    var xgOpp = (oppBlock.statistics||[]).find(function(s){ return s.type==='expected_goals'; });
                    if(xgOpp && xgOpp.value!=null) xgAgainst.push(parseFloat(xgOpp.value));
                  }
                } catch(e){}
                await sleep(120);
              }

              function avg(arr){ return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : null; }

              // Si expected_goals n'a jamais été dispo malgré le match joué (cas rare),
              // on retombe sur les buts réels du tournoi en cours plutôt que rien.
              var xgForAvg = avg(xgFor);
              var xgAgainstAvg = avg(xgAgainst);
              // Slots 15min depuis les events des matchs joués en CDM
              var slotsFor=[{t:'0-15',n:0},{t:'15-30',n:0},{t:'30-45',n:0},{t:'45-60',n:0},{t:'60-75',n:0},{t:'75-90',n:0}];
              var slotsAgainst=[{t:'0-15',n:0},{t:'15-30',n:0},{t:'30-45',n:0},{t:'45-60',n:0},{t:'60-75',n:0},{t:'75-90',n:0}];
              var slotRanges=[[0,15],[15,30],[30,45],[45,60],[60,75],[75,91]];
              var hasSlotsData=false;
              for(var si2=0;si2<played.length;si2++){
                try{
                  var evR=await get('https://v3.football.api-sports.io/fixtures/events?fixture='+played[si2].fixture.id,APS);
                  var evts=evR.response||[];
                  var isHome2=played[si2].teams.home.id===teamId;
                  evts.forEach(function(e){
                    if(e.type!=='Goal'||e.detail==='Missed Penalty') return;
                    var min=e.time&&e.time.elapsed||0;
                    var isByTeam=e.team&&e.team.id===teamId;
                    for(var ri=0;ri<slotRanges.length;ri++){
                      if(min>=slotRanges[ri][0]&&min<slotRanges[ri][1]){
                        if(isByTeam) slotsFor[ri].n++;
                        else slotsAgainst[ri].n++;
                        hasSlotsData=true;
                        break;
                      }
                    }
                  });
                }catch(e2){}
                await sleep(100);
              }

              var result = {
                xg_for: xgForAvg!=null ? Math.round(xgForAvg*100)/100 : avg(goalsFor),
                xg_against: xgAgainstAvg!=null ? Math.round(xgAgainstAvg*100)/100 : avg(goalsAgainst),
                games: played.length,
                source: xgForAvg!=null ? 'tournoi_xg_reel' : 'tournoi_buts_reels',
                slots: hasSlotsData ? slotsFor : null,
                slots_against: hasSlotsData ? slotsAgainst : null,
              };
              console.log('  [WC tournoi] '+teamName+': xg_for='+result.xg_for+' xg_against='+result.xg_against+' ('+played.length+' matchs joués, source='+result.source+')');
              WC_TEAM_STATS_CACHE[cacheKey] = result;
              return result;
            } catch(e) {
              console.log('  [WC tournoi] '+teamName+' erreur:', e.message);
              WC_TEAM_STATS_CACHE[cacheKey] = null;
              return null;
            }
          }

          // Point d'entrée unique : combine qualifs + tournoi en cours pour une équipe,
          // avec pondération qui évolue selon le nombre de matchs déjà joués dans le
          // tournoi (plus le tournoi avance, plus son poids augmente face aux qualifs).
          async function getTeamWCStats(teamId, teamName) {
            var qualif = await getTeamQualifStats(teamId, teamName);
            var tournoi = await getTeamTournamentStats(teamId, teamName);

            // Aucune donnée dynamique disponible (Océanie, équipe non mappée, API vide) :
            // signal clair au code appelant pour utiliser le fallback statique QUALS_XG.
            if(!qualif && !tournoi) return null;

            // Seulement des données qualifs (cas le plus fréquent : match 1 de poule)
            if(qualif && !tournoi) {
              return { xg_for: qualif.xg_for, xg_against: qualif.xg_against, source: 'qualifs_seul', detail: qualif };
            }

            // Seulement le tournoi (cas rare : pas de mapping qualifs mais déjà joué en CM)
            if(!qualif && tournoi) {
              return { xg_for: tournoi.xg_for, xg_against: tournoi.xg_against, source: 'tournoi_seul', detail: tournoi };
            }

            // Hybridation qualifs + tournoi, poids croissant pour le tournoi au fil des matchs
            var nGames = tournoi.games||0;
            var poidsTournoi = nGames>=2 ? 0.70 : 0.40; // 1 match joué → 40%, 2-3 matchs → 70%
            var poidsQualif = 1 - poidsTournoi;

            var xgFor = (qualif.xg_for*poidsQualif) + (tournoi.xg_for*poidsTournoi);
            var xgAgainst = (qualif.xg_against*poidsQualif) + (tournoi.xg_against*poidsTournoi);

            return {
              xg_for: Math.round(xgFor*100)/100,
              xg_against: Math.round(xgAgainst*100)/100,
              source: 'hybride_qualif'+Math.round(poidsQualif*100)+'_tournoi'+Math.round(poidsTournoi*100),
              detail: { qualif: qualif, tournoi: tournoi },
            };
          }


          function postJSON(host, path, body, headers) {
            return new Promise(function(resolve) {
              var data = JSON.stringify(body);
              var timer = setTimeout(function(){ console.log('  TIMEOUT 180s'); resolve({}); }, 180000);
              var req = https.request({
                hostname:host, path:path, method:'POST',
                headers:Object.assign({
                  'Content-Type':'application/json',
                  'Content-Length':Buffer.byteLength(data)
                }, headers||{})
              }, function(res) {
                var d='';
                res.on('data',function(c){d+=c;});
                res.on('end',function(){
                  clearTimeout(timer);
                  try{
                    var parsed=JSON.parse(d);
                    if(parsed.error) console.log('  API ERROR type='+parsed.error.type+' msg='+(parsed.error.message||'').slice(0,100));
                    resolve(parsed);
                  }catch(e){ console.log('  Parse error status='+res.statusCode); resolve({}); }
                });
              });
              req.on('error',function(e){ clearTimeout(timer); console.log('  req error:'+e.message); resolve({}); });
              req.write(data); req.end();
            });
          }

          async function postJSONWithRetry(host, path, body, headers) {
            for(var attempt=1; attempt<=4; attempt++){
              var r = await postJSON(host, path, body, headers);
              if(r.error && (r.error.type==='overloaded_error'||r.error.type==='rate_limit_error')){
                var wait=attempt*30000;
                console.log('  Rate limit — attente '+(wait/1000)+'s tentative '+attempt+'/4');
                await sleep(wait);
                continue;
              }
              return r;
            }
            return {};
          }

          function levenshtein(a,b){
            var m=a.length,n=b.length,dp=[];
            for(var i=0;i<=m;i++){dp[i]=[i];for(var j=1;j<=n;j++)dp[i][j]=0;}
            for(var j=0;j<=n;j++)dp[0][j]=j;
            for(var i=1;i<=m;i++)for(var j=1;j<=n;j++){
              if(a[i-1]===b[j-1])dp[i][j]=dp[i-1][j-1];
              else dp[i][j]=1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
            }
            return dp[m][n];
          }

          function slugify(s) {
            return (s||'').toLowerCase()
              .replace(/[\u00e0\u00e1\u00e2\u00e3\u00e4\u00e5]/g,'a').replace(/[\u00e9\u00e8\u00ea\u00eb]/g,'e')
              .replace(/[\u00ed\u00ec\u00ee\u00ef]/g,'i').replace(/[\u00f3\u00f2\u00f4\u00f5\u00f6]/g,'o')
              .replace(/[\u00fa\u00f9\u00fb\u00fc]/g,'u').replace(/[\u00e7]/g,'c').replace(/[\u00f1]/g,'n')
              .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
          }

          function mkdirSafe(p) {
            try { fs.mkdirSync(p, {recursive:true}); } catch(e) {}
          }

          function toParisHeure(utcDate) {
            if (!utcDate) return '';
            var d = new Date(utcDate);
            if (isNaN(d.getTime())) return '';
            var year = d.getUTCFullYear();
            function lastSundayOf(month) {
              var last = new Date(Date.UTC(year, month+1, 0));
              last.setUTCDate(last.getUTCDate() - last.getUTCDay());
              return last;
            }
            var startCEST = lastSundayOf(2);
            var endCEST   = lastSundayOf(9);
            var offset = (d >= startCEST && d < endCEST) ? 2 : 1;
            var parisMs = d.getTime() + offset * 3600 * 1000;
            var paris = new Date(parisMs);
            var hh = String(paris.getUTCHours()).padStart(2,'0');
            var mm = String(paris.getUTCMinutes()).padStart(2,'0');
            return hh+':'+mm;
          }

          // ── MATHS FOOTBALL ───────────────────────────────────────
          function poissonProb(lambda, k) {
            if(lambda<=0) return k===0?1:0;
            var logP = -lambda + k*Math.log(lambda) - logFactorial(k);
            return Math.exp(logP);
          }
          function logFactorial(n) {
            if(n<=1) return 0;
            var r=0;for(var i=2;i<=n;i++) r+=Math.log(i);return r;
          }
          function calcPoissonProbs(lambdaH, lambdaA) {
            var mat=[];
            for(var h=0;h<=8;h++){mat[h]=[];for(var a=0;a<=8;a++) mat[h][a]=poissonProb(lambdaH,h)*poissonProb(lambdaA,a);}
            var p1=0,pN=0,p2=0,over25=0,under25=0,bttsY=0,bttsN=0,over15=0,over35=0;
            for(var h=0;h<=8;h++) for(var a=0;a<=8;a++){
              var p=mat[h][a];
              if(h>a) p1+=p; else if(h===a) pN+=p; else p2+=p;
              if(h+a>2.5) over25+=p; else under25+=p;
              if(h+a>1.5) over15+=p;
              if(h+a>3.5) over35+=p;
              if(h>0&&a>0) bttsY+=p; else bttsN+=p;
            }
            return {
              p1:Math.round(p1*100), pN:Math.round(pN*100), p2:Math.round(p2*100),
              over15:Math.round(over15*100), over25:Math.round(over25*100),
              under25:Math.round(under25*100), over35:Math.round(over35*100),
              bttsY:Math.round(bttsY*100), bttsN:Math.round(bttsN*100),
            };
          }
          function calcLambdas(bmHdom, beHdom, mdHdom, bmAext, beAext, meAext, leagueAvgH, leagueAvgA) {
            var leagAvgH=leagueAvgH||1.35, leagAvgA=leagueAvgA||1.10;
            var attH=mdHdom>0?(bmHdom/mdHdom)/leagAvgH:1;
            var defH=mdHdom>0?(beHdom/mdHdom)/leagAvgA:1;
            var attA=meAext>0?(bmAext/meAext)/leagAvgA:1;
            var defA=meAext>0?(beAext/meAext)/leagAvgH:1;
            return {
              lambdaH:parseFloat(Math.max(0.3,attH*defA*leagAvgH).toFixed(3)),
              lambdaA:parseFloat(Math.max(0.3,attA*defH*leagAvgA).toFixed(3))
            };
          }
          function shinProbabilities(odds) {
            var prices=odds.filter(function(o){return o&&o>1;});
            if(!prices.length) return null;
            var rawProbs=prices.map(function(o){return 1/o;});
            var sumRaw=rawProbs.reduce(function(a,b){return a+b;},0);
            if(sumRaw<=1) return rawProbs;
            var z=0.02;
            for(var iter=0;iter<50;iter++){
              var f=0,df=0;
              for(var i=0;i<rawProbs.length;i++){
                var qi=rawProbs[i];
                var denom=Math.sqrt(z*z+4*(1-z)*qi*qi/sumRaw);
                f+=(z+denom)/(2*(1-z));
                df+=(1+(2*z/sumRaw-2*qi*qi*(1-2*z)/(sumRaw*sumRaw))/denom)/(2*(1-z))+(z+denom)/(2*(1-z)*(1-z));
              }
              f-=1;
              var zNew=z-f/df;
              if(Math.abs(zNew-z)<1e-8) break;
              z=Math.max(0,Math.min(0.15,zNew));
            }
            var trueProbs=rawProbs.map(function(qi){return (z+Math.sqrt(z*z+4*(1-z)*qi*qi/sumRaw))/(2*(1-z));});
            var sumTrue=trueProbs.reduce(function(a,b){return a+b;},0);
            return trueProbs.map(function(p){return p/sumTrue;});
          }
          function fractionalKelly(probIA, cote, fraction) {
            fraction=fraction||0.25;
            var b=cote-1, q=1-probIA;
            var kelly=(probIA*b-q)/b;
            if(kelly<=0) return null;
            return Math.min(kelly*fraction*100,5).toFixed(1);
          }

