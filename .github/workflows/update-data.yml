                var games=Math.max(eventsArr.length,1);
                function goalsIn(min1,min2,arr){return arr.filter(function(e){var m=e.time&&e.time.elapsed||0;return m>=min1&&m<min2;}).length;}
                var redCards=teamEvts.filter(function(e){return e.type==='Card'&&e.detail==='Red Card';}).length;
                var yellowCards=teamEvts.filter(function(e){return e.type==='Card'&&e.detail==='Yellow Card';}).length;
                function avg(n){return (n/games).toFixed(2);}
                return{goals_avg:avg(allGoals.length),conceded_avg:avg(concGoals.length),
                  slots:[{t:'0-15',n:goalsIn(0,15,allGoals)},{t:'15-30',n:goalsIn(15,30,allGoals)},{t:'30-45',n:goalsIn(30,45,allGoals)},{t:'45-60',n:goalsIn(45,60,allGoals)},{t:'60-75',n:goalsIn(60,75,allGoals)},{t:'75-90',n:goalsIn(75,91,allGoals)}],
                  red_cards:redCards,yellow_per_game:(yellowCards/games).toFixed(1),games};
              }

              var evPatH=calcEventsPattern(eventsH_raw,home.id);
