          // Ecrit les champs premium (kelly/edge/verdict_shark/facteur_x/dropping_odds)
          // dans Supabase (table match_premium_data), jamais dans un fichier public.
          // Degrade proprement si le secret n'est pas encore configure : log un
          // avertissement plutot que d'echouer tout le run, mais n'ecrit ces champs
          // NULLE PART en clair - c'est le comportement de repli volontaire tant que
          // SUPABASE_SERVICE_ROLE_KEY n'est pas ajoute comme secret GitHub Actions
          // (voir supabase/migrations/0002_match_premium_data.sql pour la migration
          // a appliquer sur le projet Supabase avant d'ajouter ce secret).
          function upsertJSON(host, path, body, headers) {
            return new Promise(function(resolve) {
              var data = JSON.stringify(body);
              var timer = setTimeout(function(){ resolve({ok:false,status:0,error:'timeout'}); }, 15000);
              var req = https.request({
                hostname:host, path:path, method:'POST',
                headers:Object.assign({
                  'Content-Type':'application/json',
                  'Content-Length':Buffer.byteLength(data)
                }, headers||{})
              }, function(res) {
                var d='';
                res.on('data',function(c){d+=c;});
                res.on('end',function(){
                  clearTimeout(timer);
                  resolve({ok:res.statusCode>=200&&res.statusCode<300,status:res.statusCode,body:d});
                });
              });
              req.on('error',function(e){ clearTimeout(timer); resolve({ok:false,status:0,error:e.message}); });
              req.write(data); req.end();
            });
          }
          async function writePremiumData(rows) {
