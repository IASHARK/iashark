          async function getRefereeStats(refName) {
            if(!refName) return null;
            var r = await get('https://v3.football.api-sports.io/fixtures?referee='+encodeURIComponent(refName)+'&last=20', APS);
            var games=(r&&r.response)||[];
            if(!games.length) return null;
            var totalCards=0,totalPens=0;
            games.forEach(function(g){(g.events||[]).forEach(function(e){if(e.type==='Card')totalCards++;if(e.detail&&e.detail.toLowerCase().includes('penalty'))totalPens++;});});
            return {name:refName,games:games.length,cards_per_game:(totalCards/games.length).toFixed(1),pens_per_game:(totalPens/games.length).toFixed(1)};
          }
          async function getTopScorers(teamId, leagueId) {
            var r = await get('https://v3.football.api-sports.io/players?team='+teamId+'&season='+SEASON+'&league='+leagueId, APS);
            var players=(r&&r.response)||[];
            if(!players.length) return [];
            var scored=players.filter(function(p){return p.statistics&&p.statistics[0]&&p.statistics[0].goals&&(p.statistics[0].goals.total>0||p.statistics[0].goals.assists>0);});
            scored.sort(function(a,b){return ((b.statistics[0].goals.total||0)+(b.statistics[0].goals.assists||0))-((a.statistics[0].goals.total||0)+(a.statistics[0].goals.assists||0));});
            return scored.slice(0,3).map(function(p){var s=p.statistics[0];return {id:p.player.id,name:p.player.name,photo:p.player.photo||('https://media.api-sports.io/football/players/'+p.player.id+'.png'),goals:s.goals.total||0,assists:s.goals.assists||0,games:s.games.appearences||0};});
          }
