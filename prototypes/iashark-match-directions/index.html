-radius:50%;background:var(--bg)}.focus-ring div{position:relative;z-index:1}.focus-ring b{display:block;font-size:31px}.focus-ring span{font-size:10px;color:var(--muted)}.focus-price{text-align:left}.focus-price small{display:block;color:var(--muted);font-size:11px}.focus-price b{display:block;font-size:25px;margin:4px 0}.focus-price em{font-style:normal;color:var(--peach);font-size:11px}.focus-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.focus-card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,var(--card),#19171b);padding:21px}.focus-why{grid-column:span 7}.focus-risk{grid-column:span 5}.focus-card h2{font-size:16px;margin:0 0 17px}.focus-reason{display:flex;align-items:flex-start;gap:11px;padding:13px 0;border-top:1px solid var(--line)}.focus-reason:first-of-type{border-top:0}.focus-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--violet);box-shadow:0 0 0 5px rgba(189,166,255,.08)}.focus-reason b{font-size:13px}.focus-reason p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.focus-riskbox{padding:15px;border-radius:15px;background:rgba(255,182,147,.06);border:1px solid rgba(255,182,147,.16)}.focus-riskbox b{color:var(--peach);font-size:12px}.focus-riskbox p{color:#b8a097;font-size:12px;line-height:1.55;margin:7px 0 0}.focus-data{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.focus-data div{padding:12px;border-radius:13px;background:var(--card2)}.focus-data small{display:block;color:var(--muted);font-size:10px}.focus-data b{display:block;margin-top:5px}.focus-markets{grid-column:1/-1}.focus-market-row{display:grid;grid-template-columns:1.4fr repeat(3,1fr) auto;align-items:center;gap:12px;padding:13px 3px;border-top:1px solid var(--line);font-size:12px}.focus-market-row.header{color:var(--muted);font-size:10px;border-top:0}.focus-market-row button{height:32px;border:0;border-radius:9px;background:rgba(189,166,255,.1);color:var(--violet);padding:0
