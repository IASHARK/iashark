                        var isH=homeP&&homeP.name===matchedHomeH2H;
                        var w; if(gH>gA)w=isH?'1':'2'; else if(gH<gA)w=isH?'2':'1'; else w='N';
                        return {d:(fx.starting_at||'').split(' ')[0], home:homeP?homeP.name:matchedHomeH2H, away:awayP?awayP.name:matchedAwayH2H, s:gH+'-'+gA, w:w};
