<header class="sticky top-0 z-40 border-b border-hairline bg-page/95 backdrop-blur">
  <div class="mx-auto flex h-14 w-full max-w-[1440px] items-center gap-4 px-4 sm:px-6">

<main class="mx-auto w-full max-w-[1440px] px-4 pb-24 sm:px-6">

  <div class="border-b border-hairline py-7 sm:py-9">
    <p class="mb-2.5 inline-flex items-center gap-2 text-[11px] font-bold tracking-[0.18em] text-soft">
      <span aria-hidden="true" class="h-1 w-1 rounded-full bg-cyan"></span>TOOL CENTER
    </p>
    <h1 class="text-[clamp(26px,3.4vw,38px)] font-extrabold leading-[1.1] tracking-[-0.035em] text-ink">Vos outils. <span class="text-cyan">Nos probabilités.</span></h1>
    <p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-soft">Six outils qui transforment les probabilités du modèle en décisions mesurables : détecter, évaluer, dimensionner, simuler, combiner, mesurer.</p>
  </div>

  <div class="grid grid-cols-1 gap-6 py-6 lg:grid-cols-[248px_minmax(0,1fr)] lg:gap-8">

    <nav aria-label="Outils" class="hidden lg:block">
      <div class="sticky top-[76px] flex flex-col gap-1" role="tablist" aria-orientation="vertical">
      <button type="button" role="tab" id="tab-scanner" aria-controls="panel-scanner" aria-selected="true" data-tool="scanner" data-active="1"
        class="tool-tab group flex w-full items-start gap-3 rounded-xl border border-transparent px-3 py-3 text-left transition hover:bg-white/[0.04]">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="mt-0.5 h-[18px] w-[18px] shrink-0 fill-none stroke-current stroke-[1.7] text-soft transition group-data-[active=1]:text-cyan"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z"/><path d="m16.5 16.5 4 4"/></svg>
        <span class="min-w-0">
          <span class="block text-[9.5px] font-bold tracking-[0.16em] text-soft/70">DÉTECTER</span>
          <span class="block text-[14px] font-semibold leading-tight text-ink">Détecteur d’écarts</span>
          <span class="mt-0.5 block text-[12px] leading-snug text-soft">Où le marché s’écarte le plus de nos probabilités.</span>
        </span>
      </button>
      <button type="button" role="tab" id="tab-fair" aria-controls="panel-fair" aria-selected="false" data-tool="fair"
        class="tool-tab group flex w-full items-start gap-3 rounded-xl border border-transparent px-3 py-3 text-left transition hover:bg-white/[0.04]">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="mt-0.5 h-[18px] w-[18px] shrink-0 fill-none stroke-current stroke-[1.7] text-soft transition group-data-[active=1]:text-cyan"><path d="M12 4v16"/><path d="M5 8h14"/><path d="m5 8-2.5 6h5L5 8Z"/><path d="m19 8-2.5 6h5L19 8Z"/></svg>
        <span class="min-w-0">
          <span class="block text-[9.5px] font-bold tracking-[0.16em] text-soft/70">ÉVALUER</span>
          <span class="block text-[14px] font-semibold leading-tight text-ink">Cote juste</span>
          <span class="mt-0.5 block text-[12px] leading-snug text-soft">La cote qu’une probabilité mérite, face au prix proposé.</span>
        </span>
      </button>
      <button type="button" role="tab" id="tab-stake" aria-controls="panel-stake" aria-selected="false" data-tool="stake"
        class="tool-tab group flex w-full items-start gap-3 rounded-xl border border-transparent px-3 py-3 text-left transition hover:bg-white/[0.04]">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="mt-0.5 h-[18px] w-[18px] shrink-0 fill-none stroke-current stroke-[1.7] text-soft transition group-data-[active=1]:text-cyan"><path d="M3 17V7"/><path d="M9 17V11"/><path d="M15 17V9"/><path d="M21 17V5"/></svg>
        <span class="min-w-0">
          <span class="block text-[9.5px] font-bold tracking-[0.16em] text-soft/70">DIMENSIONNER</span>
          <span class="block text-[14px] font-semibold leading-tight text-ink">Calculateur de mise</span>
          <span class="mt-0.5 block text-[12px] leading-snug text-soft">Combien miser selon le capital et la cote.</span>
        </span>
      </button>
      <button type="button" role="tab" id="tab-bankroll" aria-controls="panel-bankroll" aria-selected="false" data-tool="bankroll"
        class="tool-tab group flex w-full items-start gap-3 rounded-xl border border-transparent px-3 py-3 text-left transition hover:bg-white/[0.04]">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="mt-0.5 h-[18px] w-[18px] shrink-0 fill-none stroke-current stroke-[1.7] text-soft transition group-data-[active=1]:text-cyan"><path d="M3 15c3-8 6 4 9-2s6 3 9-5"/><path d="M3 20h18"/></svg>
        <span class="min-w-0">
          <span class="block text-[9.5px] font-bold tracking-[0.16em] text-soft/70">SIMULER</span>
          <span class="block text-[14px] font-semibold leading-tight text-ink">Simulateur de capital</span>
          <span class="mt-0.5 block text-[12px] leading-snug text-soft">Jusqu’où le capital peut descendre avant de remonter.</span>
        </span>
      </button>
      <button type="button" role="tab" id="tab-combo" aria-controls="panel-combo" aria-selected="false" data-tool="combo"
        class="tool-tab group flex w-full items-start gap-3 rounded-xl border border-transparent px-3 py-3 text-left transition hover:bg-white/[0.04]">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="mt-0.5 h-[18px] w-[18px] shrink-0 fill-none stroke-current stroke-[1.7] text-soft transition group-data-[active=1]:text-cyan"><path d="M7 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M17 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M11 12h2"/></svg>
        <span class="min-w-0">
          <span class="block text-[9.5px] font-bold tracking-[0.16em] text-soft/70">COMBINER</span>
          <span class="block text-[14px] font-semibold leading-tight text-ink">Analyse de combiné</span>
          <span class="mt-0.5 block text-[12px] leading-snug text-soft">Ce qu’un combiné retire vraiment à l’espérance de gain.</span>
        </span>
      </button>
      <button type="button" role="tab" id="tab-journal" aria-controls="panel-journal" aria-selected="false" data-tool="journal"
        class="tool-tab group flex w-full items-start gap-3 rounded-xl border border-transparent px-3 py-3 text-left transition hover:bg-white/[0.04]">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="mt-0.5 h-[18px] w-[18px] shrink-0 fill-none stroke-current stroke-[1.7] text-soft transition group-data-[active=1]:text-cyan"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6"/><path d="M9 14h6"/></svg>
        <span class="min-w-0">
          <span class="block text-[9.5px] font-bold tracking-[0.16em] text-soft/70">MESURER</span>
          <span class="block text-[14px] font-semibold leading-tight text-ink">Journal des décisions</span>
          <span class="mt-0.5 block text-[12px] leading-snug text-soft">Ce que les paris enregistrés ont réellement rapporté.</span>
        </span>
      </button>
        <div id="sidebarFoot" class="mt-4 border-t border-hairline pt-4"></div>
      </div>
    </nav>

    <div class="-mx-4 overflow-x-auto px-4 lg:hidden">
      <div class="flex gap-2 pb-1" role="tablist" aria-label="Outils" aria-orientation="horizontal">
      <button type="button" role="tab" id="mtab-scanner" aria-controls="panel-scanner" aria-selected="true" data-tool="scanner" data-active="1"
        class="tool-tab shrink-0 rounded-full border border-hairline px-4 py-2 text-[13px] font-semibold text-soft transition data-[active=1]:border-cyan/40 data-[active=1]:bg-cyan/[0.08] data-[active=1]:text-cyan">Détecteur d’écarts</button>
      <button type="button" role="tab" id="mtab-fair" aria-controls="panel-fair" aria-selected="false" data-tool="fair"
        class="tool-tab shrink-0 rounded-full border border-hairline px-4 py-2 text-[13px] font-semibold text-soft transition data-[active=1]:border-cyan/40 data-[active=1]:bg-cyan/[0.08] data-[active=1]:text-cyan">Cote juste</button>
      <button type="button" role="tab" id="mtab-stake" aria-controls="panel-stake" aria-selected="false" data-tool="stake"
        class="tool-tab shrink-0 rounded-full border border-hairline px-4 py-2 text-[13px] font-semibold text-soft transition data-[active=1]:border-cyan/40 data-[active=1]:bg-cyan/[0.08] data-[active=1]:text-cyan">Calculateur de mise</button>
      <button type="button" role="tab" id="mtab-bankroll" aria-controls="panel-bankroll" aria-selected="false" data-tool="bankroll"
        class="tool-tab shrink-0 rounded-full border border-hairline px-4 py-2 text-[13px] font-semibold text-soft transition data-[active=1]:border-cyan/40 data-[active=1]:bg-cyan/[0.08] data-[active=1]:text-cyan">Simulateur de capital</button>
      <button type="button" role="tab" id="mtab-combo" aria-controls="panel-combo" aria-selected="false" data-tool="combo"
        class="tool-tab shrink-0 rounded-full border border-hairline px-4 py-2 text-[13px] font-semibold text-soft transition data-[active=1]:border-cyan/40 data-[active=1]:bg-cyan/[0.08] data-[active=1]:text-cyan">Analyse de combiné</button>
      <button type="button" role="tab" id="mtab-journal" aria-controls="panel-journal" aria-selected="false" data-tool="journal"
        class="tool-tab shrink-0 rounded-full border border-hairline px-4 py-2 text-[13px] font-semibold text-soft transition data-[active=1]:border-cyan/40 data-[active=1]:bg-cyan/[0.08] data-[active=1]:text-cyan">Journal des décisions</button>
      </div>
    </div>

    <div class="min-w-0">
    <section role="tabpanel" id="panel-scanner" aria-labelledby="tab-scanner" data-panel="scanner" hidden class="tool-panel"></section>
    <section role="tabpanel" id="panel-fair" aria-labelledby="tab-fair" data-panel="fair" hidden class="tool-panel"></section>
    <section role="tabpanel" id="panel-stake" aria-labelledby="tab-stake" data-panel="stake" hidden class="tool-panel"></section>
    <section role="tabpanel" id="panel-bankroll" aria-labelledby="tab-bankroll" data-panel="bankroll" hidden class="tool-panel"></section>
    <section role="tabpanel" id="panel-combo" aria-labelledby="tab-combo" data-panel="combo" hidden class="tool-panel"></section>
    <section role="tabpanel" id="panel-journal" aria-labelledby="tab-journal" data-panel="journal" hidden class="tool-panel"></section>
    </div>
  </div>
