          ODDS_API_IO_KEY:    ${{ secrets.ODDS_API_IO_KEY }}
          CREATOMATE_KEY:     ${{ secrets.CREATOMATE_KEY }}
          TEST_WC_ONLY:       ${{ github.event.inputs.test_wc_only }}
        run: node pipeline.js

      - name: Commit and push
        run: |
          git config user.name "IASHARK"
          git config user.email "yaramode81@gmail.com"
          git add data.json historique.json transferts.json actus.json sitemap.xml sitemap-*.xml match/ index.html
