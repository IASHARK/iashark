                if(countryName){
                  var countryLow = countryName.toLowerCase();
                  candidates = leagues.filter(function(l){
                    var lc = (l.country && l.country.name || '').toLowerCase();
                    return lc === countryLow || lc.includes(countryLow) || countryLow.includes(lc);
                  });
