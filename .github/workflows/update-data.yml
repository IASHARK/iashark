            if(forceNeutral){homeBonus=0;}
            else if(vdH!=null&&mdHdom&&mdHdom>0){
              var hwr=vdH/mdHdom;
              if(hwr>=0.65)homeBonus=100;else if(hwr>=0.50)homeBonus=70;else if(hwr>=0.35)homeBonus=40;else homeBonus=20;
            }
