              p1Name:p1.name||'Joueur 1', p2Name:p2.name||'Joueur 2',
              p1Country:p1.countryAcr||'', p2Country:p2.countryAcr||'',
              seed1:f.seed1||null, seed2:f.seed2||null,
              c1:f.odd1&&parseFloat(f.odd1)>1?String(f.odd1):'--',
              c2:f.odd2&&parseFloat(f.odd2)>1?String(f.odd2):'--',
              surface:court.name||'Hard',
              tourRank:rank.name||'', tournament:tournament.name||'',
              tournamentId:f.tournamentId,
              h2hP1Wins:h2h.player1AllWins||0, h2hP2Wins:h2h.player2AllWins||0,
              date:f.date||'', round:f.round&&f.round.name||'',
            };
