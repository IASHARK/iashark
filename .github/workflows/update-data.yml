          async function getLineups(fixtureId) {
            var r = await get('https://v3.football.api-sports.io/fixtures/lineups?fixture='+fixtureId, APS);
            if(!r.response||!r.response.length) return null;
            function extractLineup(team){
              return {formation:team.formation||null,coach:team.coach&&team.coach.name||null,
                startXI:(team.startXI||[]).map(function(p){return {name:(p.player&&p.player.name)||'',pos:(p.player&&p.player.pos)||''};}),
                substitutes:(team.substitutes||[]).map(function(p){return {name:(p.player&&p.player.name)||'',pos:(p.player&&p.player.pos)||''};})};
            }
            return {home:extractLineup(r.response[0]),away:extractLineup(r.response[1]||{})};
