<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="geo.meta.checkout-annule.title">IASHARK — Paiement annulé</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Paiement annulé : aucun montant n'a été débité." data-i18n-attr="content:geo.meta.checkout-annule.description">
<link rel="canonical" href="https://iashark.com/checkout-annule.html">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080c12'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='%2322d3ee'%3E🦈%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="/funnel-track.js"></script>
<script src="/i18n/i18n.js"></script>
<style>
:root{--bg:#080c12;--card:#0d1520;--cyan:#22d3ee;--amber:#f59e0b;--text:#e2e8f0;--muted:#7089a1;--border:rgba(255,255,255,0.06);--bc:rgba(34,211,238,0.18);--ba:rgba(245,158,11,0.2);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:60px;}
.hdr{position:sticky;top:0;z-index:99;background:rgba(8,12,18,0.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:var(--text);text-decoration:none;}
.logo span{color:var(--cyan);}
/* Logo image, comme les autres en-tetes (QA 14/09/2026). */
.logo{display:inline-flex;align-items:center;min-height:44px;}
.logo img{display:block;height:28px;width:auto;}
.wrap{max-width:460px;margin:0 auto;padding:60px 20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 28px;text-align:center;}
.icon{font-size:48px;margin-bottom:16px;}
.title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;margin-bottom:10px;}
.body{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:24px;}
.ctas{display:flex;flex-direction:column;gap:10px;}
.cta{display:block;width:100%;padding:15px 13px;border-radius:10px;border:1px solid var(--ba);background:rgba(245,158,11,0.1);color:var(--amber);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;text-decoration:none;text-align:center;}
.cta.secondary{border-color:var(--border);background:none;color:var(--muted);}
.cta[hidden]{display:none;}
.trust{margin-top:18px;font-size:11px;color:var(--muted);letter-spacing:.04em;}
</style>
<link rel="stylesheet" href="/assets/bottom-navigation.css"></head>
<body>
<header class="hdr"><a href="/" data-href="" class="logo"><img src="/assets/iashark-logo.png" alt="IASHARK" width="105" height="28"></a></header>
<div class="wrap">
  <div class="card">
    <div class="icon">↩️</div>
    <div class="title" data-i18n="checkout_pages.cancel_heading">Paiement annulé</div>
    <div class="body" data-i18n="checkout_pages.cancel_body">Aucun paiement n'a été effectué. Tu peux réessayer quand tu veux, sans engagement.</div>
    <!-- Page de reprise, pas une impasse (tunnel 09/2026 : un visiteur y est
         passe deux fois sans jamais revenir au paiement). Le premier bouton
         ramene au choix de duree ; le match d'origine, s'il est connu, est
         propose juste en dessous. -->
    <div class="ctas">
      <a href="/abonnement.html" data-href="abonnement.html" id="ctaRetry" class="cta" data-i18n="checkout_pages.cancel_cta_retry">REPRENDRE — SANS ENGAGEMENT →</a>
      <a href="/" id="ctaMatch" class="cta secondary" hidden data-i18n="checkout_pages.cancel_cta_match">REVENIR AU MATCH →</a>
      <a href="/compte.html" data-href="compte.html" id="ctaAccount" class="cta secondary" data-i18n="checkout_pages.cancel_cta_account">MON COMPTE →</a>
    </div>
    <p class="trust" data-i18n="checkout_pages.cancel_trust">Paiement sécurisé · Résiliable à tout moment</p>
  </div>
</div>
<script>
(function(){
  if(window.iasharkTrack) iasharkTrack('checkout_cancel_view');
  // Match d'origine memorise par abonnement-page.js avant le depart vers
  // Stripe : chemin interne uniquement, sinon les liens restent generiques.
  var ctx=null;try{ctx=JSON.parse(sessionStorage.getItem('iashark.checkout.return')||'null');}catch(e){}
  var path=ctx&&ctx.path;
  if(typeof path==='string'&&path.charAt(0)==='/'&&path.charAt(1)!=='/'&&path.indexOf('\\')===-1&&/\/match\.html(\?|$)/.test(path)){
    var retry=document.getElementById('ctaRetry');
    retry.setAttribute('data-href','abonnement.html?next='+encodeURIComponent(path));
    retry.href='/abonnement.html?next='+encodeURIComponent(path);
    var match=document.getElementById('ctaMatch');match.href=path;match.hidden=false;
    document.getElementById('ctaAccount').hidden=true;
  }
  if(window.I18N&&window.I18N.init){window.I18N.init();}
})();
</script>
<script src="/site-prefs.js"></script>
<script src="/bottom-navigation.js"></script><script src="/site-header.js" defer></script>
</body>
</html>
