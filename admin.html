<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IASHARK — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080c12'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='%2322d3ee'%3E🦈%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#080c12;--card:#0d1520;--card2:#0f1a28;--cyan:#22d3ee;--amber:#f59e0b;--green:#10b981;--red:#ef4444;--text:#e2e8f0;--muted:#4a6580;--border:rgba(255,255,255,0.06);--bc:rgba(34,211,238,0.18);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:60px;}
.hdr{position:sticky;top:0;z-index:99;background:rgba(8,12,18,0.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:var(--text);text-decoration:none;}
.logo span{color:var(--cyan);}
.hdr-pill{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--muted);}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px;}
.icon{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px;}
.state{display:none;text-align:center;padding:80px 20px;}
.state.show{display:block;}
.state .icon{width:28px;height:28px;stroke:var(--muted);margin:0 auto 14px;display:block;}
.state-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.5px;margin-bottom:8px;}
.state-body{font-size:13px;color:var(--muted);}
.state-body a{color:var(--cyan);}
.dashboard{display:none;}
.dashboard.show{display:block;}
.section-title{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;margin:24px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.section-title:first-child{margin-top:0;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
.stat-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--muted);margin-bottom:8px;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.5px;}
.stat-val.cyan{color:var(--cyan);}
.stat-val.amber{color:var(--amber);}
.funnel-table{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.funnel-row{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);font-size:13px;}
.funnel-row:last-child{border-bottom:none;}
.funnel-row-label{color:var(--text);}
.funnel-row-val{font-family:'Space Mono',monospace;font-size:13px;color:var(--cyan);}
.funnel-empty{padding:20px 16px;text-align:center;font-size:12.5px;color:var(--muted);}
.meta-note{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:0.5px;margin-top:18px;text-align:center;}
.refresh-btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bc);background:rgba(34,211,238,0.08);color:var(--cyan);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;cursor:pointer;margin-top:20px;}
.refresh-btn:disabled{opacity:0.5;cursor:not-allowed;}
</style>
</head>
<body>

<header class="hdr">
  <a href="/" class="logo"><span>IA</span>SHARK</a>
  <span class="hdr-pill">ADMIN</span>
</header>

<div class="wrap">

  <div class="state show" id="stateLoading">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <div class="state-title">Vérification</div>
    <div class="state-body">Contrôle des accès en cours...</div>
  </div>

  <div class="state" id="stateDenied">
    <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
    <div class="state-title">Accès réservé</div>
    <div class="state-body">Cette page est réservée aux comptes administrateur. <a href="/compte.html">Retour à mon compte</a></div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="section-title">UTILISATEURS</div>
    <div class="stat-grid" id="userStats"></div>

    <div class="section-title">INSCRIPTIONS</div>
    <div class="stat-grid" id="signupStats"></div>

    <div class="section-title">TUNNEL DE CONVERSION — 7 DERNIERS JOURS</div>
    <div class="funnel-table" id="funnelTable"></div>

    <button class="refresh-btn" id="refreshBtn" onclick="loadStats()">ACTUALISER</button>
    <div class="meta-note" id="metaNote"></div>
  </div>

</div>

<script>
var SUPA_URL = 'https://ksvjraqitxouwiabecai.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzdmpyYXFpdHhvdXdpYWJlY2FpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3ODcwMjMsImV4cCI6MjA4ODM2MzAyM30.Eh3qk4tATM40hoYxdErAllLEo1y8KNt4BSCET_fAgT8';
var sb = supabase.createClient(SUPA_URL, SUPA_KEY);

var FUNNEL_LABELS = {
  landing_view: 'Vues page Tarifs',
  signup_started: 'Inscriptions commencées',
  signup_completed: 'Inscriptions terminées',
  login_completed: 'Connexions',
  onboarding_dismissed: 'Onboarding masqué',
  tool_page_view: 'Vues page Outils',
  paywall_view: 'Vues paywall',
  checkout_started: 'Checkouts démarrés',
  checkout_unavailable: 'Checkouts indisponibles',
  checkout_success_view: 'Retours paiement réussi',
  checkout_cancel_view: 'Retours paiement annulé'
};

function statCard(label, val, cls){
  return '<div class="stat-card"><div class="stat-label">' + label + '</div><div class="stat-val ' + (cls||'') + '">' + val + '</div></div>';
}

function showState(which){
  ['stateLoading','stateDenied'].forEach(function(id){ document.getElementById(id).classList.remove('show'); });
  document.getElementById('dashboard').classList.remove('show');
  if(which==='dashboard'){ document.getElementById('dashboard').classList.add('show'); }
  else { document.getElementById(which).classList.add('show'); }
}

async function loadStats(){
  var btn = document.getElementById('refreshBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'ACTUALISATION...'; }
  try{
    var res = await sb.rpc('admin_stats');
    if(res.error) throw res.error;
    var s = res.data;

    document.getElementById('userStats').innerHTML =
      statCard('TOTAL', s.total_users) +
      statCard('GRATUIT', s.free_users) +
      statCard('OUTILS', s.pro_users, 'amber') +
      statCard('ADMIN', s.admin_users, 'cyan');

    document.getElementById('signupStats').innerHTML =
      statCard('7 DERNIERS JOURS', s.signups_last_7d, 'cyan') +
      statCard('30 DERNIERS JOURS', s.signups_last_30d, 'cyan');

    var funnel = s.funnel_last_7d || {};
    var keys = Object.keys(funnel);
    if(keys.length===0){
      document.getElementById('funnelTable').innerHTML = '<div class="funnel-empty">Aucun événement enregistré sur les 7 derniers jours.</div>';
    } else {
      document.getElementById('funnelTable').innerHTML = keys.sort().map(function(k){
        return '<div class="funnel-row"><span class="funnel-row-label">' + (FUNNEL_LABELS[k]||k) + '</span><span class="funnel-row-val">' + funnel[k] + '</span></div>';
      }).join('');
    }

    document.getElementById('metaNote').textContent = 'Généré : ' + new Date(s.generated_at).toLocaleString('fr-FR');
    showState('dashboard');
  }catch(e){
    showState('stateDenied');
  }
  if(btn){ btn.disabled = false; btn.textContent = 'ACTUALISER'; }
}

async function init(){
  try{
    var res = await sb.auth.getSession();
    if(!res.data || !res.data.session){ showState('stateDenied'); return; }
    var ures = await sb.from('users').select('role').eq('id', res.data.session.user.id).maybeSingle();
    if(!ures.data || ures.data.role !== 'admin'){ showState('stateDenied'); return; }
    await loadStats();
  }catch(e){
    showState('stateDenied');
  }
}
init();
</script>
</body>
</html>
