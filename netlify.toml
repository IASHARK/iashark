# Netlify ne publie QUE dist/, construit par scripts/build-public.js a chaque
# deploiement (audit QA du 14/09/2026 : la racine du depot etait publique,
# documents internes, SQL, code des fonctions et donnees brutes compris).
[build]
  command = "node scripts/build-public.js"
  publish = "dist"
  # Saute le deploiement quand le commit ne touche aucun fichier publie ni la
  # configuration du build (docs, tests, workflows, raw_api/...). Toujours un
  # build sans commit de reference. Voir scripts/netlify-ignore.sh (16/09/2026,
  # compte coupe pour « usage_exceeded » le 15/09).
  ignore = "bash scripts/netlify-ignore.sh"

# « Pretty URLs » COUPE (audit GEO/SEO du 23/10/2026) : ce traitement de
# Netlify reecrivait apres le build les liens du HTML publie (href="/fr/x.html"
# devenait href='/fr/x'), alors que les canonical, les hreflang et les sitemaps
# donnent les adresses completes en .html. Les moteurs voyaient deux adresses
# par page. Ne PAS ajouter de 301 /x -> /x.html dans _redirects : Netlify
# confond /x et /x.html, risque de boucle de redirections.
[build.processing.html]
  pretty_urls = false

# /api/geo : pays / region / ville APPROXIMATIFS deduits du reseau par Netlify
# pour les statistiques anonymes (funnel-track.js). Aucune adresse IP n'est
# renvoyee ni stockee. Code : netlify/edge-functions/geo.ts (hors dist/).
# Meme origine que le site : couvert par connect-src 'self' de _headers.
[[edge_functions]]
  path = "/api/geo"
  function = "geo"
