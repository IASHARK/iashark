              h2hStr=d.home+' '+w1+'V / '+wN+'N / '+w2+'D | Moy buts: '+d.h2hAvgButs;
            }

            var prompt;
            if(isWorldCup){
              prompt='=== COUPE DU MONDE FIFA 2026 ===\n'+d.home+' vs '+d.away+'\n'+d.league+' | '+d.date+' | '+d.stade+'\n\n'
