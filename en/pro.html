<main class="mx-auto w-full max-w-[1440px] px-4 pb-24 sm:px-6">

  <div class="border-b border-hairline py-7 sm:py-9">
    <p class="mb-2.5 inline-flex items-center gap-2 text-[11px] font-bold tracking-[0.18em] text-soft">
      <span aria-hidden="true" class="h-1 w-1 rounded-full bg-cyan"></span><span data-i18n="tools_page.static_kicker">TOOL CENTER</span>

    <h1 class="text-[clamp(26px,3.4vw,38px)] font-extrabold leading-[1.1] tracking-[-0.035em] text-ink"><span data-i18n="tools_page.static_hero_title_pre">Your tools. </span><span class="text-cyan" data-i18n="tools_page.static_hero_title_hl">Our probabilities.</span></h1>
    <p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-soft" data-i18n="tools_page.static_hero_sub">Six tools that turn the model's probabilities into measurable decisions: detect, evaluate, size, simulate, combine, measure.</p>
  </div>

  <div class="grid grid-cols-1 gap-6 py-6 lg:grid-cols-[248px_minmax(0,1fr)] lg:gap-8">

    <nav aria-label="Tools" data-i18n-attr="aria-label:site_header.nav_tools" class="hidden lg:block">
      <div class="sticky top-[76px] flex flex-col gap-1" role="tablist" aria-orientation="vertical">
      <button type="button" role="tab" id="tab-scanner" aria-controls="panel-scanner" aria-selected="true" data-tool="scanner" data-active="1"

        <svg viewBox="0 0 24 24" aria-hidden="true" class="mt-0.5 h-[18px] w-[18px] shrink-0 fill-none stroke-current stroke-[1.7] text-soft transition group-data-[active=1]:text-cyan"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z"/><path d="m16.5 16.5 4 4"/></svg>
        <span class="min-w-0">
          <span class="block text-[9.5px] font-bold tracking-[0.16em] text-soft/70" data-i18n="tools_page.static_cat_scan">DETECT</span>
          <span class="block text-[14px] font-semibold leading-tight text-ink" data-i18n="tools_page.scan_title">Edge Detector</span>
          <span data-i18n="tools_page.static_desc_scan" class="mt-0.5 block text-[12px] leading-snug text-soft">Where the market strays furthest from our probabilities.</span>
        </span>
      </button>
      <button type="button" role="tab" id="tab-fair" aria-controls="panel-fair" aria-selected="false" data-tool="fair"
        class="tool-tab group flex w-full items-start gap-3 rounded-xl border border-transparent px-3 py-3 text-left transition hover:bg-white/[0.04]">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="mt-0.5 h-[18px] w-[18px] shrink-0 fill-none stroke-current stroke-[1.7] text-soft transition group-data-[active=1]:text-cyan"><path d="M12 4v16"/><path d="M5 8h14"/><path d="m5 8-2.5 6h5L5 8Z"/><path d="m19 8-2.5 6h5L19 8Z"/></svg>
        <span class="min-w-0">
          <span class="block text-[9.5px] font-bold tracking-[0.16em] text-soft/70" data-i18n="tools_page.static_cat_fair">EVALUATE</span>
          <span class="block text-[14px] font-semibold leading-tight text-ink" data-i18n="tools_page.fair_title">Fair Odds</span>
          <span data-i18n="tools_page.static_desc_fair" class="mt-0.5 block text-[12px] leading-snug text-soft">The odds a probability deserves, against the price on offer.</span>
        </span>
      </button>
      <button type="button" role="tab" id="tab-stake" aria-controls="panel-stake" aria-selected="false" data-tool="stake"

        <svg viewBox="0 0 24 24" aria-hidden="true" class="mt-0.5 h-[18px] w-[18px] shrink-0 fill-none stroke-current stroke-[1.7] text-soft transition group-data-[active=1]:text-cyan"><path d="M3 17V7"/><path d="M9 17V11"/><path d="M15 17V9"/><path d="M21 17V5"/></svg>

          <span class="block text-[14px] font-semibold leading-tight text-ink" data-i18n="tools_page.stake_title">Stake Calculator</span>

        <span class="min-w-0">
          <span class="block text-[9.5px] font-bold tracking-[0.16em] text-soft/70" data-i18n="tools_page.static_cat_bankroll">SIMULATE</span>
          <span class="block text-[14px] font-semibold leading-tight text-ink" data-i18n="tools_page.bankroll_title">Bankroll Simulator</span>

        <span class="min-w-0">
          <span class="block text-[9.5px] font-bold tracking-[0.16em] text-soft/70" data-i18n="tools_page.static_cat_combo">COMBINE</span>
          <span class="block text-[14px] font-semibold leading-tight text-ink" data-i18n="tools_page.combo_title">Combo Bet Analysis</span>
          <span data-i18n="tools_page.static_desc_combo" class="mt-0.5 block text-[12px] leading-snug text-soft">What a combo bet really costs your expected value.</span>
        </span>
      </button>
      <button type="button" role="tab" id="tab-journal" aria-controls="panel-journal" aria-selected="false" data-tool="journal"

          <span class="block text-[9.5px] font-bold tracking-[0.16em] text-soft/70" data-i18n="tools_page.static_cat_journal">MEASURE</span>

      <button type="button" role="tab" id="mtab-fair" aria-controls="panel-fair" aria-selected="false" data-tool="fair"

      <button type="button" role="tab" id="mtab-bankroll" aria-controls="panel-bankroll" aria-selected="false" data-tool="bankroll"
        class="tool-tab shrink-0 rounded-full border border-hairline px-4 py-2 text-[13px] font-semibold text-soft transition data-[active=1]:border-cyan/40 data-[active=1]:bg-cyan/[0.08] data-[active=1]:text-cyan" data-i18n="tools_page.bankroll_title">Bankroll Simulator</button>
      <button type="button" role="tab" id="mtab-combo" aria-controls="panel-combo" aria-selected="false" data-tool="combo"
        class="tool-tab shrink-0 rounded-full border border-hairline px-4 py-2 text-[13px] font-semibold text-soft transition data-[active=1]:border-cyan/40 data-[active=1]:bg-cyan/[0.08] data-[active=1]:text-cyan" data-i18n="tools_page.combo_title">Combo Bet Analysis</button>

        class="tool-tab shrink-0 rounded-full border border-hairline px-4 py-2 text-[13px] font-semibold text-soft transition data-[active=1]:border-cyan/40 data-[active=1]:bg-cyan/[0.08] data-[active=1]:text-cyan" data-i18n="tools_page.journal_title">Decision Journal</button>

    </div>

    <section role="tabpanel" id="panel-stake" aria-labelledby="tab-stake" data-panel="stake" hidden class="tool-panel"></section>
    <section role="tabpanel" id="panel-bankroll" aria-labelledby="tab-bankroll" data-panel="bankroll" hidden class="tool-panel"></section>
