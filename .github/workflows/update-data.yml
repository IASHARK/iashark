              (hLow.includes('city')&&aLow.includes('united'))||(hLow.includes('celtic')&&aLow.includes('rangers'))||(hLow.includes('inter')&&aLow.includes('milan'));
            if(isDerby){score+=25;alerts.push('\uD83D\uDD25 DERBY — imprévisibilité maximale');}
            score=Math.max(0,Math.min(100,score));
            return{score,alerts,label:score>=80?'ENJEU CRITIQUE':score>=60?'ENJEU \u00c9LEV\u00c9':score>=40?'Enjeu mod\u00e9r\u00e9':'Enjeu faible',isDerby};
          }

          function calcMatchup(xgH,xgA,sH,sA){
            var xgHavg=xgH&&xgH.xg_avg?parseFloat(xgH.xg_avg):1.2;
            var xgAavg=xgA&&xgA.xg_avg?parseFloat(xgA.xg_avg):1.0;
