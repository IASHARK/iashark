<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tennis — IASHARK</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04080d;--card:#0a1119;--card2:#0e1820;
  --lime:#c8ff00;--lime2:#a3e635;--lime3:rgba(200,255,0,0.07);
  --red:#ff2d2d;--amber:#f59e0b;--green:#10b981;--blue:#38bdf8;
  --text:#e8f0f8;--muted:#4a6580;--muted2:#1e2d3d;
  --border:rgba(255,255,255,0.04);--bl:rgba(200,255,0,0.15);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:80px;}

/* HEADER */
.hdr{position:sticky;top:0;z-index:99;background:rgba(4,8,13,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:48px;display:flex;align-items:center;padding:0 16px;gap:10px;}
.hdr-back{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--muted);border:1px solid var(--border);padding:5px 10px;border-radius:5px;background:none;cursor:pointer;}
.hdr-back:hover{color:var(--lime);border-color:var(--bl);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;text-decoration:none;color:var(--text);}
.logo span{color:var(--lime);}
.hdr-sport{margin-left:auto;font-family:'Space Mono',monospace;font-size:7px;letter-spacing:2px;color:var(--lime);border:1px solid var(--bl);padding:3px 9px;border-radius:20px;background:var(--lime3);}

.wrap{max-width:680px;margin:0 auto;padding:0 12px;}

/* ═══ HERO MATCH ═══ */
.hero{background:linear-gradient(160deg,#060e0a 0%,#04080d 60%);border:1px solid var(--border);border-radius:20px;margin:12px 0 10px;overflow:hidden;}

.hero-top{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.tour-name{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;}
.surf-pill{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:1px;padding:3px 9px;border-radius:20px;}
.surf-clay{background:rgba(234,88,12,0.1);border:1px solid rgba(234,88,12,0.2);color:#fb923c;}
.surf-grass{background:var(--lime3);border:1px solid var(--bl);color:var(--lime);}
.surf-hard{background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.18);color:var(--blue);}
.round-tag{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);}

.players-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:20px 16px 14px;}

.player-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.player-col.away{opacity:.75;}

.p-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px;position:relative;}
.p-avatar.p1{background:linear-gradient(135deg,#0d2010,#182a0e);border:2px solid var(--lime2);}
.p-avatar.p2{background:linear-gradient(135deg,#0e1520,#182030);border:2px solid rgba(255,255,255,0.1);color:var(--muted);}
.p-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
.p-seed{position:absolute;bottom:-4px;right:-4px;font-family:'Space Mono',monospace;font-size:6px;background:var(--lime);color:#000;padding:1px 4px;border-radius:4px;font-weight:700;}

.p-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(14px,3.5vw,22px);letter-spacing:1px;line-height:1;text-align:center;}
.p-country{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);letter-spacing:1px;}
.p-rank{font-family:'Space Mono',monospace;font-size:8px;color:var(--lime);background:var(--lime3);border:1px solid var(--bl);padding:2px 8px;border-radius:10px;}
.p-rank.p2-rank{color:var(--muted);background:transparent;border-color:var(--border);}

.p-form{display:flex;gap:2px;}
.fd{width:13px;height:13px;border-radius:2px;font-size:6px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;}
.fw{background:rgba(16,185,129,0.2);color:#10b981;}
.fl{background:rgba(255,45,45,0.15);color:#ff2d2d;}

.vs-center{display:flex;flex-direction:column;align-items:center;gap:4px;}
.vs-txt{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--muted2);}
.vs-time{font-family:'Space Mono',monospace;font-size:10px;color:var(--lime);}

/* PROBA BAR */
.proba-wrap{padding:0 16px 14px;}
.proba-labels{display:flex;justify-content:space-between;margin-bottom:5px;}
.proba-pct{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;}
.proba-pct.p1c{color:var(--lime);}
.proba-pct.p2c{color:rgba(255,255,255,0.4);text-align:right;}
.proba-bar{height:5px;border-radius:5px;overflow:hidden;display:flex;background:rgba(255,255,255,0.04);}
.pb-p1{background:linear-gradient(90deg,var(--lime2),var(--lime));transition:width 1s ease;}
.pb-p2{background:rgba(255,255,255,0.1);}

/* ═══ VERDICT SHARK ═══ */
.verdict{border-radius:14px;padding:14px 16px;margin:10px 0;position:relative;overflow:hidden;}
.verdict.go{background:linear-gradient(135deg,rgba(200,255,0,0.05),rgba(163,230,53,0.02));border:1px solid var(--bl);}
.verdict.go::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--lime),transparent);}
.verdict.pass{background:rgba(255,45,45,0.04);border:1px solid rgba(255,45,45,0.15);}
.verdict.pass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--red),transparent);}
.verdict-eyebrow{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:2px;margin-bottom:6px;}
.verdict.go .verdict-eyebrow{color:var(--lime);}
.verdict.pass .verdict-eyebrow{color:var(--red);}
.verdict-bet{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;margin-bottom:4px;}
.verdict-sub{font-size:12px;color:var(--muted);line-height:1.5;}
.verdict-cote{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--lime);line-height:1;}
.verdict-row{display:flex;justify-content:space-between;align-items:flex-start;}
.verdict-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.vtag{font-family:'Space Mono',monospace;font-size:7px;padding:3px 8px;border-radius:4px;}
.vtag.edge{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);color:var(--green);}
.vtag.kelly{background:var(--lime3);border:1px solid var(--bl);color:var(--lime);}
.vtag.conf{background:rgba(245,158,11,0.07);border:1px solid rgba(245,158,11,0.2);color:var(--amber);}
.vtag.risk{background:rgba(255,45,45,0.06);border:1px solid rgba(255,45,45,0.15);color:var(--red);}

/* ═══ CONFIANCE JAUGE ═══ */
.conf-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:10px 0;}
.conf-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.conf-num{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--lime);line-height:1;}
.conf-num sup{font-size:18px;color:var(--muted);}
.conf-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;padding:4px 10px;border-radius:20px;}
.conf-track{height:6px;background:rgba(255,255,255,0.04);border-radius:6px;overflow:hidden;margin-bottom:6px;}
.conf-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--lime2),var(--lime),var(--amber));transition:width 1s ease;}
.conf-scale{display:flex;justify-content:space-between;}
.conf-scale span{font-family:'Space Mono',monospace;font-size:6px;color:var(--muted2);}

/* ═══ SECTION GÉNÉRIQUE ═══ */
.section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin:8px 0;}
.sec-title{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* ═══ RADAR STATS SERVICE ═══ */
.stats-duel{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat-col{display:flex;flex-direction:column;gap:6px;}
.stat-col-hdr{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:1px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.stat-col-hdr.p1h{color:var(--lime);}
.stat-col-hdr.p2h{color:var(--muted);}

.stat-row{display:flex;flex-direction:column;gap:3px;}
.stat-lbl{font-family:'Space Mono',monospace;font-size:6px;color:var(--muted);letter-spacing:.5px;}
.stat-bar-wrap{display:flex;align-items:center;gap:6px;}
.stat-track{flex:1;height:4px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden;}
.stat-fill{height:100%;border-radius:2px;transition:width 1s ease;}
.stat-fill.p1f{background:linear-gradient(90deg,var(--lime2),var(--lime));}
.stat-fill.p2f{background:linear-gradient(90deg,#2a4060,#3a5070);}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--text);line-height:1;width:28px;text-align:right;flex-shrink:0;}
.stat-val.good{color:var(--lime);}
.stat-val.bad{color:var(--red);}

/* ═══ SURFACE WINRATE ═══ */
.surf-duel{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.surf-box{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;}
.surf-box-hdr{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:1px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.surf-box-hdr.p1h{color:var(--lime);}
.surf-box-hdr.p2h{color:var(--muted);}
.surf-wr{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;margin-bottom:3px;}
.surf-wr.hi{color:var(--lime);}
.surf-wr.mid{color:var(--amber);}
.surf-wr.lo{color:var(--red);}
.surf-detail{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);}
.surf-minibar{height:3px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,0.04);margin-top:8px;}
.surf-minibar-fill{height:100%;border-radius:3px;transition:width 1s ease;}

/* ═══ H2H ═══ */
.h2h-block{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:4px 0;}
.h2h-side{text-align:center;}
.h2h-wins{font-family:'Bebas Neue',sans-serif;font-size:60px;line-height:1;}
.h2h-wins.p1w{color:var(--lime);}
.h2h-wins.p2w{color:rgba(255,255,255,0.3);}
.h2h-name{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);letter-spacing:1px;margin-top:3px;}
.h2h-sep{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--muted2);}
.h2h-bar{height:4px;border-radius:4px;overflow:hidden;display:flex;margin-top:10px;}
.h2h-fill1{background:linear-gradient(90deg,var(--lime2),var(--lime));}
.h2h-fill2{background:rgba(255,255,255,0.08);}
.h2h-note{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);text-align:center;margin-top:6px;}

/* ═══ FORME RÉCENTE ═══ */
.form-duel{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.form-col{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;}
.form-col-hdr{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:1px;margin-bottom:8px;}
.form-col-hdr.p1h{color:var(--lime);}
.form-col-hdr.p2h{color:var(--muted);}
.form-dots{display:flex;gap:4px;flex-wrap:wrap;}
.fdot{width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:13px;}
.fdot.fw{background:rgba(16,185,129,0.15);color:var(--green);border:1px solid rgba(16,185,129,0.2);}
.fdot.fl{background:rgba(255,45,45,0.1);color:var(--red);border:1px solid rgba(255,45,45,0.15);}
.form-record{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);margin-top:6px;}

/* ═══ SCENARIO SETS ═══ */
.sets-list{display:flex;flex-direction:column;gap:0;}
.set-item{display:flex;gap:10px;align-items:stretch;padding:0 0 10px;}
.set-item:last-child{padding-bottom:0;}
.set-l{display:flex;flex-direction:column;align-items:center;width:50px;flex-shrink:0;}
.set-badge{font-family:'Space Mono',monospace;font-size:7px;color:var(--lime);background:var(--lime3);border:1px solid var(--bl);padding:4px 6px;border-radius:6px;text-align:center;white-space:nowrap;}
.set-badge.set3{color:var(--amber);background:rgba(245,158,11,0.06);border-color:rgba(245,158,11,0.18);}
.set-line{flex:1;width:1px;background:linear-gradient(180deg,var(--bl),transparent);margin:3px auto 0;}
.set-body{flex:1;padding-top:2px;}
.set-txt{font-size:12px;color:#8aaabf;line-height:1.65;}

/* ═══ FACTEUR ═══ */
.facteur{background:var(--lime3);border:1px solid var(--bl);border-radius:12px;padding:13px 15px;display:flex;gap:10px;align-items:flex-start;}
.fact-icon{font-size:20px;flex-shrink:0;line-height:1;}
.fact-lbl{font-family:'Space Mono',monospace;font-size:7px;color:var(--lime);letter-spacing:2px;margin-bottom:4px;}
.fact-txt{font-size:12px;color:var(--text);line-height:1.55;font-weight:500;}

/* ═══ ANALYSE ═══ */
.analyse-txt{font-size:12px;color:#8aaabf;line-height:1.7;font-style:italic;}
.analyse-txt strong{color:var(--text);font-style:normal;}

/* ═══ SIGNALS GRID ═══ */
.signals{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.signal{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
.signal-ico{font-size:14px;margin-bottom:4px;}
.signal-lbl{font-family:'Space Mono',monospace;font-size:6px;color:var(--muted);letter-spacing:1px;margin-bottom:3px;}
.signal-val{font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1;}
.signal-val.green{color:var(--lime);}
.signal-val.amber{color:var(--amber);}
.signal-val.red{color:var(--red);}
.signal-sub{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);margin-top:2px;}

/* ═══ NAV ═══ */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--lime);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-lbl{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2px;}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(4,8,13,0.98);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;height:58px;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.ni-icon{font-size:17px;transition:.2s;}
.ni:hover .ni-icon{transform:translateY(-2px);}
.ni-lbl{font-family:'Space Mono',monospace;font-size:6px;letter-spacing:1px;color:var(--muted);}
@media(max-width:440px){.stats-duel,.surf-duel,.form-duel,.signals{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header class="hdr">
  <button class="hdr-back" onclick="history.back()">← RETOUR</button>
  <a class="logo" href="/">IA<span>SHARK</span></a>
  <span class="hdr-sport">🎾 TENNIS</span>
</header>

<div id="root">
  <div class="loading"><div class="spinner"></div><div class="loading-lbl">ANALYSE EN COURS...</div></div>
</div>

<nav class="nav">
  <div class="ni" onclick="location='/'"><div class="ni-icon">🦈</div><div class="ni-lbl">ACCUEIL</div></div>
  <div class="ni" onclick="location='/historique.html'"><div class="ni-icon">📊</div><div class="ni-lbl">HISTORIQUE</div></div>
  <div class="ni" onclick="location='/combis.html'"><div class="ni-icon">🎰</div><div class="ni-lbl">COMBINÉS</div></div>
  <div class="ni" onclick="location='/blog/'"><div class="ni-icon">📖</div><div class="ni-lbl">GUIDES</div></div>
  <div class="ni" onclick="location='/compte.html'"><div class="ni-icon">👤</div><div class="ni-lbl">COMPTE</div></div>
</nav>

<script>
var fId = new URLSearchParams(location.search).get('id');

function surfClass(s){
  var sl=(s||'').toLowerCase();
  return sl.includes('clay')||sl.includes('terre')?'surf-clay':sl.includes('grass')||sl.includes('gazon')?'surf-grass':'surf-hard';
}
function surfLabel(s){
  var sl=(s||'').toLowerCase();
  return sl.includes('clay')||sl.includes('terre')?'🟤 TERRE':sl.includes('grass')||sl.includes('gazon')?'🟢 GAZON':'🔵 DUR';
}
function ini(name){return (name||'??').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();}
function lastName(name){return (name||'').split(' ').pop().toUpperCase();}

function formHTML(str,cls){
  if(!str) return '<span style="font-family:Space Mono,monospace;font-size:8px;color:var(--muted)">N/A</span>';
  var html='';
  str.split('').forEach(function(c){
    html+='<div class="fdot '+(c==='W'?'fw':'fl')+'">'+c+'</div>';
  });
  return html;
}

function formRecord(str){
  if(!str) return '';
  var w=0,l=0;
  str.split('').forEach(function(c){c==='W'?w++:l++;});
  return w+'V / '+l+'D';
}

function statBar(lbl,val,cls,max){
  if(!val&&val!==0) return '';
  var pct=Math.min(Math.round((val/(max||100))*100),100);
  var color=val>=65?'good':val<=40?'bad':'';
  return '<div class="stat-row">'
    +'<div class="stat-lbl">'+lbl+'</div>'
    +'<div class="stat-bar-wrap">'
    +'<div class="stat-track"><div class="stat-fill '+cls+'" data-w="'+pct+'" style="width:0%"></div></div>'
    +'<div class="stat-val '+color+'">'+val+'%</div>'
    +'</div></div>';
}

function confLabel(c){
  return c>=8?'SHARK LOCK':c>=7?'SIGNAL FORT':c>=6?'MODÉRÉ':'FAIBLE';
}
function confColor(c){
  return c>=8?'background:rgba(200,255,0,0.08);border:1px solid var(--bl);color:var(--lime)':
         c>=7?'background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);color:var(--amber)':
         'background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--muted)';
}

function render(m){
  var p1n=m.home&&m.home.n||'J1', p2n=m.away&&m.away.n||'J2';
  var p1last=lastName(p1n), p2last=lastName(p2n);
  var p1ini=ini(p1n), p2ini=ini(p2n);
  var seed1=m.home&&m.home.seed, seed2=m.away&&m.away.seed;
  var rank1=m.home&&m.home.rank, rank2=m.away&&m.away.rank;
  var p1c=m.home&&m.home.country||'', p2c=m.away&&m.away.country||'';
  var surf=m.surface||'hard', heure=(m.date||'').split(' ')[1]||'';
  var p1=m.p1||50, p2=m.p2||50;
  var c1=m.c1||'--', c2=m.c2||'--';
  var conf=parseFloat(m.conf||0);
  var confPct=Math.round((conf/10)*100);
  var sv1=m.surf_stats_p1, sv2=m.surf_stats_p2;
  var h2h=m.h2h_tennis||{};
  var h2hP1=h2h.p1Wins||0, h2hP2=h2h.p2Wins||0, h2hTot=h2hP1+h2hP2;
  var pariRec=m.pari_rec||'', pariCote=m.cote_rec||'—';
  var isGo=pariRec&&!m.no_signal;
  var scen=m.scenario||{};

  document.title=p1last+' vs '+p2last+' — IASHARK Tennis';

  // HERO
  var heroHTML='<div class="hero">'
    +'<div class="hero-top">'
    +'<span class="tour-name">'+(m.league||'').toUpperCase()+'</span>'
    +'<div style="display:flex;gap:6px;align-items:center">'
    +'<span class="surf-pill '+surfClass(surf)+'">'+surfLabel(surf)+'</span>'
    +(heure?'<span style="font-family:Space Mono,monospace;font-size:10px;color:var(--text)">'+heure+'</span>':'')
    +(m.tour_rank?'<span style="font-family:Space Mono,monospace;font-size:6px;color:var(--muted)">'+m.tour_rank.toUpperCase()+'</span>':'')
    +'</div></div>'
    // PLAYERS
    +'<div class="players-grid">'
    // P1
    +'<div class="player-col">'
    +'<div class="p-avatar p1">'+p1ini+(seed1?'<span class="p-seed">'+seed1+'</span>':'')+'</div>'
    +'<div class="p-name">'+p1last+'</div>'
    +'<div style="font-size:11px;color:var(--muted);text-align:center">'+p1n.replace(p1last,'').trim()+'</div>'
    +(rank1?'<div class="p-rank">ATP #'+rank1+'</div>':'')
    +(m.form_p1?'<div class="p-form">'+formHTML(m.form_p1)+'</div>':'')
    +'</div>'
    // VS
    +'<div class="vs-center"><div class="vs-txt">VS</div>'+(heure?'<div class="vs-time">'+heure+'</div>':'')+'</div>'
    // P2
    +'<div class="player-col away">'
    +'<div class="p-avatar p2">'+p2ini+(seed2?'<span class="p-seed" style="background:var(--muted);color:#000">'+seed2+'</span>':'')+'</div>'
    +'<div class="p-name">'+p2last+'</div>'
    +'<div style="font-size:11px;color:var(--muted);text-align:center">'+p2n.replace(p2last,'').trim()+'</div>'
    +(rank2?'<div class="p-rank p2-rank">ATP #'+rank2+'</div>':'')
    +(m.form_p2?'<div class="p-form">'+formHTML(m.form_p2)+'</div>':'')
    +'</div>'
    +'</div>'
    // PROBA
    +'<div class="proba-wrap">'
    +'<div class="proba-labels"><div><div class="proba-pct p1c">'+p1+'%</div><div style="font-family:Space Mono,monospace;font-size:7px;color:var(--muted)">'+p1last.slice(0,8)+'</div></div>'
    +'<div style="text-align:right"><div class="proba-pct p2c">'+p2+'%</div><div style="font-family:Space Mono,monospace;font-size:7px;color:var(--muted)">'+p2last.slice(0,8)+'</div></div></div>'
    +'<div class="proba-bar"><div class="pb-p1" id="pb1" style="width:0%"></div><div class="pb-p2" style="flex:1"></div></div>'
    +'</div>'
    +'</div>';

  // VERDICT
  var verdictHTML='';
  if(isGo){
    var cMin=pariCote&&pariCote!=='—'?(parseFloat(pariCote)-0.2).toFixed(2):'';
    verdictHTML='<div class="verdict go">'
      +'<div class="verdict-row">'
      +'<div><div class="verdict-eyebrow">🦈 SELECTION IASHARK</div>'
      +'<div class="verdict-bet">'+pariRec.toUpperCase()+'</div>'
      +(m.verdict_shark?'<div class="verdict-sub">'+m.verdict_shark+'</div>':'')
      +'</div>'
      +'<div class="verdict-cote">'+pariCote+'</div>'
      +'</div>'
      +'<div class="verdict-tags">'
      +(m.edge?'<span class="vtag edge">EDGE '+m.edge+'</span>':'')
      +(m.kelly&&m.kelly!=='0'?'<span class="vtag kelly">KELLY '+m.kelly+'%</span>':'')
      +'<span class="vtag conf">CONF '+conf.toFixed(1)+'/10</span>'
      +(m.risque?'<span class="vtag risk">'+m.risque+'</span>':'')
      +'</div>'
      +(cMin?'<div style="margin-top:7px;font-family:Space Mono,monospace;font-size:7px;color:var(--amber)">⚠ Si cote tombe sous '+cMin+' — ne pas jouer</div>':'')
      +'</div>';
  } else {
    verdictHTML='<div class="verdict pass">'
      +'<div class="verdict-eyebrow">🚨 PASSE TON TOUR</div>'
      +'<div style="font-size:13px;color:#8aaabf;line-height:1.5">'+(m.no_signal_label||m.conseil_public||'Signaux insuffisants — aucun pari recommandé.')+'</div>'
      +'</div>';
  }

  // CONFIANCE
  var confHTML='<div class="conf-block">'
    +'<div class="conf-head">'
    +'<div class="conf-num">'+conf.toFixed(1)+'<sup>/10</sup></div>'
    +'<div class="conf-label" style="'+confColor(conf)+'">'+confLabel(conf)+'</div>'
    +'</div>'
    +'<div class="conf-track"><div class="conf-fill" id="confFill" style="width:0%"></div></div>'
    +'<div class="conf-scale"><span>FAIBLE</span><span>MODÉRÉ</span><span>FORT</span><span>LOCK</span></div>'
    +'</div>';

  // FACTEUR
  var factHTML=m.facteur_x?'<div class="facteur"><div class="fact-icon">⚡</div><div><div class="fact-lbl">FACTEUR DÉCISIF</div><div class="fact-txt">'+m.facteur_x+'</div></div></div>':'';

  // SIGNALS GRID
  var signalsHTML='<div class="section"><div class="sec-title">SIGNAUX CLÉS</div>'
    +'<div class="signals">';
  // Classement
  if(rank1||rank2){
    var gap=rank1&&rank2?Math.abs(rank1-rank2):null;
    signalsHTML+='<div class="signal"><div class="signal-ico">🏆</div><div class="signal-lbl">ÉCART CLASSEMENT</div>'
      +'<div class="signal-val '+(gap&&gap>30?'green':gap&&gap>10?'amber':'red')+'">'+( gap?'+'+gap:'N/A')+'</div>'
      +'<div class="signal-sub">#'+(rank1||'?')+' vs #'+(rank2||'?')+'</div></div>';
  }
  // Cotes
  if(c1!=='--'){
    signalsHTML+='<div class="signal"><div class="signal-ico">💰</div><div class="signal-lbl">COTES</div>'
      +'<div class="signal-val amber">'+c1+' / '+c2+'</div>'
      +(m.edge?'<div class="signal-sub">Edge '+m.edge+'</div>':'')+'</div>';
  }
  // Surface winrate
  if(sv1||sv2){
    var wr1=sv1?sv1.winrate:null, wr2=sv2?sv2.winrate:null;
    if(wr1||wr2){
      signalsHTML+='<div class="signal"><div class="signal-ico">🎾</div><div class="signal-lbl">WINRATE '+surfLabel(surf)+'</div>'
        +'<div class="signal-val '+(wr1&&wr1>=65?'green':wr1&&wr1<45?'red':'amber')+'">'+(wr1?wr1+'%':'?')+' / '+(wr2?wr2+'%':'?')+'</div>'
        +'<div class="signal-sub">'+p1last.slice(0,8)+' / '+p2last.slice(0,8)+'</div></div>';
    }
  }
  // H2H
  if(h2hTot>0){
    signalsHTML+='<div class="signal"><div class="signal-ico">⚔️</div><div class="signal-lbl">HEAD TO HEAD</div>'
      +'<div class="signal-val '+(Math.abs(h2hP1-h2hP2)>=3?'green':'amber')+'">'+h2hP1+' — '+h2hP2+'</div>'
      +'<div class="signal-sub">'+h2hTot+' confrontations</div></div>';
  }
  signalsHTML+='</div></div>';

  // STATS SERVICE
  var svHtml='';
  // On affiche les stats surface si dispo
  if(sv1||sv2){
    svHtml='<div class="section"><div class="sec-title">STATS SUR '+surfLabel(surf)+'</div>'
      +'<div class="surf-duel">';
    function surfBox(sv,cls,hcls,name){
      if(!sv) return '<div class="surf-box"><div class="surf-box-hdr '+hcls+'">'+name+'</div><div style="font-family:Space Mono,monospace;font-size:8px;color:var(--muted)">Non disponible</div></div>';
      var wr=sv.winrate, col=wr>=65?'hi':wr>=50?'mid':'lo';
      var fillCol=wr>=65?'background:var(--lime)':wr>=50?'background:var(--amber)':'background:var(--red)';
      return '<div class="surf-box"><div class="surf-box-hdr '+hcls+'">'+name+'</div>'
        +'<div class="surf-wr '+col+'">'+wr+'%</div>'
        +'<div class="surf-detail">'+sv.wins+'V / '+sv.losses+'D sur 3 ans</div>'
        +'<div class="surf-minibar"><div class="surf-minibar-fill" data-w="'+wr+'" style="'+fillCol+';width:0%"></div></div>'
        +'</div>';
    }
    svHtml+=surfBox(sv1,'p1','p1h',p1last.slice(0,12))+surfBox(sv2,'p2','p2h',p2last.slice(0,12));
    svHtml+='</div></div>';
  }

  // FORME RÉCENTE
  var formeHTML='<div class="section"><div class="sec-title">FORME RÉCENTE</div>'
    +'<div class="form-duel">'
    +'<div class="form-col"><div class="form-col-hdr p1h">'+p1last.slice(0,12).toUpperCase()+'</div>'
    +'<div class="form-dots">'+formHTML(m.form_p1)+'</div>'
    +'<div class="form-record">'+formRecord(m.form_p1)+'</div>'
    +'</div>'
    +'<div class="form-col"><div class="form-col-hdr p2h">'+p2last.slice(0,12).toUpperCase()+'</div>'
    +'<div class="form-dots">'+formHTML(m.form_p2)+'</div>'
    +'<div class="form-record">'+formRecord(m.form_p2)+'</div>'
    +'</div>'
    +'</div></div>';

  // H2H BLOCK
  var h2hHTML='';
  if(h2hTot>0){
    var p1pct=Math.round(h2hP1/h2hTot*100);
    h2hHTML='<div class="section"><div class="sec-title">HEAD TO HEAD</div>'
      +'<div class="h2h-block">'
      +'<div class="h2h-side"><div class="h2h-wins p1w">'+h2hP1+'</div><div class="h2h-name">'+p1last.slice(0,10).toUpperCase()+'</div></div>'
      +'<div class="h2h-sep">VS</div>'
      +'<div class="h2h-side"><div class="h2h-wins p2w">'+h2hP2+'</div><div class="h2h-name">'+p2last.slice(0,10).toUpperCase()+'</div></div>'
      +'</div>'
      +'<div class="h2h-bar"><div class="h2h-fill1" style="width:'+p1pct+'%"></div><div class="h2h-fill2" style="flex:1"></div></div>'
      +'<div class="h2h-note">'+h2hTot+' confrontations historiques</div>'
      +'</div>';
  }

  // ANALYSE
  var analyseHTML=m.analyse_card||m.conseil_public?'<div class="section"><div class="sec-title">ANALYSE IA</div>'
    +'<div class="analyse-txt">'+(m.analyse_card||m.conseil_public)+'</div></div>':'';

  // SCENARIO PAR SETS
  var scenHTML='';
  if(scen.phase1||scen.phase2){
    var phases=[
      {t:'1ER SET',txt:scen.phase1,cls:''},
      {t:'2ÈME SET',txt:scen.phase2,cls:''},
    ];
    if(scen.phase3&&scen.phase3!=='null') phases.push({t:'3ÈME SET',txt:scen.phase3,cls:'set3'});
    var list=phases.filter(function(p){return p.txt&&p.txt!=='null';}).map(function(p,i,arr){
      var last=i===arr.length-1;
      return '<div class="set-item">'
        +'<div class="set-l"><div class="set-badge '+p.cls+'">'+p.t+'</div>'+(!last?'<div class="set-line"></div>':'')+'</div>'
        +'<div class="set-body"><div class="set-txt">'+p.txt+'</div></div>'
        +'</div>';
    }).join('');
    scenHTML='<div class="section"><div class="sec-title">SCÉNARIO PAR SET</div><div class="sets-list">'+list+'</div></div>';
  }

  // CONTEXTE
  var ctxHTML=m.contexte?'<div class="section"><div class="sec-title">CONTEXTE</div>'
    +'<div class="analyse-txt">'+m.contexte+'</div></div>':'';

  return '<div class="wrap">'
    +heroHTML
    +verdictHTML
    +confHTML
    +factHTML
    +signalsHTML
    +svHtml
    +formeHTML
    +h2hHTML
    +analyseHTML
    +scenHTML
    +ctxHTML
    +'</div>';
}

async function init(){
  var el=document.getElementById('root');
  if(!fId){el.innerHTML='<div style="text-align:center;padding:60px 20px;font-family:Space Mono,monospace;font-size:10px;color:var(--muted)">ID MANQUANT<br><br><a href="/" style="color:var(--lime)">← RETOUR</a></div>';return;}
  try{
    var res=await fetch('data.json?t='+Date.now());
    var data=await res.json();
    var m=(data.matchs||[]).find(function(x){return String(x.id)===String(fId);});
    if(!m){el.innerHTML='<div style="text-align:center;padding:60px;font-family:Space Mono,monospace;font-size:10px;color:var(--muted)">MATCH INTROUVABLE<br><br><a href="/" style="color:var(--lime);font-family:Space Mono,monospace">← RETOUR</a></div>';return;}
    el.innerHTML=render(m);
    // Animations
    setTimeout(function(){
      var pb1=document.getElementById('pb1');
      if(pb1) pb1.style.width=(m.p1||50)+'%';
      var cf=document.getElementById('confFill');
      if(cf) cf.style.width=Math.round(((m.conf||0)/10)*100)+'%';
      document.querySelectorAll('[data-w]').forEach(function(b){
        requestAnimationFrame(function(){setTimeout(function(){b.style.width=b.getAttribute('data-w')+'%';},80);});
      });
    },150);
  }catch(e){console.error(e);el.innerHTML='<div style="text-align:center;padding:60px;color:var(--muted)">Erreur</div>';}
}
init();
</script>
</body>
</html>
