          var TEAM_NAME_MAP = {
            'Manchester City':'Manchester City','Manchester United':'Manchester United',
            'AC Milan':'AC Milan','Inter':'Inter Milan','Internazionale':'Inter Milan',
            'PSG':'Paris Saint-Germain','Paris Saint Germain':'Paris Saint-Germain',
            'Marseille':'Olympique de Marseille','Lyon':'Olympique Lyonnais',
            'Bayern Munich':'Bayern Munich','Bayer Leverkusen':'Bayer 04 Leverkusen',
            'Celtic':'Celtic','Rangers':'Rangers',
          };

          function bestTeamMatch(name,candidates){
            var mapped=TEAM_NAME_MAP[name]||name;
            var nameLow=mapped.toLowerCase();
            var best=null,bestScore=Infinity;
            candidates.forEach(function(c){
              var score=levenshtein(nameLow,c.toLowerCase())/Math.max(nameLow.length,c.length);
              if(score<bestScore){bestScore=score;best=c;}
            });
            return bestScore<0.4?best:null;
          }

          async function getPinnacleOdds(homeTeam, awayTeam, leagueKey) {
            if(!ODDS_KEY) return null;
            var sportMap = {
              'premier':'soccer_england_league1','champ':'soccer_england_championship',
              'ligue1':'soccer_france_ligue_1','laliga':'soccer_spain_la_liga',
              'seriea':'soccer_italy_serie_a','bundesliga':'soccer_germany_bundesliga',
              'ldc':'soccer_uefa_champs_league','el':'soccer_uefa_europa_league',
              'scottish':'soccer_scotland_premiership','belgique':'soccer_belgium_first_div_a',
            };
            var sport=sportMap[leagueKey]||'soccer_uefa_champs_league';
            try {
              var url='https://api.the-odds-api.com/v4/sports/'+sport+'/odds/?apiKey='+ODDS_KEY+'&regions=eu&markets=h2h,totals,btts&bookmakers=pinnacle&oddsFormat=decimal';
              var r=await get(url,{});
              if(!r||!Array.isArray(r)) return null;
              var allTeams=[];
              r.forEach(function(g){allTeams.push(g.home_team,g.away_team);});
              var matchedHome=bestTeamMatch(homeTeam,allTeams);
              var matchedAway=bestTeamMatch(awayTeam,allTeams);
              if(!matchedHome||!matchedAway) return null;
              var match=r.find(function(g){return (g.home_team===matchedHome&&g.away_team===matchedAway)||(g.home_team===matchedAway&&g.away_team===matchedHome);});
              if(!match||!match.bookmakers||!match.bookmakers[0]) return null;
              var bk=match.bookmakers[0];
              var result={};
              (bk.markets||[]).forEach(function(mkt){
                if(mkt.key==='h2h'){(mkt.outcomes||[]).forEach(function(o){if(o.name===match.home_team)result.c1=o.price;else if(o.name==='Draw')result.cn=o.price;else result.c2=o.price;});}
                if(mkt.key==='totals'){(mkt.outcomes||[]).forEach(function(o){if(o.point===2.5&&o.name==='Over')result.over25=o.price;if(o.point===2.5&&o.name==='Under')result.under25=o.price;});}
                if(mkt.key==='btts'){(mkt.outcomes||[]).forEach(function(o){if(o.name==='Yes')result.bttsY=o.price;if(o.name==='No')result.bttsN=o.price;});}
              });
              if(Object.keys(result).length>0) console.log('Pinnacle matched:',homeTeam,'\u2192',matchedHome);
              return Object.keys(result).length>0?result:null;
            } catch(e){console.log('Pinnacle fetch error:',e.message);return null;}
          }

          async function getWeightedXGStats(teamId, fixtureIds, rawFixtures, xgConcededCache) {
            xgConcededCache=xgConcededCache||{};
            var results=[];
            for(var i=0;i<Math.min(fixtureIds.length,10);i++){
              try{
                var r=await get('https://v3.football.api-sports.io/fixtures/statistics?fixture='+fixtureIds[i],APS);
                if(!r.response||!r.response.length){await sleep(150);continue;}
                var teamBlock=r.response.find(function(b){return b.team&&b.team.id===teamId;});
                var oppBlock=r.response.find(function(b){return b.team&&b.team.id!==teamId;});
                if(!teamBlock){await sleep(150);continue;}
                var s={};(teamBlock.statistics||[]).forEach(function(x){s[(x.type||'').toLowerCase().replace(/ /g,'_')]=x.value;});
                var sOpp={};if(oppBlock)(oppBlock.statistics||[]).forEach(function(x){sOpp[(x.type||'').toLowerCase().replace(/ /g,'_')]=x.value;});
                var xgTeam=parseFloat(s['expected_goals'])||null;
                var xgAgainst=parseFloat(sOpp['expected_goals'])||null;
                var shots_on=parseInt(s['shots_on_goal'])||0;
                var shots_total=parseInt(s['total_shots'])||0;
                var fouls=parseInt(s['fouls'])||0;
                var fx=rawFixtures.find(function(f){return f.fixture.id===fixtureIds[i];});
                var oppId=fx?(fx.teams.home.id===teamId?fx.teams.away.id:fx.teams.home.id):null;
                var xgWeighted=null;
                if(xgTeam!==null&&oppId&&xgConcededCache[oppId]) xgWeighted=parseFloat((xgTeam/xgConcededCache[oppId]).toFixed(3));
                results.push({xg:xgTeam,xga:xgAgainst,xg_weighted:xgWeighted,shots_on,shots_total,fouls});
                await sleep(150);
              }catch(e){}
            }
            if(!results.length) return {xg_avg:null,xga_avg:null,xg_weighted:null,shots_on_avg:null,shots_total_avg:null,fouls_avg:null};
            function avg(arr){return arr.length?arr.reduce(function(a,b){return a+b;},0)/arr.length:null;}
            var xgs=results.filter(function(r){return r.xg!==null;}).map(function(r){return r.xg;});
            var xgas=results.filter(function(r){return r.xga!==null;}).map(function(r){return r.xga;});
            var xgsW=results.filter(function(r){return r.xg_weighted!==null;}).map(function(r){return r.xg_weighted;});
            var shots=results.map(function(r){return r.shots_on;}).filter(Boolean);
            var shotsT=results.map(function(r){return r.shots_total;}).filter(Boolean);
            var foulsArr=results.map(function(r){return r.fouls;}).filter(Boolean);
            var avgXGA=avg(xgas);
            var surchauffe=false;
            if(avgXGA&&avgXGA>=1.5){var recentBE=results.slice(0,5).filter(function(r){return r.xga!==null&&r.xga>=1.5;}).length;if(recentBE>=3)surchauffe=true;}
            return {
              xg_avg:avg(xgs)?parseFloat(avg(xgs).toFixed(2)):null,
              xga_avg:avgXGA?parseFloat(avgXGA.toFixed(2)):null,
              xg_weighted:avg(xgsW)?parseFloat(avg(xgsW).toFixed(3)):null,
              shots_on_avg:avg(shots)?avg(shots).toFixed(1):null,
              shots_total_avg:avg(shotsT)?avg(shotsT).toFixed(1):null,
              fouls_avg:avg(foulsArr)?avg(foulsArr).toFixed(1):null,
              defense_surchauffe:surchauffe,n:results.length
            };
          }

          var clubEloCache=null;
          async function loadClubElo() {
            if(clubEloCache) return clubEloCache;
            try {
              var http=require('http');
              var csv=await new Promise(function(resolve,reject){
                var timer=setTimeout(function(){resolve('');},5000);
                http.get('http://api.clubelo.com/'+TODAY,function(res){
                  var data='';res.on('data',function(c){data+=c;});
                  res.on('end',function(){clearTimeout(timer);resolve(data);});
                }).on('error',function(e){clearTimeout(timer);reject(e);});
              });
              var lines=csv.split('\n').slice(1);
              clubEloCache={};
              lines.forEach(function(line){
                var parts=line.split(',');
                if(parts.length>=5){var name=(parts[1]||'').trim();var elo=parseFloat(parts[4]);if(name&&!isNaN(elo))clubEloCache[name.toLowerCase()]=elo;}
              });
              console.log('ClubElo charg\u00e9:',Object.keys(clubEloCache).length,'\u00e9quipes');
              return clubEloCache;
            } catch(e){console.log('ClubElo indisponible:',e.message);clubEloCache={};return clubEloCache;}
          }

          function getElo(eloData,teamName){
            if(!eloData||!teamName) return null;
            var nameLow=teamName.toLowerCase();
            if(eloData[nameLow]) return eloData[nameLow];
            var best=null,bestScore=Infinity;
            Object.keys(eloData).forEach(function(k){
              var score=levenshtein(nameLow,k)/Math.max(nameLow.length,k.length);
              if(score<bestScore){bestScore=score;best=k;}
            });
            return bestScore<0.35?eloData[best]:null;
          }

          function eloWinProb(eloH,eloA,vdH,mdHdom,forceNeutral){
            if(!eloH||!eloA) return null;
            var homeBonus=70;
            if(forceNeutral){homeBonus=0;}
            else if(vdH!=null&&mdHdom&&mdHdom>0){
              var hwr=vdH/mdHdom;
              if(hwr>=0.65)homeBonus=100;else if(hwr>=0.50)homeBonus=70;else if(hwr>=0.35)homeBonus=40;else homeBonus=20;
            }
            var probHadj=1/(1+Math.pow(10,(eloA-(eloH+homeBonus))/400));
            return {probH:Math.round(probHadj*100),probA:Math.round((1-probHadj)*100),diff:Math.round(eloH-eloA),homeBonus,signal:Math.abs(eloH-eloA)>=100?'FORT':Math.abs(eloH-eloA)>=50?'MOD\u00c9R\u00c9':'FAIBLE'};
          }

          function parseOdds(o) {
            var empty={c1:'--',cn:'--',c2:'--',co15:'--',co25:'--',cu25:'--',dc1x:'--',dc2x:'--',dc12:'--',btts_oui:'--',btts_non:'--',bookies:[]};
            if(!o||!o.bookmakers||!o.bookmakers.length) return empty;
            var arr1=[],arrN=[],arr2=[],arr15=[],arr25=[],arru25=[],arr35=[],arru35=[],arr1x=[],arrx2=[],arr12=[],arrby=[],arrbn=[];
            o.bookmakers.forEach(function(bk){
              (bk.bets||[]).forEach(function(bet){
                if(bet.name==='Match Winner'||bet.name==='Home/Draw/Away'){
                  var hm=(bet.values||[]).find(function(v){return v.value==='Home';});
                  var dr=(bet.values||[]).find(function(v){return v.value==='Draw';});
                  var aw=(bet.values||[]).find(function(v){return v.value==='Away';});
                  if(hm&&parseFloat(hm.odd)>=1.05&&parseFloat(hm.odd)<=15)arr1.push(parseFloat(hm.odd));
                  if(dr&&parseFloat(dr.odd)>=1.05&&parseFloat(dr.odd)<=15)arrN.push(parseFloat(dr.odd));
                  if(aw&&parseFloat(aw.odd)>=1.05&&parseFloat(aw.odd)<=15)arr2.push(parseFloat(aw.odd));
                }
                if(bet.name==='Goals Over/Under'){
                  (bet.values||[]).forEach(function(v){
                    if(v.value==='Over 1.5')arr15.push(parseFloat(v.odd));
                    if(v.value==='Over 2.5')arr25.push(parseFloat(v.odd));
                    if(v.value==='Under 2.5')arru25.push(parseFloat(v.odd));
                    if(v.value==='Over 3.5')arr35.push(parseFloat(v.odd));
                    if(v.value==='Under 3.5')arru35.push(parseFloat(v.odd));
                  });
                }
                if(bet.name==='Double Chance'){
                  var d1x=(bet.values||[]).find(function(v){return v.value==='Home/Draw';});
                  var dx2=(bet.values||[]).find(function(v){return v.value==='Draw/Away';});
                  var d12=(bet.values||[]).find(function(v){return v.value==='Home/Away';});
                  if(d1x)arr1x.push(parseFloat(d1x.odd));
                  if(dx2)arrx2.push(parseFloat(dx2.odd));
                  if(d12)arr12.push(parseFloat(d12.odd));
                }
                if(bet.name==='Both Teams Score'){
                  var by=(bet.values||[]).find(function(v){return v.value==='Yes';});
                  var bn=(bet.values||[]).find(function(v){return v.value==='No';});
                  if(by)arrby.push(parseFloat(by.odd));
                  if(bn)arrbn.push(parseFloat(bn.odd));
                }
              });
            });
            function med(a){
              if(!a.length)return '--';
              var s=a.slice().sort(function(x,y){return x-y;});
              var m=Math.floor(s.length/2);
              return (s.length%2?s[m]:((s[m-1]+s[m])/2)).toFixed(2);
            }
            var c1=med(arr1),cn=med(arrN),c2=med(arr2);
            var co15=med(arr15),co25=med(arr25),cu25=med(arru25);
            var dc1x=med(arr1x),dc2x=med(arrx2),dc12=med(arr12);
            var btts_oui=med(arrby),btts_non=med(arrbn);
            var deltas=[0,-0.03,-0.02,-0.05,+0.03];
            function vary(c,d){if(!c||c==='--')return '--';return Math.max(1.01,parseFloat(c)+d).toFixed(2);}
            var bookies=FR_FIXED.map(function(bk,i){return {n:bk.n,o:bk.o,l:bk.l,c:vary(c1,deltas[i]),c1:vary(c1,deltas[i]),cn:vary(cn,deltas[i]),c2:vary(c2,deltas[i])};});
            return {c1,cn,c2,co15,co25,cu25,co35:med(arr35),cu35:med(arru35),dc1x,dc2x,dc12,btts_oui,btts_non,bookies};
          }

          function calcCriteres(stats,isDom,rank){
            if(!stats)return{fd:50,att:50,def:50,fr:50,mot:70,fat:50};
            var total=(stats.fixtures&&stats.fixtures.played&&stats.fixtures.played.total)||30;
            var bm=(stats.goals&&stats.goals.for&&stats.goals.for.total&&stats.goals.for.total.total)||0;
            var be=(stats.goals&&stats.goals.against&&stats.goals.against.total&&stats.goals.against.total.total)||0;
            var form=(stats.form||'').slice(-5);
            var pts=form.split('').reduce(function(a,c){return a+(c==='W'?3:c==='D'?1:0);},0);
            var fr=Math.round(pts/Math.max(form.length*3,1)*100);
            var att=Math.min(100,Math.round(bm/Math.max(total,1)*40));
            var def=Math.max(0,Math.min(100,Math.round((2.5-be/Math.max(total,1))*35)));
            var vd=(stats.fixtures&&stats.fixtures.wins&&stats.fixtures.wins.home)||0;
            var ve=(stats.fixtures&&stats.fixtures.wins&&stats.fixtures.wins.away)||0;
            var md=(stats.fixtures&&stats.fixtures.played&&stats.fixtures.played.home)||Math.round(total/2);
            var me=(stats.fixtures&&stats.fixtures.played&&stats.fixtures.played.away)||Math.round(total/2);
            var fd=isDom?Math.min(100,Math.round(vd/Math.max(md,1)*100)):Math.min(100,Math.round(ve/Math.max(me,1)*100));
            var mot=70;
            if(rank){if(rank<=3)mot=95;else if(rank<=6)mot=85;else if(rank<=10)mot=70;else if(rank>=17)mot=90;else mot=60;}
            return{fd:Math.max(0,Math.min(100,fd)),att:Math.max(0,Math.min(100,att)),def:Math.max(0,Math.min(100,def)),fr:Math.max(0,Math.min(100,fr)),mot:Math.max(0,Math.min(100,mot)),fat:50};
          }

          function calcFatigue(last10){
            if(!last10||!last10.length)return{val:40,info:'Calendrier inconnu'};
            var now=new Date();
            var last=new Date(last10[0].date_full||last10[0].d);
            var daysSince=Math.round((now-last)/(1000*60*60*24));
            var matchesIn14=last10.filter(function(m){return (now-new Date(m.date_full||m.d))/(1000*60*60*24)<=14;}).length;
            var score=0;
            if(daysSince<=2)score=90;else if(daysSince<=4)score=70;else if(daysSince<=6)score=50;else if(daysSince<=8)score=30;else score=15;
            if(matchesIn14>=3)score=Math.min(100,score+20);
            return{val:Math.round(score),info:daysSince<=7?'Dernier match il y a '+daysSince+'j \u2014 '+matchesIn14+' match(s) en 14j':'Repos '+daysSince+' jours'};
          }

          function calcTendances(last10Home,last10Away){
            function countOver25(games){return games.filter(function(g){var p=(g.score||'').split('-');return parseInt(p[0]||0)+parseInt(p[1]||0)>2;}).length;}
            function countBTTS(games){return games.filter(function(g){var p=(g.score||'').split('-');return parseInt(p[0]||0)>0&&parseInt(p[1]||0)>0;}).length;}
            var domGames=last10Home.filter(function(g){return g.home===true;});
            var extGames=last10Away.filter(function(g){return g.home===false;});
            var n1=Math.max(domGames.length,1),n2=Math.max(extGames.length,1);
            return{over25_home:countOver25(domGames),over25_away:countOver25(extGames),over25_home_n:n1,over25_away_n:n2,btts_home:countBTTS(domGames),btts_away:countBTTS(extGames),btts_home_n:n1,btts_away_n:n2};
          }

          function calcMotivation(rank,totalTeams,pts,ptsLeader,matchsLeft,isHome,leagueName,homeName,awayName){
            totalTeams=totalTeams||20;matchsLeft=matchsLeft||5;
            var alerts=[],score=50;
            if(!rank)return{score:50,alerts:[],label:'Enjeu standard'};
            if(rank>=totalTeams-3){score+=30;alerts.push('\u26a0\ufe0f EN ZONE DE REL\u00c9GATION (#'+rank+'/'+totalTeams+')');}
            else if(rank<=3&&ptsLeader){var gap=(ptsLeader-pts)||0;if(gap<=6){score+=20;alerts.push('\uD83C\uDFC6 \u00c0 '+gap+' pts du titre');}}
            if(rank<=5&&rank>1){score+=10;alerts.push('\uD83C\uDF0D En course pour l\'Europe (#'+rank+')');}
            var hLow=(homeName||'').toLowerCase(),aLow=(awayName||'').toLowerCase();
            var isDerby=['manchester','london','milan','madrid','rome','glasgow','paris'].some(function(c){return hLow.includes(c)&&aLow.includes(c);})||
              (hLow.includes('city')&&aLow.includes('united'))||(hLow.includes('celtic')&&aLow.includes('rangers'))||(hLow.includes('inter')&&aLow.includes('milan'));
            if(isDerby){score+=25;alerts.push('\uD83D\uDD25 DERBY — imprévisibilité maximale');}
            score=Math.max(0,Math.min(100,score));
            return{score,alerts,label:score>=80?'ENJEU CRITIQUE':score>=60?'ENJEU \u00c9LEV\u00c9':score>=40?'Enjeu mod\u00e9r\u00e9':'Enjeu faible',isDerby};
          }

          function calcMatchup(xgH,xgA,sH,sA){
            var xgHavg=xgH&&xgH.xg_avg?parseFloat(xgH.xg_avg):1.2;
            var xgAavg=xgA&&xgA.xg_avg?parseFloat(xgA.xg_avg):1.0;
            var totalH=(sH&&sH.fixtures&&sH.fixtures.played&&sH.fixtures.played.total)||20;
            var totalA=(sA&&sA.fixtures&&sA.fixtures.played&&sA.fixtures.played.total)||20;
            var defH=sH&&sH.goals&&sH.goals.against&&sH.goals.against.total?(sH.goals.against.total.total/totalH).toFixed(2):1.2;
            var defA=sA&&sA.goals&&sA.goals.against&&sA.goals.against.total?(sA.goals.against.total.total/totalA).toFixed(2):1.2;
            var insights=[];
            if(xgHavg>=1.4&&xgAavg>=1.2)insights.push('\u26bd Deux équipes offensives — renforce Over 2.5');
            if(parseFloat(defH)<=1.0&&parseFloat(defA)<=1.0)insights.push('\uD83D\uDD12 Deux défenses solides — renforce BTTS Non');
            return{insights,defH,defA};
          }

          function calcKeyAbsences(injuries,topScorersH,topScorersA,homeId,awayId,bmHdom,mdHdom,bmAext,meAext){
            var alerts=[];
            if(!injuries||!injuries.length)return alerts;
            var injH=injuries.filter(function(x){return x.team===homeId;});
            var injA=injuries.filter(function(x){return x.team===awayId;});
            function checkAbsence(injList,scorers,teamGoals,teamGames,teamLabel){
              if(!injList.length||!scorers||!scorers.length)return;
              scorers.forEach(function(player){
                var isAbsent=injList.find(function(inj){
                  var pn=(player.name||'').toLowerCase(),in_=(inj.name||'').toLowerCase();
                  return pn.split(' ').some(function(w){return w.length>=4&&in_.includes(w);});
                });
                if(isAbsent){
                  var totalContrib=(player.goals||0)+(player.assists||0);
                  var pct=Math.round((totalContrib/Math.max((teamGoals||1)*1.5,1))*100);
                  var severity=pct>=30?'\uD83D\uDEA8 ALERTE ROUGE':pct>=20?'\uD83D\uDD34 ABSENCE MAJEURE':'\uD83D\uDFE1 Absence notable';
                  alerts.push(severity+': '+player.name+' ('+teamLabel+') ABSENT');
                }
              });
            }
            checkAbsence(injH,topScorersH,bmHdom,mdHdom,'DOM');
            checkAbsence(injA,topScorersA,bmAext,meAext,'EXT');
            return alerts;
          }

          function formatLast10(fixtures,teamId){
            return fixtures.slice(0,20).map(function(f){
              var isH=f.teams.home.id===teamId;
              var gf=isH?(f.goals.home||0):(f.goals.away||0);
              var ga=isH?(f.goals.away||0):(f.goals.home||0);
              return{d:(f.fixture.date||'').split('T')[0],opponent:isH?f.teams.away.name:f.teams.home.name,score:gf+'-'+ga,result:gf>ga?'W':gf<ga?'L':'D',home:isH,match:isH?f.teams.away.name:f.teams.home.name,lieu:isH?'DOM':'EXT',date_full:f.fixture.date||''};
            });
          }

          function formatH2H(fixtures,homeId){
            return fixtures.slice(0,5).map(function(f){
              var gfH=f.goals.home||0,gfA=f.goals.away||0;
              var isH=f.teams.home.id===homeId;
              var w;if(gfH>gfA)w=isH?'1':'2';else if(gfH<gfA)w=isH?'2':'1';else w='N';
              return{d:(f.fixture.date||'').split('T')[0],home:f.teams.home.name,away:f.teams.away.name,s:gfH+'-'+gfA,w};
            });
          }

          function calcDisciplineRisk(refStats,xgH,xgA,homeName,awayName){
            if(!refStats)return null;
            var cartons=parseFloat(refStats.cards_per_game)||0;
            var foutesH=xgH&&xgH.fouls_avg?parseFloat(xgH.fouls_avg):0;
            var foutesA=xgA&&xgA.fouls_avg?parseFloat(xgA.fouls_avg):0;
            var alerts=[],riskScore=0;
            if(cartons>=5.0){riskScore+=30;alerts.push('\uD83D\uDFE8 Arbitre tr\u00e8s s\u00e9v\u00e8re ('+cartons+' cartons/match)');}
            else if(cartons>=4.0){riskScore+=15;alerts.push('\uD83D\uDFE8 Arbitre s\u00e9v\u00e8re ('+cartons+' cartons/match)');}
            if(foutesH>=14&&cartons>=4.0){riskScore+=25;alerts.push('\u26a0\ufe0f '+homeName+' tr\u00e8s agressif + arbitre s\u00e9v\u00e8re');}
            if(foutesA>=14&&cartons>=4.0){riskScore+=25;alerts.push('\u26a0\ufe0f '+awayName+' tr\u00e8s agressif + arbitre s\u00e9v\u00e8re');}
            if(!alerts.length)return null;
            return{score:Math.min(riskScore,100),alerts};
          }

          // ── PROMPT FOOTBALL ──────────────────────────────────────
          async function genAnalyse(d) {
            var isWorldCup=(d.leagueId===1);
            var moyBmHdom=d.bmHdom&&d.mdHdom?(d.bmHdom/d.mdHdom).toFixed(2):'?';
            var moyBeHdom=d.beHdom&&d.mdHdom?(d.beHdom/d.mdHdom).toFixed(2):'?';
            var moyBmAext=d.bmAext&&d.meAext?(d.bmAext/d.meAext).toFixed(2):'?';
            var moyBeAext=d.beAext&&d.meAext?(d.beAext/d.meAext).toFixed(2):'?';
            var edgeAberrant=d.best_edge&&d.best_edge>15;
            var failHpct=d.mdHdom>0?Math.round((d.failHdom/d.mdHdom)*100):0;
            var failApct=d.meAext>0?Math.round((d.failAext/d.meAext)*100):0;
            var bttsNonCondition=failHpct>=35||failApct>=35;
            var poissonScoreH=Math.round(d.poisson_lambdaH||1.2);
            var poissonScoreA=Math.round(d.poisson_lambdaA||1.0);
            var scoreCentral=poissonScoreH+'-'+poissonScoreA;

            var injStr='Aucune absence majeure confirmée.';
            if(d.injuries&&d.injuries.length){
              var injH=d.injuries.filter(function(x){return x.team===d.homeId;});
              var injA=d.injuries.filter(function(x){return x.team===d.awayId;});
              var parts=[];
              if(injH.length)parts.push(d.home+' absents: '+injH.map(function(x){return x.name;}).join(', '));
              if(injA.length)parts.push(d.away+' absents: '+injA.map(function(x){return x.name;}).join(', '));
              if(parts.length)injStr=parts.join(' | ');
            }
            var h2hStr='Indisponible.';
            if(d.h2h&&d.h2h.length){
              var w1=0,wN=0,w2=0;
              d.h2h.forEach(function(g){var gfH=g.goals.home||0,gfA=g.goals.away||0;var isH=g.teams.home.id===d.homeId;if(gfH>gfA)isH?w1++:w2++;else if(gfH<gfA)isH?w2++:w1++;else wN++;});
              h2hStr=d.home+' '+w1+'V / '+wN+'N / '+w2+'D | Moy buts: '+d.h2hAvgButs;
            }

            var prompt;
            var wcPromptIsComplete = false;
            if(isWorldCup){
              wcPromptIsComplete = true;
              prompt = '⚠️ Modèle WC non disponible — analyse basique\n';

              if(WC_MODEL && WC_DATA){
                var stadeName = d.stade || '';
                var stadeKey = null;
                if(WC_DATA.WC2026_STADIUMS){
                  Object.keys(WC_DATA.WC2026_STADIUMS).forEach(function(k){
                    if(stadeName.toLowerCase().includes(k.toLowerCase().slice(0,6))||k.toLowerCase().includes(stadeName.toLowerCase().slice(0,6))) stadeKey = k;
                  });
                }

                var homeKey = d.home, awayKey = d.away;
                var nameMap = {
                  'United States':'USA','Korea Republic':'South Korea','Czechia':'Czech Republic',
                  'Czech Republic':'Czech Republic','Ivory Coast':'Ivory Coast','DR Congo':'DR Congo',
                  'Bosnia and Herzegovina':'Bosnia','Bosnia & Herzegovina':'Bosnia','Bosnia-Herzegovina':'Bosnia',
                };
                homeKey = nameMap[homeKey] || homeKey;
                awayKey = nameMap[awayKey] || awayKey;

                // xG dynamiques : qualifs réelles (buts + tirs cadrés via API,
                // expected_goals étant systématiquement null pour les qualifs)
                // hybridées avec le xG réel du tournoi en cours dès qu'il est
                // disponible. Fallback automatique sur QUALS_XG statique si
                // aucune donnée dynamique n'est trouvée (ex: Océanie).
                var dynStatsH = await getTeamWCStats(d.homeId, homeKey);
                var dynStatsA = await getTeamWCStats(d.awayId, awayKey);

                var wcPhase = d.isKnockout ? 'knockout' : 'group';
                var wcProbs = WC_MODEL.calcMatchProbs(homeKey, awayKey, wcPhase, null, null, stadeKey, dynStatsH, dynStatsA);
                var wcMarkets = WC_MODEL.calcWCMarkets(homeKey, awayKey, wcProbs, dynStatsH, dynStatsA);

                prompt = WC_MODEL.buildWCPrompt({
                  home: d.home, away: d.away,
                  league: d.league, date: d.date, stade: d.stade,
                  phase: wcPhase,
                  probs: wcProbs, markets: wcMarkets,
                  fatigueH: null, fatigueA: null,
                  h2h: h2hStr, absences: injStr,
                  tournoi_xg_h: null, tournoi_xg_a: null,
                  pinnacle_p1: d.pinnacle_p1, pinnacle_pN: d.pinnacle_pN, pinnacle_p2: d.pinnacle_p2,
                  dc1x: d.dc1x, dcx2: d.dc2x,
                  over25: d.co25, under25: d.cu25,
                  btts_oui: d.btts_oui, btts_non: d.btts_non,
                });
              }
            } else {
              prompt='=== MATCH ===\n'+d.home+' (DOM, #'+(d.rkH||'?')+') vs '+d.away+' (EXT, #'+(d.rkA||'?')+')\n'+d.league+' | '+d.date+' | '+d.stade+'\n\n'
                +'=== PHASE 1 — ANALYSE INDÉPENDANTE ===\n'
                +'DOM — Bilan domicile: '+d.vdH+'V / '+d.mdHdom+' matchs | Marqués: '+moyBmHdom+'/match | Encaissés: '+moyBeHdom+'/match\n'
                +'DOM — Sans marquer: '+d.failHdom+'/'+d.mdHdom+' ('+failHpct+'%) | CS: '+d.csHdom+'/'+d.mdHdom+'\n'
                +'DOM — Forme 5 derniers: '+d.forme5H+(d.streakH?' | '+d.streakH:'')+'\n'
                +(d.xgH_avg?'DOM — xG: '+d.xgH_avg+' | xGA: '+(d.xgH_xga||'N/A')+(d.xgH_defense_surchauffe?' ⚠️ DÉFENSE SURCHAUFFE':'')+'\n':'')
                +'\nEXT — Bilan extérieur: '+d.veA+'V / '+d.meAext+' matchs | Marqués: '+moyBmAext+'/match | Encaissés: '+moyBeAext+'/match\n'
                +'EXT — Sans marquer: '+d.failAext+'/'+d.meAext+' ('+failApct+'%) | CS: '+d.csAext+'/'+d.meAext+'\n'
                +'EXT — Forme 5 derniers: '+d.forme5A+(d.streakA?' | '+d.streakA:'')+'\n'
                +(d.xgA_avg?'EXT — xG: '+d.xgA_avg+' | xGA: '+(d.xgA_xga||'N/A')+(d.xgA_defense_surchauffe?' ⚠️ DÉFENSE SURCHAUFFE':'')+'\n':'')
                +'\nH2H: '+h2hStr+'\nAbsences: '+injStr+'\n'
                +(d.eloH&&d.eloA?'ELO: '+d.home+' '+Math.round(d.eloH)+' vs '+d.away+' '+Math.round(d.eloA)+' | Écart: '+(d.eloStats?d.eloStats.diff:0)+' ('+( d.eloStats?d.eloStats.signal:'?')+')\n':'ELO: non disponible\n')
                +(d.motivH&&d.motivH.alerts&&d.motivH.alerts.length?'Enjeu DOM: '+d.motivH.alerts.join(' | ')+'\n':'')
                +(d.motivA&&d.motivA.alerts&&d.motivA.alerts.length?'Enjeu EXT: '+d.motivA.alerts.join(' | ')+'\n':'')
                +(d.matchup&&d.matchup.insights&&d.matchup.insights.length?'Tactique: '+d.matchup.insights.join(' | ')+'\n':'')
                +'\n=== PHASE 2 — MODÈLE MATHÉMATIQUE ===\n'
                +'Poisson lambdas: DOM '+d.poisson_lambdaH+' | EXT '+d.poisson_lambdaA+'\n'
                +'Poisson: DOM '+d.poisson_p1+'% | Nul '+d.poisson_pN+'% | EXT '+d.poisson_p2+'%\n'
                +'Over 2.5: '+d.poisson_over25+'% | BTTS Non: '+d.poisson_bttsN+'%\n'
                +(d.pinnacle_p1?'Pinnacle (sharp): DOM '+d.pinnacle_p1+'% | Nul '+d.pinnacle_pN+'% | EXT '+d.pinnacle_p2+'%\n':'Pinnacle: non disponible\n')
                +(edgeAberrant?'⚠️ ALERTE: Edge > 15% = bug Poisson probable, ignore\n':'')
                +'\nCotes (UTILISE CES VALEURS EXACTES):\n'
                +(d.dc1x&&d.dc1x!=='--'?'DC 1X: '+d.dc1x+'\n':'DC 1X: N/A\n')
                +(d.dc2x&&d.dc2x!=='--'?'DC X2: '+d.dc2x+'\n':'DC X2: N/A\n')
                +(d.co25&&d.co25!=='--'?'Over 2.5: '+d.co25+'\n':'Over 2.5: N/A\n')
                +(d.btts_non&&d.btts_non!=='--'?'BTTS Non: '+d.btts_non+'\n':'BTTS Non: N/A\n')
                +'\n=== PHASE 3 — DÉCISION ===\n\n'
                +'PASSER SON TOUR si: Phase 1 et 2 contradictoires | Derby | ELO+Pinnacle absents | <8 matchs joués | aucune cote 1.60-2.20\n\n'
                +'MARCHÉS AUTORISÉS: DC 1X, DC X2, Over 2.5, BTTS Non (BTTS Non uniquement si '+bttsNonCondition+')\n'
                +'COTE OBLIGATOIRE: 1.60-2.20\n'
                +'CONFIANCE: 7.0-7.4 (1-2 signaux) | 7.5-7.9 (3+) | 8.0-8.5 (4+ dont ELO+Pinnacle) — MAX 8.5\n'
                +'RISQUE: FAIBLE si <1.75 + ELO + Pinnacle | MODERE si 1.75-2.10 | ELEVE sinon\n'
                +'edge = prob_IA - 1/cote | vbet OUI si edge>=5% ET conf>=7.0\n'
                +'kelly = edge_decimal*(cote-1)-(1-edge_decimal))/(cote-1)*0.25*100, max 5%\n\n';
            }

            // JSON commun foot
            var jsonTpl = 'Réponds UNIQUEMENT avec ce JSON valide. Aucun texte avant ou après. Aucun backtick.\n'
              +'RÈGLE ABSOLUE: analyse_card, conseil, contexte, facteur_x, scenario, scenario_15min TOUJOURS remplis même si passe_ton_tour=true.\n\n'
              +'{\n'
              +'"passe_ton_tour": false,\n'
              +'"confiance": [7.0 à 8.5 ou 0],\n'
              +'"pari_rec": "[DC 1X|DC X2|Over 2.5|BTTS Non] ou vide",\n'
              +'"cote_rec": "[COPIE EXACTE de la cote ci-dessus]",\n'
              +'"marche": "[DOUBLE_CHANCE|TOTAL_BUTS|BTTS] ou vide",\n'
              +'"risque": "[FAIBLE|MODERE|ELEVE]",\n'
              +'"verdict_shark": "[pari] à [cote] — [1 phrase] ou vide",\n'
              +'"analyse_card": "[TOUJOURS REMPLI]",\n'
              +'"conseil": "[TOUJOURS REMPLI]",\n'
              +'"contexte": "[TOUJOURS REMPLI]",\n'
              +'"facteur_x": "[TOUJOURS REMPLI]",\n'
              +'"score_central": "'+scoreCentral+'",\n'
              +'"p1": '+d.poisson_p1+', "pn": '+d.poisson_pN+', "p2": '+d.poisson_p2+',\n'
              +'"po25": '+d.poisson_over25+', "btts": '+d.poisson_bttsY+',\n'
              +'"edge": "[prob_estimée - 1/cote en %]",\n'
              +'"vbet": "[OUI|NON]",\n'
              +'"kelly": "[1/4 Kelly max 5%]",\n'
              +'"scenario": {"phase1":"[TOUJOURS REMPLI]","phase2":"[TOUJOURS REMPLI]","phase3":"[TOUJOURS REMPLI]"},\n'
              +'"scenario_15min": [\n'
              +'  {"t":"0-15min","prob":8,"txt":"[TOUJOURS REMPLI]"},\n'
              +'  {"t":"15-30min","prob":12,"txt":"[TOUJOURS REMPLI]"},\n'
              +'  {"t":"30-45min","prob":10,"txt":"[TOUJOURS REMPLI]"},\n'
              +'  {"t":"45-60min","prob":15,"txt":"[TOUJOURS REMPLI]"},\n'
              +'  {"t":"60-75min","prob":18,"txt":"[TOUJOURS REMPLI]"},\n'
              +'  {"t":"75-90min","prob":20,"txt":"[TOUJOURS REMPLI]"}\n'
              +']\n'
              +'}';

            var finalContent = wcPromptIsComplete ? prompt : (prompt + jsonTpl);
            var systemMsg = isWorldCup
