name: Update IASHARK Daily

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Vider le cache et recalculer tous les matchs'
        required: false
        default: 'false'
      test_wc_only:
        description: 'Mode test : Coupe du Monde uniquement (rapide)'
        required: false
        default: 'false'

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Write pipeline script
        run: |
          cat > pipeline.js << 'JSEOF'
          const https = require('https');
          const fs    = require('fs');
          const { poissonProb, calcPoissonProbs, dixonColesCorr, calcDixonColesProbs, calcMonteCarlo, shinProbabilities } = require('./lib/models.js');
          const { fractionalKelly } = require('./lib/betting.js');
          const { resolveMarketWin } = require('./lib/resolvers.js');
          const { parseOdds } = require('./lib/odds.js');
          const { pickMarketDeterministic, computeRiskLabel, computeModelAgreement, computeDataQualityScore, computeReliability } = require('./lib/decision.js');
          const I18N_LOCALES = require('./i18n/locales.json');
          const I18N_PAGES = require('./scripts/i18n-manifest.js');
          // Identifiant du generateur de predictions actif. A incrementer/renommer
          // quand le moteur change reellement (ex: introduction du moteur V2.1
          // multi-modeles §10 du MASTER) pour pouvoir comparer les performances
          // d'un modele a l'autre dans match_snapshots/match_premium_data plutot
          // que de tout attribuer au meme "modele" indistinct.
          const MODEL_VERSION = 'legacy-poisson-dc-mc-v1';
          const APS_KEY    = process.env.APISPORTS_KEY;
          const OWM_KEY    = process.env.OPENWEATHER_KEY;
          const NEWS_KEY   = process.env.NEWSAPI_KEY;
          const ANT_KEY    = process.env.ANTHROPIC_KEY;
          const ODDS_KEY   = process.env.ODDS_API_KEY;
          const SUPA_URL_PIPELINE = process.env.SUPABASE_URL;
          const SUPA_SERVICE_KEY  = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const APS        = {'x-apisports-key': APS_KEY};
          var WC_DATA = null, WC_MODEL = null;
          function sleep(ms) { return new Promise(function(r){ setTimeout(r,ms); }); }
          function get(url, headers) {
            return new Promise(function(resolve) {
              var u = new URL(url);
              var timer = setTimeout(function(){ resolve({}); }, 10000);
              https.get({
                hostname: u.hostname, path: u.pathname+u.search,
                headers: Object.assign({'User-Agent':'IASHARK/1.0'}, headers||{})
              }, function(res) {
                var d='';
                res.on('data',function(c){d+=c;});
                res.on('end',function(){
                  clearTimeout(timer);
                  try{ resolve(JSON.parse(d)); }catch(e){ resolve({}); }
                });
              }).on('error',function(){ clearTimeout(timer); resolve({}); });
            });
          }
          function getArr(url, headers) {
            return new Promise(function(resolve) {
              var u = new URL(url);
              var timer = setTimeout(function(){ resolve([]); }, 10000);
              https.get({
                hostname: u.hostname, path: u.pathname+u.search,
                headers: Object.assign({'User-Agent':'IASHARK/1.0'}, headers||{})
              }, function(res) {
                var d='';
                res.on('data',function(c){d+=c;});
                res.on('end',function(){
                  clearTimeout(timer);
                  try{
                    var parsed = JSON.parse(d);
                    resolve(Array.isArray(parsed) ? parsed : (parsed.data||parsed.response||[]));
                  }catch(e){ resolve([]); }
                });
              }).on('error',function(){ clearTimeout(timer); resolve([]); });
            });
          }
          function getText(url, headers) {
            return new Promise(function(resolve) {
              var u = new URL(url);
              var timer = setTimeout(function(){ resolve(''); }, 10000);
              https.get({
                hostname: u.hostname, path: u.pathname+u.search,
                headers: Object.assign({'User-Agent':'IASHARK/1.0'}, headers||{})
              }, function(res) {
                var d='';
                res.on('data',function(c){d+=c;});
                res.on('end',function(){ clearTimeout(timer); resolve(d); });
              }).on('error',function(){ clearTimeout(timer); resolve(''); });
            });
          }
          function stripCdata(s){ return (s||'').replace(/<!\[CDATA\[/g,'').replace(/\]\]>/g,'').trim(); }
          function stripTags(s){ return (s||'').replace(/<[^>]+>/g,'').trim(); }
          function decodeEntities(s){
            var out = (s||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
              .replace(/&quot;/g,'"').replace(/&apos;/g,"'")
              .replace(/&rsquo;/g,"'").replace(/&lsquo;/g,"'")
              .replace(/&rdquo;/g,'"').replace(/&ldquo;/g,'"')
              .replace(/&nbsp;/g,' ');
            out = out.replace(/&#x([0-9a-f]+);/gi, function(m, hex){ return String.fromCharCode(parseInt(hex,16)); });
            out = out.replace(/&#0*(\d+);/g, function(m, dec){ return String.fromCharCode(parseInt(dec,10)); });
            return out;
          }
          function smartSnippet(desc, maxLen){
            maxLen = maxLen || 220;
            var text = (desc||'').replace(/\s+/g,' ').trim();
            if(text.length <= maxLen) return text;
            var cut = text.slice(0, maxLen);
            var lastEnd = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('! '), cut.lastIndexOf('? '));
            if(lastEnd > maxLen*0.4){
              return cut.slice(0, lastEnd+1).trim();
            }
            var lastSpace = cut.lastIndexOf(' ');
            return (lastSpace>0?cut.slice(0,lastSpace):cut).trim() + '…';
          }
          function parseRSSItems(xml, maxItems) {
            maxItems = maxItems || 15;
            var items = [];
            var blocks = xml.match(/<item[\s\S]*?<\/item>/g) || [];
            blocks.slice(0, maxItems).forEach(function(block){
              function field(tag){
                var re = new RegExp('<'+tag+'[^>]*>([\\s\\S]*?)<\\/'+tag+'>');
                var m = block.match(re);
                return m ? decodeEntities(stripTags(stripCdata(m[1]))) : '';
              }
              var link = field('link');
              if(!link){ var lm = block.match(/<link[^>]*href=["']([^"']+)["']/); if(lm) link = lm[1]; }
              items.push({ title: field('title'), link: link, pubDate: field('pubDate')||field('published')||field('updated'), description: field('description')||field('summary') });
            });
            return items;
          }
          var RSS_SOURCES = [
            { nom: "L'Equipe", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Football/Transferts-football/", type: 'mercato', fiabilite: 'high' },
            { nom: "Foot01", url: "https://www.foot01.com/news.rss", type: 'general', fiabilite: 'mid' },
            { nom: "RMC Sport", url: "https://rmcsport.bfmtv.com/rss/football/", type: 'general', fiabilite: 'high' },
            { nom: "Foot Mercato", url: "https://www.footmercato.net/flux-rss", type: 'mercato', fiabilite: 'high' },
          ];
          var WC_QUALIF_LEAGUE = {
            'France':32,'Germany':32,'Spain':32,'England':32,'Portugal':32,'Italy':32,
            'Netherlands':32,'Belgium':32,'Croatia':32,'Switzerland':32,'Austria':32,
            'Denmark':32,'Norway':32,'Sweden':32,'Poland':32,'Ukraine':32,'Czech Republic':32,
            'Scotland':32,'Wales':32,'Serbia':32,'Slovakia':32,'Slovenia':32,'Romania':32,
            'Hungary':32,'Bosnia':32,'Bosnia and Herzegovina':32,'Albania':32,'Kosovo':32,
            'Greece':32,'Turkey':32,'Iceland':32,'Finland':32,'Ireland':32,'Northern Ireland':32,
            'Montenegro':32,'North Macedonia':32,'Israel':32,'Georgia':32,'Luxembourg':32,
            'Cyprus':32,'Faroe Islands':32,'Gibraltar':32,'San Marino':32,'Andorra':32,
            'Malta':32,'Moldova':32,'Belarus':32,'Armenia':32,'Azerbaijan':32,'Kazakhstan':32,
            'Estonia':32,'Latvia':32,'Lithuania':32,'Bulgaria':32,'Liechtenstein':32,
            'USA':31,'Mexico':31,'Canada':31,'Costa Rica':31,'Jamaica':31,'Panama':31,
            'Honduras':31,'El Salvador':31,'Curacao':31,'Haiti':31,'Trinidad and Tobago':31,
            'Guatemala':31,'Nicaragua':31,'Suriname':31,
            'Iran':30,'South Korea':30,'Korea Republic':30,'Japan':30,'Australia':30,
            'Saudi Arabia':30,'Qatar':30,'Iraq':30,'UAE':30,'United Arab Emirates':30,
            'Uzbekistan':30,'Jordan':30,'Oman':30,'Bahrain':30,'Kyrgyzstan':30,
            'North Korea':30,'China':30,'Indonesia':30,'Palestine':30,
            'Morocco':29,'Senegal':29,'Tunisia':29,'Egypt':29,'Algeria':29,'Nigeria':29,
            'Ghana':29,'Cameroon':29,'Ivory Coast':29,'South Africa':29,'DR Congo':29,
            'Mali':29,'Cape Verde':29,'Gabon':29,'Mozambique':29,'Benin':29,'Uganda':29,
            'Burkina Faso':29,'Guinea':29,
            'Brazil':34,'Argentina':34,'Uruguay':34,'Colombia':34,'Ecuador':34,
            'Paraguay':34,'Bolivia':34,'Venezuela':34,'Chile':34,'Peru':34,
          };
          var WC_TEAM_STATS_CACHE = {};
          function calcApproxXG(goalsAvg, shotsOnTargetAvg) {
            if(goalsAvg==null) return null;
            if(shotsOnTargetAvg==null) return Math.round(goalsAvg*100)/100;
            var xgFromShots = shotsOnTargetAvg * 0.32;
            var blended = goalsAvg*0.65 + xgFromShots*0.35;
            return Math.round(blended*100)/100;
          }
          async function getTeamQualifStats(teamId, teamName) {
            var cacheKey = 'qualif_'+teamId;
            if(WC_TEAM_STATS_CACHE[cacheKey]) return WC_TEAM_STATS_CACHE[cacheKey];
            var leagueId = WC_QUALIF_LEAGUE[teamName];
            if(!leagueId) { WC_TEAM_STATS_CACHE[cacheKey] = null; return null; }
            try {
              var seasonsToTry = [2026, 2024, 2023];
              var fixturesRaw = null;
              for(var si=0; si<seasonsToTry.length; si++){
                var r = await get('https://v3.football.api-sports.io/fixtures?league='+leagueId+'&season='+seasonsToTry[si]+'&team='+teamId, APS);
                if(r.response && r.response.length){ fixturesRaw = r.response; break; }
                await sleep(150);
              }
              if(!fixturesRaw || !fixturesRaw.length) { WC_TEAM_STATS_CACHE[cacheKey] = null; return null; }
              var played = fixturesRaw.filter(function(f){
                var st=(f.fixture.status&&f.fixture.status.short)||'';
                return st==='FT'||st==='AET'||st==='PEN';
              }).sort(function(a,b){ return (b.fixture.timestamp||0)-(a.fixture.timestamp||0); });
              var last8 = played.slice(0, 8);
              if(!last8.length) { WC_TEAM_STATS_CACHE[cacheKey] = null; return null; }
              var goalsFor=[], goalsAgainst=[];
              last8.forEach(function(f){
                var isHome = f.teams.home.id===teamId;
                var gf = isHome ? f.goals.home : f.goals.away;
                var ga = isHome ? f.goals.away : f.goals.home;
                if(gf!=null) goalsFor.push(gf);
                if(ga!=null) goalsAgainst.push(ga);
              });
              var shotsOnFor=[], shotsOnAgainst=[];
              for(var mi=0; mi<last8.length; mi++){
                try {
                  var statR = await get('https://v3.football.api-sports.io/fixtures/statistics?fixture='+last8[mi].fixture.id, APS);
                  var blocks = statR.response||[];
                  var teamBlock = blocks.find(function(b){ return b.team && b.team.id===teamId; });
                  var oppBlock = blocks.find(function(b){ return b.team && b.team.id!==teamId; });
                  if(teamBlock){
                    var sot = (teamBlock.statistics||[]).find(function(s){ return s.type==='Shots on Goal'; });
                    if(sot && sot.value!=null) shotsOnFor.push(parseFloat(sot.value));
                  }
                  if(oppBlock){
                    var sotOpp = (oppBlock.statistics||[]).find(function(s){ return s.type==='Shots on Goal'; });
                    if(sotOpp && sotOpp.value!=null) shotsOnAgainst.push(parseFloat(sotOpp.value));
                  }
                } catch(e){}
                await sleep(120);
              }
              function avg(arr){ return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : null; }
              var result = {
                xg_for: calcApproxXG(avg(goalsFor), avg(shotsOnFor)),
                xg_against: calcApproxXG(avg(goalsAgainst), avg(shotsOnAgainst)),
                goals_for_avg: avg(goalsFor)!=null?Math.round(avg(goalsFor)*100)/100:null,
                goals_against_avg: avg(goalsAgainst)!=null?Math.round(avg(goalsAgainst)*100)/100:null,
                form: last8.map(function(f){
                  var isHome = f.teams.home.id===teamId;
                  var gf = isHome ? f.goals.home : f.goals.away;
                  var ga = isHome ? f.goals.away : f.goals.home;
                  if(gf==null||ga==null) return '?';
                  return gf>ga?'V':gf<ga?'D':'N';
                }).join(''),
                n_matches: last8.length, source: 'qualifs_api',
              };
              WC_TEAM_STATS_CACHE[cacheKey] = result;
              return result;
            } catch(e) { WC_TEAM_STATS_CACHE[cacheKey] = null; return null; }
          }
          async function getTeamTournamentStats(teamId, teamName) {
            var cacheKey = 'tournoi_'+teamId;
            if(WC_TEAM_STATS_CACHE[cacheKey]!==undefined) return WC_TEAM_STATS_CACHE[cacheKey];
            try {
              var r = await get('https://v3.football.api-sports.io/fixtures?league=1&season=2026&team='+teamId, APS);
              var fixturesRaw = r.response||[];
              var played = fixturesRaw.filter(function(f){
                var st=(f.fixture.status&&f.fixture.status.short)||'';
                return st==='FT'||st==='AET'||st==='PEN';
              });
              if(!played.length) { WC_TEAM_STATS_CACHE[cacheKey] = null; return null; }
              var xgFor=[], xgAgainst=[], goalsFor=[], goalsAgainst=[];
              for(var mi=0; mi<played.length; mi++){
                var f = played[mi];
                var isHome = f.teams.home.id===teamId;
                if(f.goals.home!=null) goalsFor.push(isHome?f.goals.home:f.goals.away);
                if(f.goals.away!=null) goalsAgainst.push(isHome?f.goals.away:f.goals.home);
                try {
                  var statR = await get('https://v3.football.api-sports.io/fixtures/statistics?fixture='+f.fixture.id, APS);
                  var blocks = statR.response||[];
                  var teamBlock = blocks.find(function(b){ return b.team && b.team.id===teamId; });
                  var oppBlock = blocks.find(function(b){ return b.team && b.team.id!==teamId; });
                  if(teamBlock){
                    var xg = (teamBlock.statistics||[]).find(function(s){ return s.type==='expected_goals'; });
                    if(xg && xg.value!=null) xgFor.push(parseFloat(xg.value));
                  }
                  if(oppBlock){
                    var xgOpp = (oppBlock.statistics||[]).find(function(s){ return s.type==='expected_goals'; });
                    if(xgOpp && xgOpp.value!=null) xgAgainst.push(parseFloat(xgOpp.value));
                  }
                } catch(e){}
                await sleep(120);
              }
              function avg(arr){ return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : null; }
              var slotsFor=[{t:'0-15',n:0},{t:'15-30',n:0},{t:'30-45',n:0},{t:'45-60',n:0},{t:'60-75',n:0},{t:'75-90',n:0}];
              var slotsAgainst=[{t:'0-15',n:0},{t:'15-30',n:0},{t:'30-45',n:0},{t:'45-60',n:0},{t:'60-75',n:0},{t:'75-90',n:0}];
              var slotRanges=[[0,15],[15,30],[30,45],[45,60],[60,75],[75,91]];
              var hasSlotsData=false;
              for(var si2=0;si2<played.length;si2++){
                try{
                  var evR=await get('https://v3.football.api-sports.io/fixtures/events?fixture='+played[si2].fixture.id,APS);
                  var evts=evR.response||[];
                  evts.forEach(function(e){
                    if(e.type!=='Goal'||e.detail==='Missed Penalty') return;
                    var min=e.time&&e.time.elapsed||0;
                    var isByTeam=e.team&&e.team.id===teamId;
                    for(var ri=0;ri<slotRanges.length;ri++){
                      if(min>=slotRanges[ri][0]&&min<slotRanges[ri][1]){
                        if(isByTeam) slotsFor[ri].n++;
                        else slotsAgainst[ri].n++;
                        hasSlotsData=true;
                        break;
                      }
                    }
                  });
                }catch(e2){}
                await sleep(100);
              }
              var xgForAvg = avg(xgFor), xgAgainstAvg = avg(xgAgainst);
              var result = {
                xg_for: xgForAvg!=null ? Math.round(xgForAvg*100)/100 : avg(goalsFor),
                xg_against: xgAgainstAvg!=null ? Math.round(xgAgainstAvg*100)/100 : avg(goalsAgainst),
                games: played.length,
                source: xgForAvg!=null ? 'tournoi_xg_reel' : 'tournoi_buts_reels',
                slots: hasSlotsData ? slotsFor : null,
                slots_against: hasSlotsData ? slotsAgainst : null,
              };
              WC_TEAM_STATS_CACHE[cacheKey] = result;
              return result;
            } catch(e) { WC_TEAM_STATS_CACHE[cacheKey] = null; return null; }
          }
          async function getTeamWCStats(teamId, teamName) {
            var qualif = await getTeamQualifStats(teamId, teamName);
            var tournoi = await getTeamTournamentStats(teamId, teamName);
            if(!qualif && !tournoi) return null;
            if(qualif && !tournoi) return { xg_for: qualif.xg_for, xg_against: qualif.xg_against, source: 'qualifs_seul', detail: qualif };
            if(!qualif && tournoi) return { xg_for: tournoi.xg_for, xg_against: tournoi.xg_against, source: 'tournoi_seul', detail: tournoi };
            var nGames = tournoi.games||0;
            var poidsTournoi = nGames>=2 ? 0.70 : 0.40;
            var poidsQualif = 1 - poidsTournoi;
            return {
              xg_for: Math.round(((qualif.xg_for||0)*poidsQualif + (tournoi.xg_for||0)*poidsTournoi)*100)/100,
              xg_against: Math.round(((qualif.xg_against||0)*poidsQualif + (tournoi.xg_against||0)*poidsTournoi)*100)/100,
              source: 'hybride_qualif'+Math.round(poidsQualif*100)+'_tournoi'+Math.round(poidsTournoi*100),
              detail: { qualif: qualif, tournoi: tournoi },
            };
          }
          function postJSON(host, path, body, headers) {
            return new Promise(function(resolve) {
              var data = JSON.stringify(body);
              var timer = setTimeout(function(){ console.log('  TIMEOUT 180s'); resolve({}); }, 180000);
              var req = https.request({
                hostname:host, path:path, method:'POST',
                headers:Object.assign({
                  'Content-Type':'application/json',
                  'Content-Length':Buffer.byteLength(data)
                }, headers||{})
              }, function(res) {
                var d='';
                res.on('data',function(c){d+=c;});
                res.on('end',function(){
                  clearTimeout(timer);
                  try{
                    var parsed=JSON.parse(d);
                    if(parsed.error) console.log('  API ERROR type='+parsed.error.type+' msg='+(parsed.error.message||'').slice(0,100));
                    resolve(parsed);
                  }catch(e){ console.log('  Parse error status='+res.statusCode); resolve({}); }
                });
              });
              req.on('error',function(e){ clearTimeout(timer); console.log('  req error:'+e.message); resolve({}); });
              req.write(data); req.end();
            });
          }
          async function postJSONWithRetry(host, path, body, headers) {
            for(var attempt=1; attempt<=4; attempt++){
              var r = await postJSON(host, path, body, headers);
              if(r.error && (r.error.type==='overloaded_error'||r.error.type==='rate_limit_error')){
                var wait=attempt*30000;
                console.log('  Rate limit - attente '+(wait/1000)+'s tentative '+attempt+'/4');
                await sleep(wait);
                continue;
              }
              return r;
            }
            return {};
          }
          function levenshtein(a,b){
            var m=a.length,n=b.length,dp=[];
            for(var i=0;i<=m;i++){dp[i]=[i];for(var j=1;j<=n;j++)dp[i][j]=0;}
            for(var j=0;j<=n;j++)dp[0][j]=j;
            for(var i=1;i<=m;i++)for(var j=1;j<=n;j++){
              if(a[i-1]===b[j-1])dp[i][j]=dp[i-1][j-1];
              else dp[i][j]=1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
            }
            return dp[m][n];
          }
          function slugify(s) {
            return (s||'').toLowerCase()
              .replace(/[\u00e0\u00e1\u00e2\u00e3\u00e4\u00e5]/g,'a').replace(/[\u00e9\u00e8\u00ea\u00eb]/g,'e')
              .replace(/[\u00ed\u00ec\u00ee\u00ef]/g,'i').replace(/[\u00f3\u00f2\u00f4\u00f5\u00f6]/g,'o')
              .replace(/[\u00fa\u00f9\u00fb\u00fc]/g,'u').replace(/[\u00e7]/g,'c').replace(/[\u00f1]/g,'n')
              .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
          }
          function mkdirSafe(p) {
            try { fs.mkdirSync(p, {recursive:true}); } catch(e) {}
          }
          function toParisHeure(utcDate) {
            if (!utcDate) return '';
            var d = new Date(utcDate);
            if (isNaN(d.getTime())) return '';
            var year = d.getUTCFullYear();
            function lastSundayOf(month) {
              var last = new Date(Date.UTC(year, month+1, 0));
              last.setUTCDate(last.getUTCDate() - last.getUTCDay());
              return last;
            }
            var startCEST = lastSundayOf(2);
            var endCEST   = lastSundayOf(9);
            var offset = (d >= startCEST && d < endCEST) ? 2 : 1;
            var parisMs = d.getTime() + offset * 3600 * 1000;
            var paris = new Date(parisMs);
            var hh = String(paris.getUTCHours()).padStart(2,'0');
            var mm = String(paris.getUTCMinutes()).padStart(2,'0');
            return hh+':'+mm;
          }
          function calcFinalProbs(lambdaH, lambdaA, eloStats) {
            var po = calcPoissonProbs(lambdaH, lambdaA);
            var dc = calcDixonColesProbs(lambdaH, lambdaA);
            var mc = calcMonteCarlo(lambdaH, lambdaA);
            var eloP1=null, eloPN=null, eloP2=null;
            if(eloStats && eloStats.probH && eloStats.probA) {
              var avgPN = Math.round((po.pN + dc.pN + mc.pN) / 3);
              var rawH = eloStats.probH, rawA = eloStats.probA;
              var scale = (100 - avgPN) / Math.max(rawH + rawA, 1);
              eloP1 = Math.round(rawH * scale);
              eloP2 = Math.round(rawA * scale);
              eloPN = 100 - eloP1 - eloP2;
            }
            var hasElo = eloP1 !== null;
            var w = hasElo
              ? {po:0.32, dc:0.36, mc:0.22, elo:0.10}
              : {po:0.35, dc:0.40, mc:0.25, elo:0};
            function blend1X2(key, eloVal) {
              var base = po[key]*w.po + dc[key]*w.dc + mc[key]*w.mc;
              if(hasElo && eloVal!==null) base += eloVal*w.elo;
              return Math.round(base);
            }
