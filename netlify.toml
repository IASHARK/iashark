# Netlify ne publie QUE dist/, construit par scripts/build-public.js a chaque
# deploiement (audit QA du 14/09/2026 : la racine du depot etait publique,
# documents internes, SQL, code des fonctions et donnees brutes compris).
[build]
  command = "node scripts/build-public.js"
  publish = "dist"

# /api/geo : pays / region / ville APPROXIMATIFS deduits du reseau par Netlify
# pour les statistiques anonymes (funnel-track.js). Aucune adresse IP n'est
# renvoyee ni stockee. Code : netlify/edge-functions/geo.ts (hors dist/).
# Meme origine que le site : couvert par connect-src 'self' de _headers.
[[edge_functions]]
  path = "/api/geo"
  function = "geo"
