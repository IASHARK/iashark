# LISERÉ VERT / ROUGE DU JOUR EN COURS (20/09/2026, demande du proprietaire).
#
# update-data.yml ne tourne qu'a 6 h UTC et n'ecrit results/<date>.json que pour
# les journees DEJA PASSEES : il ne peut pas colorer un match qui se termine a
# 17 h. Ce workflow fait la seule chose qui manque — relire les statuts du jour
# et reecrire results/<aujourd'hui>.json — sans rien recalculer du modele.
#
# COUT. API-Football : 1 appel par run (tous les matchs de la journee d'un
# coup), soit ~4 appels/jour sur un quota de 75 000. Netlify : 1 build par run,
# et SEULEMENT quand un verdict a change (rien de modifie -> aucun commit,
# aucun build) — le compte a deja ete coupe pour depassement le 15/09/2026.
#
# HORAIRES (UTC) choisis sur le rythme reel des journees : fin d'apres-midi
# europeenne, soiree, fin de soiree, puis nuit sud-americaine.
name: Resultats du jour

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: resultats-du-jour
  cancel-in-progress: false

jobs:
  resultats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reconstruire results/<aujourd-hui>.json
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/resultats-du-jour.js

      - name: Publier si un verdict a change
        run: |
          set -e
          git config user.name "IASHARK"
          git config user.email "yaramode81@gmail.com"
          # `generated_at` change a chaque run : on ne commite QUE si un verdict
          # a bouge, sinon chaque passage couterait un build Netlify pour rien.
          if git diff --quiet -- results/; then
            echo "Aucun changement dans results/ : rien a publier."
            exit 0
          fi
          if [ "$(git diff --numstat -- results/ | awk '{a+=$1+$2} END {print a+0}')" -le 2 ]; then
            echo "Seul generated_at a change : rien a publier."
            git checkout -- results/
            exit 0
          fi
          git add results/
          git commit -m "Resultats du jour : liseré vert/rouge mis a jour"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push $i echoue, nouvelle tentative..."
            sleep 10
          done
          echo "::warning title=Resultats du jour::push impossible ce run ; le prochain reessaiera."
