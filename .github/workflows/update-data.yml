              console.log('\n=== JOUR SANS MATCHS — Résolution historique d\'hier ===');
              var histoPathEarly='historique.json';
              var histoEarly={predictions:[],stats:{winrate:0,roi:0,total:0,streak:0,wins:0,losses:0},monthly:[],backtesting:{}};
              try{histoEarly=JSON.parse(fs.readFileSync(histoPathEarly,'utf8'));}catch(e){}
              var resolveDatesEarly=[];
