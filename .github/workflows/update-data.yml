              }
              console.log('  [API] '+API_ERRORS.count+' refus de l\'API pendant cette execution'+(API_ERRORS.quota?' (QUOTA EPUISE)':'')+'.');
              if(restaurees)console.log('  [FILET] '+restaurees+' analyse(s) conservee(s) de l\'execution precedente plutot que publiees vides.');
              else console.log('  [FILET] aucune analyse precedente exploitable a conserver.');
            }
            // item 2 : compteurs honnetes de la file d'attente API globale
            // (v3.football.api-sports.io uniquement - voir API_FETCHER) pour
            // que le quota reellement consomme, le cache reellement reutilise
            // et les 429 reellement rencontres/rattrapes soient visibles a
            // chaque run, jamais devinables depuis les seuls logs par match.
            console.log('  [API_STATS] API_CALLS='+API_FETCHER.stats.calls+' CACHE_HITS='+API_FETCHER.stats.cache_hits+' RATE_LIMIT_RETRIES='+API_FETCHER.stats.rate_limit_retries+' RATE_LIMIT_FAILURES='+API_FETCHER.stats.rate_limit_failures+' (v3.football.api-sports.io uniquement)');
            var allMatchsData = matchsData.slice();
            allMatchsData.sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
            matchsData.sort(function(a,b){var tA=(a.date||'').split(' ')[1]||'99:99';var tB=(b.date||'').split(' ')[1]||'99:99';return tA<tB?-1:tA>tB?1:0;});
            // ============= RUN OUTPUT ENGINE (moteur produit canonique) =============
            // Appele UNE SEULE FOIS ici, apres le calcul de TOUTES les fixtures
            // (RUN_OUTPUT_CANDIDATES deja rempli fixture par fixture ci-dessus) et
            // AVANT designerMatchGratuit()/matchsPublics - pour pouvoir faire
            // apparaitre une SAFE_PICK_OF_THE_DAY canonique directement sur la
            // carte EXISTANTE du match concerne (reutilise l'affichage deja en
            // place, aucun nouvel ecran). Jamais un nouveau calcul de
            // probabilite : uniquement selection/classement/assemblage au-dessus
            // des marches deja geles. runOutputForSnapshot fusionne lui-meme le
            // registry League Expansion Factory avec le statut canonique Premier
            // League (lib/run-output/canonical-registry.js) : aucune ligue n'est
            // jamais eligible ici sans etre passee par cette meme porte.
            var RUN_OUTPUT_SNAPSHOT_TIME = new Date().toISOString();
            var runOutput = runOutputForSnapshot({
              candidates: RUN_OUTPUT_CANDIDATES,
              registry: RUN_OUTPUT_CANONICAL_REGISTRY,
              snapshotTime: RUN_OUTPUT_SNAPSHOT_TIME,
              runId: 'DAILY_'+TODAY,
            });
            // Injection directe de la SAFE_PICK_OF_THE_DAY sur la carte
            // existante de son match (jamais l'inverse : le pick canonique
            // remplace l'ancien pour CE match precis, uniquement quand le
            // moteur canonique en a reellement selectionne un). is_canonical_pick
            // trace explicitement l'origine du champ pour tout audit futur.
            if(runOutput.SAFE_PICK_OF_THE_DAY.status==='SELECTED'){
              var safePick=runOutput.SAFE_PICK_OF_THE_DAY;
              var matchCibleSafePick=allMatchsData.find(function(m){ return m && m.id===safePick.fixture.fixture_id; });
              if(matchCibleSafePick){
                matchCibleSafePick.pari_rec=legacyLabelForCanonicalMarket(safePick.market);
                matchCibleSafePick.cote_rec=safePick.decimal_odds;
                matchCibleSafePick.model_probability=safePick.model_probability_pct;
                matchCibleSafePick.conf=Math.round((safePick.model_probability_pct/10)*10)/10;
                matchCibleSafePick.no_signal=false;
                matchCibleSafePick.is_canonical_pick=true;
                console.log('  [RUN_OUTPUT] SAFE_PICK_OF_THE_DAY injectee sur la carte existante du match '+matchCibleSafePick.id+' ('+(matchCibleSafePick.home&&matchCibleSafePick.home.n)+' vs '+(matchCibleSafePick.away&&matchCibleSafePick.away.n)+') : '+matchCibleSafePick.pari_rec+' @ '+matchCibleSafePick.cote_rec);
              } else {
                console.log('  [RUN_OUTPUT] SAFE_PICK_OF_THE_DAY selectionnee (fixture '+safePick.fixture.fixture_id+') mais match introuvable dans allMatchsData - injection ignoree, aucune carte modifiee.');
              }
            }
            // ================= PROTECTION DU FICHIER PUBLIC =================
            // data.json est servi sans authentification. Il ne doit donc plus
            // contenir le marche recommande, sa cote, la probabilite du modele
            // ni le comparatif par marche - sauf pour UNE analyse, l'offre
            // d'appel du jour, designee ici cote serveur.
            //
            // La designation est faite par le pipeline (et non calculee dans le
            // navigateur) pour que le site, la page match et la fonction Edge
            // parlent tous du meme match. conf reste public : sans le marche,
            // c'est une amorce, pas le produit.
            var CHAMPS_PREMIUM=['pari_rec','cote_rec','model_probability','markets_compared'];
            // GARDE-FOU. Retirer ces champs du fichier public n'est sur QUE si la
            // table protegee peut reellement les recevoir. Sans la cle service
            // role, writePremiumData() n'ecrit rien : on se retrouverait avec des
            // analyses nulle part, et un abonne payant ne verrait plus aucun pari.
            // Dans ce cas on prefere ne rien retirer et le crier dans les logs :
            // une fuite connue vaut mieux qu'un produit casse pour les clients.
            var PEUT_PROTEGER=!!(SUPA_URL_PIPELINE&&SUPA_SERVICE_KEY);
            if(!PEUT_PROTEGER){
              console.log('  [ACCES] ATTENTION : SUPABASE_SERVICE_ROLE_KEY absente. Les champs premium ne peuvent pas etre persliste ailleurs, ils restent donc dans data.json public. A CORRIGER.');
            }
            (function designerMatchGratuit(){
              // Priorite absolue : si le moteur canonique (RUN_OUTPUT_ENGINE) a
              // reellement selectionne une SAFE_PICK_OF_THE_DAY ci-dessus, c'est
              // TOUJOURS elle l'analyse offerte du jour - jamais un pick legacy
              // non valide, meme avec une confiance affichee plus haute.
              var matchCanonique=allMatchsData.find(function(m){ return m && m.is_canonical_pick; });
              if(matchCanonique){
                allMatchsData.forEach(function(m){ if(m) m.is_free=(m===matchCanonique); });
                console.log('  [ACCES] analyse offerte du jour (SAFE_PICK_OF_THE_DAY canonique) : '+matchCanonique.id+' ('+(matchCanonique.home&&matchCanonique.home.n)+' vs '+(matchCanonique.away&&matchCanonique.away.n)+')');
                return;
              }
              var candidats=allMatchsData.filter(function(m){
                return m && m.pari_rec && !m.no_signal && (m.date||'').split(' ')[0]===TODAY;
              });
              if(!candidats.length){
                candidats=allMatchsData.filter(function(m){return m && m.pari_rec && !m.no_signal;});
              }
              var choisi=null;
              candidats.forEach(function(m){
                var c=Number(m.conf)||0;
                if(!choisi||c>(Number(choisi.conf)||0))choisi=m;
              });
              allMatchsData.forEach(function(m){ if(m) m.is_free=(choisi&&m.id===choisi.id); });
              console.log(choisi
                ? '  [ACCES] analyse offerte du jour : '+choisi.id+' ('+(choisi.home&&choisi.home.n)+' vs '+(choisi.away&&choisi.away.n)+')'
                : '  [ACCES] aucune analyse exploitable a offrir aujourd\'hui.');
            })();
            // Copie assainie pour le fichier public. allMatchsData reste complet :
            // l'historique, les pages match et les lignes premium en ont besoin.
            var matchsPublics=allMatchsData.map(function(m){
              if(!m||m.is_free||!PEUT_PROTEGER)return m;
              var copie={};
              Object.keys(m).forEach(function(k){ if(CHAMPS_PREMIUM.indexOf(k)===-1)copie[k]=m[k]; });
              // Le site doit pouvoir dire "une analyse existe sur ce match"
              // sans nommer le marche. Sans ce drapeau, une carte verrouillee
              // afficherait a tort "aucun marche prioritaire".
              copie.has_signal=!!(m.pari_rec&&!m.no_signal);
              return copie;
            });
            var retires=allMatchsData.length-matchsPublics.filter(function(m){return m&&m.pari_rec;}).length;
            console.log('  [ACCES] '+retires+' analyse(s) retiree(s) du data.json public.');
            // legacy_output : separation EXPLICITE demandee - matchsPublics
            // (l'ancienne analyse par match, marches shots/1ere-mi-temps inclus)
            // ne doit JAMAIS servir de source a SAFE/Top5/Combos ni a de futurs
            // premium picks canoniques. C'est deja le cas par construction
            // (RUN_OUTPUT_CANDIDATES vient exclusivement de allMarkets filtre
            // aux marches canoniques, jamais de matchObj/matchsPublics) ; ce
            // bloc rend cette separation visible dans la sortie elle-meme,
            // sans renommer/deplacer le champ `matchs` existant (deja lu par le
            // site en production - un renommage est un changement de contrat
            // frontend distinct, hors perimetre de ce branchement).
            var dataJsonPayload = {
              matchs: matchsPublics,
              legacy_output: { note: 'Alias explicite de `matchs` ci-dessus - ancien moteur (shots/shots-on-target/1ere-mi-temps inclus), jamais utilise comme source de run_output.', source_field: 'matchs' },
              run_output: {
                run_id: runOutput.run_id,
                snapshot: runOutput.snapshot_time,
                betting_validation_status: runOutput.betting_validation_status,
                safe_pick: runOutput.SAFE_PICK_OF_THE_DAY,
                top5_scorers: runOutput.TOP_5_SCORERS_OF_DAY,
                daily_combos: runOutput.DAILY_COMBOS,
                run_output_engine_version: RUN_OUTPUT_ENGINE_VERSION,
                canonical_registry_hash: CANONICAL_REGISTRY_HASH,
              },
            };
            fs.writeFileSync('data.json',JSON.stringify(dataJsonPayload,null,2));
            // OBSERVABILITE (fin de run) : memes valeurs meme quand elles sont
            // "vides" (NO_SAFE_SELECTION/0/0) - jamais omises, jamais un silence
            // qui masquerait un run degrade.
            console.log('SAFE_PICK_OF_THE_DAY='+(runOutput.SAFE_PICK_OF_THE_DAY.status==='SELECTED'?(runOutput.SAFE_PICK_OF_THE_DAY.league+'/'+runOutput.SAFE_PICK_OF_THE_DAY.selection):runOutput.SAFE_PICK_OF_THE_DAY.status));
            console.log('TOP_5_SCORERS_COUNT='+runOutput.TOP_5_SCORERS_OF_DAY.count_returned);
            console.log('DAILY_COMBOS_COUNT='+runOutput.DAILY_COMBOS.combos.filter(function(c){return c.status==='GENERATED';}).length);
            console.log('\n=== DONE: '+allMatchsData.length+' matchs total ===');
            await writePremiumData(premiumRows);
            await writeSnapshots(snapshotRows);
            await updateHistorique(allMatchsData);
            await updateTransferts(fixtures);
            await updateRumeurs();
            // Les pages match sont generees a partir de la copie ASSAINIE : sans
            // cela, le HTML d'un match payant embarquait le pari recommande en
            // clair dans PRELOADED_MATCH, sous le mur d'abonnement. Un abonne
            // recupere la version complete a l'execution via match-data.
            generateMatchPages(matchsPublics);
            generateSitemaps(allMatchsData);
            injectHomeSeoSummary(allMatchsData);
          }
          main().catch(function(e){console.error('FATAL:',e.message,e.stack);process.exit(1);});
          JSEOF
      - name: Signaler le mode de recalcul
        run: |
          echo "Les fixtures sont recalculees a chaque execution; les snapshots historiques restent conserves separement."
      - name: Verifier la couverture reelle des ligues de lancement (API-Football)
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: node scripts/verify-league-coverage.js

      - name: Sauvegarder un snapshot reel des cotes (historique API limite)
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/save-odds-snapshot.js

      - name: Run pipeline
        env:
          APISPORTS_KEY:      ${{ secrets.APISPORTS_KEY }}
          OPENWEATHER_KEY:    ${{ secrets.OPENWEATHER_KEY }}
          NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_KEY:      ${{ secrets.ANTHROPIC_KEY }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          ODDS_API_IO_KEY:    ${{ secrets.ODDS_API_IO_KEY }}
          CREATOMATE_KEY:     ${{ secrets.CREATOMATE_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_WC_ONLY:       ${{ github.event.inputs.test_wc_only }}
        run: node pipeline.js

      - name: Commit and push
        # Le pipeline tourne ~20 minutes. Un simple "git push" echoue des que
        # quiconque pousse sur main pendant ce temps (arrive le 02/09/2026 :
        # "! [rejected] main -> main (fetch first)", 20 minutes de calcul et
        # toutes les analyses du jour perdues).
        #
        # Strategie : les fichiers ci-dessous sont des SORTIES regenerees
        # integralement a chaque execution, jamais des sources editees a la
        # main. On peut donc, sans rien perdre, repartir de l'etat distant a
        # jour et y reposer les sorties fraiches. Pas de rebase, donc pas de
        # resolution de conflit hasardeuse : le code distant est conserve tel
        # quel, les donnees du jour sont celles qui viennent d'etre calculees.
        run: |
          set -euo pipefail
          OUTPUTS="data.json historique.json transferts.json actus.json sitemap.xml match index.html league-coverage-report.json"

          git config user.name "IASHARK"
          git config user.email "yaramode81@gmail.com"

          git add $OUTPUTS sitemap-*.xml
          if git diff --staged --quiet; then
            echo "Aucun changement a publier."
            exit 0
          fi

          SAVE="$(mktemp -d)"
          for f in $OUTPUTS; do
            [ -e "$f" ] && cp -R "$f" "$SAVE/"
          done
          cp sitemap-*.xml "$SAVE/" 2>/dev/null || true

          for attempt in 1 2 3 4 5; do
            git add $OUTPUTS sitemap-*.xml
            git diff --staged --quiet || git commit -m "Daily update - $(date +%Y-%m-%d)"

            if git push; then
              echo "Publie (tentative $attempt)."
              exit 0
            fi

            echo "Push refuse : main a avance pendant le pipeline. Rattrapage (tentative $attempt)..."
            git fetch origin main
            git reset --hard origin/main
            for f in $OUTPUTS; do
              rm -rf "$f"
              [ -e "$SAVE/$f" ] && cp -R "$SAVE/$f" .
            done
            cp "$SAVE"/sitemap-*.xml . 2>/dev/null || true
          done

          echo "Echec de publication apres 5 tentatives." >&2
          exit 1
