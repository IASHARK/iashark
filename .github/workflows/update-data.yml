          // ── HISTORIQUE ───────────────────────────────────────────
          async function updateHistorique(matchsData){
            console.log('\n=== HISTORIQUE UPDATE ===');
            var histoPath='historique.json';
            var histo={predictions:[],stats:{winrate:0,roi:0,total:0,streak:0,wins:0,losses:0},monthly:[],backtesting:{}};
            try{histo=JSON.parse(fs.readFileSync(histoPath,'utf8'));}catch(e){}

            var yesterday=new Date(TODAY+'T12:00:00Z');yesterday.setDate(yesterday.getDate()-1);
            var yDate=yesterday.toISOString().split('T')[0];

            // Fenêtre de résolution élargie à 4 jours en arrière (pas seulement
            // "hier") : un match bloqué en pending à cause d'un bug ponctuel
            // (ex: WC absent de l'endpoint générique) doit pouvoir être rattrapé
            // au run suivant, au lieu de rester pending indéfiniment.
            var resolveDates=[];
            for(var dback=1; dback<=4; dback++){
              var dd=new Date(TODAY+'T12:00:00Z'); dd.setDate(dd.getDate()-dback);
              resolveDates.push(dd.toISOString().split('T')[0]);
            }

            // Résolution football — championnats classiques + Coupe du Monde
            // 2026 explicitement (l'endpoint générique par date ne renvoie pas
            // systématiquement les matchs WC, il faut les fetch à part avec
            // league=1&season=2026 comme dans getFixtures()). On couvre les
            // 4 derniers jours pour rattraper les éventuels pending bloqués.
            try{
              var yResults=[];
              for(var rdi=0; rdi<resolveDates.length; rdi++){
                var rDate=resolveDates[rdi];
                var fClassic=await get('https://v3.football.api-sports.io/fixtures?date='+rDate+'&timezone=Europe/Paris',APS);
                var fWC=await get('https://v3.football.api-sports.io/fixtures?league=1&season=2026&date='+rDate+'&timezone=Europe/Paris',APS);
                yResults=yResults.concat(fClassic.response||[], fWC.response||[]);
                console.log('  Résultats '+rDate+': '+(fClassic.response||[]).length+' classique + '+(fWC.response||[]).length+' World Cup');
                await sleep(150);
              }
              for(var yr=0;yr<yResults.length;yr++){
                var fix=yResults[yr];
                var fid=fix.fixture&&fix.fixture.id;
                var homeN=fix.teams&&fix.teams.home&&fix.teams.home.name||'';
                var awayN=fix.teams&&fix.teams.away&&fix.teams.away.name||'';
                var gh=fix.goals&&fix.goals.home!=null?fix.goals.home:null;
                var ga=fix.goals&&fix.goals.away!=null?fix.goals.away:null;
                var status=fix.fixture&&fix.fixture.status&&fix.fixture.status.short||'';
                if(status!=='FT'&&status!=='AET'&&status!=='PEN')continue;
                if(gh===null||ga===null)continue;
                var found=histo.predictions.find(function(p){return (p.result==='scheduled'||p.result==='pending')&&p.fixture_id===fid;});
                if(!found)found=histo.predictions.find(function(p){return (p.result==='scheduled'||p.result==='pending')&&p.type==='single'&&p.sport!=='tennis'&&p.date&&resolveDates.indexOf(p.date.substring(0,10))!==-1&&levenshtein((p.home||'').toLowerCase(),homeN.toLowerCase())<=3&&levenshtein((p.away||'').toLowerCase(),awayN.toLowerCase())<=3;});
                if(!found)continue;
                var pred=(found.prediction||'').toLowerCase();
                var isWin=false;
                if(pred.includes('over 2.5'))isWin=(gh+ga)>2;
                else if(pred.includes('over 1.5'))isWin=(gh+ga)>1;
                else if(pred.includes('over 3.5'))isWin=(gh+ga)>3;
                else if(pred.includes('under 2.5'))isWin=(gh+ga)<3;
                else if(pred.includes('btts non'))isWin=(gh===0||ga===0);
                else if(pred.includes('btts'))isWin=(gh>0&&ga>0);
                else if(pred.includes('1x')||pred.includes('dc 1x'))isWin=(gh>=ga);
                else if(pred.includes('x2')||pred.includes('dc x2'))isWin=(ga>=gh);
                else if(pred.includes('nul')||pred.includes('draw'))isWin=(gh===ga);
                found.result=isWin?'win':'loss';found.score=gh+'-'+ga;found.fixture_id=fid;found.resolved_date=TODAY;
                console.log('  Résolu foot: '+found.match+' \u2192 '+found.result+' ('+gh+'-'+ga+')');
              }
            }catch(e){console.log('  Résultats hier erreur:',e.message);}

            // Résolution tennis — utilise past-matches car fixtures ne contient pas le winner
            // past-matches retourne match_winner = id du gagnant
            try{
              if(TENNIS_KEY){
                // Chercher les paris tennis pending d'hier
                var pendingTennis=histo.predictions.filter(function(p){
                  return (p.result==='scheduled'||p.result==='pending')&&p.sport==='tennis'&&p.date&&p.date.substring(0,10)===yDate;
                });
                console.log('  Paris tennis pending à résoudre: '+pendingTennis.length);

                if(pendingTennis.length>0){
                  // Pour chaque pari pending, chercher le résultat via past-matches d'un des joueurs
                  var resolvedIds={};
                  for(var pt=0;pt<pendingTennis.length;pt++){
                    var pending=pendingTennis[pt];
                    if(resolvedIds[pending.fixture_id]) continue;

                    // Extraire l'ID joueur depuis fixture_id (format t_12345)
                    var fxId=String(pending.fixture_id||'').replace('t_','');
                    var tour=(pending.league_key||'atp').toLowerCase().includes('wta')?'wta':'atp';

                    // Chercher via l'endpoint fixtures d'hier avec result
                    try {
                      var dayFixtures=await getArr(
                        TENNIS_BASE+'/tennis/v2/'+tour+'/fixtures/'+yDate+'?filter=PlayerGroup:singles&pageSize=50',
                        TENNIS_HEADERS
                      );
                      for(var df=0;df<dayFixtures.length;df++){
                        var fx=dayFixtures[df];
                        var fxMatchId='t_'+fx.id;
                        var p1n=fx.player1&&fx.player1.name||'';
                        var p2n=fx.player2&&fx.player2.name||'';
                        // Match par fixture_id ou par noms
                        var isMatch=fxMatchId===pending.fixture_id||
                          (p1n&&p2n&&pending.home&&pending.away&&
                           p1n.toLowerCase().includes(pending.home.split(' ').pop().toLowerCase().slice(0,4))&&
                           p2n.toLowerCase().includes(pending.away.split(' ').pop().toLowerCase().slice(0,4)));
                        if(!isMatch) continue;
                        // Vérifier si le match est terminé (result non vide)
                        if(!fx.result||fx.result==='') continue;
                        // Déterminer le gagnant depuis le score (sets)
                        // Format: "6-3 6-4" = player1 gagne, "3-6 4-6" = player2 gagne
                        var sets=fx.result.split(' ');
                        var p1sets=0,p2sets=0;
                        sets.forEach(function(s){
                          var parts=s.replace(/\([^)]*\)/g,'').split('-');
                          if(parts.length===2){
                            var a=parseInt(parts[0])||0,b=parseInt(parts[1])||0;
                            if(a>b)p1sets++;else if(b>a)p2sets++;
                          }
                        });
                        var winnerName=p1sets>p2sets?p1n:p2n;
                        var predLow=(pending.prediction||'').toLowerCase();
                        var winnerLow=winnerName.toLowerCase();
                        // Match si le nom du gagnant est dans la prédiction (4 premiers chars)
                        var isWinT=predLow.includes(winnerLow.slice(0,4))||
                                   predLow.includes(winnerLow.split(' ').pop().slice(0,4));
                        pending.result=isWinT?'win':'loss';
                        pending.score=winnerName+' W '+fx.result;
                        pending.resolved_date=yDate;
                        resolvedIds[pending.fixture_id]=true;
                        console.log('  Résolu tennis: '+pending.match+' → '+pending.result+' ('+winnerName+')');
                        break;
                      }
                    } catch(e2){ console.log('  Erreur résolution tennis match:', e2.message); }
                    await sleep(200);
                  }
                }
              }
            }catch(e){console.log('  Résultats tennis erreur:',e.message);}

            // Ajouter les nouveaux paris d'aujourd'hui avec le statut "scheduled"
            // (= match pas encore joué). Ce statut n'est JAMAIS affiché sur le
            // site (filtré côté génération de historique.html) — il sert
            // uniquement de mémoire interne pour pouvoir résoudre le pari une
            // fois le match terminé. Dès la résolution, le statut devient
            // 'win' ou 'loss' et l'entrée apparaît alors dans l'historique.
            for(var mi=0;mi<matchsData.length;mi++){
              var m=matchsData[mi];
              var alreadyExists=histo.predictions.find(function(p){return p.fixture_id===m.id||(p.home===m.home.n&&p.away===m.away.n&&p.date&&p.date.substring(0,10)===TODAY);});
              if(!alreadyExists&&m.pari_rec){
                var betLabel=m.pari_rec;
                var betCote=parseFloat(m.cote_rec)||null;
                var marketType='autre';
                if(betLabel){
                  var bl=betLabel.toLowerCase();
                  if(bl.includes('over 2.5'))marketType='over25';
                  else if(bl.includes('over 1.5'))marketType='over15';
                  else if(bl.includes('btts non'))marketType='btts_non';
                  else if(bl.includes('btts'))marketType='btts_oui';
                  else if(bl.includes('1x'))marketType='dc1x';
                  else if(bl.includes('x2'))marketType='dc_x2';
                  else if(m.sport==='tennis')marketType='match_winner';
                }
                var confBucket=m.conf>=8?'8+':m.conf>=7?'7-8':m.conf>=6?'6-7':'<6';
                histo.predictions.unshift({
                  match:m.home.n+' vs '+m.away.n,
                  home:m.home.n,away:m.away.n,
                  prediction:betLabel,cote:betCote,conf:m.conf,
                  conf_bucket:confBucket,
                  market:marketType,league:m.league||'',league_key:m.league_key||'',
                  sport:m.sport||'football',
                  elo_diff:m.elo_diff||null,has_pinnacle:!!(m.pinnacle_snapshot),has_elo:!!(m.elo_home),
                  date:TODAY,result:'scheduled',fixture_id:m.id,type:'single',score:null
                });
              }
            }

            histo.predictions=histo.predictions.slice(0,300);
            var beforeClean=histo.predictions.length;
            histo.predictions=histo.predictions.filter(function(p){return p.type!=='combi';});
            var cleaned=beforeClean-histo.predictions.length;
            if(cleaned>0)console.log('  Nettoyage: '+cleaned+' combinés supprimés');

            var singles=histo.predictions.filter(function(p){return p.type==='single'&&p.result!=='pending'&&p.result!=='scheduled';});
            var wins=singles.filter(function(p){return p.result==='win';});
            var total=singles.length;
            var winrate=total>0?(wins.length/total*100):0;
            var roiTotal=0;
            singles.forEach(function(p){var c=parseFloat(p.cote)||1.75;roiTotal+=p.result==='win'?(c-1):-1;});
            var roi=total>0?(roiTotal/total*100):0;
            var streak=0;
            for(var si=0;si<singles.length;si++){
              var isW=singles[si].result==='win';
              if(si===0)streak=isW?1:-1;
              else if(isW&&streak>0)streak++;
              else if(!isW&&streak<0)streak--;
              else break;
            }
            histo.stats={winrate:Math.round(winrate*10)/10,roi:Math.round(roi*10)/10,total,streak,wins:wins.length,losses:total-wins.length};

            function breakdown(field){
              var groups={};
              singles.forEach(function(p){
                var k=p[field]||'inconnu';
                if(!groups[k])groups[k]={wins:0,losses:0,roi:0};
                if(p.result==='win'){groups[k].wins++;groups[k].roi+=(parseFloat(p.cote)||1.75)-1;}
                else{groups[k].losses++;groups[k].roi-=1;}
              });
              return Object.keys(groups).sort().map(function(k){
                var g=groups[k];var tot=g.wins+g.losses;
                return{key:k,wins:g.wins,losses:g.losses,total:tot,winrate:tot>0?Math.round(g.wins/tot*1000)/10:0,roi:tot>0?Math.round(g.roi/tot*1000)/10:0};
              }).sort(function(a,b){return b.total-a.total;});
            }
            histo.backtesting={by_market:breakdown('market'),by_league:breakdown('league_key'),by_conf:breakdown('conf_bucket'),by_sport:breakdown('sport'),by_has_pinnacle:breakdown('has_pinnacle'),by_has_elo:breakdown('has_elo'),updated:TODAY};

            var mktStats=histo.backtesting.by_market;
            console.log('  === BACKTESTING INSIGHTS ===');
            mktStats.forEach(function(m){if(m.total>=5)console.log('  '+m.key+': '+m.winrate+'% winrate | ROI '+m.roi+'% | '+m.total+' paris');});

            var months={};
            singles.forEach(function(p){var key=(p.date||'').substring(0,7);if(!months[key])months[key]={wins:0,losses:0};if(p.result==='win')months[key].wins++;else months[key].losses++;});
            histo.monthly=Object.keys(months).sort().reverse().slice(0,6).map(function(k){
              var mo=months[k];var tot=mo.wins+mo.losses;var r=tot>0?((mo.wins*0.75-mo.losses)/tot*100):0;
              var parts=k.split('-');var mn=['Jan','F\u00e9v','Mar','Avr','Mai','Jun','Jul','Ao\u00fb','Sep','Oct','Nov','D\u00e9c'];
              return{month:k,label:(mn[parseInt(parts[1])-1]||parts[1])+' '+parts[0],wins:mo.wins,losses:mo.losses,total:tot,roi:Math.round(r*10)/10};
            });

            fs.writeFileSync(histoPath,JSON.stringify(histo,null,2));
            console.log('  Historique: '+total+' paris | Winrate: '+winrate.toFixed(0)+'% | ROI: '+roi.toFixed(1)+'%');
          }

          // ═══════════════════════════════════════════════════════
          // ── MAIN ────────────────────────────────────────────────
          // ═══════════════════════════════════════════════════════
          async function main(){
            console.log('=== IASHARK',TODAY,'===');

            // ── 1. FETCH TENNIS + RANKINGS EN PARALLÈLE avec le football ──
            var tennisFixturesPromise = Promise.resolve([]); // Tennis bloqué temporairement
            var footballFixturesPromise = getFixtures();
            // Fetch rankings ATP+WTA + OddsIO index en parallèle
            if(ODDS_IO_KEY) await loadOddsIOIndex();
            var rankingsPromise = Promise.all([
