            else if(icon==='Clouds') emoji='\u2601\ufe0f';
            return {emoji,temp:Math.round(r.main.temp)+'\u00b0C',desc:(r.weather&&r.weather[0]&&r.weather[0].description)||'',wind:Math.round((r.wind&&r.wind.speed)||0)+' km/h'};
