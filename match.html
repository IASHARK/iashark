<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analyse Match — IASHARK</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#060a10;--card:#0c1520;--card2:#101d2a;
  --cyan:#22d3ee;--cyan2:#06b6d4;--amber:#f59e0b;
  --green:#10b981;--red:#ef4444;--text:#e2e8f0;
  --muted:#4a6580;--muted2:#2a3f55;
  --border:rgba(255,255,255,0.05);--bc:rgba(34,211,238,0.18);
  --wc:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:80px;}

/* HEADER */
.hdr{position:sticky;top:0;z-index:99;background:rgba(6,10,16,0.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);height:50px;display:flex;align-items:center;padding:0 16px;gap:12px;}
.hdr-back{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--muted);border:1px solid var(--border);padding:5px 10px;border-radius:6px;background:none;cursor:pointer;transition:.15s;}
.hdr-back:hover{color:var(--cyan);border-color:var(--bc);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;text-decoration:none;color:var(--text);}
.logo span{color:var(--cyan);}
.hdr-pill{margin-left:auto;font-family:'Space Mono',monospace;font-size:7px;letter-spacing:2px;color:var(--cyan);border:1px solid var(--bc);padding:3px 8px;border-radius:20px;background:rgba(34,211,238,0.05);}

/* LAYOUT */
.wrap{max-width:660px;margin:16px auto 0;padding:0 14px;}
.card{border:1px solid var(--border);border-radius:18px;overflow:hidden;animation:up .4s ease forwards;}
.card.hot{border-color:rgba(245,158,11,0.2);}
.card.wc{border-color:rgba(245,158,11,0.25);}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.s{padding:0 18px 13px;}
.s.pt{padding-top:14px;}
.sep{height:1px;background:var(--border);margin:0 18px 13px;}
.stitle{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2px;margin-bottom:9px;display:flex;align-items:center;gap:5px;}
.stitle::after{content:'';flex:1;height:1px;background:var(--border);}

/* TOPBAR */
.topbar{background:linear-gradient(135deg,#090f1c,#0c1828);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap;}
.topbar.wc-bar{background:linear-gradient(135deg,#0f0c00,#1a1200);}
.lg-row{display:flex;align-items:center;gap:7px;}
.lg-name{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;}
.badges{display:flex;gap:5px;align-items:center;}
.badge{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:1.5px;padding:3px 9px;border-radius:20px;}
.badge.hot{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);color:var(--amber);}
.badge.val{background:rgba(34,211,238,0.06);border:1px solid var(--bc);color:var(--cyan);}
.badge.wc{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--amber);}
.badge.time{font-size:10px;letter-spacing:0;color:var(--text);padding:0;}

/* WC BANNER */
.wc-banner{background:linear-gradient(90deg,rgba(245,158,11,0.08),rgba(245,158,11,0.03));border-bottom:1px solid rgba(245,158,11,0.15);padding:8px 18px;display:flex;align-items:center;gap:10px;}
.wc-flag{font-size:18px;}
.wc-info{flex:1;}
.wc-title{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--amber);letter-spacing:2px;}
.wc-sub{font-family:'Space Mono',monospace;font-size:7px;color:rgba(245,158,11,0.5);margin-top:1px;}
.wc-group{font-family:'Space Mono',monospace;font-size:9px;color:var(--amber);border:1px solid rgba(245,158,11,0.2);padding:3px 8px;border-radius:4px;}

/* TEAMS */
.teams{padding:22px 18px 16px;background:linear-gradient(180deg,#090f1c,var(--card));}
.teams-row{display:grid;grid-template-columns:1fr 56px 1fr;align-items:center;gap:8px;margin-bottom:14px;}
.team{text-align:center;}
.team-logo{width:48px;height:48px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,0.03);margin:0 auto 7px;display:block;}
.team-logo-ph{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.04);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--muted);margin:0 auto 7px;}
.team-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(16px,4.5vw,26px);letter-spacing:1px;line-height:1;margin-bottom:3px;}
.team-sub{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);letter-spacing:1px;}
.team-form{display:flex;justify-content:center;gap:2px;margin-top:5px;}
.fd{width:14px;height:14px;border-radius:2px;font-size:6px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;}
.fw{background:rgba(16,185,129,0.18);color:var(--green);}
.fn{background:rgba(245,158,11,0.1);color:var(--amber);}
.fl{background:rgba(239,68,68,0.13);color:var(--red);}
.team.away .team-name{color:rgba(226,232,240,0.65);}
.vs-col{text-align:center;}
.vs{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--muted2);display:block;}
.vs-hr{font-family:'Space Mono',monospace;font-size:10px;color:var(--cyan);margin-top:2px;}
.pbar{display:flex;height:3px;border-radius:3px;overflow:hidden;margin-bottom:7px;}
.pb1{background:linear-gradient(90deg,var(--cyan2),var(--cyan));}
.pbn{background:rgba(255,255,255,0.07);}
.pb2{background:rgba(226,232,240,0.15);}
.plabels{display:flex;justify-content:space-between;}
.pi{text-align:center;}
.pi-pct{font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1;}
.pi-lbl{font-family:'Space Mono',monospace;font-size:6px;color:var(--muted);letter-spacing:1px;}

/* STADE */
.stade-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding:7px 10px;background:rgba(255,255,255,0.02);border-radius:7px;border:1px solid var(--border);}
.stade-icon{font-size:13px;}
.stade-name{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);}
.stade-meta{margin-left:auto;font-family:'Space Mono',monospace;font-size:7px;color:var(--muted2);}

/* PARIS RECOMMANDÉ */
.pari-main{background:linear-gradient(135deg,rgba(34,211,238,0.06),rgba(6,182,212,0.01));border:1px solid var(--bc);border-radius:13px;padding:16px;position:relative;overflow:hidden;}
.pari-main::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--cyan),transparent);}
.pm-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.pm-left{}
.pm-lbl{font-family:'Space Mono',monospace;font-size:7px;color:var(--cyan);letter-spacing:2px;margin-bottom:3px;}
.pm-bet{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--text);line-height:1;margin-bottom:3px;}
.pm-right{text-align:right;flex-shrink:0;}
.pm-cote{font-family:'Bebas Neue',sans-serif;font-size:46px;color:var(--cyan);line-height:1;}

/* JAUGE CONFIANCE */
.conf-block{background:rgba(255,255,255,0.02);border-radius:9px;padding:10px 12px;margin:10px 0;}
.conf-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.conf-score{font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;color:var(--cyan);}
.conf-score sup{font-size:16px;color:var(--muted);}
.conf-badge{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;padding:4px 10px;border-radius:20px;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);color:var(--amber);}
.conf-track{background:rgba(255,255,255,0.03);border-radius:5px;height:4px;overflow:hidden;}
.conf-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cyan2),var(--amber),#f97316);}
.conf-scale{display:flex;justify-content:space-between;margin-top:4px;}
.conf-scale span{font-family:'Space Mono',monospace;font-size:6px;color:var(--muted2);letter-spacing:1px;}

/* MARCHÉS — tableau edge */
.markets-table{display:flex;flex-direction:column;gap:5px;margin-top:10px;}
.mkt-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.02);border:1px solid var(--border);}
.mkt-row.best{background:rgba(34,211,238,0.04);border-color:var(--bc);}
.mkt-row.best2{background:rgba(16,185,129,0.03);border-color:rgba(16,185,129,0.15);}
.mkt-name{font-family:'Space Mono',monospace;font-size:8px;color:var(--text);flex:1;}
.mkt-cote{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--cyan);width:40px;text-align:right;}
.mkt-edge{font-family:'Space Mono',monospace;font-size:7px;padding:2px 6px;border-radius:4px;white-space:nowrap;}
.mkt-edge.pos{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);color:var(--green);}
.mkt-edge.zero{background:rgba(255,255,255,0.02);border:1px solid var(--border);color:var(--muted);}
.mkt-best-tag{font-family:'Space Mono',monospace;font-size:6px;color:var(--cyan);letter-spacing:1px;}
.pm-warn{margin-top:8px;font-family:'Space Mono',monospace;font-size:7px;color:var(--amber);}

/* FACTEUR IA */
.facteur{background:rgba(245,158,11,0.03);border:1px solid rgba(245,158,11,0.12);border-radius:10px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;}
.fact-icon{font-size:18px;flex-shrink:0;}
.fact-lbl{font-family:'Space Mono',monospace;font-size:7px;color:var(--amber);letter-spacing:2px;margin-bottom:3px;}
.fact-txt{font-size:12px;color:var(--text);line-height:1.5;}

/* VERDICT */
.verdict-block{background:rgba(255,255,255,0.015);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.verdict-badge{font-family:'Space Mono',monospace;font-size:7px;color:var(--cyan);letter-spacing:2px;margin-bottom:6px;}
.verdict-title{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--text);margin-bottom:5px;line-height:1.3;}
.verdict-body{font-size:12px;color:#94a3b8;line-height:1.65;}

/* WC MODEL */
.wc-model{background:linear-gradient(135deg,rgba(245,158,11,0.05),rgba(245,158,11,0.01));border:1px solid rgba(245,158,11,0.15);border-radius:13px;padding:14px;}
.wc-model-title{font-family:'Space Mono',monospace;font-size:7px;color:var(--amber);letter-spacing:2px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.wc-model-title::after{content:'';flex:1;height:1px;background:rgba(245,158,11,0.15);}
.wc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.wc-team-col{}
.wc-team-lbl{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:1px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(245,158,11,0.1);}
.wc-stat{display:flex;justify-content:space-between;align-items:center;padding:4px 0;}
.wc-stat-lbl{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);}
.wc-stat-val{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--amber);}
.wc-alert{background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.15);border-radius:6px;padding:6px 10px;font-family:'Space Mono',monospace;font-size:7px;color:var(--red);margin-top:8px;}
.wc-fatigue-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:rgba(255,255,255,0.02);border-radius:7px;}
.wc-fat-lbl{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);flex:1;}
.wc-fat-bar{flex:1;height:4px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden;}
.wc-fat-fill{height:100%;border-radius:2px;}
.wc-fat-val{font-family:'Space Mono',monospace;font-size:7px;width:30px;text-align:right;}

/* H2H */
.h2h-list{display:flex;flex-direction:column;gap:5px;}
.h2h-row{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:7px 10px;background:var(--card2);border-radius:7px;border:1px solid var(--border);}
.h2h-team{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);}
.h2h-team.win{color:var(--text);}
.h2h-score{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--text);text-align:center;}
.h2h-date{font-family:'Space Mono',monospace;font-size:6px;color:var(--muted2);}
.h2h-summary{display:flex;gap:10px;margin-bottom:8px;}
.h2h-sum-item{flex:1;text-align:center;padding:8px;background:var(--card2);border-radius:7px;border:1px solid var(--border);}
.h2h-sum-n{font-family:'Bebas Neue',sans-serif;font-size:22px;}
.h2h-sum-l{font-family:'Space Mono',monospace;font-size:6px;color:var(--muted);}

/* ELO */
.elo-block{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.elo-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.elo-team{flex:1;}
.elo-name{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);margin-bottom:2px;}
.elo-val{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;}
.elo-bar-wrap{flex:2;}
.elo-bar{height:6px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden;position:relative;}
.elo-fill-h{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--cyan2),var(--cyan));border-radius:3px;}
.elo-fill-a{position:absolute;right:0;top:0;height:100%;background:rgba(255,255,255,0.15);border-radius:3px;}
.elo-signal{font-family:'Space Mono',monospace;font-size:8px;text-align:center;margin-top:6px;}

/* DROPPING ODDS */
.drop-block{background:rgba(239,68,68,0.04);border:1px solid rgba(239,68,68,0.15);border-radius:10px;padding:11px 13px;}
.drop-title{font-family:'Space Mono',monospace;font-size:7px;color:var(--red);letter-spacing:2px;margin-bottom:8px;}
.drop-row{display:flex;align-items:center;gap:8px;padding:5px 0;}
.drop-team{font-family:'Space Mono',monospace;font-size:8px;color:var(--text);flex:1;}
.drop-arrow{font-size:12px;}
.drop-cotes{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);}
.drop-pct{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--red);}

/* ARBITRE */
.arb-block{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.arb-stat{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;}
.arb-n{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--amber);}
.arb-l{font-family:'Space Mono',monospace;font-size:6px;color:var(--muted);margin-top:2px;}

/* SURFACE TENNIS */
.surf-block{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.surf-col{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;}
.surf-lbl{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:1px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.surf-stat{display:flex;justify-content:space-between;align-items:center;padding:3px 0;}
.surf-stat-l{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);}
.surf-stat-v{font-family:'Bebas Neue',sans-serif;font-size:16px;}

/* TENNIS H2H */
.th2h-row{display:flex;justify-content:center;gap:20px;padding:12px;background:var(--card2);border-radius:9px;border:1px solid var(--border);}
.th2h-item{text-align:center;}
.th2h-n{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;}
.th2h-l{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);}

/* PALMARÈS TOURNOI */
.tourec-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.tourec-col{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.tourec-name{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:1px;margin-bottom:6px;color:var(--muted);}
.tourec-stat{display:flex;justify-content:space-between;align-items:center;padding:2px 0;}
.tourec-l{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted2);}
.tourec-v{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--text);}
.tourec-best{font-family:'Space Mono',monospace;font-size:7px;color:var(--cyan);margin-top:4px;}

/* COMP */
.comp{display:grid;grid-template-columns:1fr 1fr;background:var(--border);border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.comp-c{background:var(--card2);padding:12px;}
.comp-c:first-child{border-right:1px solid var(--border);}
.comp-lbl{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:1px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.crit{display:flex;flex-direction:column;gap:8px;}
.cr{display:flex;flex-direction:column;gap:3px;}
.cr-top{display:flex;justify-content:space-between;}
.cr-lbl{font-family:'Space Mono',monospace;font-size:6px;color:var(--muted);letter-spacing:1px;}
.cr-val{font-family:'Space Mono',monospace;font-size:8px;}
.cr-bar{height:2px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden;}
.cr-fill{height:100%;border-radius:2px;transition:width 1.2s ease;}
.cr-fill.hi{background:linear-gradient(90deg,var(--cyan2),var(--cyan));}
.cr-fill.mid{background:linear-gradient(90deg,#d97706,var(--amber));}
.cr-fill.lo{background:linear-gradient(90deg,#dc2626,var(--red));}

/* PATTERNS — graphique buts */
.pat-double-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pat-double-col{}
.pat-col-hdr{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.pat-legend{display:flex;gap:8px;}
.pat-leg{font-family:'Space Mono',monospace;font-size:6px;letter-spacing:0.5px;opacity:0.7;}
.pat-leg-blue{color:var(--cyan);}
.pat-leg-red{color:#ef4444;}
.pat-double-row{display:flex;align-items:flex-start;gap:6px;padding:3px 0;}
.pat-slot-lbl{font-family:'Space Mono',monospace;font-size:7px;color:var(--muted);width:32px;flex-shrink:0;padding-top:3px;}
.pat-bars{flex:1;display:flex;flex-direction:column;gap:3px;}
.pat-bar-row{display:flex;align-items:center;gap:5px;}
.pat-bar-track{flex:1;height:5px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden;}
.pat-bar-fill{height:100%;border-radius:3px;transition:width .8s ease;}
.pf-blue{background:linear-gradient(90deg,rgba(34,211,238,0.5),rgba(34,211,238,0.9));}
.pf-red{background:linear-gradient(90deg,rgba(239,68,68,0.4),rgba(239,68,68,0.8));}
.pat-bar-val{font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--text);line-height:1;width:24px;text-align:right;flex-shrink:0;}
.pat-bar-unit{font-family:'Space Mono',monospace;font-size:6px;color:var(--muted);}
.pat-comment{background:rgba(34,211,238,0.04);border:1px solid rgba(34,211,238,0.1);border-radius:9px;padding:11px 13px;margin-top:12px;font-size:12px;color:#94a3b8;line-height:1.7;}
.pat-comment strong{color:var(--text);}
.pat-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
.pat-stat-row{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;}
.pat-stat-lbl{font-size:12px;color:var(--muted);}
.pat-stat-vals{display:flex;align-items:center;gap:8px;}
.psv{text-align:center;}
.psv-n{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;}
.psv-n.h{color:var(--cyan);}

</nav>
<script>
var fId=new URLSearchParams(location.search).get('id');
var isPro=true;

// ── UTILS ────────────────────────────────────────────────
function ph(n){return n?n.slice(0,2).toUpperCase():'??';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function forme(str){
  if(!str)return '';
  return str.split('').slice(0,5).map(function(c){
    var cls=c==='W'||c==='V'?'fw':c==='D'||c==='N'?'fn':'fl';
    var l=c==='W'?'V':c==='D'?'N':c==='L'?'D':c;
    return '<div class="fd '+cls+'">'+l+'</div>';
  }).join('');
}
function lgImg(team,ini){
  if(!team)return '';
  var url=team.logo||(team.id?'https://media.api-sports.io/football/teams/'+team.id+'.png':'');
  if(!url)return '<div class="team-logo-ph">'+ini+'</div>';
  return '<img class="team-logo" src="'+url+'" onerror="this.outerHTML=\'<div class=team-logo-ph>'+ini+'</div>\'">';
}
function fmtEdge(e){
  if(e===null||e===undefined)return '<span class="mkt-edge zero">—</span>';
  var n=parseFloat(e);
  if(n>0)return '<span class="mkt-edge pos">+'+n.toFixed(1)+'%</span>';
  return '<span class="mkt-edge zero">'+n.toFixed(1)+'%</span>';
}

// ── MARCHÉS avec edge ────────────────────────────────────
function buildMarkets(m,isPariRec){
  var mkts=[];
  function edge(prob,cote){
    if(!prob||!cote||cote==='--')return null;
    var c=parseFloat(cote);
    if(c<1.01||c>20)return null;
    return prob/100-1/c;
  }
  var p1=m.p1||0,pn=m.pn||0,p2=m.p2||0;
  var p1x=p1+pn, px2=p2+pn;

  // Probabilités Over/Under depuis Poisson si disponible
  var po25=m.po25||0, pbtts=m.btts||0, pu25=100-po25;

  if(m.co25&&m.co25!=='--') mkts.push({name:'Over 2.5',cote:m.co25,edge:edge(po25||55,m.co25)});
  if(m.cu25&&m.cu25!=='--') mkts.push({name:'Under 2.5',cote:m.cu25,edge:edge(pu25||45,m.cu25)});
  if(m.btts_oui&&m.btts_oui!=='--') mkts.push({name:'BTTS Oui',cote:m.btts_oui,edge:edge(pbtts||45,m.btts_oui)});
  if(m.btts_non&&m.btts_non!=='--') mkts.push({name:'BTTS Non',cote:m.btts_non,edge:edge(100-pbtts||55,m.btts_non)});
  if(m.dc1x&&m.dc1x!=='--') mkts.push({name:'DC 1X',cote:m.dc1x,edge:edge(p1x,m.dc1x)});
  if(m.dc2x&&m.dc2x!=='--') mkts.push({name:'DC X2',cote:m.dc2x,edge:edge(px2,m.dc2x)});

  if(!mkts.length)return '';
  mkts.sort(function(a,b){return (b.edge||0)-(a.edge||0);});

  var rows=mkts.map(function(mk,i){
    var cls=i===0&&mk.edge>0?'best':i===1&&mk.edge>0?'best2':'';
    var isRec=isPariRec&&mk.name.toLowerCase()===isPariRec.toLowerCase();
    return '<div class="mkt-row '+cls+'">'
      +'<span class="mkt-name">'+(isRec?'★ ':'')+mk.name+'</span>'
      +'<span class="mkt-cote">'+mk.cote+'</span>'
      +fmtEdge(mk.edge!==null?mk.edge*100:null)
      +'</div>';
  }).join('');

  return '<div class="markets-table">'+rows+'</div>';
}

// ── COMP ─────────────────────────────────────────────────
function buildComp(hn,an,ch,ca){
  var def=[{label:'ATTAQUE',val:55},{label:'DÉFENSE',val:50},{label:'FORME',val:60},{label:'PRESSING',val:55}];
  var dh=ch&&ch.length?ch:def;
  var da=ca&&ca.length?ca:def;
  function rows(crits){
    return crits.map(function(c){
      var w=Math.min(Math.max(c.val||0,0),100);
      var cls=w>=65?'hi':w>=40?'mid':'lo';
      var col=w>=65?'var(--green)':w>=40?'var(--amber)':'var(--red)';
      return '<div class="cr"><div class="cr-top"><span class="cr-lbl">'+(c.label||'')+'</span><span class="cr-val" style="color:'+col+'">'+w+'</span></div><div class="cr-bar"><div class="cr-fill '+cls+'" data-w="'+w+'" style="width:0%"></div></div></div>';
    }).join('');
  }
  return '<div class="comp">'
    +'<div class="comp-c"><div class="comp-lbl" style="color:var(--cyan)">'+hn.toUpperCase().slice(0,13)+'</div><div class="crit">'+rows(dh)+'</div></div>'
    +'<div class="comp-c"><div class="comp-lbl" style="color:var(--text)">'+an.toUpperCase().slice(0,13)+'</div><div class="crit">'+rows(da)+'</div></div>'
    +'</div>';
}

// ── PATTERNS graphique buts (20 matchs) ──────────────────
function buildPatterns(hn,an,evH,evA,m){
  if(!evH&&!evA&&!m)return '';
  var hn3=hn.slice(0,3).toUpperCase(),an3=an.slice(0,3).toUpperCase();
  var gamesH=(evH&&evH.games)||20, gamesA=(evA&&evA.games)||20;

  // Stats xG
  function statRow(lbl,nh,na){
    if(!nh&&!na)return '';
    return '<div class="pat-stat-row"><span class="pat-stat-lbl">'+lbl+'</span>'
      +'<div class="pat-stat-vals">'
      +'<div class="psv"><div class="psv-n h">'+(nh||'—')+'</div><div class="psv-t">'+hn3+'</div></div>'
      +'<span class="pat-sep">/</span>'
      +'<div class="psv"><div class="psv-n a">'+(na||'—')+'</div><div class="psv-t">'+an3+'</div></div>'
      +'</div></div>';
  }
  var statsHtml='<div class="pat-stats-grid">'
    +statRow('xG moy/match',m&&m.xgH_avg,m&&m.xgA_avg)
    +statRow('Tirs cadrés/match',m&&m.xgH_shots,m&&m.xgA_shots)
    +statRow('Tirs totaux/match',m&&m.xgH_shots_total,m&&m.xgA_shots_total)
    +statRow('Fautes/match',m&&m.xgH_fouls,m&&m.xgA_fouls)
    +'</div>';

  var slotsH=evH&&evH.slots||[];
  var slotsA=evA&&evA.slots||[];
  if(!slotsH.length&&!slotsA.length)return '<div class="s"><div class="stitle">PATTERNS — 20 DERNIERS MATCHS</div>'+statsHtml+'</div><div class="sep"></div>';

  var allNs=slotsH.concat(slotsA).map(function(s){return parseInt(s.n)||0;});
  var maxN=Math.max.apply(null,allNs.concat([1]));

  function doubleRow(slotM,slotC,games){
    var nm=parseInt(slotM&&slotM.n)||0;
    var nc=parseInt(slotC&&slotC.n)||0;
    var pctM=Math.round((nm/maxN)*100);
    var pctC=Math.round((nc/maxN)*100);
    return '<div class="pat-double-row">'
      +'<div class="pat-slot-lbl">'+(slotM?slotM.t:'—')+'</div>'
      +'<div class="pat-bars">'
      +'<div class="pat-bar-row"><div class="pat-bar-track"><div class="pat-bar-fill pf-blue" style="width:'+pctM+'%"></div></div><div class="pat-bar-val">'+nm+'<span class="pat-bar-unit">/'+games+'</span></div></div>'
      +'<div class="pat-bar-row"><div class="pat-bar-track"><div class="pat-bar-fill pf-red" style="width:'+pctC+'%"></div></div><div class="pat-bar-val">'+nc+'<span class="pat-bar-unit">/'+games+'</span></div></div>'
      +'</div></div>';
  }

  var s6=[{t:'0-15',n:0},{t:'15-30',n:0},{t:'30-45',n:0},{t:'45-60',n:0},{t:'60-75',n:0},{t:'75-90',n:0}];
  function fillSlots(arr){return s6.map(function(d,i){return arr[i]||d;});}
  var sh=fillSlots(slotsH),sa=fillSlots(slotsA);
  var sch=evH&&evH.slots_conceded?fillSlots(evH.slots_conceded):s6;
  var sca=evA&&evA.slots_conceded?fillSlots(evA.slots_conceded):s6;

  function topSlot(slots){var b=null,bv=-1;(slots||[]).forEach(function(s){var n=parseInt(s.n)||0;if(n>bv){bv=n;b=s;}});return b;}
  var tH=topSlot(slotsH),tA=topSlot(slotsA);
  var lines=[];
  if(tH&&parseInt(tH.n)>0) lines.push('<strong>'+hn+'</strong> marque surtout <strong>'+tH.t+'</strong> ('+tH.n+'/'+gamesH+' matchs).');
  if(tA&&parseInt(tA.n)>0) lines.push('<strong>'+an+'</strong> le plus dangereux <strong>'+tA.t+'</strong> ('+tA.n+'/'+gamesA+' matchs).');

  var chartHtml='<div class="pat-double-wrap">'
    +'<div class="pat-double-col"><div class="pat-col-hdr"><span style="color:var(--cyan)">'+hn.slice(0,12).toUpperCase()+'</span><div class="pat-legend"><span class="pat-leg pat-leg-blue">⚽ Marqués</span><span class="pat-leg pat-leg-red">🛡 Encaissés</span></div></div>'+sh.map(function(s,i){return doubleRow(s,sch[i],gamesH);}).join('')+'</div>'
    +'<div class="pat-double-col"><div class="pat-col-hdr"><span>'+an.slice(0,12).toUpperCase()+'</span><div class="pat-legend"><span class="pat-leg pat-leg-blue">⚽ Marqués</span><span class="pat-leg pat-leg-red">🛡 Encaissés</span></div></div>'+sa.map(function(s,i){return doubleRow(s,sca[i],gamesA);}).join('')+'</div>'
    +'</div>';

  return '<div class="s"><div class="stitle">PATTERNS — 20 DERNIERS MATCHS</div>'
    +statsHtml
    +(lines.length?'<div class="pat-comment">'+lines.join(' ')+'</div>':'')
    +chartHtml
    +'</div><div class="sep"></div>';
}

// ── H2H ──────────────────────────────────────────────────
function buildH2H(hn,an,h2h,homeId){
  if(!h2h||!h2h.length)return '';
  var w1=0,wN=0,w2=0;
  h2h.forEach(function(g){
    var r=g.w||'N';
    if(r==='1')w1++;else if(r==='2')w2++;else wN++;
  });
  var rows=h2h.slice(0,5).map(function(g){
    var isHome=g.home&&g.home.toLowerCase().includes(hn.toLowerCase().slice(0,4));
    var hw=g.w==='1'?'win':'',aw=g.w==='2'?'win':'';
    return '<div class="h2h-row">'
      +'<span class="h2h-team '+(g.w==='1'?'win':'')+'">'+esc(g.home||'')+'</span>'
      +'<span class="h2h-score">'+esc(g.s||'?-?')+'</span>'
      +'<span class="h2h-team '+(g.w==='2'?'win':'')+'">'+esc(g.away||'')+'</span>'
      +'</div>';
  }).join('');
  return '<div class="s"><div class="stitle">HEAD TO HEAD</div>'
    +'<div class="h2h-summary">'
    +'<div class="h2h-sum-item"><div class="h2h-sum-n" style="color:var(--cyan)">'+w1+'</div><div class="h2h-sum-l">'+hn.slice(0,8).toUpperCase()+'</div></div>'
    +'<div class="h2h-sum-item"><div class="h2h-sum-n" style="color:var(--muted)">'+wN+'</div><div class="h2h-sum-l">NULS</div></div>'
    +'<div class="h2h-sum-item"><div class="h2h-sum-n" style="color:rgba(226,232,240,0.4)">'+w2+'</div><div class="h2h-sum-l">'+an.slice(0,8).toUpperCase()+'</div></div>'
    +'</div>'
    +'<div class="h2h-list">'+rows+'</div>'
    +'</div><div class="sep"></div>';
}

// ── ELO ──────────────────────────────────────────────────
function buildElo(hn,an,eloH,eloA,eloSignal){
  if(!eloH&&!eloA)return '';
  var maxElo=Math.max(eloH||0,eloA||0);
  var wH=eloH?Math.round((eloH/maxElo)*100):0;
  var wA=eloA?Math.round((eloA/maxElo)*100):0;
  var sigColor=eloSignal==='FORT'?'var(--red)':eloSignal==='MODÉRÉ'?'var(--amber)':'var(--muted)';
  return '<div class="s"><div class="stitle">ELO RATING</div>'
    +'<div class="elo-block">'
    +'<div class="elo-row">'
    +'<div class="elo-team"><div class="elo-name">'+hn.toUpperCase().slice(0,12)+'</div><div class="elo-val" style="color:var(--cyan)">'+(eloH?Math.round(eloH):'—')+'</div></div>'
    +'<div class="elo-bar-wrap"><div class="elo-bar"><div class="elo-fill-h" style="width:'+wH+'%"></div><div class="elo-fill-a" style="width:'+(100-wH)+'%"></div></div></div>'
    +'<div class="elo-team" style="text-align:right"><div class="elo-name">'+an.toUpperCase().slice(0,12)+'</div><div class="elo-val">'+(eloA?Math.round(eloA):'—')+'</div></div>'
    +'</div>'
    +(eloSignal?'<div class="elo-signal" style="color:'+sigColor+'">SIGNAL '+eloSignal+'</div>':'')
    +'</div></div><div class="sep"></div>';
}

// ── DROPPING ODDS ─────────────────────────────────────────
function buildDropping(drops){
  if(!drops||!drops.length)return '';
  var rows=drops.map(function(d){
    var arrow=d.dir==='baisse'?'📉':'📈';
    return '<div class="drop-row">'
      +'<span class="drop-team">'+esc(d.team)+'</span>'
      +'<span class="drop-arrow">'+arrow+'</span>'

// ── WC MODEL ──────────────────────────────────────────────
function buildWCModel(m){

  var wcp=m.wc_probs, wcm=m.wc_markets;
  if(!wcp)return '';

  var fatH=wcp.fatigueH||0, fatA=wcp.fatigueA||0;
  var fatColH=fatH>60?'#ef4444':fatH>40?'var(--amber)':'var(--green)';
  var fatColA=fatA>60?'#ef4444':fatA>40?'var(--amber)':'var(--green)';

  var altH=wcp.altMalusH||0, altA=wcp.altMalusA||0;

  return '<div class="s"><div class="stitle">MODÈLE IA SHARK — CM 2026</div>'
    +'<div class="wc-model">'
    +'<div class="wc-model-title">SIGNAUX COUPE DU MONDE</div>'
    +'<div class="wc-grid">'
    +'<div class="wc-team-col">'
    +'<div class="wc-team-lbl" style="color:var(--cyan)">'+esc(m.home.n||'').toUpperCase()+'</div>'
    +(wcp.scoreH?'<div class="wc-stat"><span class="wc-stat-lbl">Score modèle</span><span class="wc-stat-val">'+wcp.scoreH.total+'/100</span></div>':'')
    +(wcm?'<div class="wc-stat"><span class="wc-stat-lbl">Valeur attaque</span><span class="wc-stat-val">'+wcm.val_att_h+'M€</span></div>':'')
    +(wcm?'<div class="wc-stat"><span class="wc-stat-lbl">Valeur défense</span><span class="wc-stat-val">'+wcm.val_def_h+'M€</span></div>':'')
    +(wcp.scoreH?'<div class="wc-stat"><span class="wc-stat-lbl">xG qualifs</span><span class="wc-stat-val">+'+wcp.scoreH.details.xg_for+' / -'+wcp.scoreH.details.xg_against+'</span></div>':'')
    +'</div>'
    +'<div class="wc-team-col">'
    +'<div class="wc-team-lbl" style="color:var(--text)">'+esc(m.away.n||'').toUpperCase()+'</div>'
    +(wcp.scoreA?'<div class="wc-stat"><span class="wc-stat-lbl">Score modèle</span><span class="wc-stat-val">'+wcp.scoreA.total+'/100</span></div>':'')
    +(wcm?'<div class="wc-stat"><span class="wc-stat-lbl">Valeur attaque</span><span class="wc-stat-val">'+wcm.val_att_a+'M€</span></div>':'')
    +(wcm?'<div class="wc-stat"><span class="wc-stat-lbl">Valeur défense</span><span class="wc-stat-val">'+wcm.val_def_a+'M€</span></div>':'')
    +(wcp.scoreA?'<div class="wc-stat"><span class="wc-stat-lbl">xG qualifs</span><span class="wc-stat-val">+'+wcp.scoreA.details.xg_for+' / -'+wcp.scoreA.details.xg_against+'</span></div>':'')
    +'</div>'
    +'</div>'
    // Fatigue
    +'<div class="wc-fatigue-row">'
    +'<span class="wc-fat-lbl">✈ '+esc(m.home.n||'').slice(0,10)+' fatigue</span>'
    +'<div class="wc-fat-bar"><div class="wc-fat-fill" style="width:'+fatH+'%;background:'+fatColH+'"></div></div>'
    +'<span class="wc-fat-val" style="color:'+fatColH+'">'+fatH+'</span>'
    +'</div>'
    +'<div class="wc-fatigue-row">'
    +'<span class="wc-fat-lbl">✈ '+esc(m.away.n||'').slice(0,10)+' fatigue</span>'
    +'<div class="wc-fat-bar"><div class="wc-fat-fill" style="width:'+fatA+'%;background:'+fatColA+'"></div></div>'
    +'<span class="wc-fat-val" style="color:'+fatColA+'">'+fatA+'</span>'
    +'</div>'
    +(altH>0?'<div class="wc-alert">⛰ Malus altitude '+esc(m.home.n||'')+': -'+altH+'% (stade >1500m)</div>':'')
    +(altA>0?'<div class="wc-alert">⛰ Malus altitude '+esc(m.away.n||'')+': -'+altA+'% (stade >1500m)</div>':'')
    +'</div></div><div class="sep"></div>';
}

// ── SCÉNARIO ─────────────────────────────────────────────
function buildScen(m){
  var sc15=m.scenario_15min||null;
  var phases=[];
  if(sc15&&sc15.length)phases=sc15;
  else if(m.scenario){
    if(m.scenario.phase1)phases.push({t:"0-30'",prob:10,txt:m.scenario.phase1});
    if(m.scenario.phase2)phases.push({t:"30-65'",prob:16,txt:m.scenario.phase2});
    if(m.scenario.phase3)phases.push({t:"65-90'",prob:14,txt:m.scenario.phase3});
  }
  if(!phases.length)return '';
  var list=phases.map(function(p,i){
    var w=Math.min((p.prob||0)*4,100);
    var last=i===phases.length-1;
    return '<div class="scen-phase">'
      +'<div class="scen-l"><div class="scen-badge">'+(p.t||'')+'</div>'+(!last?'<div class="scen-line"></div>':'')+'</div>'
      +'<div class="scen-body"><div class="scen-bar-row"><div class="scen-bar"><div class="scen-bar-fill" style="width:'+w+'%"></div></div><span class="scen-pct">'+(p.prob||0)+'%</span></div><div class="scen-txt">'+(p.txt||'')+'</div></div>'
      +'</div>';
  }).join('');
  return '<div class="s"><div class="stitle">SCÉNARIO ATTENDU</div><div class="scen-list">'+list+'</div></div><div class="sep"></div>';
}

// ── BUTEURS ───────────────────────────────────────────────
function buildPlayers(hn,an,scH,scA){
  var hasH=scH&&scH.length,hasA=scA&&scA.length;
  if(!hasH&&!hasA)return '';
  function pcard(p){
    var photo=p.photo?'<img class="p-photo" src="'+p.photo+'" onerror="this.outerHTML=\'<div class=p-photo-ph>'+ph(p.name)+'</div>\'">':'<div class="p-photo-ph">'+ph(p.name)+'</div>';
    return '<div class="pcard">'+photo+'<div class="pmain"><div class="pname">'+esc(p.name)+'</div>'
      +'<div class="pstats">'
      +'<div class="pstat goals"><div class="pstat-n">'+(p.goals||0)+'</div><div class="pstat-l">Buts</div></div>'
      +'<div class="pstat assists"><div class="pstat-n">'+(p.assists||0)+'</div><div class="pstat-l">PD</div></div>'
      +'<div class="pstat shots"><div class="pstat-n">'+(p.shots_on||0)+'</div><div class="pstat-l">Tirs cadrés</div></div>'
      +'<div class="pstat games"><div class="pstat-n">'+(p.games||0)+'</div><div class="pstat-l">Matchs</div></div>'
      +'</div></div></div>';
  }
  return '<div class="s"><div class="stitle">BUTEURS CLÉS</div>'
    +(hasH?'<div class="team-sec-lbl h">'+hn.toUpperCase().slice(0,14)+'</div><div class="players">'+scH.map(pcard).join('')+'</div>':'')
    +(hasA?'<div class="team-sec-lbl a" style="margin-top:'+(hasH?'10px':'0')+'">'+an.toUpperCase().slice(0,14)+'</div><div class="players">'+scA.map(pcard).join('')+'</div>':'')
    +'</div><div class="sep"></div>';
}

// ── SURFACE TENNIS ────────────────────────────────────────
function buildSurface(hn,an,s1,s2,surface){
  if(!s1&&!s2)return '';
  var surfLabel=surface==='clay'?'Terre battue':surface==='grass'?'Gazon':'Dur';
  function col(tr){
    if(!tr)return '<div class="surf-stat-l">N/A</div>';
    return '<div class="wc-stat"><span class="wc-stat-lbl">Winrate</span><span class="wc-stat-val" style="color:var(--cyan)">'+tr.winrate+'%</span></div>'
      +'<div class="wc-stat"><span class="wc-stat-lbl">Bilan</span><span class="wc-stat-val">'+tr.wins+'V/'+tr.losses+'D</span></div>';

  return '<div class="s"><div class="stitle">SURFACE — '+surfLabel.toUpperCase()+'</div>'

    +'<div class="surf-col"><div class="surf-lbl">'+an.toUpperCase().slice(0,14)+'</div>'+col(s2)+'</div>'

function buildTourRecord(hn,an,tr1,tr2){

// ── RENDER PRINCIPAL ──────────────────────────────────────
function render(m){
  var hn=m.home&&m.home.n||'',an=m.away&&m.away.n||'';
  var heure=(m.date||'').split(' ')[1]||'';
  var isHot=m.hot||(m.conf||0)>=8, isVal=m.val||m.vbet==='OUI';
  var isWC=m.league_key==='wc'||m.sport==='football'&&m.wc_probs;
  var isTennis=m.sport==='tennis';
  var confPct=Math.round(((m.conf||0)/10)*100);
  var confLvl=(m.conf||0)>=7.5?'SHARK LOCK':(m.conf||0)>=6.5?'ELEVE':'MODERE';
  var pariRec=m.pari_rec||'', paricote=m.cote_rec||'—';

  document.title=hn+' vs '+an+' — IASHARK';

  // ─ TOPBAR
  var topbar='<div class="topbar'+(isWC?' wc-bar':'')+'"><div class="lg-row"><span style="font-size:14px">'+(m.ligue_icon||'🏆')+'</span><span class="lg-name">'+(m.league||'').toUpperCase()+'</span></div>'
    +'<div class="badges">'+(heure?'<span class="badge time">'+heure+'</span>':'')
    +(isWC?'<span class="badge wc">🌍 CM 2026</span>':isHot?'<span class="badge hot">SHARK LOCK</span>':isVal?'<span class="badge val">VALUE BET</span>':'')
    +'</div></div>';

  // ─ WC BANNER
  var wcBanner=isWC?'<div class="wc-banner"><div class="wc-flag">🏆</div><div class="wc-info"><div class="wc-title">FIFA WORLD CUP 2026</div><div class="wc-sub">USA · Canada · Mexique</div></div>'+(m.league?'<div class="wc-group">'+esc(m.league).split(' ').pop()+'</div>':'')+'</div>':'';

  // ─ TEAMS
  var stadeHtml='';
  if(m.stade&&m.stade.nom){
    stadeHtml='<div class="stade-row"><span class="stade-icon">🏟</span><span class="stade-name">'+esc(m.stade.nom)+'</span>'
      +(m.stade.temp?'<span class="stade-meta">'+esc(m.stade.temp)+'</span>':'')
      +'</div>';
  }
  var teamsHtml='<div class="teams">'
    +'<div class="teams-row">'
    +'<div class="team home">'+lgImg(m.home,hn.slice(0,2).toUpperCase())+'<div class="team-name">'+hn.toUpperCase()+'</div><div class="team-sub">'+(isTennis?'JOUEUR 1':'DOMICILE')+'</div>'+(forme(m.forme_h||m.form_p1)?'<div class="team-form">'+forme(m.forme_h||m.form_p1)+'</div>':'')+'</div>'
    +'<div class="vs-col"><span class="vs">VS</span>'+(heure?'<div class="vs-hr">'+heure+'</div>':'')+'</div>'
    +'<div class="team away">'+lgImg(m.away,an.slice(0,2).toUpperCase())+'<div class="team-name">'+an.toUpperCase()+'</div><div class="team-sub">'+(isTennis?'JOUEUR 2':'EXTÉRIEUR')+'</div>'+(forme(m.forme_a||m.form_p2)?'<div class="team-form">'+forme(m.forme_a||m.form_p2)+'</div>':'')+'</div>'
    +'</div>'
    +'<div class="pbar"><div class="pb1" style="width:'+(m.p1||0)+'%"></div><div class="pbn" style="width:'+(m.pn||0)+'%"></div><div class="pb2" style="width:'+(m.p2||0)+'%"></div></div>'
    +'<div class="plabels"><div class="pi"><div class="pi-pct" style="color:var(--cyan)">'+(m.p1||0)+'%</div><div class="pi-lbl">'+hn.slice(0,8).toUpperCase()+'</div></div>'+(m.pn?'<div class="pi"><div class="pi-pct" style="color:var(--muted)">'+(m.pn||0)+'%</div><div class="pi-lbl">NUL</div></div>':'')+'<div class="pi"><div class="pi-pct" style="color:rgba(226,232,240,0.45)">'+(m.p2||0)+'%</div><div class="pi-lbl">'+an.slice(0,8).toUpperCase()+'</div></div></div>'
    +stadeHtml
    +'</div>';

  // ─ PARIS RECOMMANDÉ
  var parisHtml='';
  if(pariRec){
    var coteMin=paricote!=='—'?((parseFloat(paricote)-0.20).toFixed(2)):'';
    var marketsHtml=!isTennis?buildMarkets(m,pariRec):'';
    parisHtml='<div class="s"><div class="stitle">PARIS RECOMMANDÉ</div>'
      +'<div class="pari-main">'
      +'<div class="pm-top"><div class="pm-left"><div class="pm-lbl">SÉLECTION IA DU SOIR</div><div class="pm-bet">'+pariRec.toUpperCase()+'</div></div><div class="pm-right"><div class="pm-cote">'+paricote+'</div></div></div>'
      +'<div class="conf-block"><div class="conf-top"><div class="conf-score">'+(m.conf||0).toFixed(1)+'<sup>/10</sup></div><div class="conf-badge">'+confLvl+'</div></div><div class="conf-track"><div class="conf-fill" style="width:'+confPct+'%"></div></div><div class="conf-scale"><span>PRUDENT</span><span>CONFIANT</span><span>ÉLEVÉ</span><span>LOCK</span></div></div>'
      +(marketsHtml?marketsHtml:'')
      +(coteMin?'<div class="pm-warn">⚠ Si la cote passe sous '+coteMin+' — ne pas jouer</div>':'')
      +'</div></div><div class="sep"></div>';
  }

  // ─ SKIP
  var skipHtml=m.no_signal
    ?'<div class="s"><div class="skip danger"><div class="skip-icon">🚨</div><div><div class="skip-lbl">PASSE TON TOUR</div><div class="skip-txt">'+(m.no_signal_label||'Signaux contradictoires. <strong>Ne pas jouer.</strong>')+'</div></div></div></div><div class="sep"></div>'
    :'<div class="s"><div class="skip ok"><div class="skip-icon">✅</div><div><div class="skip-lbl">FEU VERT</div><div class="skip-txt">Configuration favorable. <strong>Voir la sélection ci-dessus.</strong></div></div></div></div><div class="sep"></div>';

  // ─ FACTEUR IA
  var facteur=m.facteur_x?'<div class="s"><div class="facteur"><div class="fact-icon">⚡</div><div><div class="fact-lbl">FACTEUR DÉCISIF</div><div class="fact-txt">'+esc(m.facteur_x)+'</div></div></div></div><div class="sep"></div>':'';

  // ─ VERDICT
  var verdict=(m.verdict_shark||m.contexte)?
    '<div class="s"><div class="verdict-block"><div class="verdict-badge">🦈 VERDICT DU SHARK</div>'
    +(m.verdict_shark?'<div class="verdict-title">'+esc(m.verdict_shark)+'</div>':'')
    +(m.contexte?'<div class="verdict-body">'+esc(m.contexte)+'</div>':'')
    +'</div></div><div class="sep"></div>':'';

  // ─ PRO WALL (si pas pro)
  var proWall=!isPro&&!isTennis?buildProWall():'';

  return '<div class="wrap"><div class="card'+(isHot?' hot':'')+(isWC?' wc':'')+'">'
    +topbar
    +wcBanner
    +teamsHtml
    +'<div class="sep"></div>'
    +parisHtml
    +skipHtml
    +facteur
    // WC model
    +buildWCModel(m)
    // H2H
    +(isTennis?buildTennisH2H(hn,an,m.h2h_tennis):buildH2H(hn,an,m.h2h,m.home&&m.home.id))
    // ELO (foot seulement)
    +(!isTennis&&!isWC?buildElo(hn,an,m.elo_home,m.elo_away,m.elo_signal):'')
    // Dropping odds
    +(!isTennis?buildDropping(m.dropping_odds):'')
    // Analyse comparative
    +'<div class="s"><div class="stitle">ANALYSE COMPARATIVE</div>'+buildComp(hn,an,m.crit_home,m.crit_away)+'</div><div class="sep"></div>'
    // Surface tennis
    +(isTennis?buildSurface(hn,an,m.surf_stats_p1,m.surf_stats_p2,m.surface):'')
    // Palmarès tournoi tennis
    +(isTennis?buildTourRecord(hn,an,m.tour_record_p1,m.tour_record_p2):'')
    // Patterns buts (foot)
    +(!isTennis?buildPatterns(hn,an,m.events_home,m.events_away,m):'')
    // Scénario
    +buildScen(m)
    // Buteurs
    +buildPlayers(hn,an,m.top_scorers_home,m.top_scorers_away)
    // Arbitre
    +(!isTennis?buildArbitre(m.arbitre):'')
    // Verdict
    +verdict
    +proWall
    +'<div class="card-footer"></div></div></div>';
}

    var m=(data.matchs||[]).find(function(x){return String(x.id)===String(fId);});
    if(!m){
      el.innerHTML='<div style="text-align:center;padding:60px 20px"><div style="font-family:Space Mono,monospace;font-size:10px;color:var(--muted)">MATCH INTROUVABLE · ID: '+fId+'</div><br><a href="/" style="color:var(--cyan);font-family:Space Mono,monospace;font-size:9px">← RETOUR</a></div>';
      return;
    }
    el.innerHTML=render(m);
    // Animer les barres
    setTimeout(function(){
      document.querySelectorAll('.cr-fill[data-w]').forEach(function(b){
        var w=b.getAttribute('data-w');
        b.style.width='0%';
        requestAnimationFrame(function(){setTimeout(function(){b.style.width=w+'%';},60);});
      });
    },100);
  }catch(e){
    console.error(e);
    el.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--muted)">Erreur de chargement</div>';
  }
}
init();
</script>
