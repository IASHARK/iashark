      - name: Vider le cache (force recalcul complet pour ce test)
        run: echo '{"matchs":[],"combis":[]}' > data.json

      - name: Run pipeline
        env:
          APISPORTS_KEY:      ${{ secrets.APISPORTS_KEY }}
          SPORTMONKS_KEY:     ${{ secrets.SPORTMONKS_KEY }}
          OPENWEATHER_KEY:    ${{ secrets.OPENWEATHER_KEY }}
          NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_KEY:      ${{ secrets.ANTHROPIC_KEY }}
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          ODDS_API_IO_KEY:    ${{ secrets.ODDS_API_IO_KEY }}
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
          CREATOMATE_KEY:     ${{ secrets.CREATOMATE_KEY }}
        run: node pipeline.js

      - name: Afficher les stats joueurs du data.json genere
        run: |
          echo "=== EXTRAIT top_scorers_home / top_scorers_away ==="
          node -e "
            const d = require('./data.json');
            d.matchs.forEach(m => {
              if(m.top_scorers_home && m.top_scorers_home.length || m.top_scorers_away && m.top_scorers_away.length){
                console.log('---', m.home.n, 'vs', m.away.n, '---');
                console.log('HOME:', JSON.stringify(m.top_scorers_home, null, 2));
                console.log('AWAY:', JSON.stringify(m.top_scorers_away, null, 2));
              }
            });
          "

      - name: Commit and push
        run: |
          git config user.name "IASHARK"
          git config user.email "yaramode81@gmail.com"
          git add data.json historique.json transferts.json actus.json sitemap.xml sitemap-*.xml
          git diff --staged --quiet || git commit -m "TEST match unique - $(date +%Y-%m-%d)"
          git push
