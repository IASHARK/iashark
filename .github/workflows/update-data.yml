                xgH_xga:xgH.xga_avg,xgA_xga:xgA.xga_avg,
                xgH_defense_surchauffe:xgH.defense_surchauffe,xgA_defense_surchauffe:xgA.defense_surchauffe,
                isKnockout:isKnockout,
              });
              await sleep(500);
              // pickedMarket/kellyVal/edgeVal/riskLabelCode/noSignal deja calcules
              // AVANT l'appel LLM (voir plus haut) - an ne contient plus que du texte
              // narratif, plus aucune re-selection de marche ni recalcul ici.
              var classementObj=null;
              if(entryH||entryA){
                var rankH=rkH||99,rankA=rkA||99;
                var minRank=Math.max(1,Math.min(rankH,rankA)-2);
                var maxRank=Math.min(Math.max(rankH,rankA)+2,standings.length);
                classementObj={league_name:lg.name,standings:standings.filter(function(s){return s.rank>=minRank&&s.rank<=maxRank;}).map(function(s){return{rank:s.rank,name:s.team.name,team_id:s.team.id,played:s.all.played,won:s.all.win,drawn:s.all.draw,lost:s.all.lose,gd:s.goalsDiff,pts:s.points,form:s.form||''};}),home:entryH?{rank:entryH.rank,pts:entryH.points,played:entryH.all.played,won:entryH.all.win,lost:entryH.all.lose,gd:entryH.goalsDiff,form:entryH.form||''}:null,away:entryA?{rank:entryA.rank,pts:entryA.points,played:entryA.all.played,won:entryA.all.win,lost:entryA.all.lose,gd:entryA.goalsDiff,form:entryA.form||''}:null};
              }
              var parisDateObj=new Date(new Date(f.date||TODAY).toLocaleString('en-US',{timeZone:'Europe/Paris'}));
              var dateVraieParis=parisDateObj.getFullYear()+'-'+String(parisDateObj.getMonth()+1).padStart(2,'0')+'-'+String(parisDateObj.getDate()).padStart(2,'0');
              // Categorie de marche deterministe (etait an.marche, choisie par le LLM).
              function categorizeMarket(marketName){
                var n=(marketName||'').toLowerCase();
                if(n.includes('over')||n.includes('under')) return 'TOTAL_BUTS';
                if(n.includes('btts')) return 'BTTS';
                if(n.includes('dc ')||n.includes('handicap')||n.includes('dnb')) return 'DOUBLE_CHANCE';
                return 'RESULTAT';
              }
              // Data Quality Score (MASTER V2.1 §11.1) et Model Agreement (§10.AB/§11.2) :
              // deterministes, remplacent l'ancien "Confiance /10" auto-rapporte par le LLM
              // (dont le backtest de cette session a mesure qu'il etait activement
              // desinformatif - voir BACKTEST_REPORT.json, Brier score 0.2814 > repere
              // pile-ou-face 0.25).
              var dataQuality=computeDataQualityScore({
                hasTeamStatsHome:!!(sH&&sH.fixtures&&sH.fixtures.played&&((sH.fixtures.played.home||0)>0||(sH.fixtures.played.away||0)>0)),
                hasTeamStatsAway:!!(sA&&sA.fixtures&&sA.fixtures.played&&((sA.fixtures.played.home||0)>0||(sA.fixtures.played.away||0)>0)),
                hasOdds:!!(odds.c1&&odds.c1!=='--'),
                hasInjuries:!!(injuries&&injuries.length),
                hasH2H:!!(h2hRaw&&h2hRaw.length),
                hasElo:!!(eloH&&eloA),
                hasLineups:!!(lineups&&(lineups.home||lineups.away)),
              });
              var modelAgreement=computeModelAgreement([pureProbs.p1,pureProbs.dixon?pureProbs.dixon.p1:pureProbs.p1,pureProbs.montecarlo?pureProbs.montecarlo.p1:pureProbs.p1]);
              // Taille d'echantillon reelle (matchs joues cette saison par les deux
              // equipes) - jamais la valeur de repli ||20/||30 utilisee ailleurs pour
              // les calculs statistiques (qui doit rester un repli technique, pas une
              // donnee affichee comme reelle). null si vraiment inconnu.
              var sampleSizeH=(sH&&sH.fixtures&&sH.fixtures.played&&sH.fixtures.played.total)||null;
              var sampleSizeA=(sA&&sA.fixtures&&sA.fixtures.played&&sA.fixtures.played.total)||null;
              var sampleSizeReal=(sampleSizeH!=null&&sampleSizeA!=null)?Math.min(sampleSizeH,sampleSizeA):null;
              var reliability=computeReliability(modelAgreement,dataQuality,sampleSizeReal);
              var matchObj={
                id:f.id,sport:'football',
                league_id:lg.id,
                season:SEASON_2026.indexOf(lg.id)!==-1?2026:SEASON,
                home:{n:home.name,id:home.id},away:{n:away.name,id:away.id},
                league:lg.name,ligue_icon:lgIcon(lg.name),league_key:lgKey(lg.id),
                date:(dateVraieParis+' '+heure).trim(),cat:['all'],
                val:!noSignal&&kellyVal!=='0',
                hot:!noSignal&&modelAgreement.label==='Fort'&&kellyVal!=='0',
                // model_probability : PURE_IASHARK_PROBABILITY (§10.2) pour le marche
                // retenu (0-100, deterministe) - ensemble Poisson/Dixon-Coles/Monte-Carlo
                // (+Elo), et RIEN d'autre : aucune cote n'entre dans ce calcul, jamais,
                // pour aucun marche (1X2/DC inclus - corrige ce jalon, ils etaient
                // auparavant ancres au marche via un blend Shin, cf MODEL_ARCHITECTURE.md
                // et tests/pure-probability.test.js). C'est le meme nombre utilise pour
                // choisir le marche (lib/decision.js#pickMarketDeterministic) et pour
                // calculer edge/Kelly contre market_consensus_* ci-dessous - jamais une
                // valeur intermediaire brute, jamais MARKET_AWARE contre son propre
                // marche source (interdit explicitement par le MASTER). Ce n'EST PAS une
                // "probabilite calibree" au sens statistique (isotonic/Platt, §10.S) :
                // aucune calibration post-hoc n'a encore ete mesuree pour ce moteur (voir
                // CALIBRATION_REPORT.md).
                model_probability:pickedMarket?Math.round(pickedMarket.prob*10)/10:null,
                // Les 3 probabilites S10.2 exposees separement et explicitement pour le
                // marche 1X2 (celui qui a les 3 versions calculees) - jamais fusionnees.
                market_consensus_p1:shinProbs?shinProbs.p1:null,market_consensus_pN:shinProbs?shinProbs.pN:null,market_consensus_p2:shinProbs?shinProbs.p2:null,
                market_aware_p1:marketAware.p1,market_aware_pN:marketAware.pN,market_aware_p2:marketAware.p2,
                // reliability : fiabilite/confiance, EXPLICITEMENT separee de la
                // probabilite (retour utilisateur direct : ne jamais confondre les
                // deux). Composite de signaux mesurables (accord des modeles, qualite
                // des donnees, taille d'echantillon) - jamais une probabilite recopiee
                // sous un autre nom. Voir lib/decision.js#computeReliability.
                reliability:reliability,
                // "conf" (echelle 0-10) : ALIAS DEPRECIE conserve uniquement pour
                // compatibilite descendante avec le frontend actuel (match.html/
                // pro.html/historique.html lisent encore ce champ) et historique.json.
                // Vaut model_probability/10 - PAS un score de confiance independant.
                // A SUPPRIMER une fois le frontend migre vers model_probability +
                // reliability (Phase 5) : chercher toutes les lectures de `.conf`/
                // `conf_bucket` dans le frontend et les remplacer avant de retirer ce
                // champ. Ne jamais lui donner une valeur differente de
                // model_probability/10 entre-temps (sinon on recree la confusion
                // probabilite/confiance qu'on est en train de corriger).
                conf:pickedMarket?Math.round((pickedMarket.prob/10)*10)/10:Math.round((dataQuality.score/10)*10)/10,
                data_quality_score:dataQuality.score,data_quality_label:dataQuality.label,
                model_agreement:modelAgreement.label,
                // p1/pn/p2 : PURE_IASHARK_PROBABILITY (jamais market_aware -
                // c'etait le bug corrige ce jalon pour 1X2/DC specifiquement).
                p1:pureProbs.p1||0,pn:pureProbs.pN||0,p2:pureProbs.p2||0,
                po15:0,po25:pureProbs.over25||0,btts:pureProbs.bttsY||0,
                c1:odds.c1,cn:odds.cn,c2:odds.c2,co15:odds.co15,co25:odds.co25,cu25:odds.cu25,
                dc1x:odds.dc1x,dc2x:odds.dc2x,dc12:odds.dc12,cdc1x:odds.dc1x,cdc2x:odds.dc2x,
                ah_dom:odds.ah_dom||'--',ah_ext:odds.ah_ext||'--',co35:odds.co35||'--',
                cbtts:odds.btts_oui,cbtts_non:odds.btts_non,btts_oui:odds.btts_oui,btts_non:odds.btts_non,
