<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IASHARK — Paiement confirmé</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Ton abonnement Outils IASHARK est en cours d'activation.">
<link rel="canonical" href="https://iashark.com/checkout-succes.html">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080c12'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='%2322d3ee'%3E🦈%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/funnel-track.js"></script>
<style>
:root{--bg:#080c12;--card:#0d1520;--cyan:#22d3ee;--green:#10b981;--amber:#f59e0b;--text:#e2e8f0;--muted:#4a6580;--border:rgba(255,255,255,0.06);--bc:rgba(34,211,238,0.18);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:60px;}
.hdr{position:sticky;top:0;z-index:99;background:rgba(8,12,18,0.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:var(--text);text-decoration:none;}
.logo span{color:var(--cyan);}
.wrap{max-width:460px;margin:0 auto;padding:60px 20px;}
.card{background:var(--card);border:1px solid rgba(16,185,129,0.25);border-radius:20px;padding:36px 28px;text-align:center;}
.icon{font-size:48px;margin-bottom:16px;}
.title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--green);margin-bottom:10px;}
.body{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:24px;}
.status{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted);margin-bottom:20px;min-height:14px;}
.status.ready{color:var(--green);}
.cta{display:block;width:100%;padding:13px;border-radius:10px;border:1px solid var(--bc);background:rgba(34,211,238,0.1);color:var(--cyan);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;text-decoration:none;text-align:center;}
</style>
</head>
<body>
<header class="hdr"><a href="/" class="logo"><span>IA</span>SHARK</a></header>
<div class="wrap">
  <div class="card">
    <div class="icon">✅</div>
    <div class="title">Paiement confirmé</div>
    <div class="body">Merci ! Ton abonnement Outils est en cours d'activation — cela prend généralement quelques secondes.</div>
    <div class="status" id="statusTxt">Vérification de ton accès...</div>
    <a href="/compte.html" class="cta">ALLER À MON COMPTE →</a>
  </div>
</div>
<script>
if(window.iasharkTrack) iasharkTrack('checkout_success_view');

var SUPA_URL = 'https://ksvjraqitxouwiabecai.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzdmpyYXFpdHhvdXdpYWJlY2FpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3ODcwMjMsImV4cCI6MjA4ODM2MzAyM30.Eh3qk4tATM40hoYxdErAllLEo1y8KNt4BSCET_fAgT8';
var sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// Le webhook Stripe met a jour users.plan de facon asynchrone (evenement
// customer.subscription.* recu apres le retour sur cette page) - on
// interroge quelques fois avec un delai croissant plutot que d'affirmer un
// succes qui n'est pas encore reellement en base.
async function pollAccess(attempt){
  var statusEl = document.getElementById('statusTxt');
  try{
    var res = await sb.auth.getSession();
    if(!res.data || !res.data.session){ statusEl.textContent = 'Connecte-toi pour voir ton nouvel accès.'; return; }
    var ures = await sb.from('users').select('plan').eq('id', res.data.session.user.id).maybeSingle();
    if(ures.data && ures.data.plan==='pro'){
      statusEl.textContent = 'Accès Outils activé ✓';
      statusEl.classList.add('ready');
      return;
    }
  }catch(e){}
  if(attempt < 5){
    setTimeout(function(){ pollAccess(attempt+1); }, 1500);
  } else {
    statusEl.textContent = "L'activation peut prendre un peu plus de temps — rends-toi sur ton compte dans une minute.";
  }
}
pollAccess(0);
</script>
<script src="/site-prefs.js"></script>
</body>
</html>
