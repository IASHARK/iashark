    var edgeNum=parseEdgeText(m.edge);
    var coteF=parseFloat(paricote);
    var probImpl=coteF&&coteF>1?Math.round((1/coteF)*100):null;
    // Fiabilite : EXPLICITEMENT separee de la probabilite (m.reliability,
    // voir lib/decision.js#computeReliability) - accord des modeles,
    // qualite des donnees, taille d'echantillon. Jamais la probabilite
    // elle-meme sous un autre nom.
    var relLabel=(m.reliability&&m.reliability.label)||'Inconnue';
    var relPct=relLabel==='Élevée'?85:relLabel==='Moyenne'?55:relLabel==='Faible'?25:0;
    var relDetail=m.reliability?('Accord modèles: '+(m.reliability.model_agreement||'?')+' · Qualité données: '+(m.reliability.data_quality||'?')):'';

    parisHtml='<div class="pari-main">'
      +'<div class="pm-headline"><div><div class="pm-lbl">SÉLECTION IA DU JOUR</div><div class="pm-bet">'+translateMarket(pariRec).toUpperCase()+'</div></div><div class="pm-cote-big">'+paricote+'</div></div>'
      +'<div class="pm-metrics">'
      +(probIA!=null?'<div class="pmm"><div class="pmm-val cy">'+Math.round(probIA)+'%</div><div class="pmm-lbl">PROBABILITÉ MODÈLE</div></div>':'')
      +(probImpl?'<div class="pmm"><div class="pmm-val">'+probImpl+'%</div><div class="pmm-lbl">COTE IMPL.</div></div>':'')
      +(edgeNum!==null?'<div class="pmm"><div class="pmm-val gr">'+(edgeNum>0?'+':'')+edgeNum.toFixed(0)+'%</div><div class="pmm-lbl">AVANTAGE</div></div>':'')
      +'</div>'
      +'<div class="pm-conf" title="'+esc(relDetail)+'"><span class="pm-conf-lbl">FIABILITÉ</span><div class="pm-conf-bar"><div class="pm-conf-fill" style="width:'+relPct+'%"></div></div><span class="pm-conf-val">'+relLabel.toUpperCase()+'</span></div>'
      +(coteMin?'<div class="pm-warn">⚠ Si cote passe sous '+coteMin+' — ne pas jouer</div>':'')
      +'</div>';
  }

  var stripHtml='';
  if(!isTennis){
    if(isWC&&m.wc_probs&&m.wc_probs.scoreH&&m.wc_probs.scoreA){
      var dH=m.wc_probs.scoreH.details||{},dA=m.wc_probs.scoreA.details||{};
      stripHtml='<div class="info-strip">'
        +'<div class="is-item"><div class="is-val" style="color:var(--cyan)">'+(dH.fifa_pts||'—')+'</div><div class="is-lbl">FIFA '+hn.slice(0,4).toUpperCase()+'</div></div>'
        +'<div class="is-item"><div class="is-val">'+(dA.fifa_pts||'—')+'</div><div class="is-lbl">FIFA '+an.slice(0,4).toUpperCase()+'</div></div>'
        +'<div class="is-item"><div class="is-val" style="color:var(--cyan)">'+(dH.wc_exp||'—')+'</div><div class="is-lbl">EXP CM '+hn.slice(0,4).toUpperCase()+'</div></div>'
        +'<div class="is-item"><div class="is-val">'+(dA.wc_exp||'—')+'</div><div class="is-lbl">EXP CM '+an.slice(0,4).toUpperCase()+'</div></div>'
        +'</div>';
    } else if(m.classement&&m.classement.home&&m.classement.away&&m.classement.standings&&m.classement.standings.length){
      function formDots(str){
        return (str||'').split('').slice(0,5).map(function(c){
          var col=c==='W'||c==='V'?'rgba(255,255,255,0.55)':c==='D'||c==='N'?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.08)';
          return '<div style="width:5px;height:5px;border-radius:50%;background:'+col+'"></div>';
        }).join('');
      }
      var rows='';
      m.classement.standings.forEach(function(t,i){
        var isH=t.team_id===m.home.id||t.name===m.home.n;
        var isA=t.team_id===m.away.id||t.name===m.away.n;
        var border=i<m.classement.standings.length-1?'border-bottom:1px solid rgba(255,255,255,0.04);':'';
        var nameCol=isH?'#e2e8f0':isA?'rgba(226,232,240,0.6)':'#4a6580';
        var ptsCol=isH?'#22d3ee':isA?'#e2e8f0':'#4a6580';
        var rankCol=isH||isA?'#e2e8f0':'#2a3f55';
        var dot=isH?'<div style="width:3px;height:3px;border-radius:50%;background:#22d3ee;margin-right:8px;flex-shrink:0"></div>'
               :isA?'<div style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.3);margin-right:8px;flex-shrink:0"></div>'
               :'<div style="width:3px;margin-right:8px;flex-shrink:0"></div>';
        rows+='<div style="display:flex;align-items:center;padding:9px 0;'+border+'">'
          +'<div style="font-family:Space Mono,monospace;font-size:9px;color:'+rankCol+';width:22px;flex-shrink:0">'+t.rank+'</div>'
          +dot
          +'<div style="flex:1;min-width:0;font-family:Space Mono,monospace;font-size:10px;color:'+nameCol+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.name)+'</div>'
          +'<div style="display:flex;gap:3px;align-items:center;margin:0 12px">'+formDots(t.form)+'</div>'
          +'<div style="font-family:Space Mono,monospace;font-size:9px;color:#2a3f55;width:20px;text-align:center">'+(t.won||0)+'</div>'
          +'<div style="font-family:Space Mono,monospace;font-size:9px;color:#2a3f55;width:20px;text-align:center">'+(t.drawn||0)+'</div>'
          +'<div style="font-family:Space Mono,monospace;font-size:9px;color:#2a3f55;width:20px;text-align:center">'+(t.lost||0)+'</div>'
          +'<div style="font-family:Bebas Neue,sans-serif;font-size:20px;color:'+ptsCol+';width:36px;text-align:right">'+t.pts+'</div>'
          +'</div>';
      });
      stripHtml='<div style="margin:0 18px 16px">'
        +'<div style="font-family:Space Mono,monospace;font-size:7px;letter-spacing:2px;color:#4a6580;margin-bottom:10px;display:flex;align-items:center;gap:8px">CLASSEMENT<div style="flex:1;height:1px;background:rgba(255,255,255,0.05)"></div></div>'
        +rows
        +'</div>';
    }
  }
  var ctxHtml=!isTennis?buildResumeRencontre(m,hn,an):(m.contexte?'<div style="padding:0 18px 16px"><div style="font-size:13px;color:#94a3b8;line-height:1.75;">'+esc(cleanJargon(m.contexte))+'</div></div>':'');

  var skipHtml=m.no_signal
    ?'<div style="padding:0 18px 16px"><div class="skip danger"><div class="skip-icon">🚨</div><div><div class="skip-lbl">PASSE TON TOUR</div><div class="skip-txt">'+(m.no_signal_label||'Signaux contradictoires. <strong>Ne pas jouer.</strong>')+'</div></div></div></div>'
    :'';

  var insightHtml='';
  var hasSignal=m.facteur_x||m.verdict_shark||m.no_signal;
  if(hasSignal){
    insightHtml='<div class="insight">';
    if(m.facteur_x){
      insightHtml+='<div class="insight-row"><div class="ir-icon sig">⚡</div><div><div class="ir-lbl sig">SIGNAL DÉCISIF</div><div class="ir-txt">'+esc(cleanJargon(m.facteur_x))+'</div></div></div>';
    }
    if(m.verdict_shark){
    }
    if(!m.facteur_x&&!m.verdict_shark&&m.no_signal){
      insightHtml+='<div class="insight-row"><div class="ir-icon" style="background:rgba(239,68,68,0.1)">🚨</div><div><div class="ir-lbl" style="color:var(--red)">PASSE TON TOUR</div><div class="ir-txt">'+(m.no_signal_label||'Signaux contradictoires. Ne pas jouer.')+'</div></div></div>';
    }
    insightHtml+='</div>';
  }

  var classementHtml=!isTennis?stripHtml:'';
  var h2hCustomHtml=!isTennis?buildH2H(hn,an,m.h2h,m.home&&m.home.id):'';
  var meteoHtml=(m.stade&&(m.stade.desc||m.stade.temp))
    ?'<div style="padding:0 18px 16px;color:#94a3b8;font-size:12px;">'+(m.stade.meteo||'')+' Conditions à la rencontre : '+esc(m.stade.desc||'')+(m.stade.temp?', '+esc(m.stade.temp):'')+'.</div>'
    :'';
  var absentsHtml=!isTennis?buildAbsentsTable(m.injuries,m.home&&m.home.id,hn,an):'';
  var arbitreHtml=!isTennis?buildArbitre(m.arbitre):'';
  var tabApercu=parisHtml+classementHtml+h2hCustomHtml+ctxHtml+meteoHtml+skipHtml+insightHtml+absentsHtml+arbitreHtml;

  var tabAnalyseEquipe=
    (!isTennis?buildDonut(hn,an,m.p1||0,m.pn||0,m.p2||0):'')
    +(!isTennis?buildMarketsTable(m,pariRec):'')
    +(!isTennis?buildScoresProbables(m.lambda_h,m.lambda_a,m.scores,m):'')
    +buildWCModel(m)
    +(!isTennis?'<div class="s"><div class="stitle">ANALYSE COMPARATIVE</div>'+buildCompTable(hn,an,m.crit_home,m.crit_away)+'</div><div class="sep"></div>':'')
    +(!isTennis?buildMatchStats(hn,an,m.match_stats_home,m.match_stats_away):'')
    +(!isTennis?buildPatterns(hn,an,m.events_home,m.events_away):'')
    +(isTennis?buildSurface(hn,an,m.surf_stats_p1,m.surf_stats_p2,m.surface):'')
    +buildScen(m);

  var tabAnalyseJoueur=
    (!isTennis?buildPlayerStatCards(hn,an,m.top_scorers_home,m.top_scorers_away):'');

  function trimSepInline(html){return (html||'').replace(/<div class="sep"><\/div>\s*$/,'');}
  tabAnalyseEquipe=trimSepInline(tabAnalyseEquipe);
  tabAnalyseJoueur=trimSepInline(tabAnalyseJoueur);

  var analyseSubNav='<div style="display:flex;gap:0;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.015);">'
    +'<button class="analyse-sub-btn active" data-sub="equipe" onclick="switchAnalyseSub(this,\'equipe\')" style="flex:1;font-family:Space Mono,monospace;font-size:8px;letter-spacing:1.5px;color:var(--cyan);background:rgba(34,211,238,0.06);border:none;border-bottom:2px solid var(--cyan);padding:11px 6px;cursor:pointer;">ÉQUIPE</button>'
    +'<button class="analyse-sub-btn" data-sub="joueur" onclick="switchAnalyseSub(this,\'joueur\')" style="flex:1;font-family:Space Mono,monospace;font-size:8px;letter-spacing:1.5px;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:11px 6px;cursor:pointer;">JOUEUR</button>'
    +'</div>';

  var tabAnalyse=analyseSubNav
    +'<div id="analyse-sub-equipe" class="analyse-sub-panel">'+tabAnalyseEquipe+'</div>'
    +'<div id="analyse-sub-joueur" class="analyse-sub-panel" style="display:none;">'+(tabAnalyseJoueur||'<div style="padding:40px 20px;text-align:center;color:var(--muted);font-family:Space Mono,monospace;font-size:9px;">PAS DE DONNÉES JOUEUR POUR CE MATCH</div>')+'</div>';

  var tabCriteres=
    buildPourquoiCePari(m,pariRec,paricote)
    +(isTennis?buildTennisH2H(hn,an,m.h2h_tennis):'')
    +(!isTennis&&!isWC?buildElo(hn,an,m.elo_home,m.elo_away,m.elo_signal):'')
    +(!isTennis?buildDropping(m.dropping_odds):'')
    +(isTennis?buildTourRecord(hn,an,m.tour_record_p1,m.tour_record_p2):'');

  var tabFAQ=buildFAQ(m,hn,an,pariRec,paricote);

  function trimSep(html){return html.replace(/<div class="sep"><\/div>\s*$/,'');}
  tabApercu=trimSep(tabApercu);
  tabAnalyse=trimSep(tabAnalyse);
  tabCriteres=trimSep(tabCriteres);
  tabFAQ=trimSep(tabFAQ);

  var tabsNav='<div class="tabbar">'
    +'<button class="tab-btn active" data-tab="apercu" onclick="switchTab(this,\'apercu\')">VUE D\'ENSEMBLE</button>'
    +'<button class="tab-btn" data-tab="analyse" onclick="switchTab(this,\'analyse\')">ANALYSE</button>'
    +'<button class="tab-btn" data-tab="criteres" onclick="switchTab(this,\'criteres\')">DÉCISION</button>'
    +'<button class="tab-btn" data-tab="savoir" onclick="switchTab(this,\'savoir\')">EN SAVOIR +</button>'
    +'</div>';

  var tabsContent='<div id="tab-apercu" class="tab-panel active">'+tabApercu+'</div>'
    +'<div id="tab-analyse" class="tab-panel">'+tabAnalyse+'</div>'
    +'<div id="tab-criteres" class="tab-panel">'+tabCriteres+'</div>'
    +'<div id="tab-savoir" class="tab-panel">'+tabFAQ+'</div>';

  var proWall=!isPro&&!isTennis?buildProWall():'';

  return '<div class="wrap"><div class="card'+(isHot?' hot':'')+(isWC?' wc':'')+'">'
    +teamsHtml
    +tabsNav
    +tabsContent
    +proWall
    +'<div class="card-footer"></div></div></div>';
}

function switchTab(btn,tabName){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('tab-'+tabName).classList.add('active');
}

function switchAnalyseSub(btn,subName){
  document.querySelectorAll('.analyse-sub-btn').forEach(function(b){
    b.classList.remove('active');
    b.style.color='var(--muted)';
    b.style.background='none';
    b.style.borderBottomColor='transparent';
  });
  document.querySelectorAll('.analyse-sub-panel').forEach(function(p){ p.style.display='none'; });
  btn.classList.add('active');
  btn.style.color='var(--cyan)';
  btn.style.background='rgba(34,211,238,0.06)';
  btn.style.borderBottomColor='var(--cyan)';
  document.getElementById('analyse-sub-'+subName).style.display='block';
}

function togglePlayerCard(id){
  var el=document.getElementById(id);
  if(!el)return;
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}

async function checkSession(){
  try{var sb=supabase.createClient(SUPA_URL,SUPA_KEY);var res=await sb.auth.getSession();var s=res.data&&res.data.session;if(!s)return false;var u=await sb.from('users').select('plan').eq('id',s.user.id).maybeSingle();return u.data&&u.data.plan==='pro';}catch(e){return false;}

async function fetchMatchDataWithAuth(){
  // Les champs premium (kelly/edge/verdict_shark/facteur_x) ne sont plus dans
  // data.json - seule l'Edge Function match-data (verification serveur du
  // plan) peut les renvoyer. Repli sur data.json (gratuit uniquement) si
  // l'appel echoue. Retourne {data, isPro} pour eviter un second aller-retour
  // reseau juste pour le statut de session.
  try{
    var sb=supabase.createClient(SUPA_URL,SUPA_KEY);
    var sess=await sb.auth.getSession();
    var s=sess.data&&sess.data.session;
    var token=s?s.access_token:SUPA_KEY;
    var resp=await fetch(SUPA_URL+'/functions/v1/match-data',{headers:{'Authorization':'Bearer '+token,'apikey':SUPA_KEY}});
    if(!resp.ok) throw new Error('edge function status '+resp.status);
    var json=await resp.json();
    return {data:json, isPro:!!json.isPro};
  }catch(e){
    var resp2=await fetch('/data.json?t='+Date.now());
    var json2=await resp2.json();
    var pro=await checkSession();
    return {data:json2, isPro:pro};
  }
}

async function init(){
  var el=document.getElementById('root');
  if(!fId){el.innerHTML='<div style="text-align:center;padding:60px 20px;font-family:Space Mono,monospace;font-size:10px;color:var(--muted)">ID MANQUANT<br><br><a href="/" style="color:var(--cyan)">← RETOUR</a></div>';return;}
  try{
    var m;
    if(typeof PRELOADED_MATCH!=='undefined'&&PRELOADED_MATCH&&String(PRELOADED_MATCH.id)===String(fId)){
      isPro=await checkSession();
      if(isPro){
        var fetched=await fetchMatchDataWithAuth();
        var enriched=(fetched.data.matchs||[]).find(function(x){return String(x.id)===String(fId);});
        m=enriched||PRELOADED_MATCH;
      }else{
        m=PRELOADED_MATCH;
      }
    }else{
      var fetched2=await fetchMatchDataWithAuth();
      isPro=fetched2.isPro;
      m=(fetched2.data.matchs||[]).find(function(x){return String(x.id)===String(fId);});
    }
    if(!m){
      el.innerHTML='<div style="text-align:center;padding:60px 20px"><div style="font-family:Space Mono,monospace;font-size:10px;color:var(--muted)">MATCH INTROUVABLE · ID: '+fId+'</div><br><a href="/" style="color:var(--cyan);font-family:Space Mono,monospace;font-size:9px">← RETOUR</a></div>';
      return;
    }
    el.innerHTML=render(m);
  }catch(e){
    console.error(e);
    el.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--muted)">Erreur de chargement</div>';
  }
}
init();
