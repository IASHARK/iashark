# Relance par e-mail des inscrits (supabase/functions/relance-emails).
#   etat  : qui recevrait quoi (comptes par type et langue), rien n'est envoye
#   suivi : ce que Brevo a fait des e-mails de la campagne (sans adresse)
#   test  : tous les e-mails aux seuls comptes administrateurs (objet [TEST])
#   envoi : l'envoi reel, une fois par personne (phrase « ENVOYER LA RELANCE »)
# Envoi AUTOMATIQUE (demande de Clement) : mercredi 28/10/2026 a 11 h, heure de Paris (10:00 UTC,
# heure d'hiver). Declencheur principal : la tache pg_cron « relance-2026-10-28 » de la base
# (migration 0057), a l'heure exacte. Les taches planifiees GitHub de ce depot partent avec 3 a 6 h de
# retard : celles ci-dessous ne sont qu'un secours (la fonction refuse apres 15:00 UTC). Chaque
# personne n'est servie qu'une fois (email_reserve_send), rien ne part deux fois. Un autre jour (le
# declencheur revient chaque annee), rien n'est fait : garde de date ici ET dans la fonction.
# A la fusion sur main (push), la fonction est reinstallee depuis main et le mode etat s'affiche :
# la version appelee par pg_cron est donc toujours celle de main.
name: Relance e-mails
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/relance-emails/**"
      - ".github/workflows/relance-emails.yml"
  schedule:
    - cron: "0 10 28 10 *"
    - cron: "20 10 28 10 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "etat, suivi, test ou envoi"
        required: true
        default: etat
        type: choice
        options: [etat, suivi, test, envoi]
      confirmation:
        description: "Pour l'envoi reel : ENVOYER LA RELANCE"
        required: false
        default: ""
      exclure:
        description: "Comptes a ne pas relancer (identifiants separes par des virgules)"
        required: false
        default: ""
permissions:
  contents: read
# Jamais deux lancements en meme temps (le second attend la fin du premier).
concurrency:
  group: relance-emails
  cancel-in-progress: false
jobs:
  relance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Garde de date (envoi automatique)
        id: garde
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ "$EVENEMENT" = "schedule" ] && [ "$(date -u +%F)" != "2026-10-28" ]; then
            echo "Envoi automatique prevu le 2026-10-28 seulement (aujourd'hui $(date -u +%F)) : rien n'est fait."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.garde.outputs.go == 'true'
      # La fonction est installee depuis ce depot a chaque lancement (meme version que le test).
      # Jusqu'a 3 essais : le 28/10 a 05:37 UTC, l'assemblage chez Supabase a echoue une fois sur un
      # telechargement trop lent (jsr.io). En envoi automatique, un echec ici n'arrete pas tout : l'etape
      # suivante verifie d'abord que la version en ligne est bien celle du 28/10 (sinon rien ne part).
      - name: Installation de la fonction
        id: installation
        if: steps.garde.outputs.go == 'true'
        env:
          EVENEMENT: ${{ github.event_name }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RELANCE_SECRET: ${{ secrets.RELANCE_SECRET }}
          # Meme secret pour signer (relance-emails) et verifier (email-unsubscribe) les liens de desinscription.
          EMAIL_UNSUBSCRIBE_SECRET: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
          # Cle API Brevo collee par Clement dans les secrets GitHub (gh secret set BREVO_API_KEY).
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          npx -y supabase@2 secrets set "RELANCE_SECRET=$RELANCE_SECRET" "EMAIL_UNSUBSCRIBE_SECRET=$EMAIL_UNSUBSCRIBE_SECRET" --project-ref ksvjraqitxouwiabecai > /dev/null
          if [ -n "$BREVO_API_KEY" ]; then
            npx -y supabase@2 secrets set "BREVO_API_KEY=$(printf %s "$BREVO_API_KEY" | tr -d '\r\n ')" --project-ref ksvjraqitxouwiabecai > /dev/null
          fi
          for essai in 1 2 3; do
            if npx -y supabase@2 functions deploy relance-emails --project-ref ksvjraqitxouwiabecai --use-api; then
              echo "installee=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Installation : essai $essai echoue"; [ "$essai" = 3 ] || sleep 30
          done
          echo "installee=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENEMENT" = "schedule" ]; then
            echo "::warning::Fonction non reinstallee : la version deja en ligne sera verifiee avant l'envoi."
          else
            exit 1
          fi
      # Region fixe (Ohio, us-east-2) : Brevo n'accepte que les adresses autorisees par Clement
      # (plage IPv6 2600:1f16::/32) ; sans region fixe, l'adresse de depart change a chaque appel.
      - name: Appel de la fonction
        if: steps.garde.outputs.go == 'true'
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELANCE_SECRET: ${{ secrets.RELANCE_SECRET }}
          EVENEMENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXCLURE: ${{ inputs.exclure }}
        run: |
          KEY=$(printf %s "$KEY" | tr -d '\r\n ')
          PLANIFIE=false
          if [ "$EVENEMENT" = "schedule" ]; then
            # Envoi automatique demande par Clement : mode envoi, avec la phrase de confirmation.
            MODE=envoi; CONFIRMATION="ENVOYER LA RELANCE"; EXCLURE=""; PLANIFIE=true
          elif [ "$EVENEMENT" = "push" ]; then
            # Fusion sur main : reinstallation (etape precedente) puis etat, rien n'est envoye.
            MODE=etat; CONFIRMATION=""; EXCLURE=""
          fi
          appel() {
            curl -sS -o reponse.json -w "%{http_code}" -X POST "https://ksvjraqitxouwiabecai.supabase.co/functions/v1/relance-emails" \
              -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "x-relance-secret: $RELANCE_SECRET" -H "x-region: us-east-2" -H "Content-Type: application/json" --max-time 600 -d "$1"
          }
          if [ "$PLANIFIE" = true ]; then
            # Avant l'envoi automatique : la fonction en ligne doit etre celle de la campagne du 28/10.
            code=$(appel '{"mode":"etat"}')
            cle=$(jq -r '.cle // empty' reponse.json 2>/dev/null || true)
            echo "Verification : HTTP $code, campagne en ligne : ${cle:-inconnue}"
            if [ "$code" != "200" ] || [ "$cle" != "2026-10-28" ]; then
              echo "::error::La fonction en ligne n'est pas celle du 28/10 : rien n'est envoye."; exit 1
            fi
          fi
          corps=$(jq -nc --arg m "$MODE" --arg c "$CONFIRMATION" --arg x "$EXCLURE" --argjson p "$PLANIFIE" --arg b "$GITHUB_REF_NAME" '{mode:$m, confirmation:$c, exclure:$x, planifie:$p, branche:$b}')
          code=$(curl -sS -o reponse.json -w "%{http_code}" -X POST "https://ksvjraqitxouwiabecai.supabase.co/functions/v1/relance-emails" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "x-relance-secret: $RELANCE_SECRET" -H "x-region: us-east-2" -H "Content-Type: application/json" --max-time 600 -d "$corps")
          echo "HTTP $code (mode $MODE)"; jq . reponse.json || cat reponse.json
          [ "$code" = "200" ]
