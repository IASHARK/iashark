          // ── HISTORIQUE ───────────────────────────────────────────
          async function updateHistorique(matchsData){
            console.log('\n=== HISTORIQUE UPDATE ===');
            var histoPath='historique.json';
            var histo={predictions:[],stats:{winrate:0,roi:0,total:0,streak:0,wins:0,losses:0},monthly:[],backtesting:{}};
            try{histo=JSON.parse(fs.readFileSync(histoPath,'utf8'));}catch(e){}

            var yesterday=new Date(TODAY+'T12:00:00Z');yesterday.setDate(yesterday.getDate()-1);
            var yDate=yesterday.toISOString().split('T')[0];

            // Résolution football (résultats d'hier)
            try{
              var yFixtures=await get('https://v3.football.api-sports.io/fixtures?date='+yDate+'&timezone=Europe/Paris',APS);
              var yResults=(yFixtures.response||[]);
              for(var yr=0;yr<yResults.length;yr++){
                var fix=yResults[yr];
                var fid=fix.fixture&&fix.fixture.id;
                var homeN=fix.teams&&fix.teams.home&&fix.teams.home.name||'';
                var awayN=fix.teams&&fix.teams.away&&fix.teams.away.name||'';
                var gh=fix.goals&&fix.goals.home!=null?fix.goals.home:null;
                var ga=fix.goals&&fix.goals.away!=null?fix.goals.away:null;
                var status=fix.fixture&&fix.fixture.status&&fix.fixture.status.short||'';
                if(status!=='FT'&&status!=='AET'&&status!=='PEN')continue;
                if(gh===null||ga===null)continue;
                var found=histo.predictions.find(function(p){return p.result==='pending'&&p.fixture_id===fid;});
                if(!found)found=histo.predictions.find(function(p){return p.result==='pending'&&p.type==='single'&&p.sport!=='tennis'&&p.date&&p.date.substring(0,10)===yDate&&levenshtein((p.home||'').toLowerCase(),homeN.toLowerCase())<=3&&levenshtein((p.away||'').toLowerCase(),awayN.toLowerCase())<=3;});
                if(!found)continue;
                var pred=(found.prediction||'').toLowerCase();
                var isWin=false;
                if(pred.includes('over 2.5'))isWin=(gh+ga)>2;
                else if(pred.includes('over 1.5'))isWin=(gh+ga)>1;
                else if(pred.includes('over 3.5'))isWin=(gh+ga)>3;
                else if(pred.includes('under 2.5'))isWin=(gh+ga)<3;
                else if(pred.includes('btts non'))isWin=(gh===0||ga===0);
                else if(pred.includes('btts'))isWin=(gh>0&&ga>0);
                else if(pred.includes('1x')||pred.includes('dc 1x'))isWin=(gh>=ga);
                else if(pred.includes('x2')||pred.includes('dc x2'))isWin=(ga>=gh);
                else if(pred.includes('nul')||pred.includes('draw'))isWin=(gh===ga);
                found.result=isWin?'win':'loss';found.score=gh+'-'+ga;found.fixture_id=fid;found.resolved_date=yDate;
                console.log('  Résolu foot: '+found.match+' \u2192 '+found.result+' ('+gh+'-'+ga+')');
              }
            }catch(e){console.log('  Résultats hier erreur:',e.message);}

            // Résolution tennis (résultats d'hier)
            // On cherche les paris tennis pending d'hier et on les marque comme non-résolus si pas de résultat API
            // (le résultat tennis sera résolu par l'API tennis le lendemain)
            try{
              if(TENNIS_KEY){
                var tours=['atp','wta'];
                for(var t=0;t<tours.length;t++){
                  var tour=tours[t];
                  var yTennisFixtures=await getArr(TENNIS_BASE+'/tennis/v2/'+tour+'/fixtures?date='+yDate,TENNIS_HEADERS);
                  for(var ytf=0;ytf<yTennisFixtures.length;ytf++){
                    var tf=yTennisFixtures[ytf];
                    var tfId='t_'+(tf.id||tf.fixtureId||ytf);
                    var winnerId=tf.winnerId||tf.winner_id||(tf.winner&&tf.winner.id);
                    if(!winnerId)continue;
                    var p1Id=tf.player1&&tf.player1.id||tf.player1Id;
                    var p2Id=tf.player2&&tf.player2.id||tf.player2Id;
                    var p1Name=tf.player1&&tf.player1.name||'';
                    var p2Name=tf.player2&&tf.player2.name||'';
                    var foundT=histo.predictions.find(function(p){return p.result==='pending'&&p.sport==='tennis'&&(p.fixture_id===tfId||(p.home===p1Name&&p.away===p2Name&&p.date&&p.date.substring(0,10)===yDate));});
                    if(!foundT)continue;
                    var winnerName=winnerId===p1Id?p1Name:p2Name;
                    var predName=(foundT.prediction||'').toLowerCase();
                    var isWinT=predName.toLowerCase().includes(winnerName.toLowerCase().slice(0,4));
                    foundT.result=isWinT?'win':'loss';foundT.score=winnerName+' W';foundT.resolved_date=yDate;
                    console.log('  Résolu tennis: '+foundT.match+' \u2192 '+foundT.result);
                  }
                  await sleep(300);
                }
              }
            }catch(e){console.log('  Résultats tennis erreur:',e.message);}

            // Ajouter les nouveaux paris d'aujourd'hui
