            }
            var u = new URL(SUPA_URL_PIPELINE);
            var batchSize = 200;
            for(var i=0;i<rows.length;i+=batchSize){
              var batch = rows.slice(i,i+batchSize);
              var r = await upsertJSON(u.hostname, '/rest/v1/match_premium_data?on_conflict=fixture_id', batch, {
                'apikey': SUPA_SERVICE_KEY,
                'Authorization': 'Bearer '+SUPA_SERVICE_KEY,
                'Prefer': 'resolution=merge-duplicates,return=minimal',
              });
              if(!r.ok) console.log('  [premium] echec upsert batch '+i+': status='+r.status+' '+(r.error||r.body||'').toString().slice(0,200));
