name: Patch Form Dots + Contexte + Retrait match (correctif ponctuel v3)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Patch data.json
        run: |
          cat > patch.js << 'EOF'
          const fs = require('fs');
          const path = 'data.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          let patchedForm = 0;
          let patchedText = 0;
          let removed = 0;

          function hasTeams(m, a, b) {
            var h = (m.home && m.home.n || '').toLowerCase();
            var aw = (m.away && m.away.n || '').toLowerCase();
            a = a.toLowerCase(); b = b.toLowerCase();
            return (h.includes(a) && aw.includes(b)) || (h.includes(b) && aw.includes(a));
          }

          function toFormString(arr) {
            if (!Array.isArray(arr) || !arr.length) return null;
            return arr.map(function(f) { return f && f.result ? f.result : '?'; }).join('');
          }

          // Retrait complet : match France vs Angleterre (petite finale, recommandation
          // IA peu fiable car calculee sans savoir que c'est un match a faible enjeu)
          var before = (data.matchs || []).length;
          data.matchs = (data.matchs || []).filter(function(m) {
            return !hasTeams(m, 'france', 'england');
          });
          removed = before - data.matchs.length;

          data.matchs.forEach(function(m) {
            // Pastilles forme_h / forme_a
            var fh = toFormString(m.form_home);
            var fa = toFormString(m.form_away);
            if (fh) { m.forme_h = fh; patchedForm++; }
            if (fa) { m.forme_a = fa; patchedForm++; }

            // Contexte errone - Espagne vs Argentine = LA finale
            if (hasTeams(m, 'spain', 'argentina')) {
              m.contexte = "LA FINALE de la Coupe du Monde 2026, au MetLife Stadium (New York/New Jersey), dimanche 19 juillet. L'Argentine, championne du monde en titre, affronte l'Espagne, championne d'Europe en titre, pour le trophee mondial. Enjeu maximal : c'est le dernier match du tournoi, decisif pour l'histoire des deux nations.";
              patchedText++;
            }
          });

          fs.writeFileSync(path, JSON.stringify(data, null, 2));
          console.log('Match(s) retire(s) : ' + removed);
          console.log('Pastilles corrigees : ' + patchedForm);
          console.log('Textes contexte corriges : ' + patchedText);
          EOF
          node patch.js
          rm patch.js

      - name: Commit and push
        run: |
          git config user.name "IASHARK"
          git config user.email "yaramode81@gmail.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Correctif v3 : retrait match France-Angleterre + pastilles + contexte finale"
          git push
