name: Resultats - resolution continue

# ONGLET « HIER » : reglement des paris publies au fil des fins de match
# (docs/SPEC_RESULTATS_HIER.md, lot R1).
#
# POURQUOI CE JOB N'ECRIT RIEN DANS LE DEPOT
# Le compte Netlify a ete coupe pour depassement le 15/09/2026. Un commit
# toutes les 30 minutes declencherait un build a chaque passage. Ce job
# n'appelle donc JAMAIS git : il ecrit uniquement la table Supabase
# match_results (service role), que le navigateur lit directement. Les
# fichiers publics results/<date>.json sont ecrits une fois par jour par le
# pipeline quotidien (update-data.yml), au moment ou il commite deja.
#
# BUDGET API-SPORTS (quota 75 000 appels/jour, pipeline ~8 a 15 k)
# 18 passages par jour, 2 appels MAXIMUM par passage (constante MAX_APPELS) :
# 36 appels/jour au pire, et 0 sur un passage ou il n'y a rien a regler.
# L'appel « Coupe du monde » (league=1) n'est fait que si un pari non regle
# appartient vraiment a cette competition - sinon c'est un appel gaspille.
#
# FENETRE : 16:00 -> 00:30 UTC, soit 18:00 -> 02:30 heure de Paris en heure
# d'ete (17:00 -> 01:30 en heure d'hiver). C'est la plage ou les matchs
# europeens et sud-americains se terminent. Le site raisonne en heure de
# Paris, les crons GitHub sont en UTC : la conversion est faite explicitement
# dans le script (lib/match-results.js#parisDay).

on:
  # FONCTIONNALITE « HIER » LEVEE le 20/09/2026 a la demande du proprietaire :
  # plus aucun passage automatique. Le job reste lançable a la main. Pour le
  # reprendre : retirer les commentaires des trois crons ci-dessous.
  # schedule:
  #   - cron: '0,30 16-23 * * *'
  #   - cron: '0 0 * * *'
  #   - cron: '30 0 * * *'
  workflow_dispatch: {}

concurrency:
  # Groupe dedie : ne partage rien avec update-data (qui, lui, commite).
  group: results-refresh
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Aucune ecriture dans le depot : le jeton n'a besoin d'aucun droit.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ecrire le script de resolution
        run: |
          cat > results-refresh.js << 'JSEOF'
          'use strict';
          // Reglement des paris publies, toutes les 30 minutes.
          // Toute la logique de decision vit dans lib/match-results.js (pur,
          // teste par tests/match-results.test.js) : ici, uniquement des E/S.
          const https = require('https');
          const fs = require('fs');
          const MR = require('./lib/match-results.js');
          const PREMIUM_FIELDS_LIB = require('./lib/premium-fields.js');

          const APS_KEY = process.env.APISPORTS_KEY || '';
          const SUPA_URL = process.env.SUPABASE_URL || '';
          const SUPA_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY || '';
          // Budget dur : 2 appels API-Sports par passage, jamais plus.
          const MAX_APPELS = 2;
          // Retard rattrape : toutes les journees des 7 derniers jours, pas
          // seulement la veille (paris bloques depuis le 17/09/2026).
          const JOURS_RATTRAPAGE = 7;

          let appels = 0;
          const journal = [];
          function log(s) { console.log(s); }
          function budgetRestant() { return MAX_APPELS - appels; }

          function httpJson(options, body) {
            return new Promise(function (resolve) {
              const timer = setTimeout(function () { resolve({ ok: false, error: 'timeout' }); }, 20000);
              const req = https.request(options, function (res) {
                let d = '';
                res.on('data', function (c) { d += c; });
                res.on('end', function () {
                  clearTimeout(timer);
                  let parsed = null;
                  try { parsed = d ? JSON.parse(d) : null; } catch (e) { parsed = null; }
                  resolve({ ok: res.statusCode >= 200 && res.statusCode < 300, status: res.statusCode, json: parsed, body: d.slice(0, 300) });
                });
              });
              req.on('error', function (e) { clearTimeout(timer); resolve({ ok: false, error: (e && e.message) || 'network' }); });
              if (body) req.write(body);
              req.end();
            });
          }
          // API-Football. Chaque appel est compte : le budget est dur.
          async function apiSports(path) {
            if (budgetRestant() <= 0) { log('  [budget] appel refuse (' + MAX_APPELS + ' appels deja faits) : ' + path.split('?')[0]); return null; }
            appels++;
            const r = await httpJson({ hostname: 'v3.football.api-sports.io', path: path, method: 'GET', headers: { 'x-apisports-key': APS_KEY, 'User-Agent': 'IASHARK/1.0' } });
            if (!r.ok || !r.json || !Array.isArray(r.json.response)) {
              log('::warning title=Resultats::appel API-Football en echec (' + path.split('?')[0] + ') : status=' + (r.status || r.error));
              return null;
            }
            return r.json.response;
          }
          function supaHeaders(extra) {
            return Object.assign({ apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY, 'User-Agent': 'IASHARK/1.0' }, extra || {});
          }
          async function supaGet(path) {
            const u = new URL(SUPA_URL);
            const r = await httpJson({ hostname: u.hostname, path: '/rest/v1/' + path, method: 'GET', headers: supaHeaders() });
            if (!r.ok || !Array.isArray(r.json)) {
              log('::warning title=Resultats::lecture Supabase impossible (' + path.split('?')[0] + ') : status=' + (r.status || r.error) + ' ' + (r.body || ''));
              return null;
            }
            return r.json;
          }
          async function supaUpsert(table, rows, onConflict) {
            if (!rows.length) return true;
            const u = new URL(SUPA_URL);
            const body = JSON.stringify(rows);
            const r = await httpJson({
              hostname: u.hostname, path: '/rest/v1/' + table + '?on_conflict=' + onConflict, method: 'POST',
              headers: supaHeaders({ 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body), Prefer: 'resolution=merge-duplicates,return=minimal' }),
            }, body);
            if (!r.ok) log('::error title=Resultats::echec upsert ' + table + ' (' + rows.length + ' lignes) : status=' + (r.status || r.error) + ' ' + (r.body || ''));
            return r.ok;
          }

          function lireJson(chemin, defaut) {
            try { return JSON.parse(fs.readFileSync(chemin, 'utf8')); } catch (e) { return defaut; }
          }

          async function main() {
            if (!APS_KEY || !SUPA_URL || !SUPA_KEY) {
              log('::error title=Resultats::APISPORTS_KEY, SUPABASE_URL et SUPABASE_SERVICE_ROLE_KEY sont necessaires. Rien n a ete regle.');
              process.exit(1);
            }
            const maintenant = Date.now();
            const aujourdHui = MR.parisDay(maintenant);
            const jours = [aujourdHui];
            for (let i = 1; i <= JOURS_RATTRAPAGE; i++) jours.push(MR.ajouterJours(aujourdHui, -i));
            log('=== RESULTATS ' + aujourdHui + ' (heure de Paris) ===');

            const histo = lireJson('historique.json', { predictions: [] });
            const predictions = Array.isArray(histo.predictions) ? histo.predictions : [];
            const registre = lireJson('data/match-pages-registry.json', null);

            // 1) Les paris publies d'une journee, groupes comme lib/match-results.js
            // le fait (jour du MATCH, pas jour de publication) : meme index de
            // coups d'envoi, donc exactement la meme liste que buildDayFile.
            function parisDe(jour, fixturesParId, resultats) {
              return MR.parisDuJour(jour, predictions, archive, MR.indexerJoursDeMatch(fixturesParId || {}, resultats || [], registre));
            }

            // 2) predictions_archive (service role) : la version COMPLETE des
            //    paris masques dans le depot public. Lue directement ici, sans
            //    passer par la rehydratation du pipeline quotidien - c'est
            //    precisement elle qui est en echec depuis le 17/09/2026 et qui
            //    laisse tous les paris en 'scheduled'.
            const colonnes = 'fixture_id,match_label,home,away,' + PREMIUM_FIELDS_LIB.PENDING_REDACTED_FIELDS.join(',') + ',league,league_key,has_pinnacle,date,result,type,score';
            // predictions_archive.date est la date de PUBLICATION, pas celle du
            // match : le pipeline publie les matchs jusqu'a 2 jours a l'avance
            // (constate le 20/09/2026 : 135 des 136 paris en attente portaient sur
            // un match J+2). La fenetre lue est donc elargie de MARGE_PUBLICATION
            // jours, sinon les paris les plus anciens de la fenetre seraient
            // invisibles et resteraient non regles pour toujours.
            const MARGE_PUBLICATION = 4;
            const depuisArchive = MR.ajouterJours(aujourdHui, -(JOURS_RATTRAPAGE + MARGE_PUBLICATION));
            let archive = [];
            const rep = await supaGet('predictions_archive?select=' + colonnes + '&type=eq.single&date=gte.' + depuisArchive + '&limit=20000');
            if (Array.isArray(rep)) archive = rep;
            else log('::warning title=Resultats::predictions_archive illisible : les paris masques resteront non reglables ce passage (jamais regles a l aveugle).');
            log('  [archive] ' + archive.length + ' pari(s) relu(s) dans predictions_archive sur ' + jours.length + ' journee(s).');

            // 3) Lignes deja ecrites : un match deja regle ne consomme plus
            //    aucun appel API.
            const dejaRegles = await supaGet('match_results?select=fixture_id,day,result,scorer_result&day=in.(' + jours.join(',') + ')');
            const parFixtureRegle = {};
            (dejaRegles || []).forEach(function (r) { parFixtureRegle[String(r.fixture_id)] = r; });

            // 4) Rapport par journee AVANT tout appel API : il dit quelles
            //    journees ont encore du travail, et pourquoi.
            function rapportDe(jour, fixtures) {
              return MR.buildDayFile({
                day: jour, predictions: predictions, archiveRows: archive,
                results: dejaRegles || [], fixtures: fixtures || [], registry: registre,
              });
            }
            const aFaire = [];
            jours.forEach(function (j) {
              const out = rapportDe(j, []);
              // Un pari deja regle (ligne match_results ou historique deja a
              // jour) ne compte pas : seules les vraies lacunes restent.
              const restants = out.report.unsettled.filter(function (u) {
                const r = parFixtureRegle[String(u.fixture_id)];
                return !r || r.result === 'pending';
              });
              if (restants.length) aFaire.push({ jour: j, restants: restants.length, total: out.report.total });
            });
            if (!aFaire.length) {
              log('  Rien a regler sur les ' + jours.length + ' dernieres journees : 0 appel API.');
              return;
            }
            log('  Journees a regler : ' + aFaire.map(function (x) { return x.jour + ' (' + x.restants + '/' + x.total + ')'; }).join(', '));

            // 5) Priorite : aujourd'hui (matchs qui viennent de finir), puis la
            //    journee la plus ancienne encore en retard.
            // Rang : aujourd'hui (matchs qui viennent de finir), puis HIER, puis
            // la journee la plus ancienne encore en retard. Hier est prioritaire
            // parce que c'est la seule journee affichee sur l'accueil (onglet
            // « Hier ») : sans ce rang, le budget de 2 appels partait sur la plus
            // vieille journee en retard et l'onglet restait vide (20/09/2026).
            const hier = MR.jourDecale ? MR.jourDecale(aujourdHui, -1)
              : new Date(Date.parse(aujourdHui + 'T12:00:00Z') - 86400000).toISOString().slice(0, 10);
            function rang(j) { return j === aujourdHui ? 0 : j === hier ? 1 : 2; }
            const ordre = aFaire.slice().sort(function (a, b) {
              const ra = rang(a.jour), rb = rang(b.jour);
              if (ra !== rb) return ra - rb;
              return a.jour < b.jour ? -1 : 1;
            });

            const lignes = [];
            const rapports = [];
            let fixturesAujourdHui = {};
            for (let k = 0; k < ordre.length && budgetRestant() > 0; k++) {
              const jour = ordre[k].jour;
              // UN appel = tous les matchs de la date (meme endpoint que le
              // pipeline quotidien, jamais un appel par match).
              const fixtures = await apiSports('/fixtures?date=' + jour + '&timezone=Europe/Paris');
              if (!fixtures) break;
              let tous = fixtures;
              // Coupe du monde : appel supplementaire UNIQUEMENT si un pari non
              // regle de cette journee lui appartient vraiment.
              const premier = rapportDe(jour, tous);
              const manquants = premier.report.unsettled.filter(function (u) { return u.reason === MR.RAISON.FIXTURE_ABSENTE; });
              const aDuMondial = manquants.length && parisDe(jour, MR.indexerFixtures(tous), dejaRegles).some(function (p) {
                return /world cup|coupe du monde|mondial/i.test(String(p.league || '') + ' ' + String(p.league_key || ''));
              });
              if (aDuMondial && budgetRestant() > 0) {
                const wc = await apiSports('/fixtures?league=1&season=2026&date=' + jour + '&timezone=Europe/Paris');
                if (wc) tous = tous.concat(wc);
              }

              // Marches « tirs du match » : ils demandent /fixtures/statistics.
              // On en resout au plus un par passage (budget) ; le pipeline
              // quotidien, qui dispose du gros budget, finit le reste.
              const contexts = {};
              const parId = MR.indexerFixtures(tous);
              const aTirs = parisDe(jour, parId, dejaRegles).filter(function (p) {
                if (!/tirs( cadres)? du match/i.test(String(p.prediction || ''))) return false;
                const r = parFixtureRegle[String(p.fixture_id)];
                if (r && r.result !== 'pending') return false;
                const fx = parId[String(p.fixture_id)];
                return !!fx && MR.fixtureStatus(fx) && ['FT', 'AET', 'PEN'].indexOf(MR.fixtureStatus(fx)) !== -1;
              });
              // Le libelle complet du pari n'est disponible que si l'archive a
              // ete relue : sinon, la prediction est masquee et rien n'est tente.
              for (let s = 0; s < aTirs.length && budgetRestant() > 0; s++) {
                const stats = await apiSports('/fixtures/statistics?fixture=' + aTirs[s].fixture_id);
                if (!stats) break;
                const total = function (type) {
                  let trouves = 0;
                  const somme = stats.reduce(function (acc, b) {
                    const row = (b.statistics || []).find(function (x) { return x.type === type; });
                    const v = row ? parseFloat(row.value) : NaN;
                    if (Number.isFinite(v)) trouves++;
                    return acc + (Number.isFinite(v) ? v : 0);
                  }, 0);
                  // Les DEUX equipes doivent avoir la statistique, sinon le
                  // total est faux : on prefere laisser le pari en attente.
                  return trouves === 2 ? somme : null;
                };
                contexts[String(aTirs[s].fixture_id)] = { totalShots: total('Total Shots'), totalShotsOnTarget: total('Shots on Goal') };
              }

              const out = MR.buildDayFile({
                day: jour, predictions: predictions, archiveRows: archive,
                results: dejaRegles || [], fixtures: tous, contexts: contexts,
                registry: registre, generatedAt: new Date(maintenant).toISOString(),
              });
              rapports.push(out.report);
              if (jour === aujourdHui) fixturesAujourdHui = parId;
              const horodatage = new Date(maintenant).toISOString();
              out.file.matches.forEach(function (m) {
                const row = MR.matchResultRow(m, jour, horodatage);
                // matchResultRow rend null pour un match non termine : aucune
                // donnee de pari d'un match en cours n'atteint la table.
                if (row) lignes.push(row);
              });
              log('  ' + jour + ' : ' + out.file.totals.won + ' gagne(s), ' + out.file.totals.lost + ' perdu(s), ' +
                  out.file.totals.void + ' rembourse(s), ' + out.file.totals.pending + ' en attente (' + out.report.total + ' pari(s) publies).');
              MR.formatUnsettledLog(out.report).forEach(log);
            }

            // 6) Buteurs du jour : le nom n'est publie qu'une fois le match
            //    termine (comme le reste). Au plus 3 par jour, donc au plus 3
            //    appels /fixtures/events - et une seule fois, puisque la ligne
            //    match_results garde ensuite le resultat.
            try { await reglerButeurs(aujourdHui, lignes, parFixtureRegle, fixturesAujourdHui); }
            catch (e) { log('  [buteurs] non resolus ce passage : ' + (e && e.message)); }

            const ok = await supaUpsert('match_results', lignes, 'fixture_id');
            log('  [match_results] ' + (ok ? lignes.length + ' ligne(s) ecrite(s)' : 'ECHEC d ecriture') + ', ' + appels + ' appel(s) API-Football ce passage.');

            // 7) Alerte : plus de 10 % des paris d'une journee toujours non
            //    regles 24 h apres. C'est le signal qui manquait depuis le
            //    17/09/2026 (les paris restaient 'scheduled' en silence).
            rapports.forEach(function (r) {
              const w = MR.unsettledWarning(r, { nowMs: maintenant });
              if (w) log(w);
            });
          }

          // Buteur du jour : identite reconstruite exactement comme le
          // pipeline (lib/buteurs-du-jour.js#resolvePick) a partir des FAITS
          // publics deja commites (match/<id>.json : feuilles de match,
          // effectifs, absents) completes par les seules valeurs premium dont
          // le modele a besoin (lambda_h / lambda_a, lues en service role).
          // Aucun nom n'est devine : sans identite sure, rien n'est ecrit.
          async function reglerButeurs(jour, lignes, parFixtureRegle, fixturesParId) {
            const fichier = lireJson('buteurs-du-jour.json', null);
            const entrees = (fichier && fichier.days && fichier.days[jour]) || [];
            if (!entrees.length) return;
            const parFixture = {};
            lignes.forEach(function (l) { parFixture[String(l.fixture_id)] = l; });
            // Uniquement les matchs dont on vient d'etablir qu'ils sont termines.
            const aFaire = entrees.filter(function (e) {
              const l = parFixture[String(e.match_id)];
              if (!l) return false;
              const deja = parFixtureRegle[String(e.match_id)];
              return !(deja && deja.scorer_result && deja.scorer_result !== 'pending');
            });
            if (!aFaire.length || budgetRestant() <= 0) return;
            const BUTEURS = require('./lib/buteurs-du-jour.js');
            const ids = aFaire.map(function (e) { return e.match_id; });
            const premium = await supaGet('match_premium_data?select=fixture_id,premium_fields&fixture_id=in.(' + ids.join(',') + ')');
            const lambdas = {};
            (premium || []).forEach(function (r) {
              const pf = r && r.premium_fields && typeof r.premium_fields === 'object' ? r.premium_fields : {};
              lambdas[String(r.fixture_id)] = { lambda_h: pf.lambda_h, lambda_a: pf.lambda_a };
            });
            for (let i = 0; i < aFaire.length && budgetRestant() > 0; i++) {
              const e = aFaire[i];
              const brut = lireJson('match/' + e.match_id + '.json', null);
              if (!brut) { log('  [buteurs] match ' + e.match_id + ' : donnees publiques absentes, buteur non resolu.'); continue; }
              const enrichi = Object.assign({}, brut, lambdas[String(e.match_id)] || {});
              const joueur = BUTEURS.resolvePick(enrichi, e.match_rank);
              if (!joueur || !joueur.name) { log('  [buteurs] match ' + e.match_id + ' : joueur non identifie, rien n est ecrit.'); continue; }
              const events = await apiSports('/fixtures/events?fixture=' + e.match_id);
              if (!events) break;
              const ligne = parFixture[String(e.match_id)];
              // Le statut vient de la fixture REELLE relue ce passage : jamais
              // d'un statut suppose a partir de la ligne deja construite.
              const fixtureReelle = fixturesParId[String(e.match_id)] || null;
              const r = MR.resolveScorerPick(
                { match_id: e.match_id, player_id: joueur.player_id, player: joueur.name, match: ligne.home + ' - ' + ligne.away },
                fixtureReelle,
                events
              );
              ligne.scorer_player = r.player;
              ligne.scorer_goals = r.goals;
              ligne.scorer_result = r.result;
              log('  [buteurs] match ' + e.match_id + ' : ' + r.result + (r.goals != null ? ' (' + r.goals + ' but(s))' : ''));
            }
          }

          main().catch(function (e) { console.error('FATAL:', e && e.message, e && e.stack); process.exit(1); });
          JSEOF

      - name: Regler les paris publies et ecrire match_results
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node results-refresh.js
