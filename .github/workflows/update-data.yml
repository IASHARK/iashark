              await sleep(400);
              var batch2=await Promise.all([getOdds(f.id),getInjuries(f.id),getH2H(home.id,away.id),getWeather(f.venue&&f.venue.city?f.venue.city:''),getNews(home.name),getNews(away.name),getPredictions(f.id),getLineups(f.id),getRefereeStats(f.referee||null),getTopScorers(home.id,lg.id),getTopScorers(away.id,lg.id),getPinnacleOdds(home.name,away.name,lgKey(lg.id))]);
              await sleep(400);

