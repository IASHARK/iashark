name: Canal Telegram IASHARK

# Messages du canal t.me/iasharkdata (27/09/2026, valide par Clement).
# - Des que les analyses du jour sont publiees (Update IASHARK Daily, vers
#   13h Paris) : resultats d'hier + image du match gratuit.
# - 9h Paris : le guide du jour (blog). 15h : sondage sur l'affiche du soir.
#   18h : l'actu foot.
# Les crons tournent aux 2 heures UTC possibles (ete / hiver) ; le script ne
# garde que celle qui tombe a la bonne heure de Paris.
#
# SECURITE : tout part dans la conversation privee de Clement (TELEGRAM_CHAT_ID),
# avec les boutons « Publier sur le canal » / « Ne pas publier » : il valide
# chaque message d'un clic (scripts/telegram/send-posts.mjs). L'envoi direct sur
# le canal n'existe que si TELEGRAM_AUTO=1 ET TELEGRAM_CHANNEL_ID sont poses
# (decision de Clement, pas en place : TELEGRAM_AUTO n'est pas dans ce workflow).
# Secrets : TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (deja la pour les videos),
# TELEGRAM_CHANNEL_ID (@iasharkdata).

on:
  workflow_run:
    workflows: ["Update IASHARK Daily"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '5 7,8 * * *'    # guide, 9h Paris
    - cron: '5 13,14 * * *'  # sondage, 15h Paris
    - cron: '5 16,17 * * *'  # actu, 18h Paris
  workflow_dispatch:
    inputs:
      slot:
        description: "Quels messages"
        type: choice
        options: [tout, apres-maj, sondage, actu, guide]
        default: tout
      test:
        description: "Test : envoyer dans ma conversation privee, pas sur le canal"
        type: boolean
        default: true
  # Essai de la branche de travail : tout part en TEST dans la conversation privee.
  push:
    branches: [telegram-canal]
    paths:
      - 'scripts/telegram/**'
      - 'lib/telegram-posts.js'
      - '.github/workflows/telegram-canal.yml'

concurrency:
  group: telegram-canal
  cancel-in-progress: false

jobs:
  canal:
    # Calcul du matin en echec (panne du moteur v3, ecriture Supabase...) : le canal
    # tourne quand meme sur les donnees deja publiees (le match gratuit n'est envoye
    # que si les donnees du jour sont la), et Clement est prevenu en prive
    # (avocat du diable, 2e revue : une panne ne doit plus tout faire taire).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Choix des messages
        id: slot
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_TEST: ${{ inputs.test }}
        run: |
          H=$(TZ=Europe/Paris date +%-H)
          TEST=0; SLOT=""
          case "$EVENT" in
            workflow_run)
              # Pas de message la nuit (le calcul tourne parfois apres minuit) :
              # le run suivant de la journee enverra.
              if [ "$H" -ge 8 ] && [ "$H" -lt 21 ]; then SLOT=apres-maj; fi ;;
            schedule)
              case "$H" in 9) SLOT=guide ;; 15) SLOT=sondage ;; 18) SLOT=actu ;; esac ;;
            workflow_dispatch)
              SLOT="$INPUT_SLOT"; [ "$INPUT_TEST" = "true" ] && TEST=1 ;;
            push)
              SLOT=tout; TEST=1 ;;
          esac
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"
          echo "Heure de Paris : ${H}h -> messages : ${SLOT:-aucun} (test=$TEST)"

      - name: Prevenir Clement (calcul du matin en echec)
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "::warning title=Canal Telegram::le calcul du matin a echoue : messages faits sur les donnees deja publiees"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ Le calcul du matin a échoué (voir l'e-mail de GitHub). Le canal utilise les données déjà publiées : pas de match gratuit si celles du jour manquent. Il partira quand le calcul relancé aura réussi." > /dev/null || true
          fi

      # Une seule fois par jour et par message (le calcul du jour tourne parfois
      # plusieurs fois) : une cle de cache sert de memoire. Contre-controle de
      # l'avocat du diable (30/09/2026) : une cle PAR MESSAGE (resultats d'hier,
      # match gratuit), posee seulement quand ce message est VRAIMENT parti. Un
      # calcul du matin en echec (donnees du jour absentes) n'envoie que les
      # resultats : le match gratuit n'est pas consomme et partira apres le calcul
      # relance avec succes.
      - name: Deja envoye aujourd'hui ? (resultats d'hier)
        id: deja_resultats
        if: ${{ steps.slot.outputs.slot == 'apres-maj' && steps.slot.outputs.test == '0' }}
        uses: actions/cache/restore@v4
        with:
          path: .telegram-envoye
          key: telegram-${{ steps.slot.outputs.date }}-resultats
          lookup-only: true

      - name: Deja envoye aujourd'hui ? (match gratuit)
        id: deja_match
        if: ${{ steps.slot.outputs.slot == 'apres-maj' && steps.slot.outputs.test == '0' }}
        uses: actions/cache/restore@v4
        with:
          path: .telegram-envoye
          key: telegram-${{ steps.slot.outputs.date }}-match
          lookup-only: true

      - name: Deja envoye aujourd'hui ? (autre creneau)
        id: deja_autre
        if: ${{ steps.slot.outputs.slot != '' && steps.slot.outputs.slot != 'apres-maj' && steps.slot.outputs.test == '0' }}
        uses: actions/cache/restore@v4
        with:
          path: .telegram-envoye
          key: telegram-${{ steps.slot.outputs.date }}-${{ steps.slot.outputs.slot }}
          lookup-only: true

      - name: Messages a preparer
        id: afaire
        if: ${{ steps.slot.outputs.slot != '' }}
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          DEJA_RESULTATS: ${{ steps.deja_resultats.outputs.cache-hit }}
          DEJA_MATCH: ${{ steps.deja_match.outputs.cache-hit }}
          DEJA_AUTRE: ${{ steps.deja_autre.outputs.cache-hit }}
        run: |
          A="$SLOT"
          if [ "$SLOT" = "apres-maj" ]; then
            if [ "$DEJA_RESULTATS" = "true" ] && [ "$DEJA_MATCH" = "true" ]; then A=""
            elif [ "$DEJA_RESULTATS" = "true" ]; then A="match"
            elif [ "$DEJA_MATCH" = "true" ]; then A="resultats"
            fi
          elif [ "$DEJA_AUTRE" = "true" ]; then A=""
          fi
          echo "slot=$A" >> "$GITHUB_OUTPUT"
          echo "Messages a preparer : ${A:-aucun, deja envoyes ce jour}"

      - uses: actions/checkout@v4
        if: ${{ steps.afaire.outputs.slot != '' }}
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - uses: actions/setup-node@v4
        if: ${{ steps.afaire.outputs.slot != '' }}
        with:
          node-version: '20'
          cache: npm

      - name: Dependances (navigateur pour l'image)
        if: ${{ steps.afaire.outputs.slot != '' }}
        env:
          SLOT: ${{ steps.afaire.outputs.slot }}
        run: |
          npm ci
          if [ "$SLOT" = "apres-maj" ] || [ "$SLOT" = "match" ] || [ "$SLOT" = "tout" ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Preparation des messages
        if: ${{ steps.afaire.outputs.slot != '' }}
        env:
          SLOT: ${{ steps.afaire.outputs.slot }}
        run: node scripts/telegram/build-posts.mjs --slot "$SLOT" --out "$RUNNER_TEMP/telegram"

      - name: Envoi Telegram
        id: envoi
        if: ${{ steps.afaire.outputs.slot != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TEST: ${{ steps.slot.outputs.test }}
        run: node scripts/telegram/send-posts.mjs "$RUNNER_TEMP/telegram"

      # Ce qui est VRAIMENT parti (envoyes.txt, ecrit par send-posts.mjs apres chaque
      # message accepte par Telegram), meme si un envoi suivant a echoue.
      - name: Ce qui est parti
        id: parti
        if: ${{ always() && steps.afaire.outputs.slot != '' && steps.slot.outputs.test == '0' }}
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          ENVOI: ${{ steps.envoi.outcome }}
        run: |
          F="$RUNNER_TEMP/telegram/envoyes.txt"
          for s in resultats match; do
            if [ -f "$F" ] && grep -qx "$s" "$F"; then echo "$s=1" >> "$GITHUB_OUTPUT"; fi
          done
          if [ "$SLOT" != "apres-maj" ] && [ "$ENVOI" = "success" ]; then echo "autre=1" >> "$GITHUB_OUTPUT"; fi
          mkdir -p .telegram-envoye && date > .telegram-envoye/ok

      - name: Memoriser l'envoi du jour (resultats d'hier)
        if: ${{ always() && steps.parti.outputs.resultats == '1' }}
        uses: actions/cache/save@v4
        with:
          path: .telegram-envoye
          key: telegram-${{ steps.slot.outputs.date }}-resultats

      - name: Memoriser l'envoi du jour (match gratuit)
        if: ${{ always() && steps.parti.outputs.match == '1' }}
        uses: actions/cache/save@v4
        with:
          path: .telegram-envoye
          key: telegram-${{ steps.slot.outputs.date }}-match

      - name: Memoriser l'envoi du jour (autre creneau)
        if: ${{ always() && steps.parti.outputs.autre == '1' }}
        uses: actions/cache/save@v4
        with:
          path: .telegram-envoye
          key: telegram-${{ steps.slot.outputs.date }}-${{ steps.slot.outputs.slot }}

      # Copie des messages et de l'image (7 jours) pour verifier ce qui est parti.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.afaire.outputs.slot != '' }}
        with:
          name: telegram-${{ github.run_id }}
          path: ${{ runner.temp }}/telegram
          retention-days: 7
          if-no-files-found: ignore
