name: Canal Pro IASHARK

# MESSAGES PRO EN PRIVE (02/10/2026, decision de Clement) : plus de canal Pro commun. Le programme
# valide, les debriefs, le bilan, le Loto Foot et le programme reporte partent en message prive, un a
# un, a chaque abonne Pro (actif ou en essai) relie au robot, dans sa langue (memes chiffres pour tous).
# Rien a creer sur Telegram : pas de canal, pas d'identifiant de canal.
#
# Robot planifie des messages Pro et du robot personnel (V3, 30/09/2026 ; MENU
# branche le 30/09 : REGLE-VIP.md). Toutes les 15 minutes,
# scripts/canal-pro/tourner.mjs fait ce qui est du a cette heure-ci (heure de Paris) :
#   8 h 15 programme prepare = le MENU (sortie du moteur v3 deposee chaque matin
#   par « Update IASHARK Daily » dans la table privee moteur_v3_sorties, puis
#   cotes de Pinnacle et des 5 agrees suivis) : jusqu'a 3 simples et 1 combine
#   du jour, 1 meme match avec buteur le samedi et le dimanche, les tickets du
#   week-end le vendredi · 8 h 45 envoye a Clement (Valider / Modifier /
#   Annuler) · 10 h 30 rappel · 12 h sans clic : rien ne part · 9 h 30 (ou
#   des le clic) envoi prive aux abonnes Pro + messages personnels · cotes toutes
#   les 30 min de 8 h a 23 h (alertes) · compositions vers H-55 · meteo H-3 ·
#   reglement apres le match · debriefs 8 h 30 et 23 h 30 (dimanche 23 h 15) ·
#   bilan obligatoire le lundi 12 h 30 · Loto Foot la veille a 18 h et 2 h
#   avant la cloture · duel propose a 10 h (sans lot), revele au coup d'envoi,
#   resultat a 9 h. Chaque message Pro est PROPOSE a Clement (« Envoyer aux abonnés Pro »),
#   sauf l'automatique qu'il allume type par type (/automatique, eteint par
#   defaut). Debriefs, bilan et duel sont obligatoires : pas de « Ne pas
#   publier », reproposes toutes les 3 h jusqu'a leur envoi. Chaque tour rattrape les envois prives
#   pas encore faits (abonne refuse par Telegram, compte relie entre-temps). Chaque soir,
#   l'empreinte du dernier pari est publiee dans la branche canal-pro-ancre
#   (ancre publique SEULEMENT si le depot est public : decision de Clement).
# RODAGE par defaut : tant que Clement n'a pas tape /canalpro puis « Ouvrir
# les envois Pro » dans le robot, tout arrive dans SA conversation privee, et aucun abonne ne recoit rien.
# Le lundi 12 h 30 : « Ma semaine en image » pour chaque abonne relie.
# Cout : environ 70 lancements par jour (minutes GitHub Actions, a surveiller
# si le depot est prive).
#
# Secrets utilises (deja en place) : SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, ODDS_API_KEY, APISPORTS_KEY,
# OPENWEATHER_KEY.

on:
  schedule:
    - cron: '*/15 6-22 * * *'   # toutes les 15 min de 7 h/8 h a minuit (Paris)
    - cron: '0 0-5,23 * * *'    # la nuit : une fois par heure (reglement des matchs)
  workflow_dispatch:
    inputs:
      tache:
        description: "Une seule tache (vide = tour normal)"
        type: choice
        options: ['', programme, renvoi, cotes, compositions, meteo, regler, debrief_matin, debrief_soir, ancre, bilan_semaine, loto_foot, duel, a_publier, diffusions, semaine_en_image]
        default: ''

concurrency:
  group: canal-pro
  cancel-in-progress: false

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write   # uniquement pour l'ancre quotidienne (branche canal-pro-ancre)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/canal-pro
            scripts/telegram
            supabase/functions/_shared
            lib
            config/leagues.json
            config/moteur-v3.json
            config/quotas.json
            data/quotas-etat.json
            data.json
            data-home.json
            data/match-pages-registry.json
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Est-ce l'heure de « Ma semaine en image » (lundi 12 h 30 - 13 h, Paris) ?
        id: image
        env:
          TACHE: ${{ inputs.tache }}
        run: |
          J=$(TZ=Europe/Paris date +%u); H=$(TZ=Europe/Paris date +%H%M)
          if [ "$TACHE" = "semaine_en_image" ] || { [ -z "$TACHE" ] && [ "$J" = "1" ] && [ "$H" -ge 1230 ] && [ "$H" -lt 1300 ]; }; then echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - name: Tour du robot
        if: ${{ inputs.tache != 'semaine_en_image' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          DATA_JSON: data.json
          # Competitions preferees (information, 03/10/2026) : pages publiees et resultats d'hier, fichiers du pipeline.
          DATA_HOME_JSON: data-home.json
          REGISTRE_PAGES: data/match-pages-registry.json
          ANCRE_FICHIER: ${{ runner.temp }}/ancre.txt
          TACHE: ${{ inputs.tache }}
        run: |
          if [ -n "$TACHE" ]; then node scripts/canal-pro/tourner.mjs --tache "$TACHE"; else node scripts/canal-pro/tourner.mjs; fi
      # Le depot est extrait EN PARTIE (sparse-checkout ci-dessus) : un dossier de travail
      # « git worktree » herite de cette extraction et « git add ancre/… » y est refuse.
      # Le commit est donc fabrique sans dossier de travail (hash-object, mktree,
      # commit-tree), puis pousse. Une seule ligne par jour : si la date est deja dans la
      # branche, rien n'est fait (le tour suivant peut donc reessayer sans doublon).
      # Rejoue sur un depot jouet par tests/canal-pro.test.mjs.
      - name: Ancre publique de l'archive (empreinte du dernier pari, une fois par jour)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/ancre.txt"; [ -s "$A" ] || exit 0
          JOUR=$(cut -d' ' -f1 "$A")
          git config user.name "IASHARK robot"; git config user.email "robot@iashark.com"
          PARENT=""; ANCIEN=""
          if git fetch -q origin canal-pro-ancre 2>/dev/null; then
            PARENT=$(git rev-parse FETCH_HEAD)
            ANCIEN=$(git show "$PARENT:ancre/empreintes.txt" 2>/dev/null || true)
          fi
          if grep -q "^$JOUR " <<< "$ANCIEN"; then echo "Ancre du $JOUR deja publiee" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          BLOB=$({ if [ -n "$ANCIEN" ]; then printf '%s\n' "$ANCIEN"; fi; cat "$A"; } | git hash-object -w --stdin)
          SOUS=$(printf '100644 blob %s\tempreintes.txt\n' "$BLOB" | git mktree)
          ARBRE=$(printf '040000 tree %s\tancre\n' "$SOUS" | git mktree)
          if [ -n "$PARENT" ]; then COMMIT=$(git commit-tree "$ARBRE" -p "$PARENT" -m "Ancre Canal Pro $JOUR");
          else COMMIT=$(git commit-tree "$ARBRE" -m "Ancre Canal Pro $JOUR"); fi
          git push -q origin "$COMMIT:refs/heads/canal-pro-ancre"
          echo "Ancre publiee : $(cat "$A")" >> "$GITHUB_STEP_SUMMARY"
      - name: Ma semaine en image (navigateur pour fabriquer l'image)
        if: ${{ steps.image.outputs.go == '1' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node scripts/canal-pro/semaine-en-image.mjs
