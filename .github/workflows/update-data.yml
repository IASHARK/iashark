          // Forme depuis past matches — match_winner = id du gagnant
          function calcTennisForm(matches, playerId) {
            var res=[];
            (matches||[]).forEach(function(m){
              if(!m.match_winner||m.result_type==='upcoming') return;
              res.push(String(m.match_winner)===String(playerId)?'W':'L');
            });
            return res.slice(0,5).join('');
          }

          // Forme sur CETTE surface spécifiquement depuis les matchs récents
          // On déduit la surface depuis le tournoi si disponible
          function calcTennisFormOnSurface(matches, playerId, surface) {
            var surfLow=(surface||'').toLowerCase();
            var courtMatch=surfLow.includes('clay')?'clay':surfLow.includes('grass')?'grass':'hard';
            var res=[];
            (matches||[]).forEach(function(m){
              if(!m.match_winner||m.result_type==='upcoming') return;
              // Filtre surface si disponible dans le match
              var mSurf=((m.tournament&&m.tournament.court&&m.tournament.court.name)||'').toLowerCase();
              if(mSurf&&!mSurf.includes(courtMatch)&&!(courtMatch==='hard'&&mSurf.includes('hard'))) return;
              res.push(String(m.match_winner)===String(playerId)?'W':'L');
            });
            return res.slice(0,5).join('');
          }

          // Stats surface depuis surface-summary → data[].surfaces[]
          // surface-summary retourne les valeurs en string, profile retourne en int
          // Calcule winrate surface depuis past-matches — marche pour TOUS les joueurs
          // past-matches retourne chaque match avec tournament.court.name
          // Stats surface depuis past-matches — marche pour TOUS les joueurs
          function calcSurfaceStatsForPlayer(matches, playerId, surface) {
            if(!matches||!matches.length||!surface||!playerId) return null;
            var surfLow=(surface||'').toLowerCase();
            var target=surfLow.includes('clay')?'clay':surfLow.includes('grass')?'grass':'hard';
            var wins=0,losses=0;
            matches.forEach(function(m){
              if(!m.match_winner||m.result_type==='upcoming'||m.result_type==='retired') return;
              var court=(m.tournament&&m.tournament.court&&m.tournament.court.name||'').toLowerCase();
              var isTarget=target==='grass'?court.includes('grass'):
                           target==='clay'?court.includes('clay'):
                           (court.includes('hard'));
              if(!isTarget) return;
              var won=String(m.match_winner)===String(playerId);
              if(won) wins++; else losses++;
            });
            if(wins+losses===0) return null;
            return {wins:wins,losses:losses,total:wins+losses,winrate:Math.round(wins/(wins+losses)*100)};
          }

          // Stats surface depuis surface-summary — années adaptées par surface
          // Gazon : 3 ans (saison courte de 3 semaines)
          // Terre/Dur : 2 ans (saison plus longue)
          function calcSurfaceStats(surfData, surface) {
            if(!surfData||!surface) return null;
            var surfLow=(surface||'').toLowerCase();
            var isGrass=surfLow.includes('grass');
            var isClay=surfLow.includes('clay');
            var target=isClay?'Clay':isGrass?'Grass':'Hard';
            var yearsBack=isGrass?3:2; // gazon 3 ans, reste 2 ans
            var wins=0,losses=0;
            var years=Array.isArray(surfData)?surfData:[];
            var currentYear=new Date().getFullYear();
            var filtered=years.filter(function(yr){return parseInt(yr.year)>=currentYear-yearsBack;});
            if(!filtered.length) filtered=years.slice(0,yearsBack);
            filtered.forEach(function(yr){
              (yr.surfaces||[]).forEach(function(s){
                var cn=(s.court||'').toLowerCase();
                // Matcher Hard et I.hard ensemble
                var match=target==='Hard'?(cn==='hard'||cn==='i.hard'):cn===target.toLowerCase();
                if(match){
                  wins+=parseInt(s.courtWins)||0;
                  losses+=parseInt(s.courtLosses)||0;
                }
              });
            });
            if(wins+losses===0) return null;
            var label=isGrass?'3 ans':isClay?'2 ans':'2 ans';
            return {wins:wins,losses:losses,total:wins+losses,
                    winrate:Math.round(wins/(wins+losses)*100),
                    label:label};
          }

          // Calcul des stats service depuis getPlayerMatchStats
          function calcServiceStats(stats) {
            if(!stats||!stats.serviceStats) return null;
            var sv=stats.serviceStats, rt=stats.rtnStats;
            var bpSv=stats.breakPointsServeStats, bpRt=stats.breakPointsRtnStats;
            function pct(a,b){return b&&b>0?Math.round(a/b*100):null;}
            return {
              // Service
              firstServePct: pct(sv.firstServeGm, sv.firstServeOfGm),
              winsOn1st: pct(sv.winningOnFirstServeGm, sv.firstServeGm),
              winsOn2nd: pct(sv.winningOnSecondServeGm, sv.winningOnSecondServeOfGm),
              bpSavedPct: pct(bpSv.breakPointSavedGm, bpSv.breakPointFacedGm),
              // Retour
              winsRtnOn1st: pct(rt.winningOnFirstServeGm, rt.firstServeOfGm),
              winsRtnOn2nd: pct(rt.winningOnSecondServeGm, rt.winningOnSecondServeOfGm),
              bpConvertedPct: pct(bpRt.breakPointWonGm, bpRt.breakPointChanceGm),
            };
          }

          // Filtre tournois Main tour uniquement (250+)
          function isMainTourMatch(parsed) {
            var tr=(parsed.tourRank||'').toLowerCase();
            return tr.includes('main tour')||tr.includes('grand slam')||
                   tr.includes('1000')||tr.includes('500')||tr.includes('250')||
                   tr.includes('finals')||tr.includes('wta')||tr.includes('atp');
          }

          // ── PROMPT TENNIS ────────────────────────────────────────
          async function genAnalyseTennis(d) {
            var surfaceLabel = (d.surface||'').toLowerCase().includes('clay')?'Terre battue':
                               (d.surface||'').toLowerCase().includes('grass')?'Gazon':'Dur';

            // Shin depuis cotes
            var shinProbs = d.shinProbs||null;
            if(!shinProbs&&d.c1&&d.c1!=='--'&&d.c2&&d.c2!=='--'){
              var raw=shinProbabilities([parseFloat(d.c1),parseFloat(d.c2)]);
              if(raw&&raw.length===2) shinProbs={p1:Math.round(raw[0]*100),p2:Math.round(raw[1]*100)};
            }
            var probIAP1 = shinProbs?shinProbs.p1:(d.c1&&d.c1!=='--'?Math.round(100/parseFloat(d.c1)):50);
            var probIAP2 = 100-probIAP1;

            function calcEdge(probIA,cote){
              if(!probIA||!cote||cote==='--') return null;
              var e=probIA/100-1/parseFloat(cote);
              return e>0?Math.round(e*100):null;
            }
            var edgeP1=calcEdge(probIAP1,d.c1), edgeP2=calcEdge(probIAP2,d.c2);
            var kellyP1=edgeP1&&d.c1&&d.c1!=='--'?fractionalKelly(probIAP1/100,parseFloat(d.c1),0.25):null;
            var kellyP2=edgeP2&&d.c2&&d.c2!=='--'?fractionalKelly(probIAP2/100,parseFloat(d.c2),0.25):null;

            // Formatage stats service
            function fmtSv(sv,name){
              if(!sv) return name+': stats non disponibles';
              return name+':\n'
                +'  1ère balle rentrée: '+(sv.firstServePct||'?')+'%\n'
                +'  Points gagnés sur 1ère balle: '+(sv.winsOn1st||'?')+'%\n'
                +'  Points gagnés sur 2ème balle: '+(sv.winsOn2nd||'?')+'%\n'
                +'  Break points sauvés: '+(sv.bpSavedPct||'?')+'%\n'
                +'  Break points convertis en retour: '+(sv.bpConvertedPct||'?')+'%\n'
                +'  Points gagnés en retour 2ème balle adverse: '+(sv.winsRtnOn2nd||'?')+'%';
            }

            // Stats surface
            var surf1Str=d.surf1?d.surf1.wins+'V/'+d.surf1.losses+'D sur '+surfaceLabel+' cette saison ('+d.surf1.winrate+'% winrate)':'Non disponible';
            var surf2Str=d.surf2?d.surf2.wins+'V/'+d.surf2.losses+'D sur '+surfaceLabel+' cette saison ('+d.surf2.winrate+'% winrate)':'Non disponible';

            // H2H
            var h2hTotal=(d.h2hP1Wins||0)+(d.h2hP2Wins||0);
            var h2hStr=h2hTotal>0?d.p1+' mène '+(d.h2hP1Wins||0)+'-'+(d.h2hP2Wins||0)+' sur '+h2hTotal+' confrontations':'Aucun H2H disponible';

            // Surface-specific context
            var surfContext=surfaceLabel==='Gazon'
              ?'GAZON : Service dominant, rebond bas. Les grands serveurs et volleyeurs sont avantagés. Les échanges sont courts. Le % 1ère balle et aces sont cruciaux. Les matchs se jouent souvent au service.'
              :surfaceLabel==='Terre battue'
              ?'TERRE BATTUE : Échanges longs, rebond haut. Les joueurs de fond de court défensifs sont avantagés. Le % 2ème balle et les breaks sont déterminants. La fatigue physique joue un rôle majeur.'
              :'DUR : Surface équilibrée. Le service compte mais le retour est efficace. Les stats de 2ème balle et de breaks sont les meilleurs prédicteurs.';

            var prompt =
              '=== ANALYSE TENNIS — '+surfaceLabel.toUpperCase()+' ===\n'
              +d.p1+(d.seed1?' [Seed #'+d.seed1+']':'')+' vs '+d.p2+(d.seed2?' [Seed #'+d.seed2+']':'')+' — '+(d.tournament||'')+(d.round?' ('+d.round+')':'')+'\n'
              +'Date: '+d.date+' | Surface: '+surfaceLabel+' | '+d.tourRank+'\n\n'


              +'=== CONTEXTE SURFACE ===\n'
              +surfContext+'\n\n'

              +'=== CLASSEMENT & PROFIL ===\n'
              +'⚠ IMPORTANT : Le classement ATP/WTA est calculé sur TOUTES surfaces. Un joueur bien classé peut être mauvais sur cette surface spécifique. Ne pas utiliser le classement seul comme signal fort.\n\n'
              +d.p1+' : ATP/WTA #'+(d.rank1||'N/C')+'\n'
              +(d.seed1?'  Statut : Tête de série #'+d.seed1+'\n':'')
              +(d.seed1==='LL'||d.seed1==='ll'?'  → Lucky Loser : a perdu en qualifications mais rentré suite désistement. Peut être en reprise de rythme.\n':'')
              +(d.seed1==='WC'||d.seed1==='wc'?'  → Wild Card : invitation du tournoi. Souvent joueur local ou revenant de blessure — ne pas sous-estimer.\n':'')
              +(d.seed1==='Q'||d.seed1==='q'?'  → Qualifier : a dû passer les qualifs. Classement bas mais peut être en très grande forme.\n':'')
              +(d.seed1==='PR'||d.seed1==='pr'?'  → Protected Ranking : revient de blessure avec ancien classement protégé. Niveau réel peut être bien supérieur au classement actuel.\n':'')
              +(d.titles1&&d.titles1.total>0?'  Palmarès : '+d.titles1.grandSlams+' Grand Chelem, '+d.titles1.masters+' Masters 1000, '+d.titles1.other+' autres titres\n':'  Palmarès : Aucun titre majeur\n')
              +'\n'
              +d.p2+' : ATP/WTA #'+(d.rank2||'N/C')+'\n'
              +(d.seed2?'  Statut : Tête de série #'+d.seed2+'\n':'')
              +(d.seed2==='LL'||d.seed2==='ll'?'  → Lucky Loser : a perdu en qualifications mais rentré suite désistement. Peut être en reprise de rythme.\n':'')
              +(d.seed2==='WC'||d.seed2==='wc'?'  → Wild Card : invitation du tournoi. Souvent joueur local ou revenant de blessure — ne pas sous-estimer.\n':'')
              +(d.seed2==='Q'||d.seed2==='q'?'  → Qualifier : a dû passer les qualifs. Classement bas mais peut être en très grande forme.\n':'')
              +(d.seed2==='PR'||d.seed2==='pr'?'  → Protected Ranking : revient de blessure avec ancien classement protégé. Niveau réel peut être bien supérieur au classement actuel.\n':'')
              +(d.titles2&&d.titles2.total>0?'  Palmarès : '+d.titles2.grandSlams+' Grand Chelem, '+d.titles2.masters+' Masters 1000, '+d.titles2.other+' autres titres\n':'  Palmarès : Aucun titre majeur\n')
              +'\n'
              +(d.rank1&&d.rank2?'Ecart classement brut: '+Math.abs(d.rank1-d.rank2)+' places (signal FAIBLE sur surface spécifique)\n':'')+'\n'


              +'=== STATS SURFACE 1 AN ===\n'
              +d.p1+': '+surf1Str+'\n'
              +d.p2+': '+surf2Str+'\n\n'

              +'=== STATS SERVICE & RETOUR ===\n'
              +fmtSv(d.svStats1,d.p1)+'\n'
              +fmtSv(d.svStats2,d.p2)+'\n\n'

              +'=== HEAD TO HEAD ===\n'
              +h2hStr+'\n\n'
              +h2hStr+'\n\n'

              +'=== PALMARES DANS CE TOURNOI ===\n'
              +(d.tourRec1?d.p1+' : '+d.tourRec1.wins+'V/'+d.tourRec1.losses+'D en '+d.tourRec1.appearances+' participations | Meilleur tour: '+d.tourRec1.bestRound:(d.p1+' : Aucun historique'))+'\n'
              +(d.tourRec2?d.p2+' : '+d.tourRec2.wins+'V/'+d.tourRec2.losses+'D en '+d.tourRec2.appearances+' participations | Meilleur tour: '+d.tourRec2.bestRound:(d.p2+' : Aucun historique'))+'\n\n'

              +'=== COTES ===\n'
              +(d.c1&&d.c1!=='--'?d.p1+': '+d.c1:d.p1+': non disponible')+'\n'
              +(d.c2&&d.c2!=='--'?d.p2+': '+d.c2:d.p2+': non disponible')+'\n'
              +(shinProbs?'Shin: '+d.p1+' '+shinProbs.p1+'% | '+d.p2+' '+shinProbs.p2+'%\n':'')
              +'Edge: '+d.p1+' '+(edgeP1!==null?'+'+edgeP1+'%':'0%')+' | '+d.p2+' '+(edgeP2!==null?'+'+edgeP2+'%':'0%')+'\n\n'

              +'=== COMMENT RAISONNER SUR '+surfaceLabel.toUpperCase()+' ===\n'
              +(surfaceLabel==='Gazon'?
                'GAZON : le service est roi. Checke dans cet ordre :\n1. Qui a le meilleur % 1ere balle ? > 65% = service imbrisable\n2. Qui a le meilleur winrate gazon cette saison ?\n3. Les breaks sont rares — le set se joue souvent au tie-break\n4. Un gaucher ou un grand serveur est structurellement avantagé\n5. Les points ATP gazon confirment qui est specialiste gazon\n':
              surfaceLabel==='Terre battue'?
                'TERRE : le retour est roi. Checke dans cet ordre :\n1. Qui convertit le plus de BP ? > 45% = retourneur dangereux\n2. Qui gagne le plus de pts sur 2eme balle adverse ?\n3. Winrate terre cette saison — la forme physique prime\n4. Les echanges longs favorisent les defenseurs de fond de court\n':
                'DUR : surface neutre. Checke dans cet ordre :\n1. Ecart classement > 20 places = signal fort\n2. Forme recente 10 derniers matchs\n3. % 1ere balle + BP sauves\n4. H2H si disponible\n'
              )+'\n'
              +'MARCHE : Match Winner uniquement. Cote minimum 1.45, pas de maximum.\n'
              +'CONFIANCE : 6.0 minimum. Max 9.0.\n\n'
              +'DECISION SANS COTES : Ne pas avoir de cote nest PAS une raison de passer son tour.\n'
              +'Si 2 signaux ou plus pointent vers le meme joueur, tu DOIS le jouer.\n'
              +'Sans cote, estime-la dans cote_rec (ex: ~1.65) et mets vbet=OUI si conf >= 6.5.\n\n'
              +'SIGNAUX — chacun vaut 1 point pour un joueur :\n'
              +'H2H dominant >= 3-1 = 1 signal fort\n'
              +'Meilleur winrate surface cette saison = 1 signal\n'
              +'Forme recente superieure (WWW vs LLL) = 1 signal\n'
              +'Ecart classement > 20 places = 1 signal\n'
              +'Points ATP sur cette surface > 2x adversaire = 1 signal\n\n'
              +'REGLE ABSOLUE : 2 signaux ou plus vers le meme joueur = JOUER. Pas de passe ton tour.\n'
              +'1 signal ou moins, signaux contradictoires = passe ton tour.\n\n'
              +'EXEMPLE CONCRET : Bonzi H2H 3-1 (signal 1) + winrate gazon 60%>56% (signal 2) + forme WWW (signal 3) = 3 signaux = JOUER BONZI sans hesiter.\n\n'
              +'STYLE : UNE decision tranchante. UNE stat qui justifie. Jamais de peut-etre.\n\n'
              +'{\n'
              +'"passe_ton_tour": false,\n'
              +'"confiance": 0.0,\n'
              +'"pari_rec": "'+d.p1+' | '+d.p2+' | ou vide si passe_ton_tour",\n'
              +'"cote_rec": "cote exacte copiée depuis les données",\n'
              +'"risque": "FAIBLE|MODERE|ELEVE",\n'
              +'"verdict_shark": "1 phrase tranchante : joueur + cote + 1 stat clé qui justifie",\n'
              +'"analyse_card": "2-3 phrases précises sur les forces/faiblesses sur '+surfaceLabel+' — cite les stats disponibles",\n'
              +'"conseil": "1 phrase directe — joue ou joue pas et pourquoi en 1 mot",\n'
              +'"contexte": "tournoi + round + enjeux",\n'
              +'"facteur_x": "LE seul facteur décisif sur '+surfaceLabel+' pour CE match — stat précise",\n'
              +'"p1": '+probIAP1+',\n'
              +'"p2": '+probIAP2+',\n'
              +'"edge": "'+(edgeP1!==null?'+'+edgeP1:edgeP2!==null?'+'+edgeP2:'0')+'%",\n'
              +'"vbet": "OUI si edge>=4% ET conf>=6.0 ET passe_ton_tour=false, sinon NON",\n'
              +'"kelly": "'+(kellyP1||kellyP2||0)+'%",\n'
              +'"scenario_match": {\n'
              +'  "set1": "1er set : qui prend l\'ascendant, breaks attendus, dynamique de service",\n'
              +'  "set2": "2ème set : momentum, ajustements, qui réagit mieux",\n'
              +'  "set3": "3ème set si serré (null sinon) : facteur mental et physique"\n'
              +'}\n'
              +'}';

            var r = await postJSONWithRetry('api.anthropic.com', '/v1/messages', {
              model: 'claude-sonnet-4-6',
              max_tokens: 1500,
              system: 'Tu es un analyste tennis professionnel. Tu réponds EXCLUSIVEMENT en JSON valide. Zéro backtick. RÈGLES : (1) Sois ultra direct — une phrase = un fait chiffré. (2) verdict_shark = "JOUE [joueur] à [cote] — [1 stat clé]". (3) analyse_card = forces concrètes sur CETTE surface. (4) facteur_x = LA stat qui fait gagner sur cette surface. (5) conseil = une seule phrase actionnable. JAMAIS de "il est difficile de dire", JAMAIS de "peut-être". Si tu hésites → passe_ton_tour=true.',
              messages: [{role:'user', content:prompt}]
            }, {'x-api-key':ANT_KEY, 'anthropic-version':'2023-06-01'});

            var txt = ((r.content||[]).find(function(b){return b.type==='text';})||{}).text||'{}';
            try { return JSON.parse(txt.replace(/```json|```/g,'').trim()); }
            catch(e) { console.log('Parse error genAnalyseTennis:', txt.slice(0,200)); return null; }
          }

          async function processTennisFixtures(fixtures, RANK_MAP, PHOTOS) {
            RANK_MAP = RANK_MAP||{};
            PHOTOS = PHOTOS||{};
            var tennisMatchs = [];
            console.log('\n=== TENNIS PIPELINE: '+fixtures.length+' matchs à analyser ===');

            for(var i=0; i<fixtures.length; i++){
              var f = fixtures[i];
              var tour = f._tour||'atp';
              var parsed = parseTennisFixture(f);
              var p1Name = parsed.p1Name;
              var p2Name = parsed.p2Name;

              // Skip doubles
              if(p1Name.includes('/')&&p2Name.includes('/')){
                console.log('[TENNIS] Skip doubles: '+p1Name);
                continue;
              }

              // Skip tournois inférieurs à 250 (Challenger, ITF, Futures)
              if(!isMainTourMatch(parsed)){
                console.log('[TENNIS] Skip (non Main tour): '+p1Name+' vs '+p2Name+' — '+parsed.tourRank);
                continue;
              }

              console.log('\n[TENNIS] -> '+p1Name+' vs '+p2Name+' ('+tour.toUpperCase()+' | '+parsed.tourRank+' | '+parsed.surface+')');

              // Fetch : surface-summary + matchs récents + match-stats + cotes + palmarès tournoi
              var batch = await Promise.all([
                getTennisSurfaceSummary(parsed.p1Id, tour),
                getTennisSurfaceSummary(parsed.p2Id, tour),
                getTennisRecentForm(parsed.p1Id, tour),
                getTennisRecentForm(parsed.p2Id, tour),
                getTennisMatchStats(parsed.p1Id, tour),
                getTennisMatchStats(parsed.p2Id, tour),
                getTennisOddsBest(parsed.id),
                getTennisOddsIO(p1Name, p2Name),
                getTennisTournamentRecord(parsed.p1Id, parsed.tournamentId, tour),
                getTennisTournamentRecord(parsed.p2Id, parsed.tournamentId, tour),
                getTennisTitles(parsed.p1Id, tour),
                getTennisTitles(parsed.p2Id, tour),
              ]);
              await sleep(600);

              var surfData1 = batch[0];
              var surfData2 = batch[1];
              var matches1  = batch[2]||[];
              var matches2  = batch[3]||[];
              var mstats1   = batch[4];
              var mstats2   = batch[5];
              var bestOdds  = batch[6];
              var oddsIO    = batch[7];
              var tourRec1  = batch[8];
              var tourRec2  = batch[9];
              var titles1   = batch[10];
              var titles2   = batch[11];

              // Classement depuis RANK_MAP global (fiable pour tous les joueurs)
              var rank1 = RANK_MAP[String(parsed.p1Id)]||null;
              var rank2 = RANK_MAP[String(parsed.p2Id)]||null;
              var profile1 = null; // plus utilisé
              var profile2 = null;

              // Forme globale
              var form1 = calcTennisForm(matches1, parsed.p1Id);
              var form2 = calcTennisForm(matches2, parsed.p2Id);
              var formSurf1 = calcTennisFormOnSurface(matches1, parsed.p1Id, parsed.surface);
              var formSurf2 = calcTennisFormOnSurface(matches2, parsed.p2Id, parsed.surface);

              // Stats surface depuis past-matches (marche pour TOUS les joueurs)
              // Fallback sur surface-summary si past-matches insuffisant
              var surf1 = calcSurfaceStatsForPlayer(matches1, parsed.p1Id, parsed.surface);
              var surf2 = calcSurfaceStatsForPlayer(matches2, parsed.p2Id, parsed.surface);
              if(!surf1&&surfData1) surf1=calcSurfaceStats(surfData1, parsed.surface);
              if(!surf2&&surfData2) surf2=calcSurfaceStats(surfData2, parsed.surface);

              // Stats service/retour/breaks depuis match-stats
              var svStats1 = calcServiceStats(mstats1);
              var svStats2 = calcServiceStats(mstats2);

              // Cotes : OddsIO (Pinnacle/Bet365) prioritaire, sinon best odds API tennis
              var c1 = (oddsIO&&oddsIO.c1)||(bestOdds&&bestOdds.c1)||parsed.c1;
              var c2 = (oddsIO&&oddsIO.c2)||(bestOdds&&bestOdds.c2)||parsed.c2;
              if(oddsIO) console.log('  OddsIO cotes: '+c1+'/'+c2);
              console.log('  #'+rank1+' vs #'+rank2+' | Cotes: '+c1+'/'+c2+' | Forme: '+form1+'/'+form2+' | Surface: '+(surf1?surf1.winrate+'%':'?')+'/'+(surf2?surf2.winrate+'%':'?'));

              // Skip seulement si VRAIMENT rien — ni cotes ni classement ni forme
              var hasData = (c1!=='--'&&c2!=='--')||(rank1||rank2)||(form1.length>0)||(form2.length>0);
              if(!hasData){
                console.log('  Skip (aucune donnée): '+p1Name+' vs '+p2Name);
                continue;
              }

              // Shin sur les cotes
              var shinProbs = null;
              if(c1!=='--'&&c2!=='--'){
                var raw=shinProbabilities([parseFloat(c1),parseFloat(c2)]);
                if(raw&&raw.length===2)shinProbs={p1:Math.round(raw[0]*100),p2:Math.round(raw[1]*100)};
              }

              var an = await genAnalyseTennis({
                p1:p1Name, p2:p2Name, p1Id:parsed.p1Id, p2Id:parsed.p2Id,
                rank1:rank1, rank2:rank2,
                seed1:parsed.seed1, seed2:parsed.seed2,
                tournament:parsed.tournament, tourRank:parsed.tourRank,
                surface:parsed.surface, round:parsed.round,
                date:(parsed.date||'').split('T')[0]+' '+toParisHeure(parsed.date||''),
                form1:form1, form2:form2,
                formSurf1:formSurf1, formSurf2:formSurf2,
                surf1:surf1, surf2:surf2,
                svStats1:svStats1, svStats2:svStats2,
                h2hP1Wins:parsed.h2hP1Wins, h2hP2Wins:parsed.h2hP2Wins,
                c1:c1, c2:c2, shinProbs:shinProbs,
                tourRec1:tourRec1, tourRec2:tourRec2,
                titles1:titles1, titles2:titles2,
              });
              await sleep(300);

              if(an&&an.passe_ton_tour===true){
                console.log('  ⏭ PASS tennis: '+p1Name+' vs '+p2Name);
                an.pari_rec='';an.cote_rec='';an.confiance=0;
                an.vbet='NON';an.verdict_shark='';an.edge='';an.kelly='0';
              }

              var lkKey = tour==='wta'?'wta':'atp';
              var surfLabel = (parsed.surface||'').toLowerCase().includes('clay')?'clay':
                              (parsed.surface||'').toLowerCase().includes('grass')?'grass':'hard';
              var fDate = (parsed.date||'').split('T')[0];
              var heure = toParisHeure(parsed.date||'');

              var matchObj = {
                id: 't_'+parsed.id,
                sport: 'tennis',
                home: {n:p1Name, id:parsed.p1Id, seed:parsed.seed1, country:parsed.p1Country, rank:rank1, photo:PHOTOS[String(parsed.p1Id)]||null},
                away: {n:p2Name, id:parsed.p2Id, seed:parsed.seed2, country:parsed.p2Country, rank:rank2, photo:PHOTOS[String(parsed.p2Id)]||null},
                league: parsed.tournament+(parsed.round?' — '+parsed.round:''),
                ligue_icon: '\uD83C\uDFBE',
                league_key: lkKey,
                surface: surfLabel,
                tour_rank: parsed.tourRank,
                date: (fDate+' '+heure).trim(),
                raw_date: parsed.date||'',
                tour_record_p1: tourRec1||null,
                tour_record_p2: tourRec2||null,
                cat: ['all'],
                val: an?(an.vbet==='OUI'&&(an.confiance||0)>=7.0):false,
                hot: an?((an.confiance||0)>=8.0):false,
                conf: an?parseFloat(an.confiance||0):0,
                p1: shinProbs?shinProbs.p1:(an?(an.p1||50):50),
                pn: 0,
                p2: shinProbs?shinProbs.p2:(an?(an.p2||50):50),
                c1: c1, c2: c2,
                cote_rec: an?(an.cote_rec||''):'',
                pari_rec: an?(an.pari_rec||''):'',
                edge: an?(an.edge||''):'',
                kelly: an?(an.kelly||'0'):'0',
                vbet: an?(an.vbet||'NON'):'NON',
                risque: an?(an.risque||'ELEVE'):'ELEVE',
                verdict_shark: an?(an.verdict_shark||''):'',
                analyse_card: an?(an.analyse_card||an.conseil||''):'',
                conseil_public: an?(an.conseil||an.analyse_card||''):'',
                contexte: an?(an.contexte||''):'',
                facteur_x: an?(an.facteur_x||''):'',
                scenario: an&&an.scenario_match?{phase1:an.scenario_match.set1||'',phase2:an.scenario_match.set2||'',phase3:an.scenario_match.set3||null}:null,
                no_signal: an&&an.passe_ton_tour===true?true:!(an&&an.pari_rec),
                no_signal_label: (an&&an.passe_ton_tour===true)||(!(an&&an.pari_rec))?'Aucun signal clair sur ce match':'',
                h2h_tennis: {p1Wins:parsed.h2hP1Wins, p2Wins:parsed.h2hP2Wins},
                form_p1: form1, form_p2: form2,
                surf_stats_p1: surf1, surf_stats_p2: surf2,
                mise: '1-2% bankroll',
              };

              tennisMatchs.push(matchObj);
              console.log('  OK conf='+matchObj.conf+' pari='+matchObj.pari_rec+' cotes='+c1+'/'+c2);
            }
            return tennisMatchs;
          }


          // ═══════════════════════════════════════════════════════
          // ── FOOTBALL PIPELINE (inchangé) ────────────────────────
          // ═══════════════════════════════════════════════════════

