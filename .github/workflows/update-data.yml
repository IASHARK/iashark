                extA20d:extA20.filter(function(m){return m.result==='D';}).length,
                extA20l:extA20.filter(function(m){return m.result==='L';}).length,
                extA20:extA20.length,
                xgH_avg:xgH.xg_avg,xgH_weighted:xgH.xg_weighted,xgH_fouls:xgH.fouls_avg,
                xgA_avg:xgA.xg_avg,xgA_weighted:xgA.xg_weighted,xgA_fouls:xgA.fouls_avg,
                poisson_lambdaH:lambdas.lambdaH,poisson_lambdaA:lambdas.lambdaA,
                poisson_p1:pureProbs.p1,poisson_pN:pureProbs.pN,poisson_p2:pureProbs.p2,
                poisson_over25:pureProbs.over25,poisson_under25:pureProbs.under25,
                poisson_bttsY:pureProbs.bttsY,poisson_bttsN:pureProbs.bttsN,
                dixon_p1:pureProbs.dixon?pureProbs.dixon.p1:pureProbs.p1,
                dixon_pN:pureProbs.dixon?pureProbs.dixon.pN:pureProbs.pN,
                dixon_p2:pureProbs.dixon?pureProbs.dixon.p2:pureProbs.p2,
                mc_p1:pureProbs.montecarlo?pureProbs.montecarlo.p1:pureProbs.p1,
                mc_scores:pureProbs.montecarlo?pureProbs.montecarlo.top_scores:[],
                mc_pN:pureProbs.montecarlo?pureProbs.montecarlo.pN:pureProbs.pN,
                mc_p2:pureProbs.montecarlo?pureProbs.montecarlo.p2:pureProbs.p2,
                pinnacle_p1:shinProbs?shinProbs.p1:null,pinnacle_pN:shinProbs?shinProbs.pN:null,pinnacle_p2:shinProbs?shinProbs.p2:null,
                pinnacle_c1:marketOdds?marketOdds.c1:null,pinnacle_c2:marketOdds?marketOdds.c2:null,
                market_source:usingPinnacle?'Pinnacle (sharp)':(marketOdds?'Cotes moyennes multi-bookmakers':null),
                final_p1:pureProbs.p1,final_pN:pureProbs.pN,final_p2:pureProbs.p2,
                all_markets:allMarkets,node_kelly:nodeKelly,
