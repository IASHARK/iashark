              +'2. Pinnacle confirme + winrate surface > 65% → confiance haute\n'
              +'3. H2H > 3V pour un joueur sur cette surface → signal modéré\n'
              +'4. Forme récente dominante (WWWWW) vs forme faible (LLLLL) → signal fort\n\n'
              +'RÈGLE ABSOLUE : analyse_card, conseil, contexte, facteur_x, scenario_match doivent TOUJOURS être remplis même si passe_ton_tour = true.\n\n'
              +'Réponds UNIQUEMENT avec ce JSON valide. Aucun texte avant ou après. Aucun backtick.\n'
              +'{\n'
              +'"passe_ton_tour": false,\n'
              +'"confiance": [7.0 à 8.5 ou 0 si passe_ton_tour],\n'
              +'"pari_rec": "['+d.p1+' | '+d.p2+'] ou vide si passe_ton_tour",\n'
              +'"cote_rec": "[COPIE EXACTE de la cote ci-dessus — pas d\'arrondi]",\n'
              +'"risque": "[FAIBLE | MODERE | ELEVE]",\n'
              +'"verdict_shark": "[joueur] à [cote] — [1 phrase factuelle] ou vide si passe_ton_tour",\n'
