          async function genCombis(list,isSamedi,isDimanche,allMatchs){
            if(!list.length) return [];
            var sortedForCombis=list.slice().sort(function(a,b){return b.conf-a.conf;});
            var lines=sortedForCombis.slice(0,10).map(function(a){return '- '+a.home+' vs '+a.away+': '+a.pari+' cote '+a.cote+' (confiance '+a.conf+'/10)';}).join('\n');
            var promptClassic='Expert paris sportifs IASHARK. Meilleurs signaux du jour:\n'+lines+'\n\n'
              +'Genere 3 combines optimises. Marches autorises: Over 2.5, BTTS Non, DC 1X, DC X2.\n'
              +'c1 "SHARK SAFE": 2 matchs, cote 1.50-2.00. c2 "SHARK VALUE": 3 matchs, 2.50-4.00. c3 "SHARK EXPERT": 3-4 matchs, 4.00-6.00.\n'
              +'Reponds UNIQUEMENT JSON sans backticks:\n'
              +'{"c1":{"label":"SHARK SAFE","type":"safe","selections":"DC X2 + Over 2.5","matchs":"m1, m2","cote_totale":"1.85","conseil":"..."},'
              +'"c2":{"label":"SHARK VALUE","type":"value","selections":"DC 1X + Over 2.5 + BTTS Non","matchs":"m1, m2, m3","cote_totale":"3.20","conseil":"..."},'
              +'"c3":{"label":"SHARK EXPERT","type":"audace","selections":"Over 2.5 + DC X2 + DC 1X","matchs":"m1, m2, m3","cote_totale":"5.50","conseil":"..."}}';
            var r=await postJSONWithRetry('api.anthropic.com','/v1/messages',{model:'claude-sonnet-4-6',max_tokens:800,messages:[{role:'user',content:promptClassic}]},{'x-api-key':ANT_KEY,'anthropic-version':'2023-06-01'});
            var txt=(r.content&&r.content[0]&&r.content[0].text)||'{}';
            var classics=[];
            try{var obj=JSON.parse(txt.replace(/```json|```/g,'').trim());classics=Object.values(obj).filter(Boolean).map(function(c){return{label:c.label||'COMBINE',type:c.type||'safe',selections:c.selections||'',matchs:c.matchs||'',cote_totale:c.cote_totale||'',conseil:c.conseil||''};});}catch(e){classics=[];}
            if(!isSamedi&&!isDimanche) return classics;
            var labelFou=isSamedi?'SAMEDI FOU':'DIMANCHE FOU';
            var typeFou=isSamedi?'samedi_fou':'dimanche_fou';
            var pool=[];
            (allMatchs||[]).forEach(function(m){
              if(m.sport==='tennis') return;
              var edgeNum=parseFloat((m.edge||'').replace(/[^0-9.]/g,''))||0;
              var candidates=[];
              if(m.dc1x&&m.dc1x!=='--'&&parseFloat(m.dc1x)>=1.20&&parseFloat(m.dc1x)<=2.00)candidates.push({match:m.home.n+' vs '+m.away.n,sel:'DC 1X',cote:parseFloat(m.dc1x),edge:edgeNum});
              if(m.dc2x&&m.dc2x!=='--'&&parseFloat(m.dc2x)>=1.20&&parseFloat(m.dc2x)<=2.00)candidates.push({match:m.home.n+' vs '+m.away.n,sel:'DC X2',cote:parseFloat(m.dc2x),edge:edgeNum});
              if(m.btts_non&&m.btts_non!=='--'&&parseFloat(m.btts_non)>=1.20&&parseFloat(m.btts_non)<=2.00)candidates.push({match:m.home.n+' vs '+m.away.n,sel:'BTTS Non',cote:parseFloat(m.btts_non),edge:edgeNum});
              if(m.co25&&m.co25!=='--'&&parseFloat(m.co25)>=1.20&&parseFloat(m.co25)<=2.50)candidates.push({match:m.home.n+' vs '+m.away.n,sel:'Over 2.5',cote:parseFloat(m.co25),edge:edgeNum});
              if(!candidates.length)return;
              candidates.sort(function(a,b){return b.edge-a.edge||a.cote-b.cote;});
              pool.push(candidates[0]);
            });
            if(pool.length<2){classics.push({label:labelFou,type:typeFou,selections:'Pas assez de matchs',matchs:'',cote_totale:'--',conseil:'Reviens demain!'});return classics;}
            pool.sort(function(a,b){return b.edge-a.edge;});
            var selected=[],coteTotale=1.0;
            for(var si=0;si<pool.length;si++){
              if(selected.length>=5||coteTotale*pool[si].cote>10)break;
              selected.push(pool[si]);coteTotale*=pool[si].cote;
              if(coteTotale>=5)break;
            }
            if(selected.length<2){classics.push({label:labelFou,type:typeFou,selections:'Marches serres',matchs:'',cote_totale:'--',conseil:'Pas de combine fou aujourd\'hui.'});return classics;}
            classics.push({label:labelFou,type:typeFou,selections:selected.map(function(s){return s.sel;}).join(', '),matchs:selected.map(function(s){return s.match;}).join(', '),cote_totale:coteTotale.toFixed(2),conseil:selected.length+' selections triees par edge'});
            return classics;
          }
