          var SPORTMONKS_KEY = process.env.SPORTMONKS_KEY;
          var SM_LEAGUE_CACHE = {};
          var SM_TOPSCORERS_CACHE = {};
          function getSM(url) {
            var sep = url.indexOf('?') > -1 ? '&' : '?';
            return get(url + sep + 'api_token=' + SPORTMONKS_KEY, {});
          }
          var CLUB_STOPWORDS = ['fc','sc','cf','ac','if','bk','sk','ik','fk','ff','cd','ca','sd','ud','fk','united','city','club','athletic','atletico','calcio','de','do','da','le','la','los'];
          function smNormalize(s) {
            s = (s||'').toLowerCase();
            try { s = s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); } catch(e){}
            s = s.replace(/[^a-z0-9]+/g,' ').trim();
            var words = s.split(' ').filter(function(w){ return w && CLUB_STOPWORDS.indexOf(w)===-1; });
            return words.join(' ');
          }
          function smAcronym(s) {
            var norm = smNormalize(s);
            var words = norm.split(' ').filter(Boolean);
            if(words.length < 2) return null;
            return words.map(function(w){ return w.length <= 3 ? w : w[0]; }).join('');
          }
          function smBestMatch(name, candidates) {
            var nameLow = (name||'').toLowerCase().trim();
            var nameNorm = smNormalize(name);
            var nameAcronym = smAcronym(name);
            candidates = (candidates||[]).filter(Boolean);

            var exact = candidates.find(function(c){ return (c||'').toLowerCase().trim() === nameLow; });
            if(exact) return exact;

            var byAcronym = candidates.find(function(c){
              var cLow = (c||'').toLowerCase().trim();
              var cAcronym = smAcronym(c);
              return (nameAcronym && cLow === nameAcronym) || (cAcronym && nameLow === cAcronym);
            });
            if(byAcronym) return byAcronym;

            var bySubstring = candidates.find(function(c){
              var cNorm = smNormalize(c);
              if(cNorm.length < 3 || nameNorm.length < 3) return false;
              return cNorm.indexOf(nameNorm) !== -1 || nameNorm.indexOf(cNorm) !== -1;
            });
            if(bySubstring) return bySubstring;

            var best = null, bestScore = Infinity;
            candidates.forEach(function(c){
              var cNorm = smNormalize(c);
              var score = levenshtein(nameNorm, cNorm) / Math.max(nameNorm.length, cNorm.length, 1);
              if(score < bestScore){ bestScore = score; best = c; }
            });
            return bestScore < 0.45 ? best : null;
          }
          async function smFindLeagueSeasonByCountry(countryName) {
